<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- kitchen-admin v3.5 (2026-08-04) 「調理スタッフに確定通知が届いていない」の是正。実測（getKitchenNotifyStatus）で 2026-W32 は22名保存済みなのに通知は本間mieko 1名だけ・W31は0名と判明＝「📣一括送信」を押さず「✏️差分送信」だけを使っており、内容が変わらない人には永久に飛ばない状態だった。①週の通知状況バーを新設（通知済み n/N名・最終送信・未通知者名を常時表示）②保存後に未通知が残っていれば通知を促す確認ダイアログ ③送信対象の判定を「変更があった人」→「まだ通知していない人」に変更＝未保存の変更 ∪ 保存済み未通知(state.pending) ∪ 通知履歴に無い出勤者。ボタン名「差分送信」→「未通知へ送信」、バッジの意味も「変更セル数」→「未通知の人数」。 -->
<!-- kitchen-admin v3.4 (2026-06-20) 提出フォームに 09:00・10:00 を追加したことに対応。自動配置で開始09:00以上は「仕込み」行へ振り分け（時間行に吸着させない／assignDay）。v3.3の終了時刻併記（時間行のみ・B案）は維持。GAS変更なし。 -->
<!-- kitchen-admin v3.3 (2026-06-15) グリッドのスタッフチップに終了時刻「〜HH:MM」を併記（B案＝終了は「キッチン希望」c.req[d]のレンジから補完／確定は開始のみ保存のため）。時間行のみ付与・仕込み行は名前のみ。希望未提出（社員等）は終了なし。GAS変更なし。 -->
<title>お江戸弁当 キッチンシフト管理</title>
<style>
  :root{
    --navy:#1A3C5E; --navy-d:#122c46; --green:#0E7C66; --green-d:#0a5f4e;
    --blue:#2471A3; --orange:#E67E22; --red:#C0392B; --purple:#6A4C93;
    --bg:#f4f6f9; --card:#ffffff; --line:#e2e7ec; --off:#b6bcc4; --ink:#1c2733; --mute:#7a8694;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%;}
  .app{max-width:760px;margin:0 auto;min-height:100vh;}

  /* ── パスワード画面 ── */
  .pw-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy-d));display:flex;align-items:center;justify-content:center;z-index:50;}
  .pw-box{background:#fff;border-radius:16px;padding:28px 24px;width:86%;max-width:340px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .pw-box .ico{font-size:38px;}
  .pw-box h2{margin:8px 0 2px;font-size:18px;color:var(--navy);}
  .pw-box p{margin:0 0 16px;font-size:12px;color:var(--mute);}
  .pw-input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;text-align:center;letter-spacing:.3em;}
  .pw-btn{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
  .pw-err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px;}

  header{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;padding:15px 16px 13px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  header .brand{font-size:12px;opacity:.82;letter-spacing:.04em;}
  header h1{margin:2px 0 0;font-size:18px;font-weight:800;letter-spacing:.02em;}

  .toolbar{display:flex;align-items:center;gap:8px;padding:11px 12px 4px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:#e7ecf2;border-radius:999px;padding:3px;}
  .seg button{border:0;background:transparent;color:#4a5a6b;font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer;}
  .seg button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .reload{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .reload:active{background:#eef2f6;}

  .weekrange{padding:4px 14px 0;font-size:13px;font-weight:700;color:var(--navy);}
  .status{padding:5px 14px;font-size:12px;color:var(--mute);min-height:16px;}
  .status.err{color:var(--red);}
  .status.ok{color:var(--green-d);}

  /* ── 出勤人数ストリップ ── */
  .coverage{margin:6px 12px 0;background:#eef3f8;border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:flex;}
  .coverage .cv{flex:1;text-align:center;font-size:11px;color:var(--mute);}
  .coverage .cv b{display:block;font-size:16px;color:var(--navy);font-weight:800;}

  .copyall{margin:8px 12px 0;width:calc(100% - 24px);border:1.5px dashed var(--green);background:#eafaf4;color:var(--green-d);border-radius:10px;padding:10px;font-size:13px;font-weight:800;cursor:pointer;}
  .copyall:active{background:#dcf3ea;}
  .hint-line{margin:6px 14px 0;font-size:11px;color:var(--mute);}

  /* ── 通知状況バー（v3.5） ── */
  .nbar{margin:8px 12px 0;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700;border:1px solid;display:none;}
  .nbar .nb-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .nbar .nb-sub{margin-top:4px;font-size:11px;font-weight:600;line-height:1.5;}
  .nbar.ok{background:#eafaf4;border-color:#9fdcc9;color:var(--green-d);}
  .nbar.warn{background:#fdf0e4;border-color:#f0c48f;color:#8a4b0f;}
  .nbar.none{background:#fdecea;border-color:#f0b3ad;color:#8e2a20;}
  .nbar.load{background:#eef3f8;border-color:var(--line);color:var(--mute);}

  /* ── 時間×曜日グリッド ── */
  .gridwrap{margin:8px 12px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card);}
  table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:580px;}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;}
  table.grid th:last-child,table.grid td:last-child{border-right:0;}
  table.grid tbody tr:last-child td{border-bottom:0;}
  table.grid thead th{background:#eef3f8;color:var(--navy);font-size:12px;font-weight:800;padding:7px 4px;text-align:center;position:sticky;top:0;z-index:2;}
  table.grid thead th .dow{display:block;font-size:13px;}
  table.grid thead th .md{display:block;font-size:11px;color:var(--mute);font-weight:700;}
  .tcol{position:sticky;left:0;z-index:1;background:#f8fafc;width:74px;min-width:74px;padding:5px 4px;}
  thead th.tcol{z-index:3;background:#e7eef5;text-align:center;}
  .tlabel{font-size:14px;font-weight:800;color:var(--navy);text-align:center;padding:8px 2px;}
  .plabelfx{font-size:13px;font-weight:800;color:var(--purple);text-align:center;padding:8px 2px;}
  tr.preprow .tcol{background:#f6f1fb;}
  td.cell{min-width:92px;padding:4px;cursor:pointer;}
  td.cell:active{background:#eef7ff;}
  tr.preprow td.cell:active{background:#f3ecfb;}
  .chip{display:block;margin:2px 0;padding:5px 7px;border-radius:7px;color:#fff;font-size:12px;font-weight:800;line-height:1.2;word-break:break-all;}
  .chip .chipend{font-weight:600;opacity:.82;margin-left:3px;}
  .cell-add{display:block;text-align:center;color:#c2cdd9;font-size:15px;padding:3px 0;}

  /* ── アクションバー ── */
  .actionbar{position:sticky;bottom:0;z-index:6;background:rgba(244,246,249,.96);backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:7px;flex-wrap:wrap;}
  .act{flex:1;min-width:84px;border:0;border-radius:10px;padding:11px 6px;font-size:13px;font-weight:800;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;}
  .act.save{background:var(--blue);}
  .act.all{background:var(--green);}
  .act.diff{background:var(--orange);}
  .act:disabled{opacity:.5;}
  .act .bdg{background:rgba(255,255,255,.28);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:800;}

  .empty{margin:24px 14px;padding:32px 18px;background:#fff;border-radius:12px;text-align:center;color:var(--mute);font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .empty .ico{font-size:34px;margin-bottom:8px;}

  /* ── 追加シート（bottom sheet） ── */
  #sheet{position:fixed;inset:0;z-index:48;display:none;}
  #sheet.show{display:block;}
  .sheet-bd{position:absolute;inset:0;background:rgba(18,28,40,.45);}
  .sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.22);}
  .sheet-head{padding:14px 16px 8px;border-bottom:1px solid var(--line);}
  .sheet-head h3{margin:0;font-size:16px;color:var(--navy);font-weight:800;}
  .sheet-head .sub{font-size:12px;color:var(--mute);margin-top:3px;}
  .sheet-body{padding:6px 14px 4px;overflow-y:auto;}
  .sec-t{font-size:12px;font-weight:800;color:var(--navy);margin:10px 2px 6px;}
  .sec-empty{font-size:12px;color:var(--mute);padding:4px 2px 8px;}
  .pl{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#f8fafc;}
  .pl .nm{font-weight:800;font-size:13px;}
  .pl .emp{font-size:10px;color:var(--purple);font-weight:800;border:1px solid #d9cef0;border-radius:6px;padding:1px 5px;}
  .pl .rm{margin-left:auto;border:1px solid var(--red);background:#fff;color:var(--red);font-size:11.5px;font-weight:800;border-radius:8px;padding:7px 11px;cursor:pointer;}
  .cand{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;}
  .cand.placed{background:#eef0f3;opacity:.72;}
  .cand.placed .nm{color:var(--mute);}
  .cand .nm{font-weight:800;font-size:13px;}
  .cand .hint{font-size:11px;color:var(--mute);}
  .cand .hint.emp{color:var(--purple);}
  .cand .hint.move{color:var(--orange);font-weight:700;}
  .cand .add{margin-left:auto;border:0;background:var(--green);color:#fff;font-size:12.5px;font-weight:800;border-radius:8px;padding:8px 13px;cursor:pointer;}
  .cand.placed .add{background:var(--orange);}
  .sheet-foot{padding:10px 14px;border-top:1px solid var(--line);}
  .sheet-close{width:100%;border:0;background:var(--navy);color:#fff;font-size:14px;font-weight:800;border-radius:10px;padding:12px;cursor:pointer;}

  /* ── トースト ── */
  #toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(20px);background:#1c2733;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{background:var(--red);} #toast.ok{background:var(--green-d);}

  #overlay{position:fixed;inset:0;background:rgba(18,28,40,.45);display:none;align-items:center;justify-content:center;z-index:45;}
  #overlay.show{display:flex;}
  .spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ovtext{position:absolute;bottom:38%;color:#fff;font-size:13px;font-weight:700;}

  footer{text-align:center;padding:10px 16px 90px;font-size:11px;color:#9aa5b1;}
</style>
</head>
<body>

<!-- パスワード -->
<div class="pw-screen" id="pwScreen">
  <div class="pw-box">
    <div class="ico">🍳</div>
    <h2>キッチンシフト管理</h2>
    <p>パスワードを入力してください</p>
    <input type="password" class="pw-input" id="pwInput" inputmode="numeric" placeholder="••••" maxlength="8" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">開く</button>
    <div class="pw-err" id="pwErr"></div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <header>
    <div class="brand">お江戸弁当</div>
    <h1>🍳 キッチンシフト 管理</h1>
  </header>

  <div class="toolbar">
    <div class="seg">
      <button id="segThis" class="active" onclick="switchWeek('this')">今週</button>
      <button id="segNext" onclick="switchWeek('next')">来週</button>
    </div>
    <button class="reload" onclick="load()">🔄 更新</button>
  </div>

  <div class="weekrange" id="weekRange">　</div>
  <div class="status" id="status">読み込み中...</div>

  <div class="nbar" id="notifyBar"></div>

  <div class="coverage" id="coverage" style="display:none;"></div>
  <button class="copyall" id="copyAllBtn" style="display:none;" onclick="copyReqAll()">🔁 希望＋社員デフォルトで配置</button>
  <div class="hint-line" id="hintLine"></div>

  <div id="grid"></div>

  <footer>お江戸弁当 キッチンシフト管理 v3.5</footer>

  <div class="actionbar" id="actionbar" style="display:none;">
    <button class="act save" id="btnSave" onclick="doSave()">💾 保存</button>
    <button class="act all" id="btnAll" onclick="doSendAll()">📣 一括送信</button>
    <button class="act diff" id="btnDiff" onclick="doSendDiff()">✏️ 未通知へ送信 <span class="bdg" id="diffBadge">0</span></button>
  </div>
</div>

<!-- 追加シート -->
<div id="sheet">
  <div class="sheet-bd" onclick="closeSheet()"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h3 id="shTitle"></h3>
      <div class="sub" id="shSub"></div>
    </div>
    <div class="sheet-body">
      <div class="sec-t">この枠に配置済み</div>
      <div id="shPlaced"></div>
      <div class="sec-t">候補（希望者＋社員）</div>
      <div id="shCand"></div>
    </div>
    <div class="sheet-foot">
      <button class="sheet-close" onclick="closeSheet()">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="overlay"><div class="spinner"></div><div class="ovtext" id="ovtext">処理中...</div></div>

<script>
const GAS_URL  = 'https://script.google.com/macros/s/AKfycbxkcAI-Nkl3aoUZKgluss5AawPDc7aluPokONkYz6f2ikwl0S487JvhKdKh6QSp1xhEhA/exec';
const PASSWORD = '1115';
const DAYS = ['月','火','水','木','金'];
const COLORS = ['#1A3C5E','#0E7C66','#B5651D','#6A4C93','#1E6091','#9A3B3B','#3A7D44','#7A5195'];

/* 固定行：9時間 + 仕込み（1行） */
const FIXED_TIMES = ['0:00','2:00','3:00','4:00','5:00','6:00','6:30','7:00','8:00'];
const PREP_LABEL = '仕込み';

const state = { week:'this', weekTarget:null, dates:[], cooks:[], rows:[], notify:null, pending:{} };
// rows[i] = { id:'t0'..'t8'|'p0', type:'time'|'prep', time:'HH:MM', label:'仕込み' }
// cooks[i] = { name, userId, registered, isEmployee, hasReq, req:[5], days:[{off,rowId}×5], base:[5], color }
// notify   = { count, names:[{name,at}], lastSentAt } … この週に確定通知が飛んだ人（GAS通知履歴 type='kitchen'）
// pending  = { 氏名:true } … 「保存はしたがまだ通知していない」人。保存で base が更新されて
//                            差分が消えても差分送信の対象に残すための退避（v3.5）
let sheetRowId = null, sheetDay = -1;

/* ───────── 時刻ユーティリティ ───────── */
function pad2(n){ n=parseInt(n,10)||0; return (n<10?'0':'')+n; }
function padTime(t){ const p=String(t||'').split(':'); if(p.length<2) return ''; const h=parseInt(p[0],10), m=parseInt(p[1],10); if(isNaN(h)||isNaN(m)) return ''; return pad2(h)+':'+pad2(m); }
function dispTime(t){ const c=padTime(t); if(!c) return String(t||''); const p=c.split(':'); return (parseInt(p[0],10))+':'+p[1]; }
function toMin(t){ const p=String(t).split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); }

/* セル値：'HH:MM'（時間配置・開始のみ）/ '休' / 空 / それ以外の文字列（仕込み等のラベル配置） */
function parseCellRaw(v){
  v=String(v||'').trim();
  if(v==='' || v==='休') return { type:'off' };
  if(v.indexOf('-')>0){ const p=v.split('-'); const s=padTime(p[0]); if(s) return { type:'time', start:s }; }
  if(/^\d{1,2}:\d{2}$/.test(v)) return { type:'time', start:padTime(v) };
  return { type:'prep', label:v };
}
function normNV(v){
  v=String(v||'').trim();
  if(v===''||v==='休') return '休';
  if(v.indexOf('-')>0){ const p=v.split('-'); const s=padTime(p[0]); if(s) return s; }
  if(/^\d{1,2}:\d{2}$/.test(v)) return padTime(v);
  return v;
}
/* v3.3: 希望値からの終了抽出（'HH:MM-HH:MM'→'HH:MM'／それ以外→''） */
function cellEnd(v){ v=String(v||'').trim(); if(v.indexOf('-')>0){ const p=v.split('-'); const e=padTime(p[1]); return e||''; } return ''; }
function rowById(id){ for(const r of state.rows){ if(r.id===id) return r; } return null; }
function findTimeRow(t){ for(const r of state.rows){ if(r.type==='time' && toMin(r.time)===toMin(t)) return r; } return null; }
function snapTimeRow(t){
  const m=toMin(t); let best=null, bd=Infinity;
  for(const r of state.rows){ if(r.type!=='time') continue; const diff=Math.abs(toMin(r.time)-m); if(diff<bd){ bd=diff; best=r; } }
  return best;
}
function firstPrepRow(){ for(const r of state.rows){ if(r.type==='prep') return r; } return null; }
function serializeDay(c,d){
  const dd=c.days[d];
  if(!dd || dd.off || !dd.rowId) return '休';
  const row=rowById(dd.rowId);
  if(!row) return '休';
  return row.type==='time' ? row.time : (row.label||PREP_LABEL);
}

/* ───────── 固定行の構築 ───────── */
function buildRows(){
  const rows=FIXED_TIMES.map((t,i)=>({ id:'t'+i, type:'time', time:t, label:'' }));
  rows.push({ id:'p0', type:'prep', time:'', label:PREP_LABEL });
  state.rows=rows;
}
/* 確定/希望のセル値を行へ割当（時刻は一致行→無ければ最寄り。ただし開始09:00以上は「仕込み」へ） */
function assignDay(raw){
  if(raw.type==='off') return { off:true, rowId:null };
  if(raw.type==='time'){
    // v3.4: 開始09:00以上は「仕込み」行へ自動配置（時間行に吸着させない）
    if(toMin(raw.start) >= toMin('09:00')){ const pp=firstPrepRow(); if(pp) return { off:false, rowId:pp.id }; }
    const r=findTimeRow(raw.start)||snapTimeRow(raw.start); return r ? { off:false, rowId:r.id } : { off:true, rowId:null };
  }
  const p=firstPrepRow(); return p ? { off:false, rowId:p.id } : { off:true, rowId:null };
}
/* 希望＞社員デフォルト＞休 で raw を決める（確定は含めない） */
function rawReqDef(c,d){
  const rv=c.req[d];
  const hasReqDay=String(rv==null?'':rv).trim()!=='';
  if(hasReqDay) return parseCellRaw(rv);
  if(c.isEmployee && c.defaultStart) return parseCellRaw(c.defaultStart);
  return parseCellRaw('');
}

/* ───────── 週解決（kitchen-shift.html と同一・サーバの当週/翌週基準に一致） ───────── */
function isoWeekTargetOfDate(d){
  const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=tmp.getUTCDay()||7; tmp.setUTCDate(tmp.getUTCDate()+4-dayNum);
  const ys=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
  const wn=Math.ceil((((tmp-ys)/86400000)+1)/7);
  return tmp.getUTCFullYear()+'-W'+String(wn).padStart(2,'0');
}
function thisWeekTarget(){
  const t=new Date(); const dow=t.getDay(); const hour=t.getHours();
  const isNext=(dow===5&&hour>=18)||dow===6||dow===0;
  let mon;
  if(isNext){ const add=dow===0?1:8-dow; mon=new Date(t); mon.setDate(t.getDate()+add); }
  else{ const sub=dow-1; mon=new Date(t); mon.setDate(t.getDate()-sub); }
  return isoWeekTargetOfDate(mon);
}
function mondayOfWeekTarget(wt){
  const m=String(wt||'').match(/^(\d{4})-W(\d{1,2})$/); if(!m)return null;
  const year=parseInt(m[1],10),week=parseInt(m[2],10);
  const jan4=new Date(year,0,4); const dow=jan4.getDay()||7;
  const w1=new Date(jan4); w1.setDate(jan4.getDate()-dow+1);
  const mon=new Date(w1); mon.setDate(w1.getDate()+(week-1)*7); return mon;
}
function resolveWeekTarget(){
  const tw=thisWeekTarget();
  if(state.week==='this') return tw;
  const mon=mondayOfWeekTarget(tw); if(!mon)return tw;
  const t=new Date(mon); t.setDate(mon.getDate()+7); return isoWeekTargetOfDate(t);
}

async function apiGet(params){
  const qs=new URLSearchParams(params).toString();
  const res=await fetch(GAS_URL+'?'+qs,{redirect:'follow'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}
async function apiPost(payload){
  const res=await fetch(GAS_URL,{method:'POST',redirect:'follow',body:JSON.stringify(payload)});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}

function stripDow(lab){ return String(lab==null?'':lab).replace(/\([^)]*\)/,'').trim(); }

/* ───────── 読み込み（3並列） ───────── */
async function load(){
  closeSheet();
  setStatus('読み込み中...');
  document.getElementById('weekRange').innerHTML='　';
  document.getElementById('coverage').style.display='none';
  document.getElementById('copyAllBtn').style.display='none';
  document.getElementById('actionbar').style.display='none';
  document.getElementById('grid').innerHTML='';
  document.getElementById('hintLine').textContent='';
  state.notify=null; state.pending={};
  setNotifyBar('load','📣 通知状況を確認中...','');
  try{
    const wt=resolveWeekTarget();
    const [staffR,reqR,confR,notiR]=await Promise.all([
      apiGet({action:'getKitchenStaff'}),
      apiGet({action:'getKitchenRequests',weekTarget:wt}),
      apiGet({action:'getKitchenShift',weekTarget:wt}),
      // 通知状況は取れなくても本体に影響させない（未デプロイ・通信断でも表を出す）
      apiGet({action:'getKitchenNotifyStatus',weekTarget:wt}).catch(()=>null),
    ]);
    if(staffR.ok===false) throw new Error(staffR.error||'スタッフ取得失敗');
    state.notify=(notiR&&notiR.ok)?notiR:null;

    state.weekTarget=(confR&&confR.weekTarget)||(reqR&&reqR.weekTarget)||wt;
    state.dates=(confR&&confR.dates&&confR.dates.length?confR.dates:(reqR&&reqR.dates))||[];

    const reqMap={}, confMap={};
    ((reqR&&reqR.staff)||[]).forEach(s=>{ reqMap[s.name]=s.days||[]; });
    ((confR&&confR.staff)||[]).forEach(s=>{ confMap[s.name]=s.days||[]; });

    const roster=(staffR.staff||[]);

    // 固定10行を構築
    buildRows();

    // 自動配置：確定（保存済み）＞希望＞社員デフォルト＞休
    state.cooks=roster.map((s,idx)=>{
      const conf=confMap[s.name]||['','','','',''];
      const req =reqMap[s.name]||null;
      const c={
        name:s.name, userId:s.userId||'', registered:!!s.registered,
        isEmployee:!!s.isEmployee,
        defaultStart:String(s.defaultStart||'').trim(),
        hasReq:!!req,
        req: req || ['','','','',''],
        days: [],
        base: [0,1,2,3,4].map(d=>normNV(conf[d])),
        color: COLORS[idx%COLORS.length],
      };
      c.days=[0,1,2,3,4].map(d=>{
        const cv=conf[d];
        const hasConf=String(cv==null?'':cv).trim()!=='';
        if(hasConf) return assignDay(parseCellRaw(cv));
        return assignDay(rawReqDef(c,d));
      });
      return c;
    });

    const ds=state.dates;
    document.getElementById('weekRange').textContent=(ds.length>=5?stripDow(ds[0])+' 〜 '+stripDow(ds[4]):state.weekTarget);
    renderGrid();
    document.getElementById('coverage').style.display='flex';
    document.getElementById('copyAllBtn').style.display='block';
    document.getElementById('actionbar').style.display='flex';
    document.getElementById('hintLine').textContent='希望は自動配置済み。社員は「デフォルト開始」で自動配置（確定＞希望＞社員デフォルト＞休）。枠タップで追加・移動・×。固定時間に無い値は最寄り時間へ寄せます。★バッジ＝まだLINEを送っていない人数。「💾 保存」だけではLINEは飛びません。';
    updateMeta();
    setStatus('読込完了：キッチン対象 '+state.cooks.length+'名','ok');
  }catch(e){
    state.cooks=[]; state.rows=[];
    document.getElementById('grid').innerHTML='';
    setStatus('読み込みに失敗しました：'+e.message+'（通信環境を確認して「更新」）','err');
  }
}

/* ───────── 追加シート ───────── */
function isCandidate(c,d){
  if(c.isEmployee) return true;
  return parseCellRaw(c.req[d]).type!=='off';
}
function curRowLabel(c,d){
  const dd=c.days[d]; if(!dd||dd.off||!dd.rowId) return null;
  const r=rowById(dd.rowId); if(!r) return null;
  return r.type==='time' ? dispTime(r.time) : r.label;
}

function openSheet(rowId,d){
  sheetRowId=rowId; sheetDay=d;
  renderSheet();
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); sheetRowId=null; sheetDay=-1; }
function renderSheetIfOpen(){ if(document.getElementById('sheet').classList.contains('show') && sheetDay>=0) renderSheet(); }

function renderSheet(){
  const d=sheetDay, row=rowById(sheetRowId); if(d<0||!row) return;
  const lab=state.dates[d]||DAYS[d];
  document.getElementById('shTitle').textContent=DAYS[d]+'曜日　'+stripDow(lab);
  const where = row.type==='time' ? ('時間 '+dispTime(row.time)) : ('「'+row.label+'」');
  document.getElementById('shSub').textContent=where+' に配置　／　候補をタップで追加・×で外す';

  // この枠（行×曜日）に配置済み
  const placed=[];
  state.cooks.forEach((c,ci)=>{ const dd=c.days[d]; if(dd && !dd.off && dd.rowId===row.id) placed.push(ci); });
  placed.sort((a,b)=>state.cooks[a].name.localeCompare(state.cooks[b].name,'ja'));
  let ph='';
  if(!placed.length){ ph='<div class="sec-empty">この枠にはまだ誰もいません</div>'; }
  placed.forEach(ci=>{
    const c=state.cooks[ci];
    ph+='<div class="pl"><span class="nm">'+esc(c.name)+'</span>';
    if(c.isEmployee) ph+='<span class="emp">社員</span>';
    ph+='<button class="rm" onclick="rmPlaced('+ci+')">× 外す</button></div>';
  });
  document.getElementById('shPlaced').innerHTML=ph;

  // 候補（希望者＋社員、この枠に未配置）
  const cand=[];
  state.cooks.forEach((c,ci)=>{ const dd=c.days[d]; const inThis=(dd && !dd.off && dd.rowId===row.id); if(!inThis && isCandidate(c,d)) cand.push(ci); });
  cand.sort((a,b)=>{
    const ca=state.cooks[a], cb=state.cooks[b];
    const ea=ca.isEmployee?1:0, eb=cb.isEmployee?1:0;
    if(ea!==eb) return ea-eb;
    if(!ca.isEmployee){ return toMin(parseCellRaw(ca.req[d]).start||'0:00')-toMin(parseCellRaw(cb.req[d]).start||'0:00'); }
    return ca.name.localeCompare(cb.name,'ja');
  });
  let ch='';
  if(!cand.length){ ch='<div class="sec-empty">追加できる候補がいません（希望未提出／休み希望）</div>'; }
  cand.forEach(ci=>{
    const c=state.cooks[ci];
    const cur=(!c.days[d].off) ? curRowLabel(c,d) : null;   // 他の枠に配置済みか
    const placedElsewhere=!!cur;
    let baseHint, hintcls='';
    if(c.isEmployee){
      hintcls=' emp';
      if(c.defaultStart){ const dr=parseCellRaw(c.defaultStart); baseHint='社員 '+(dr.type==='time'?dispTime(dr.start):(dr.type==='prep'?dr.label:c.defaultStart)); }
      else baseHint='社員';
    }
    else { const rr=parseCellRaw(c.req[d]); baseHint='希望 '+(rr.type==='time'?dispTime(rr.start):(rr.type==='prep'?rr.label:'—')); }
    ch+='<div class="cand'+(placedElsewhere?' placed':'')+'">';
    ch+='<span class="nm">'+esc(c.name)+'</span>';
    ch+='<span class="hint'+hintcls+'">'+esc(baseHint)+'</span>';
    if(placedElsewhere) ch+='<span class="hint move">'+esc(cur)+'に配置済み</span>';
    ch+='<button class="add" onclick="addCand('+ci+')">'+(placedElsewhere?'移動':'追加')+'</button></div>';
  });
  document.getElementById('shCand').innerHTML=ch;
}

function addCand(ci){
  const c=state.cooks[ci]; if(!c || sheetDay<0 || !sheetRowId) return;
  c.days[sheetDay]={ off:false, rowId:sheetRowId };   // 1人1日1枠：別枠から移動
  renderGrid(); renderSheet(); updateMeta();
}
function rmPlaced(ci){
  const c=state.cooks[ci]; if(!c || sheetDay<0) return;
  c.days[sheetDay]={ off:true, rowId:null };
  renderGrid(); renderSheet(); updateMeta();
}

/* ───────── 希望どおりに配置（手動再適用） ───────── */
function copyReqAll(){
  const targets=state.cooks.filter(c=>c.hasReq || (c.isEmployee && c.defaultStart));
  if(!targets.length){ toast('再適用できる対象がいません'); return; }
  if(!confirm('希望どおり＋社員デフォルトで '+targets.length+'名 を配置し直します。\n（未提出かつデフォルト無しの人は変更なし。現在の手動配置は上書きされます）\nよろしいですか？')) return;
  targets.forEach(c=>{
    for(let d=0;d<5;d++){ c.days[d]=assignDay(rawReqDef(c,d)); }
  });
  renderGrid(); renderSheetIfOpen(); updateMeta();
  toast('希望＋社員デフォルトで配置しました（'+targets.length+'名）','ok');
}

/* ───────── メタ更新（出勤人数・差分・ボタン） ───────── */
function computeChanges(){
  const ch=[];
  state.cooks.forEach(c=>{
    for(let d=0;d<5;d++){
      const nv=serializeDay(c,d);
      if(normNV(nv)!==normNV(c.base[d])){
        ch.push({ name:c.name, dayIndex:d, date:(state.dates[d]||DAYS[d]), newVal:nv });
      }
    }
  });
  return ch;
}
/* 通知が必要な人（v3.5）＝次の3つの和集合
     ①未保存の変更がある人（computeChanges）
     ②このセッションで保存はしたがまだ通知していない人（state.pending）
     ③この週に出勤があるのに通知履歴が1件も無い人（state.notify）
   ①だけだったのが v3.4。保存すると base が更新されて computeChanges が空になるため
   後から押しても “変更はありません” で空振りした。さらに③が無いと、
   「保存済み・内容も変わっていない・でも一度も通知していない」人（＝今回の21名）が
   永久に対象から漏れる。実測：2026-W32 は22名保存済みで通知は本間mieko 1名のみだった。 */
function unsentNames(){
  const set={};
  computeChanges().forEach(c=>{ set[c.name]=true; });
  Object.keys(state.pending).forEach(n=>{ set[n]=true; });
  if(state.notify){
    const done={}; (state.notify.names||[]).forEach(x=>{ done[x.name]=true; });
    workingNames().forEach(n=>{ if(!done[n]) set[n]=true; });
  }
  return Object.keys(set);
}
/* この週に1日でも出勤がある人＝通知が飛ぶべき人（全休はGAS側でもスキップされる） */
function workingNames(){
  return state.cooks
    .filter(c=>{ for(let d=0;d<5;d++){ if(!c.days[d].off) return true; } return false; })
    .map(c=>c.name);
}
function updateMeta(){
  const counts=[0,0,0,0,0];
  state.cooks.forEach(c=>{ for(let d=0;d<5;d++){ if(!c.days[d].off) counts[d]++; } });
  let cv='';
  for(let d=0;d<5;d++){ cv+='<div class="cv">'+DAYS[d]+'<b>'+counts[d]+'</b></div>'; }
  document.getElementById('coverage').innerHTML=cv;

  const names=unsentNames();   // ★バッジの意味＝「未通知の人数」（v3.4までは変更セル数）
  document.getElementById('diffBadge').textContent=names.length;
  document.getElementById('btnDiff').disabled=(names.length===0);
  renderNotifyBar();
}

/* ───────── 通知状況バー（v3.5） ───────── */
function setNotifyBar(kind,title,sub){
  const el=document.getElementById('notifyBar');
  el.className='nbar '+kind;
  el.style.display='block';
  el.innerHTML='<div class="nb-t">'+esc(title)+'</div>'+(sub?('<div class="nb-sub">'+esc(sub)+'</div>'):'');
}
function renderNotifyBar(){
  if(!state.notify){
    setNotifyBar('load','📣 通知状況を取得できませんでした','この週に通知が飛んだかは画面からは確認できません。🔄更新で再取得してください。');
    return;
  }
  const work=workingNames();
  if(!work.length){ setNotifyBar('load','📣 この週はまだ出勤者がいません',''); return; }

  const done={}; (state.notify.names||[]).forEach(x=>{ done[x.name]=x.at; });
  const un=work.filter(n=>!done[n]);
  const last=state.notify.lastSentAt||'';
  const head='📣 この週の確定通知：'+(work.length-un.length)+'/'+work.length+'名'+(last?('　最終送信 '+last):'');

  if(!un.length){ setNotifyBar('ok',head,'この週の出勤者全員にLINEが飛んでいます。'); return; }
  if(un.length===work.length){
    setNotifyBar('none',head,'⚠️ まだ誰にも通知が飛んでいません。組み終わったら「📣 一括送信」を押してください（「💾 保存」だけではLINEは飛びません）。');
    return;
  }
  setNotifyBar('warn',head,'未通知：'+un.join('、'));
}
/* 送信後に通知状況を取り直す（失敗しても画面は壊さない） */
async function refreshNotifyStatus(){
  try{
    const r=await apiGet({action:'getKitchenNotifyStatus',weekTarget:state.weekTarget});
    state.notify=(r&&r.ok)?r:state.notify;
  }catch(e){ /* 表示は据え置き */ }
  renderNotifyBar();
}

/* ───────── 保存・送信 ───────── */
function buildRowsPayload(){
  return state.cooks.map(c=>({name:c.name,days:[0,1,2,3,4].map(d=>serializeDay(c,d))}));
}
function commitBase(){
  state.cooks.forEach(c=>{ c.base=[0,1,2,3,4].map(d=>normNV(serializeDay(c,d))); });
}

async function doSave(opt){
  const promptSend=!(opt&&opt.promptSend===false);
  const changed=computeChanges();          // ★保存前に退避（保存すると差分が消えるため）
  showLoading('保存中...'); setStatus('保存中...');
  let ok=false;
  try{
    const data=await apiPost({action:'saveKitchenShift',weekTarget:state.weekTarget,rows:buildRowsPayload()});
    if(!data.success) throw new Error(data.error||'保存失敗');
    commitBase();
    changed.forEach(c=>{ state.pending[c.name]=true; });   // ★保存済み・未通知として残す
    updateMeta();
    setStatus('保存完了（'+data.saved+'名）※LINEはまだ飛んでいません','ok');
    toast('保存しました（'+data.saved+'名）','ok');
    ok=true;
  }catch(e){
    setStatus('保存失敗：'+e.message,'err'); toast('保存失敗：'+e.message,'err');
  }finally{ hideLoading(); }
  if(ok&&promptSend) await promptNotifyAfterSave();
}

/* 保存しただけで終わらせないための促し（v3.5）
   ＝「保存だけで通知が飛んでいない」が今回の不具合の直接の再発防止 */
async function promptNotifyAfterSave(){
  const names=unsentNames();
  if(!names.length) return;
  const list=names.slice(0,10).join('、')+(names.length>10?(' ほか'+(names.length-10)+'名'):'');
  if(!confirm('保存しました。まだLINEは飛んでいません。\n\n未通知：'+names.length+'名\n'+list+'\n\n今すぐこの'+names.length+'名へ通知しますか？\n（キャンセル＝送らない。あとから「✏️ 差分送信」でも送れます）')) return;
  await sendDiffCore(names);
}

async function doSendAll(){
  const work=workingNames();
  if(!work.length){ toast('この週は出勤者がいません'); return; }
  if(!confirm('現在の内容を保存し、この週に出勤がある '+work.length+'名へ確定シフトをLINE通知します。\n（過去日・休は通知されません）\nよろしいですか？')) return;
  showLoading('保存＋一括通知中...'); setStatus('保存＋一括通知中...');
  try{
    const sv=await apiPost({action:'saveKitchenShift',weekTarget:state.weekTarget,rows:buildRowsPayload()});
    if(!sv.success) throw new Error(sv.error||'保存失敗');
    commitBase();
    const data=await apiPost({action:'sendKitchenShiftNotify',weekTarget:state.weekTarget,source:'manual'});
    if(!data.success) throw new Error(data.error||'通知失敗');
    state.pending={};
    await refreshNotifyStatus();
    updateMeta();
    setStatus('一括送信完了（送信'+data.sent+'名 / スキップ'+data.skipped+'名）','ok');
    toast('一括送信：'+data.sent+'名へ通知','ok');
  }catch(e){
    setStatus('一括送信失敗：'+e.message,'err'); toast('一括送信失敗：'+e.message,'err');
  }finally{ hideLoading(); }
}

async function doSendDiff(){
  const names=unsentNames();
  if(!names.length){ toast('未通知の人はいません'); return; }
  if(!confirm('現在の内容を保存し、まだ通知していない '+names.length+'名にだけLINEを送ります。\n対象：'+names.join('、')+'\n（過去日はスキップ）\nよろしいですか？')) return;
  await sendDiffCore(names);
}

/* 差分送信の実体（保存→氏名指定で送信）。
   GAS の sendKitchenShiftDiff は changes の name しか見ず、
   その人の「確定シートの現在の内容」を丸ごと送る仕様なので氏名だけ渡せばよい。 */
async function sendDiffCore(names){
  showLoading('保存＋差分通知中...'); setStatus('保存＋差分通知中...');
  try{
    const sv=await apiPost({action:'saveKitchenShift',weekTarget:state.weekTarget,rows:buildRowsPayload()});
    if(!sv.success) throw new Error(sv.error||'保存失敗');
    const data=await apiPost({action:'sendKitchenShiftDiff',weekTarget:state.weekTarget,changes:names.map(n=>({name:n}))});
    if(!data.success) throw new Error(data.error||'通知失敗');
    commitBase();
    state.pending={};
    await refreshNotifyStatus();
    updateMeta();
    setStatus('差分送信完了（送信'+data.sent+'名 / スキップ'+data.skipped+'名）','ok');
    toast('差分送信：'+data.sent+'名へ通知','ok');
  }catch(e){
    setStatus('差分送信失敗：'+e.message,'err'); toast('差分送信失敗：'+e.message,'err');
  }finally{ hideLoading(); }
}

window.addEventListener('load',()=>{ document.getElementById('pwInput').focus(); });
</script>
</body>
</html>
