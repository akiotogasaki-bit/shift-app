<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週給与明細 印刷</title>
<!--
  週締め給与明細（印刷用）  v1.2  2026-10-09
  ★v1.2 社長「封筒に貼るから縦長がいい」。ラベル（86.4×42.3mm・横長）の中身を90度回し、
         貼った時に縦長（42.3×86.4mm）で読めるようにした。用紙と配置は v1.1 のまま。
  v1.1  2026-10-09
  ★v1.1 社長指定のラベル用紙に合わせた＝A4・2列×6段＝12面（1面 86.4×42.3mm／上21.2・下22・左右18.6mm・面の間の隙間なし）。
         1面が横長で低いので、左に日別の表・右に名前と合計を置く。印刷は「余白なし・倍率100%」必須。
  v1.0  2026-10-05 A4縦を 横4×縦3＝12枠（1枠 52.5×99mm）。切り取り線で切って1人1枚で渡す。
  週＝月曜〜日曜（月をまたいでも1週間）。サーバー＝メインGAS getWeeklyPayslips（doPost・給与PW）。
-->
<style>
  :root { --ink:#111; --sub:#555; --line:#bbb; --bg:#f4f4f2; --accent:#7a2e1d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #ddd;
         padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar h1 { font-size: 16px; margin: 0 12px 0 0; }
  .bar input, .bar button { font-size: 15px; padding: 6px 10px; }
  .bar button { cursor: pointer; border: 1px solid #999; background: #fff; border-radius: 6px; }
  .bar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #msg { padding: 8px 16px; font-size: 14px; color: var(--sub); }
  #msg .warn { color: #b00; }

  /* ── A4ラベル 2列×6段（86.4×42.3mm）── */
  .sheet { width: 210mm; height: 297mm; margin: 12px auto; background: #fff;
           padding: 21.2mm 18.6mm 22mm; box-sizing: border-box;
           display: grid; grid-template-columns: repeat(2, 86.4mm); grid-template-rows: repeat(6, 42.3mm);
           box-shadow: 0 1px 4px rgba(0,0,0,.15); overflow: hidden; }
  .slip { outline: 0.2mm dashed var(--line); outline-offset: -0.1mm; position: relative; overflow: hidden; }
  .slip:empty { outline-color: #eee; }
  /* 中身は縦長（42.3×86.4mm）で組み、ラベルの中で90度回す。貼る時にラベルを縦にすると正しい向きになる */
  .slip .in { position: absolute; left: 50%; top: 50%; width: 42.3mm; height: 86.4mm;
              transform: translate(-50%, -50%) rotate(-90deg);
              padding: 3mm 2.6mm 2.6mm; box-sizing: border-box;
              font-size: 5.9pt; line-height: 1.25; display: flex; flex-direction: column; }
  .slip .ttl { font-size: 6.2pt; font-weight: 700; letter-spacing: .2em; text-align: center;
               border-bottom: 0.3mm solid var(--ink); padding-bottom: 0.8mm; margin-bottom: 1.2mm; }
  .slip .name { font-size: 9.5pt; font-weight: 700; line-height: 1.15; word-break: break-all; }
  .slip .name small { font-size: 6pt; font-weight: 400; }
  .slip .period { color: var(--sub); font-size: 5.6pt; margin: 0.4mm 0 1.4mm; }
  .slip table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .slip th { font-weight: 400; color: var(--sub); border-bottom: 0.2mm solid var(--ink); padding: 0 0 0.3mm; text-align: left; font-size: 5.2pt; }
  .slip td { padding: 0.4mm 0; border-bottom: 0.1mm solid #ddd; white-space: nowrap; }
  .slip .r { text-align: right; }
  .slip col.c1 { width: 26%; } .slip col.c2 { width: 33%; } .slip col.c3 { width: 15%; } .slip col.c4 { width: 26%; }
  .slip td.r, .slip th.r { padding-left: 0.6mm; }
  .slip .sum td { border-bottom: none; padding-top: 0.6mm; font-weight: 700; font-size: 5.6pt; }
  .slip .ex { margin-top: 1.2mm; font-size: 5.6pt; }
  .slip .ex div { display: flex; justify-content: space-between; }
  .slip .ex .exl { white-space: nowrap; margin-top: 0.4mm; }
  .slip .ex .det { color: var(--sub); font-size: 5pt; }
  .slip .total { margin-top: auto; border-top: 0.4mm double var(--ink); padding-top: 0.8mm;
                 display: flex; justify-content: space-between; align-items: baseline; }
  .slip .total span { font-size: 5.8pt; }
  .slip .total b { font-size: 11pt; }
  .slip .foot { color: var(--sub); font-size: 4.8pt; margin-top: 0.4mm; text-align: right; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .slip, .slip:empty { outline: none; }   /* ラベルは台紙で切れているので線は刷らない */
    .bar, #msg { display: none; }
    .sheet { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
    .sheet:last-child { page-break-after: auto; break-after: auto; }
  }
  @media screen and (max-width: 840px) {
    .sheet { zoom: .45; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>週給与明細</h1>
  <button id="prev">◀ 前の週</button>
  <input type="date" id="week">
  <button id="next">次の週 ▶</button>
  <input type="password" id="pw" placeholder="給与パスワード" size="10" autocomplete="off">
  <button class="primary" id="load">表示</button>
  <button id="print">🖨 印刷</button>
</div>
<div id="msg">週（その週のどの日でもよい）とパスワードを入れて「表示」。月曜〜日曜で集計します。</div>
<div id="pages"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkcAI-Nkl3aoUZKgluss5AawPDc7aluPokONkYz6f2ikwl0S487JvhKdKh6QSp1xhEhA/exec';
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const yen = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ja-JP');
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function mondayOf(d) { const x = new Date(d); const w = x.getDay(); x.setDate(x.getDate() + (w === 0 ? -6 : 1 - w)); return x; }
function shiftWeek(n) { const d = $('week').value ? new Date($('week').value + 'T00:00') : new Date(); d.setDate(d.getDate() + 7 * n); $('week').value = ymd(mondayOf(d)); }

// 既定＝先週の月曜（締めた週を印刷する想定）
(() => { const d = mondayOf(new Date()); d.setDate(d.getDate() - 7); $('week').value = ymd(d); })();
try { const s = sessionStorage.getItem('pwsPw'); if (s) $('pw').value = s; } catch (e) {}

$('prev').onclick = () => { shiftWeek(-1); if ($('pw').value) load(); };
$('next').onclick = () => { shiftWeek(1); if ($('pw').value) load(); };
$('load').onclick = load;
$('print').onclick = () => window.print();

async function load() {
  const pw = $('pw').value.trim();
  if (!pw) { $('msg').textContent = 'パスワードを入れてください。'; return; }
  $('msg').textContent = '読み込み中…';
  $('pages').innerHTML = '';
  try {
    const res = await fetch(GAS_URL, { method: 'POST', redirect: 'follow',
      body: JSON.stringify({ action: 'getWeeklyPayslips', pw, week: $('week').value }) });
    const r = await res.json();
    if (!r.ok) { $('msg').innerHTML = '<span class="warn">' + esc(r.message || 'エラー') + '</span>'; return; }
    try { sessionStorage.setItem('pwsPw', pw); } catch (e) {}
    render(r);
  } catch (e) {
    $('msg').innerHTML = '<span class="warn">読み込みに失敗しました：' + esc(e.message) + '</span>';
  }
}

function slipHtml(p, r) {
  const rows = p.days.map(d =>
    `<tr><td>${esc(d.label)}</td><td>${esc(d.inT)}-${esc(d.outT)}</td><td class="r">${esc(d.hm)}</td><td class="r">${yen(d.yen)}</td></tr>`).join('');
  const sum = `<tr class="sum"><td colspan="2">小計 ${p.days.length}日</td><td class="r">${esc(p.hm)}</td><td class="r">${yen(p.subtotal)}</td></tr>`;
  const ex = p.extras.length ? '<div class="ex">' + p.extras.map(x =>
    `<div class="exl">${esc(x.label)}</div><div><span class="det">${esc(x.detail)}</span><span>${x.yen > 0 ? '+' : ''}${yen(x.yen)}</span></div>`).join('') + '</div>' : '';
  return `<div class="slip"><div class="in">
    <div class="ttl">給与明細</div>
    <div class="name">${esc(p.name)} <small>様</small></div>
    <div class="period">${esc(r.fromLabel)}〜${esc(r.toLabel)}</div>
    <table><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
      <thead><tr><th>日付</th><th>出勤-退勤</th><th class="r">時間</th><th class="r">給与</th></tr></thead>
      <tbody>${rows}${sum}</tbody></table>
    ${ex}
    <div class="total"><span>${p.extras.length ? '差引支給額' : '合計'}</span><b>¥${yen(p.total)}</b></div>
    <div class="foot">${esc(r.brand)}</div>
  </div></div>`;
}

function render(r) {
  const people = r.people || [];
  const grand = people.reduce((s, p) => s + p.total, 0);
  let m = `${esc(r.fromLabel)}〜${esc(r.toLabel)}：週締め ${people.length}人・合計 ¥${yen(grand)}`;
  if (!people.length) m += '（この週に打刻のある週締めの人はいません）';
  (r.notes || []).forEach(n => { m += '<br><span class="warn">⚠ ' + esc(n) + '</span>'; });
  $('msg').innerHTML = m;
  let html = '';
  for (let i = 0; i < people.length; i += 12) {
    const chunk = people.slice(i, i + 12).map(p => slipHtml(p, r));
    while (chunk.length < 12) chunk.push('<div class="slip"></div>');
    html += '<div class="sheet">' + chunk.join('') + '</div>';
  }
  $('pages').innerHTML = html;
}
</script>
</body>
</html>
