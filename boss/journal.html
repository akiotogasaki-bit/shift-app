<!-- boss/journal v1.9 (2026-11-09) ★v1.9 社長「レポートを見ながら目標を立てたい」（A案）。週の左ページの「週のレポートを開く ›」で Cockpit へ飛ばず、その場に先週のレポートを重ねる。
     縦画面＝目標欄（ページ下）を隠さないよう上側に・横画面＝ページの横に出す。読むのは Cockpit と同じ dlist（key=weekly-<先週の月曜>）。ページをめくると閉じる。
     boss/journal v1.8 (2026-11-07) ★v1.8 週・月を見開き2ページに（社長決定 → 設計書 §6-3・§6-4）。
     週＝左「先週の振り返り（作成・販売・先週比・残り＝自動／やり残したタスク＝Todoist）＋今週の目標」・右「7日の行（その日の Todoist）＋目標ごとのタスク」。
     月＝左「先月の振り返り（作成・販売・売上・人件費率と前月比＝自動／やり残し）＋今月の目標→週の目標の表」・右「カレンダー（各日の販売）＋今月のタスク（Todoist）」。
     数字は jget の range、Todoist は jtodo の from/to で期間ごとに読む。週の目標の自動転記（23時の読み取り）と週・月のレポートはまだ。
     v1.8 追記：週の左ページに「週のレポートを開く ›」（Cockpit へ）。
     boss/journal v1.7 (2026-11-07) ★v1.7 Todoist（社長 A案＝関数が直接読み書き）。デイリー左のタスク欄の上に、Todoist でその日が期日のタスクを活字で出す。
     □を押すと Todoist で完了、☒をもう一度押すと未完了に戻す。関数 boss の jtodo／jdone（鍵は関数の .env だけ）。端末にも控える（電波が無い時は見るだけ）。
     boss/journal v1.6 (2026-11-07) ★v1.6 社長「ジャーナルに販売個数とかが出てない」＝段階2の数字を足した（A案＝作成数は基本数マスタG列）。
     デイリー左ページの日付の右に「作成 ◯／販売 ◯」（販売＝1次＋2次・自社の弁当）、終わった日はその上に「12時 ◯℃ 風 ◯m/s」。
     まだの日は作成の予定だけ。数字をタップすると内訳。Mac の daily-numbers.py（00:10・07:40）が関数 boss の jnums に置き、jget の dates で読む。端末にも控える。
     boss/journal v1.5 (2026-11-05) ★v1.5 ホーム画面のアイコンを手帳のピクトグラムに（茶の地に白抜き・他のアプリと同じ作り／journal-icon.png・-512）。
     v1.4 (2026-11-05) ★v1.4 社長「ペンを離して次の画を書く時の反応が遅い」＝①iPadのダブルタップ判定の待ちを止める（ページ上の touch を preventDefault）②1画ごとの全描き直し・全保存をやめる（足した1画だけ描く・端末保存は0.6秒まとめ）③送信（ページ画像づくり）は手を10秒止めてから。
     v1.3 (2026-11-05) ★v1.3 2本指でピンチイン／アウト（1〜4倍）。拡大中は1本指で動かす・「100%に戻す」。拡大後はくっきり描き直す。
     boss/journal v1.2 (2026-11-05) ★v1.2 アプリ名を「手帳」→「ジャーナル」（社長指示）。
     boss/journal v1.1 (2026-11-05) ★v1.1 社長「見開きだと小さい」→いつも1ページずつ大きく。指ではらう／「次のページ」で 左→右→追加→次の日の左 とめくる。
     boss/journal v1.0 (2026-11-05) 社長の手帳（バレットジャーナル）段階1＝書けて保存できる。
     設計: 40_ドキュメント/設計_バレットジャーナル手帳_2026-11-05.md
     ・2026年11月〜12月の INDEX／月間／週間／デイリー（見開き＋追加ページ）。見た目＝日付は革の手帳風の明朝・他はモノトーン
     ・ペン（黒赤青×細太）・蛍光ペン（黄）・消しゴム（線ごと）・戻す／やり直し（2本指タップでも戻す）
     ・Apple Pencil だけが線を引く。指は左右にはらってページ送り（「指でも書く」で切り替え）
     ・書いた線はまず端末の中（IndexedDB）に保存し、つながったら関数 boss の jsave へ自動で送る（ページ画像も一緒に）
     ・段階2（日付の横の数字・Todoist）と段階3（23時の読み取り）はまだ -->

<style>
:root{
  --desk:#ECECEC; --chrome:#FFFFFF; --fg:#111111; --sub:#777777; --line:#E0E0E0;
  --on-bg:#111111; --on-fg:#FFFFFF; --nav-bg:#F2F2F2;
  --paper:#FFFFFF; --warn:#B03A2E; --ok:#3E9B66;
  --f-body:"Noto Sans JP","Hiragino Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--fg);font-family:var(--f-body);font-size:14px;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar{background:var(--chrome);border-bottom:1px solid var(--line);padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.grp{display:flex;gap:5px;align-items:center}
.sep{width:1px;height:26px;background:var(--line)}
button{font-family:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:2px;padding:6px 10px;cursor:pointer;min-height:34px;letter-spacing:.02em;touch-action:manipulation}
button:focus-visible{outline:2px solid #111;outline-offset:2px}
button.on{background:var(--on-bg);border-color:var(--on-bg);color:var(--on-fg);font-weight:700}
button:disabled{opacity:.35;cursor:default}
.sw{width:34px;padding:0;display:grid;place-items:center}
.sw i{width:18px;height:18px;border-radius:50%;display:block}
.nav button{background:var(--nav-bg);border-color:transparent}
.stage{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:10px}
.tabs{display:none;gap:6px;margin-bottom:8px}
.spread{display:flex;gap:14px;justify-content:center;align-items:flex-start;transform-origin:0 0}
.pw{display:flex;flex-direction:column;align-items:center;gap:6px}
.page{position:relative;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 22px rgba(0,0,0,.10);touch-action:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.page .lk{position:absolute;background:transparent;border:0;padding:0;min-height:0;border-radius:3px}
.page .lk:active{background:rgba(0,0,0,.06)}
.add{font-size:12px}
.foot{background:var(--chrome);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--sub);align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.wait{background:#D89B2B}.dot.ng{background:var(--warn)}
.gate{position:fixed;inset:0;background:rgba(236,236,236,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:50;font-size:14px}
.gate[hidden]{display:none}
.gate input{font-size:16px;padding:8px 10px;border:1px solid #bbb;width:220px;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));background:#22252B;color:#fff;font-size:12px;padding:8px 12px;border-radius:6px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.nump{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:#fff;border:1px solid #111;padding:12px 16px;z-index:55;font-size:13px;line-height:1.75;min-width:240px;max-width:calc(100vw - 32px)}
.nump[hidden]{display:none}
.nump b{font-weight:700}.nump .s{color:var(--sub);font-size:12px}
.rep{position:fixed;z-index:40;background:#fff;border:1px solid #111;box-shadow:0 8px 22px rgba(0,0,0,.18);display:flex;flex-direction:column}
.rep[hidden]{display:none}
.rep-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 6px 5px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.rep-b{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 12px 16px;font-size:13px;line-height:1.7}
.rep-b h1{font-size:15px;margin:4px 0 6px}.rep-b h2,.rep-b h3{font-size:13.5px;margin:14px 0 4px}
.rep-b p{margin:5px 0}.rep-b ul{margin:4px 0;padding-left:18px}.rep-b .s{color:var(--sub)}
.rep-b table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font-size:11.5px;margin:6px 0}
.rep-b td,.rep-b th{border:1px solid var(--line);padding:3px 5px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ============================================================
   設定（マンダラ・Cockpit と同じ）
   ============================================================ */
var FB_CFG_ = { apiKey: 'AIzaSyA_BcnCo7yjc1KXVhCEOgFikNkKW3WmKcc', authDomain: 'oedo-bento.firebaseapp.com',
                projectId: 'oedo-bento', appId: '1:99139459025:web:13ec30058b25705fef32f0' };
var FB_AUTH_URL_ = 'https://asia-northeast1-oedo-bento.cloudfunctions.net/auth';
var BOSS_URL_ = 'https://asia-northeast1-oedo-bento.cloudfunctions.net/boss';
var FB_SDK_ = 'https://www.gstatic.com/firebasejs/10.14.1/';

var W = 600, H = 914, M = 26;
var START = ymd(2026, 11, 1), END = ymd(2026, 12, 31);
var HOL = { '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日' };
var WD = '月火水木金土日';
var INK = '#111111', SUB = '#8A8A8A', LINE = '#E3E3E3', DASH = '#EDEDED', DOT = '#C2C2C2', RED = '#C0392B', BLUE = '#2E6DB4', GREY = '#C8C8C8';
var F_NUM = '"Cormorant Garamond", "Times New Roman", serif', F_BODY = '"Noto Sans JP", "Hiragino Sans", sans-serif', F_DATE = '"Zen Old Mincho", "Hiragino Mincho ProN", serif';

function $(id){ return document.getElementById(id); }
var toastT = null;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2200); }

/* ============================================================
   日付
   ============================================================ */
function ymd(y, m, d){ return y + '-' + ('0'+m).slice(-2) + '-' + ('0'+d).slice(-2); }
function parse(s){ var a = s.split('-').map(Number); return new Date(Date.UTC(a[0], a[1]-1, a[2])); }
function fmt(dt){ return ymd(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate()); }
function addDays(s, n){ var d = parse(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); }
function wday(s){ return (parse(s).getUTCDay() + 6) % 7; }        // 月=0 … 日=6
function monday(s){ return addDays(s, -wday(s)); }
function inRange(s){ return s >= START && s <= END; }
function todayJst(){ var d = new Date(Date.now() + 9*3600*1000); return ymd(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
function isoWeek(s){ var d = parse(s); d.setUTCDate(d.getUTCDate() + 3 - wday(s)); var y1 = Date.UTC(d.getUTCFullYear(), 0, 4); return 1 + Math.round(((d - y1) / 864e5 - 3 + ((new Date(y1).getUTCDay() + 6) % 7)) / 7); }
function dcolor(s){ var w = wday(s); return (HOL[s] || w === 6) ? RED : (w === 5 ? BLUE : INK); }
function md(s){ var d = parse(s); return (d.getUTCMonth()+1) + '月' + d.getUTCDate() + '日'; }
function WEEKS(){ var a = [], w = monday(START); while(w <= END){ a.push(w); w = addDays(w, 7); } return a; }

/* ビュー＝ INDEX / M-2026-11 / W-2026-11-02 / D-2026-11-05 */
function viewPages(v){
  if(v.indexOf('D-') === 0){ var ids = [v + '-L', v + '-R']; for(var i = 2; i <= (S.extras[v] || 1); i++) ids.push(v + '-R' + i); return ids; }
  if(v.indexOf('W-') === 0 || v.indexOf('M-') === 0) return [v + '-L', v + '-R'];   // ★v1.8 週・月も見開き
  return [v];
}

/* ============================================================
   印刷済みの紙面（make_planner_v3.py と同じ割り付け・モノトーン）
   返り値＝リンクの当たり判定 [{x,y,w,h,to}]（紙面の座標）
   ============================================================ */
function txt(g, s, x, y, size, col, font, align, weight, ls){
  g.font = (weight || 400) + ' ' + size + 'px ' + (font || F_BODY); g.fillStyle = col || INK; g.textAlign = align || 'left';
  if('letterSpacing' in g) g.letterSpacing = (ls || 0) + 'px';
  g.fillText(s, x, y);
  if('letterSpacing' in g) g.letterSpacing = '0px';
}
function hline(g, x0, x1, y, col, w){ g.strokeStyle = col; g.lineWidth = w || .6; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); }
function dots(g, x0, y0, x1, y1){ g.fillStyle = DOT; for(var y = y0 + 7; y < y1; y += 14) for(var x = x0 + 7; x < x1; x += 14){ g.beginPath(); g.arc(x, y, .75, 0, 7); g.fill(); } }
function ruled(g, x0, y0, x1, y1, step){ for(var y = y0 + step; y <= y1; y += step) hline(g, x0, x1, y, LINE); }
function sec(g, en, ja, x, y){ txt(g, en, x, y - 11, 8.5, INK, F_BODY, 'left', 500, 3); txt(g, ja, x, y, 8.5, SUB); }
function legend(g){ txt(g, '記号：□タスク ☒完了 □>先送り ○予定 −メモ !重要 ？迷い ◎決定 Q分析・調査', M, H - 14, 8.5, '#333', F_BODY, 'left', 500); }
function pid(g, id){ txt(g, id, W - M, H - 14, 7.5, SUB, F_BODY, 'right'); }

function drawPage(g, id){
  g.clearRect(0, 0, W, H); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
  var links = [];
  if(id === 'INDEX') drawIndex(g, links);
  else if(id.indexOf('M-') === 0) drawMonth(g, id, links);
  else if(id.indexOf('W-') === 0) drawWeek(g, id, links);
  else drawDay(g, id, links);
  return links;
}

function dateHeader(g, s, y){
  txt(g, s.slice(0, 4), M, y, 10, SUB, F_BODY, 'left', 500, 2);
  var label = md(s); txt(g, label, M, y + 38, 30, INK, F_DATE, 'left', 700);
  g.font = '700 30px ' + F_DATE; var tw = g.measureText(label).width;
  txt(g, '（' + WD[wday(s)] + '）', M + tw + 2, y + 38, 18, dcolor(s), F_DATE, 'left', 700);
  if(HOL[s]) txt(g, HOL[s], M + tw + 50, y + 36, 11, RED, F_BODY, 'left', 500);
}

/* ★v1.6 日付の横の数字（作成／販売・12時の気温と風速）。タップで内訳 */
function cnt(v){ return Math.round(Number(v) || 0).toLocaleString('ja-JP'); }
function drawNums(g, s, links){
  var n = S.nums[s]; if(!n) return;
  var x = W - M, has = n.made != null || n.sold != null;
  if(has){
    if(n.temp12 != null || n.wind12 != null)
      txt(g, '12時　' + (n.temp12 != null ? n.temp12 + '℃' : '') + (n.wind12 != null ? '　風 ' + n.wind12 + 'm/s' : ''), x, 66, 10.5, SUB, F_BODY, 'right', 500);
    txt(g, '作成 ' + cnt(n.made) + '／販売 ' + cnt(n.sold), x, 88, 15, INK, F_BODY, 'right', 700);
  } else if(n.plan){
    txt(g, '作成予定 ' + cnt(n.plan), x, 88, 13, SUB, F_BODY, 'right', 700);
  } else return;
  links.push({ x: W/2, y: 50, w: W/2 - M, h: 50, fn: function(){ numPop(s); } });
}
function numPop(s){
  var n = S.nums[s], d = (n && n.detail) || {}, el = $('nump'), L = [], cats = ['海苔弁系', '全六', '満腹系'];
  var split = function(o){ return o ? cats.filter(function(k){ return o[k]; }).map(function(k){ return k + ' ' + cnt(o[k]); }).join('・') : ''; };
  L.push('<b>' + md(s) + '（' + WD[wday(s)] + '）</b>');
  if(n.made != null || n.sold != null){
    L.push('作成 <b>' + cnt(n.made) + '</b>個　<span class="s">' + split(d.made) + (d.madeExt ? '（他社製品 ' + cnt(d.madeExt) + ' は別）' : '') + '</span>');
    L.push('販売 <b>' + cnt(n.sold) + '</b>個 ＝ 1次 ' + cnt(d.sold1) + '（' + cnt(d.n1) + '拠点）＋ 2次 ' + cnt(d.sold2) + '（' + cnt(d.n2) + '拠点）');
    if(d.sold1Cat) L.push('<span class="s">1次の内訳 ' + split(d.sold1Cat) + (d.sold1Ext ? '・他社製品 ' + cnt(d.sold1Ext) + '（販売に入れていません）' : '') + '</span>');
    if(d.toSecond != null) L.push('2次へ回った ' + cnt(d.toSecond) + '個 → 最終の残り 約' + cnt(d.left) + '個');
    if(n.temp12 != null || n.wind12 != null) L.push('12時の天気　' + (n.temp12 != null ? n.temp12 + '℃' : '—') + '・風 ' + (n.wind12 != null ? n.wind12 + 'm/s' : '—'));
  } else {

/* Todoist の1行（□＋活字）。key＝S.todo の置き場所（日付 or 'R:from:to'） */

  if(t.done){ g.beginPath(); g.moveTo(x + 2.5, by - b + 2.5); g.lineTo(x + b - 1.5, by - .5); g.moveTo(x + b - 1.5, by - b + 2.5); g.lineTo(x + 2.5, by - .5); g.stroke(); }
  var label = (t.time ? t.time + ' ' : '') + t.content, f = '500 ' + size + 'px ' + F_BODY; g.font = f;
  while(label.length > 1 && g.measureText(label).width > w - b - 8) label = label.slice(0, -2) + '…';
  txt(g, label, x + b + 6, by, size, col, F_BODY, 'left', t.priority >= 4 ? 700 : 500);
  if(t.done){ g.font = f; var lw = g.measureText(label).width; hline(g, x + b + 6, x + b + 6 + lw, by - size/3, SUB, .7); }
  links.push({ x: x - 2, y: by - (h || size + 6) + 4, w: w + 2, h: h || size + 6, fn: function(){ toggleTodo(key, t); } });
}
function drawTodo(g, s, x, y0, w, step, links){
  var a = S.todo[s]; if(!a || !a.length) return 0;

  if(more > 0) txt(g, 'ほか ' + more + '件は Todoist で', x + 16, y0 + step*(n+1) - 7, 9, SUB, F_BODY, 'left', 500);
  return n + (more > 0 ? 1 : 0);
}

    var l = L[i], m;
    if(/^\s*\|/.test(l)){
      var h = '<table>', k = 0;
      for(; i < L.length && /^\s*\|/.test(L[i]); i++, k++){
        if(/^\s*\|?\s*:?-{2,}/.test(L[i])) continue;
        var tag = k === 0 ? 'th' : 'td';
        h += '<tr>' + L[i].trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return '<' + tag + '>' + repInline(c.trim()) + '</' + tag + '>'; }).join('') + '</tr>';

  if(tt.maxN === 1 && S.zoom <= 1.01 && Math.abs(dx) > 70 && dt < 700) step(dx < 0 ? 1 : -1);
}

function undo(){
  var h = S.hist.pop(); if(!h){ toast('戻せる操作はありません'); return; }
  var st = pageState(h.id).strokes;
  if(h.t === 'add'){ var i = st.indexOf(h.s); if(i >= 0) st.splice(i, 1); } else st.splice(Math.min(h.at, st.length), 0, h.s);
  S.redo.push(h); redraw(h.id); touchPage(h.id); navState();
}
function redo(){
  var h = S.redo.pop(); if(!h) return;
  var st = pageState(h.id).strokes;
  if(h.t === 'add') st.push(h.s); else { var i = st.indexOf(h.s); if(i >= 0) st.splice(i, 1); }
  S.hist.push(h); redraw(h.id); touchPage(h.id); navState();
}

/* ============================================================
   ピンチで拡大・縮小（2本指）／拡大中は1本指で動かす ★v1.3
   ============================================================ */
S.zoom = 1;
var Z = { pts: {}, active: false, endAt: 0, pan: [0, 0], z0: 1, d0: 0, m0: null, p0: null, o: null, moved: false };
function applyZoom(){
  $('spread').style.transform = S.zoom > 1.01 ? 'translate(' + Z.pan[0] + 'px,' + Z.pan[1] + 'px) scale(' + S.zoom + ')' : '';
  $('zoom100').hidden = S.zoom <= 1.01;
}
function resetZoom(){ S.zoom = 1; Z.pan = [0, 0]; applyZoom(); }
function zpts(){ return Object.keys(Z.pts).map(function(k){ return Z.pts[k]; }); }
function zbegin(){
  var a = zpts(), r = $('spread').getBoundingClientRect();
  Z.z0 = S.zoom; Z.p0 = Z.pan.slice(); Z.o = [r.left - Z.pan[0], r.top - Z.pan[1]];
  Z.m0 = a.length >= 2 ? [(a[0][0] + a[1][0]) / 2, (a[0][1] + a[1][1]) / 2] : a[0].slice();
  Z.d0 = a.length >= 2 ? Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) : 0;
}
var stageEl = $('stage');
stageEl.style.touchAction = 'none';
stageEl.addEventListener('pointerdown', function(e){
  if(e.pointerType !== 'touch' || (S.finger && !Object.keys(Z.pts).length && S.zoom <= 1.01)) return;
  Z.pts[e.pointerId] = [e.clientX, e.clientY];
  var n = Object.keys(Z.pts).length;
  if(n === 2 || (n === 1 && S.zoom > 1.01)){ Z.active = true; Z.moved = false; zbegin(); }
}, true);
stageEl.addEventListener('pointermove', function(e){
  if(!Z.pts[e.pointerId]) return;
  Z.pts[e.pointerId] = [e.clientX, e.clientY];
  if(!Z.active) return;
  var a = zpts(), m = a.length >= 2 ? [(a[0][0] + a[1][0]) / 2, (a[0][1] + a[1][1]) / 2] : a[0];
  var z = Z.z0;
  if(a.length >= 2 && Z.d0 > 0) z = Math.max(1, Math.min(4, Z.z0 * Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) / Z.d0));
  if(Math.abs(z - Z.z0) > .02 || Math.hypot(m[0] - Z.m0[0], m[1] - Z.m0[1]) > 8) Z.moved = true;
  S.zoom = z;
  Z.pan = z <= 1.01 ? [0, 0] : [m[0] - Z.o[0] - z * (Z.m0[0] - Z.o[0] - Z.p0[0]) / Z.z0, m[1] - Z.o[1] - z * (Z.m0[1] - Z.o[1] - Z.p0[1]) / Z.z0];
  applyZoom();
}, true);
function zend(e){
  if(!Z.pts[e.pointerId]) return;
  delete Z.pts[e.pointerId];
  if(!Z.active) return;
  if(Z.moved) Z.endAt = Date.now();
  if(Object.keys(Z.pts).length){ zbegin(); return; }          // 1本離しただけ＝残りの指で続ける
  Z.active = false;
  if(Z.moved){ if(S.zoom <= 1.01) resetZoom(); clearTimeout(Z.rt); Z.rt = setTimeout(build, 200); }   // 拡大後にくっきり描き直す
}
stageEl.addEventListener('pointerup', zend, true);
stageEl.addEventListener('pointercancel', zend, true);
$('zoom100').onclick = function(){ resetZoom(); build(); };

/* ============================================================
   ページ移動
   ============================================================ */
function step(dir){
  var v = S.view;
  if(v.indexOf('D-') === 0){
    var n = viewPages(v).length;
    if(S.cur + dir >= 0 && S.cur + dir < n){ S.cur += dir; build(); return; }   // 同じ日の左→右→追加
    var s = addDays(v.slice(2), dir); if(!inRange(s)) return;
    show('D-' + s).then(function(){ if(dir < 0){ S.cur = viewPages(S.view).length - 1; build(); } });
    return;
  }
  if((v.indexOf('W-') === 0 || v.indexOf('M-') === 0) && S.cur + dir >= 0 && S.cur + dir < 2){ S.cur += dir; build(); return; }   // 左→右
  var back = function(){ if(dir < 0){ S.cur = 1; build(); } };
  if(v.indexOf('W-') === 0){ var w = WEEKS(), i = w.indexOf(v.slice(2)) + dir; if(i >= 0 && i < w.length) show('W-' + w[i]).then(back); return; }
  if(v.indexOf('M-') === 0){ var to = v === 'M-2026-11' ? (dir > 0 ? 'M-2026-12' : 'INDEX') : (dir > 0 ? 'M-2026-12' : 'M-2026-11'); if(to !== v) show(to).then(to === 'INDEX' ? null : back); return; }
  if(dir > 0) show('M-2026-11');
}
function navState(){
  var v = S.view, isD = v.indexOf('D-') === 0, isW = v.indexOf('W-') === 0;
  $('n-idx').classList.toggle('on', v === 'INDEX'); $('n-11').classList.toggle('on', v === 'M-2026-11'); $('n-12').classList.toggle('on', v === 'M-2026-12');
  $('n-wk').disabled = !isD; $('n-wk').classList.toggle('on', isW);
  $('n-prev').disabled = isD ? v.slice(2) <= START : isW ? v.slice(2) <= WEEKS()[0] : v === 'INDEX';
  $('n-next').disabled = isD ? v.slice(2) >= END : isW ? v.slice(2) >= WEEKS()[WEEKS().length - 1] : v === 'M-2026-12';
  $('n-prev').textContent = isD ? '◀ 前の日' : '◀'; $('n-next').textContent = isD ? '次の日 ▶' : '▶';
  var isM = v.indexOf('M-') === 0;
  $('n-pp').hidden = $('n-np').hidden = !(isD || isW || isM);
  if(isD){ var n = viewPages(v).length; $('n-pp').disabled = S.cur <= 0 && v.slice(2) <= START; $('n-np').disabled = S.cur >= n - 1 && v.slice(2) >= END; }
  if(isW){ $('n-pp').disabled = S.cur <= 0 && v.slice(2) <= WEEKS()[0]; $('n-np').disabled = S.cur >= 1 && v.slice(2) >= WEEKS()[WEEKS().length - 1]; }
  if(isM){ $('n-pp').disabled = false; $('n-np').disabled = S.cur >= 1 && v === 'M-2026-12'; }
  $('undo').disabled = !S.hist.length; $('redo').disabled = !S.redo.length;
}
$('n-idx').onclick = function(){ show('INDEX'); };
$('n-11').onclick = function(){ show('M-2026-11'); };
$('n-12').onclick = function(){ show('M-2026-12'); };
$('n-wk').onclick = function(){ if(S.view.indexOf('D-') === 0) show('W-' + monday(S.view.slice(2))); };
$('n-prev').onclick = function(){ if(S.view.indexOf('D-') === 0){ var s = addDays(S.view.slice(2), -1); if(inRange(s)) show('D-' + s); } else step(-1); };
$('n-next').onclick = function(){ if(S.view.indexOf('D-') === 0){ var s = addDays(S.view.slice(2), 1); if(inRange(s)) show('D-' + s); } else step(1); };
$('n-pp').onclick = function(){ step(-1); };
$('n-np').onclick = function(){ step(1); };
$('n-today').onclick = function(){ var t = todayJst(); show(inRange(t) ? 'D-' + t : 'INDEX'); };
$('undo').onclick = undo; $('redo').onclick = redo;

/* ---- 道具 ---- */
function sel(ids, el){ ids.forEach(function(i){ $(i).classList.remove('on'); }); el.classList.add('on'); }
function setMode(m){ S.mode = m; $('eraser').classList.toggle('on', m === 'eraser'); $('eraser').setAttribute('aria-pressed', String(m === 'eraser')); $('hl').classList.toggle('on', m === 'hl'); $('hl').setAttribute('aria-pressed', String(m === 'hl')); }
['c-k', 'c-r', 'c-b'].forEach(function(i){ $(i).onclick = function(){ S.color = $(i).dataset.c; setMode('pen'); sel(['c-k', 'c-r', 'c-b'], $(i)); }; });
['w-thin', 'w-bold'].forEach(function(i){ $(i).onclick = function(){ S.width = +$(i).dataset.w; setMode('pen'); sel(['w-thin', 'w-bold'], $(i)); }; });
$('hl').onclick = function(){ setMode(S.mode === 'hl' ? 'pen' : 'hl'); };
$('eraser').onclick = function(){ setMode(S.mode === 'eraser' ? 'pen' : 'eraser'); };
function fingerBtn(){ $('finger').classList.toggle('on', S.finger); $('finger').setAttribute('aria-pressed', String(S.finger)); }
$('finger').onclick = function(){ S.finger = !S.finger; try{ localStorage.setItem('journal-finger', S.finger ? '1' : '0'); }catch(e){} fingerBtn(); toast(S.finger ? '指でも線を引きます' : 'Apple Pencil だけが線を引きます'); };
fingerBtn();

/* ============================================================
   送る（つながったら自動）
   ============================================================ */
var syncT = null;
function scheduleSync(){ clearTimeout(syncT); syncT = setTimeout(syncNow, 10000); }   // ★v1.4 ページ画像づくりの間はペンが効かない＝手を10秒止めてから送る
async function dirtyRows(){ return (await idbAll('pages')).filter(function(r){ return r.dirty; }); }
async function showSync(){
  var n = (await dirtyRows()).length, el = $('sync');
  if(!navigator.onLine) el.innerHTML = '<span class="dot wait"></span>電波なし・この端末に保存済み' + (n ? '（未送信 ' + n + 'ページ）' : '');
  else if(!S.user) el.innerHTML = '<span class="dot wait"></span>この端末に保存済み・ログインすると送ります' + (n ? '（未送信 ' + n + 'ページ）' : '');
  else if(n) el.innerHTML = '<span class="dot wait"></span>この端末に保存済み・送信待ち ' + n + 'ページ';
  else el.innerHTML = '<span class="dot"></span>保存・送信済み' + (S.lastSent ? ' ' + hm(S.lastSent) : '');
}
function hm(ms){ var d = new Date(ms + 9*3600*1000); return d.getUTCHours() + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
/* 23時に読む用のページ画像（紙面＋線を1枚にする・JPEG） */
function snapshot(id, strokes){
  var k = 1.5, c = document.createElement('canvas'); c.width = W*k; c.height = H*k;
  var g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); drawPage(g, id);
  strokes.forEach(function(s){ if(s.h) paint(g, s); }); strokes.forEach(function(s){ if(!s.h) paint(g, s); });
  return c.toDataURL('image/jpeg', .82);
}
async function syncNow(){
  if(S.syncing || !navigator.onLine || !S.user) { showSync(); return; }
  S.syncing = true;
  try{
    await flushSave();
    var rows = await dirtyRows();
    for(var i = 0; i < rows.length; i++){
      var r = rows[i], strokes = dec(r.json);
      var res = await api('jsave', { id: r.id, json: r.json, png: snapshot(r.id, strokes), clientAt: r.clientAt });
      if(!res || res.ok === false) throw new Error((res && res.error) || '送れませんでした');
      var now = await idbGet('pages', r.id);
      if(now && now.clientAt === r.clientAt){ now.dirty = false; await idbPut('pages', now); var p = S.pages[r.id]; if(p && p.clientAt === r.clientAt) p.dirty = false; }
      S.lastSent = Date.now();
    }
  }catch(e){ console.warn('sync', e); $('sync').innerHTML = '<span class="dot ng"></span>送れませんでした（この端末には保存済み・あとで自動で送ります）'; S.syncing = false; setTimeout(syncNow, 30000); return; }
  S.syncing = false; showSync();
}
/* ほかの端末で書いた分を取り込む（この端末で未送信のページは触らない） */
async function pullFromServer(ids){
  if(!S.user || !navigator.onLine) return;
  var want = ids.slice(); if(S.view.indexOf('D-') === 0) for(var i = (S.extras[S.view] || 1) + 1; i <= 9; i++) want.push(S.view + '-R' + i);
  try{
    var isD = S.view.indexOf('D-') === 0, ds = isD ? S.view.slice(2) : '', isWM = /^[WM]-/.test(S.view), spn = isWM ? spanOf(S.view) : null;
    var r = await api('jget', { ids: want, dates: isD ? [ds] : [], range: spn ? { from: spn.prev2[0], to: spn.cur[1] } : null }), changed = false;
    (r.nums || []).forEach(function(n){   // ★v1.6 数字が変わっていたら描き直す
      var v = { made: n.made, sold: n.sold, plan: n.plan, temp12: n.temp12, wind12: n.wind12, sales: n.sales, labor: n.labor, detail: n.detail || {} };
      if(JSON.stringify(S.nums[n.date] || null) === JSON.stringify(v)) return;
      S.nums[n.date] = v; idbPut('meta', { k: 'nums:' + n.date, v: v }); if(n.date === ds || isWM) changed = true;
    });
    for(var j = 0; j < (r.pages || []).length; j++){
      var sp = r.pages[j], p = pageState(sp.id); p.loaded = true;
      var m = /^(D-\d{4}-\d{2}-\d{2})-R(\d+)$/.exec(sp.id);
      if(m && +m[2] > (S.extras[m[1]] || 1)){ S.extras[m[1]] = +m[2]; idbPut('meta', { k: 'extras:' + m[1], n: +m[2] }); changed = true; }
      if(p.dirty || sp.clientAt <= p.clientAt) continue;
      p.strokes = dec(sp.json); p.clientAt = sp.clientAt;
      await idbPut('pages', { id: sp.id, json: sp.json, clientAt: sp.clientAt, dirty: false });
      if(els[sp.id]) redraw(sp.id);
    }
    if(changed) build();
  }catch(e){ console.warn('pull', e); }
  if(S.view.indexOf('D-') === 0) pullTodo(S.view.slice(2));
  else if(/^[WM]-/.test(S.view)) pullTodo(todoKey(S.view));
}
window.addEventListener('online', function(){ showSync(); syncNow(); });
window.addEventListener('offline', showSync);
window.addEventListener('pagehide', function(){ flushSave(); });
document.addEventListener('visibilitychange', function(){ if(document.hidden){ flushSave(); syncNow(); } else if(S.view) pullFromServer(viewPages(S.view)); });
setInterval(function(){ syncNow(); }, 60000);

/* ============================================================
   ログイン（Cockpit と同じ。電波が無い時はこの端末の中だけで書ける）
   ============================================================ */
function fbLoadScript_(src){ return new Promise(function(ok, ng){ var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); }); }
async function fbSdk_(){
  if(!window.firebase){ await fbLoadScript_(FB_SDK_ + 'firebase-app-compat.js'); await fbLoadScript_(FB_SDK_ + 'firebase-auth-compat.js'); }
  if(!firebase.apps.length) firebase.initializeApp(FB_CFG_);
}
function fbPersistedUser_(){
  return new Promise(function(res){
    var done = false, un = null, fin = function(u){ if(done) return; done = true; try{ if(un) un(); }catch(e){} res(u || null); };
    try{ un = firebase.auth().onAuthStateChanged(fin); }catch(e){ fin(null); }
    setTimeout(function(){ fin(null); }, 5000);
  });
}
async function api(mode, body){
  var u = firebase.auth().currentUser; if(!u) throw new Error('ログインできていません');
  var tok = await u.getIdToken();
  var r = await fetch(BOSS_URL_, { method: 'POST', body: JSON.stringify(Object.assign({ mode: mode, fbIdToken: tok }, body || {})) });
  var j = await r.json().catch(function(){ return null; });
  if(!j) throw new Error('通信エラー ' + r.status);
  if(j.ok === false && mode !== 'me') throw new Error(j.error || '失敗しました');
  return j;
}
function gate(html){ var g = $('gate'); g.innerHTML = html; g.hidden = !html; }
function pwGate(msg){
  gate('<div>' + (msg || '入口パスワードを入れてください') + '</div><input id="gate-pw" type="password" autocomplete="current-password" placeholder="パスワード"><button class="on" id="gate-go">入る</button>');
  var go = function(){ var pw = $('gate-pw').value.trim(); if(!pw) return; $('gate-go').disabled = true;
    fetch(FB_AUTH_URL_, { method: 'POST', body: JSON.stringify({ mode: 'pw', password: pw }) }).then(function(x){ return x.json(); })
      .then(function(r){ if(!r || !r.ok || !r.token) throw new Error(); return firebase.auth().signInWithCustomToken(r.token); })
      .then(afterLogin).catch(function(){ pwGate('パスワードが違います'); }); };
  $('gate-go').onclick = go; $('gate-pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
}
async function afterLogin(){
  var me = await api('me').catch(function(){ return null; });
  if(!me || !me.allowed){ gate('<div>このジャーナルは社長専用です。</div><button id="gate-out">別のアカウントで入り直す</button>'); $('gate-out').onclick = function(){ firebase.auth().signOut().then(function(){ location.reload(); }); }; return; }
  S.user = firebase.auth().currentUser; gate('');
  showSync(); syncNow(); if(S.view) pullFromServer(viewPages(S.view));
}
async function login(){
  try{ await fbSdk_(); }catch(e){ showSync(); return; }        // 電波が無い：この端末の中だけで書く
  if(await fbPersistedUser_()) return afterLogin();
  if(!navigator.onLine){ showSync(); return; }
  pwGate();
}

/* ============================================================
   起動
   ============================================================ */
$('rep-x').onclick = repClose;
window.addEventListener('resize', function(){ clearTimeout(window.__rz); window.__rz = setTimeout(function(){ if(S.view) build(); }, 150); });
window.addEventListener('hashchange', function(){ var h = decodeURIComponent(location.hash.slice(1)); if(h && h !== S.view) show(h); });
function validView(v){ return v === 'INDEX' || /^M-2026-1[12]$/.test(v) || (/^W-\d{4}-\d{2}-\d{2}$/.test(v) && WEEKS().indexOf(v.slice(2)) >= 0) || (/^D-\d{4}-\d{2}-\d{2}$/.test(v) && inRange(v.slice(2))); }
(async function(){
  await idbOpen();
  (await idbAll('meta')).forEach(function(r){ if(r.k.indexOf('extras:') === 0) S.extras[r.k.slice(7)] = r.n; });
  if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r, 2500); })]);
  var h = decodeURIComponent(location.hash.slice(1)), t = todayJst();
  await show(validView(h) ? h : (inRange(t) ? 'D-' + t : 'INDEX'));
  showSync();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('journal-sw.js').catch(function(){});
  login();
})();
</script>
