     boss/desk v1.4 (2026-11-05) ★v1.4 アイコンを臙脂の地に白抜きのメーターに（社長「Cockpitだけ浮く」＝他のアプリと同じ作りに）。
     v1.3 (2026-11-04) ★v1.3 アイコンをお江戸弁当のロゴに（社長「ロゴ入れようか」）。manifest を足した＝デスクトップの Chrome アプリ・ホーム画面に置ける。
     boss/desk v1.2 (2026-11-04) ★v1.2 レポートをカードで（社長決定 B案）。バッチが cards（数字）を載せた物は、大きな数字のカードで出す

     boss/desk v1.1 (2026-11-02) ★v1.1 名前を「Cockpit」に（社長決定・旧「今日の机」。URLは desk.html のまま＝ホーム画面のアイコンはそのまま使える）。
     勤怠の修正申告（type=att）の承認／却下。却下は理由を聞いてから送る（本人へLINEで届く）。
     boss/desk v1.0 (2026-11-01) 【社長専用・今日の机】社長決定（B案＝承認まで一気に）。
     承認／確認事項／レポートを1画面に。Mac のバッチと Claude の定期タスクが Firebase の boss 関数へ載せる（mode=dpost）。
     ★承認ボタンで実行するのは関数側の許可リスト（GAS_ACTIONS＝拠点レベル・初回納品の作り直し）だけ。
       請求書の送付・郵送代行・消込はボタンでは実行しない＝「チャットで『送って』」の文面を出して待つ（A案）。
     ★ログインはマンダラと同じ（同じ場所なので、マンダラで入っていれば入り直し不要）。

<style>
:root{
  --navy:#1A3C5E; --bg:#F2F2EE; --panel:#F6F6F3; --card:#fff;
  --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.14); --muted:#7a7a74; --text:#222;
  --green:#3B6D11; --orange:#854F0B; --red:#A32D2D;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--text);-webkit-text-size-adjust:100%;}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--panel);display:flex;flex-direction:column;}
.hdr{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
.hdr i{font-size:18px;}
.tabs{display:flex;background:#fff;border-bottom:.5px solid var(--line2);}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
.body{padding:12px 16px 40px;flex:1;}
input,select,textarea{width:100%;font-size:13px;padding:8px;border:.5px solid rgba(0,0,0,.18);border-radius:8px;font-family:inherit;color:var(--text);background:#fff;margin-bottom:10px;}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:500;width:100%;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn:disabled{opacity:.5;cursor:default;}
.btn.sub{background:#fff;color:var(--navy);border:.5px solid var(--navy);}
.empty{background:#fff;border:.5px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:#9a9a93;font-size:12px;line-height:1.6;}
.overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:12px;color:var(--muted);z-index:60;font-size:13px;line-height:1.6;}
.overlay i{font-size:34px;color:var(--navy);}
.overlay input{max-width:260px;text-align:center;margin:0;}
.overlay .btn{max-width:260px;}
.spinner{width:30px;height:30px;border:3px solid rgba(0,0,0,.12);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.inline-loading{display:flex;align-items:center;justify-content:center;gap:8px;color:#9a9a93;font-size:12px;padding:18px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.toast.show{opacity:.96;}
.toast.err{background:var(--red);}
.ver{font-size:9px;color:#c4c4bd;text-align:center;padding:6px 0 2px;}
.hdr .sp{flex:1;}
.hdr a,.hdr button{color:#fff;background:none;border:none;font-size:18px;cursor:pointer;text-decoration:none;display:flex;}
.tab .n{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;margin-left:3px;}
.tab .n.z{background:#c4c4bd;}
.card{background:#fff;border:.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.card h3{font-size:14px;font-weight:600;line-height:1.4;}
.meta{font-size:10px;color:var(--muted);margin:3px 0 6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.badge{font-size:10px;padding:1px 6px;border-radius:6px;border:.5px solid currentColor;}
.b-open{color:var(--navy);} .b-running{color:var(--orange);} .b-waiting{color:var(--orange);} .b-failed{color:var(--red);}
.b-done{color:var(--green);} .b-rejected{color:var(--muted);}
.sum{font-size:13px;line-height:1.6;white-space:pre-wrap;}
.more{font-size:11px;color:var(--navy);background:none;border:none;padding:6px 0;cursor:pointer;font-family:inherit;}
.md{font-size:12px;line-height:1.65;border-top:.5px solid var(--line);margin-top:6px;padding-top:8px;overflow-x:auto;}
.md h1,.md h2,.md h3,.md h4{font-size:13px;margin:10px 0 4px;}
.md p{margin:4px 0;} .md ul{padding-left:18px;margin:4px 0;}
.md table{border-collapse:collapse;font-size:11px;margin:6px 0;}
.md td,.md th{border:.5px solid var(--line2);padding:3px 5px;white-space:nowrap;}
.md th{background:var(--panel);}
.md code{background:var(--panel);padding:0 3px;border-radius:3px;font-size:11px;}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.links a{font-size:11px;color:var(--navy);border:.5px solid var(--navy);border-radius:12px;padding:3px 9px;text-decoration:none;}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.choice{text-align:left;display:block;}
.choice b{font-size:13px;} .choice small{display:block;font-size:11px;opacity:.85;margin-top:2px;font-weight:400;line-height:1.5;}
.choice .tag{font-size:10px;opacity:.8;}
.row2{display:flex;gap:6px;} .row2 .btn{flex:1;}
.result{font-size:11px;white-space:pre-wrap;background:var(--panel);border-radius:6px;padding:6px 8px;margin-top:8px;color:#444;}
.chatbox{background:#FFF8EC;border:.5px solid #E7C98F;border-radius:8px;padding:10px;margin-top:8px;font-size:12px;line-height:1.6;}
.chatbox pre{white-space:pre-wrap;font-family:inherit;background:#fff;border-radius:6px;padding:6px 8px;margin:6px 0;font-size:13px;}
/* v1.2 カード表示（数字） */
.kgt{font-size:11px;color:var(--muted);margin:10px 0 5px;font-weight:600;}
.kg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.kc{background:var(--panel);border-radius:9px;padding:9px 10px;min-width:0;}
.kc .l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kc .v{font-size:21px;font-weight:600;color:var(--navy);line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.kc .s{font-size:10px;color:var(--muted);line-height:1.4;margin-top:2px;}
.kc.bad .v{color:var(--red);} .kc.warn .v{color:var(--orange);} .kc.good .v{color:var(--green);}
.kc.txt{grid-column:1/-1;}
.kc.txt .v{font-size:15px;line-height:1.45;white-space:normal;}
.kc.txt .s{font-size:12px;line-height:1.5;}
#root.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start;}
#root.grid .card{margin-bottom:0;}
/* iPad・PC：横に広げる */
@media (min-width:700px){
  .app{max-width:1180px;}
  .body{padding:16px 22px 48px;}
  .hdr{font-size:17px;padding:15px 22px;}
  .tab{font-size:14px;padding:12px 2px;}
  .card{padding:16px;}
  .card h3{font-size:16px;}
  .sum{font-size:14px;}
  .kg{grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px;}
  .kc{padding:12px 14px;}
  .kc .l{font-size:12px;}
  .kc .v{font-size:27px;}
  .kc .s{font-size:11px;}
  .kgt{font-size:12px;margin:14px 0 6px;}
  #root.grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
  #root.grid .card.wide{grid-column:1/-1;}
}
@media (min-width:1100px){ .kc .v{font-size:30px;} }
</style>
</head>

<script>
/* ============================================================
   設定（マンダラと同じ）
   ============================================================ */
var BOSS_LIFF_ID = '';
var FB_CFG_ = { apiKey: 'AIzaSyA_BcnCo7yjc1KXVhCEOgFikNkKW3WmKcc', authDomain: 'oedo-bento.firebaseapp.com',
                projectId: 'oedo-bento', appId: '1:99139459025:web:13ec30058b25705fef32f0' };
var FB_AUTH_URL_ = 'https://asia-northeast1-oedo-bento.cloudfunctions.net/auth';
var BOSS_URL_ = 'https://asia-northeast1-oedo-bento.cloudfunctions.net/boss';
var FB_SDK_ = 'https://www.gstatic.com/firebasejs/10.14.1/';

var S = { tab:'approve', items:[], all:false, open:{}, busy:{}, chat:{} };
var KIND_TAB = { approve:'approve', check:'check', report:'report' };
var ST_LABEL = { open:'未対応', running:'実行中', waiting:'チャット待ち', failed:'失敗', done:'済み', rejected:'見送り' };
var OPEN_ST = ['open','running','waiting','failed'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var toastTimer = null;
function toast(msg, err){
  var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.className = 'toast' + (err ? ' err' : ''); }, 2600);
}
function fmtTime(ms){
  if(!ms) return '';
  var d = new Date(ms + 9*3600*1000);
  return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+' '+d.getUTCHours()+':'+('0'+d.getUTCMinutes()).slice(-2);
}

/* ============================================================
   ログイン（mandala.html と同じ）
   ============================================================ */
function fbLoadScript_(src){
  return new Promise(function(ok, ng){ var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
}
async function fbSdk_(){
  if(!window.firebase){
    await fbLoadScript_(FB_SDK_ + 'firebase-app-compat.js');
    await fbLoadScript_(FB_SDK_ + 'firebase-auth-compat.js');
  }
  if(!firebase.apps.length) firebase.initializeApp(FB_CFG_);
}
function fbPersistedUser_(){
  return new Promise(function(res){
    var done = false, un = null;
    var fin = function(u){ if(done) return; done = true; try{ if(un) un(); }catch(e){} res(u || null); };
    try{ un = firebase.auth().onAuthStateChanged(fin); }catch(e){ fin(null); }
    setTimeout(function(){ fin(null); }, 5000);
  });
}
async function signInWith_(body){
  var r = await fetch(FB_AUTH_URL_, { method:'POST', body:JSON.stringify(body) }).then(function(x){ return x.json(); });
  if(!r || !r.ok || !r.token) throw new Error((r && r.error) || 'ログインできませんでした');
  await firebase.auth().signInWithCustomToken(r.token);
}
async function login_(){
  await fbSdk_();
  if(await fbPersistedUser_()) return true;
  if(BOSS_LIFF_ID && window.liff){
    try{
      await liff.init({ liffId: BOSS_LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return false; }
      var idt = liff.getIDToken && liff.getIDToken();
      var act = !idt && liff.getAccessToken ? liff.getAccessToken() : null;
      if(idt || act){ await signInWith_(idt ? { idToken: idt } : { accessToken: act }); return true; }
    }catch(e){ console.warn('LIFF', e); }
  }
  return null;   // パスワード入口を出す
}
function showPwGate_(msg){
  $('gate').innerHTML = '<i class="ti ti-lock"></i><div>'+esc(msg || '入口パスワードを入れてください')+'</div>'
    + '<input id="gate-pw" type="password" autocomplete="current-password" placeholder="パスワード">'
    + '<button class="btn" id="gate-go">入る</button>';
  var go = function(){
    var pw = $('gate-pw').value.trim(); if(!pw) return;
    $('gate-go').disabled = true;
    signInWith_({ mode:'pw', password: pw }).then(afterLogin_).catch(function(){ showPwGate_('パスワードが違います'); });
  };
  $('gate-go').addEventListener('click', go);
  $('gate-pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
}
function denyGate_(){
  $('gate').innerHTML = '<i class="ti ti-ban"></i><div>このアプリは社長専用です。</div>'
    + '<button class="btn sub" id="gate-out">別のアカウントで入り直す</button>';
  $('gate-out').addEventListener('click', function(){ firebase.auth().signOut().then(function(){ location.reload(); }); });
}
async function afterLogin_(){
  var me = await api('me').catch(function(){ return null; });
  if(!me || !me.allowed){ denyGate_(); return; }
  $('gate').style.display = 'none';
  loadDesk();
}

async function api(mode, body){
  var u = firebase.auth().currentUser;
  if(!u) throw new Error('ログインできていません。開き直してください');
  var tok = await u.getIdToken();
  var r = await fetch(BOSS_URL_, { method:'POST', body:JSON.stringify(Object.assign({ mode: mode, fbIdToken: tok }, body || {})) });
  var j = await r.json().catch(function(){ return null; });
  if(!j) throw new Error('通信エラー ' + r.status);
  if(j.ok === false && mode !== 'me') throw new Error(j.error || '失敗しました');
  return j;
}

/* ============================================================
   マンダラ（大谷式9×9）— 営業アプリ④と同じ並び
   ブロック位置 0..8（4=中心ブロック）。中心=大目標+8テーマ／外周=各テーマ+8行動。

/* ============================================================
   本文の表示（Markdown の一部だけ：見出し・箇条書き・表・太字・リンク・コード）
   ============================================================ */
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g, '<b>$1</b>');
  return s;
}
function mdRender(text){
  var L = String(text || '').split('\n'), out = [], i = 0;
  while(i < L.length){
    var l = L[i];
    if(/^\s*\|/.test(l)){
      var rows = [];
      while(i < L.length && /^\s*\|/.test(L[i])){ rows.push(L[i]); i++; }
      var cells = function(r){ return r.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return c.trim(); }); };
      var h = '<table>';
      rows.forEach(function(r, k){
        if(/^\s*\|?\s*:?-{2,}/.test(r)) return;
        var tag = k === 0 ? 'th' : 'td';
        h += '<tr>' + cells(r).map(function(c){ return '<'+tag+'>'+mdInline(c)+'</'+tag+'>'; }).join('') + '</tr>';
      });
      out.push(h + '</table>'); continue;
    }
    if(/^\s*[-*] /.test(l)){
      var items = [];
      while(i < L.length && /^\s*[-*] /.test(L[i])){ items.push('<li>'+mdInline(L[i].replace(/^\s*[-*] /, ''))+'</li>'); i++; }
      out.push('<ul>'+items.join('')+'</ul>'); continue;
    }
    var m = l.match(/^(#{1,4}) (.*)$/);
    if(m) out.push('<h'+m[1].length+'>'+mdInline(m[2])+'</h'+m[1].length+'>');
    else if(/^---+$/.test(l.trim())) out.push('<hr>');
    else if(l.trim()) out.push('<p>'+mdInline(l)+'</p>');
    i++;
  }
  return out.join('');
}

/* ============================================================
   机
   ============================================================ */
function loadDesk(){
  api('dlist', { all: true }).then(function(r){
    S.items = r.items || [];
    render();
  }).catch(function(e){ $('root').innerHTML = '<div class="empty">読み込めませんでした（'+esc(e.message)+'）</div>'; });
}
function countTabs(){
  ['approve','check','report'].forEach(function(k){
    var n = S.items.filter(function(x){ return x.kind === k && OPEN_ST.indexOf(x.status) >= 0; }).length;
    var el = $('n-'+k); el.textContent = n; el.className = 'n' + (n ? '' : ' z');
  });
}
function render(){
  countTabs();
  var list = S.items.filter(function(x){
    var open = OPEN_ST.indexOf(x.status) >= 0;
    return S.tab === 'done' ? !open : (open && x.kind === S.tab);
  });
  if(!list.length){
    $('root').className = '';
    $('root').innerHTML = '<div class="empty">'+(S.tab === 'done' ? '直近14日で片付いた物はありません' : 'いまは何もありません')+'</div>';
    return;
  }
  $('root').className = 'grid';
  $('root').innerHTML = list.map(card).join('');
}
function card(x){
  var busy = S.busy[x.key] || x.status === 'running';
  var hasCards = x.cards && x.cards.length;
  var h = '<div class="card'+(hasCards ? ' wide' : '')+'" data-k="'+esc(x.key)+'">';
  h += '<h3>'+esc(x.title || '（無題）')+'</h3>';
  h += '<div class="meta"><span class="badge b-'+esc(x.status)+'">'+esc(ST_LABEL[x.status] || x.status)+'</span>'
     + (x.source ? '<span>'+esc(x.source)+'</span>' : '') + (x.date ? '<span>'+esc(x.date)+'</span>' : '')
     + '<span>'+esc(fmtTime(x.updatedAt))+'</span></div>';
  if(hasCards) h += kpiCards(x.cards);
  else if(x.summary) h += '<div class="sum">'+esc(x.summary)+'</div>';
  if(x.body){
    h += '<button class="more" data-a="more">'+(S.open[x.key] ? '▲ 閉じる' : hasCards ? '▼ 詳しい表を見る' : '▼ 中身を見る')+'</button>';
    if(S.open[x.key]) h += '<div class="md">'+mdRender(x.body)+'</div>';
  }
  if(x.links && x.links.length){
    h += '<div class="links">' + x.links.map(function(l){ return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label || '開く')+'</a>'; }).join('') + '</div>';
  }
  if(x.result && x.status !== 'waiting') h += '<div class="result">'+(x.chosen ? '選んだ: '+esc(x.chosen)+'\n' : '')+esc(x.result)+'</div>';
  // チャット待ち：文面を出す
  var chosen = (x.choices || []).filter(function(c){ return c.id === x.chosen; })[0];
  if(x.status === 'waiting' && chosen) h += chatBox(chosen.chatText);
  h += '<div class="acts">';
  if(OPEN_ST.indexOf(x.status) >= 0 && x.status !== 'running' && x.status !== 'waiting'){
    if(x.kind === 'approve'){
      (x.choices || []).forEach(function(c){
        var tag = (c.type === 'gas' || c.type === 'att') ? '▶ ボタンで実行' : c.type === 'chat' ? '💬 チャットで「送って」' : '実行するものなし';
        h += '<button class="btn choice'+(c.type ? '' : ' sub')+'" data-a="choose" data-c="'+esc(c.id)+'"'+(busy ? ' disabled' : '')+'>'
          + '<b>'+esc(c.id)+'　'+esc(c.label)+'</b><span class="tag"> ・'+tag+'</span>'
          + (c.detail ? '<small>'+esc(c.detail)+'</small>' : '') + '</button>';
      });
      h += '<button class="btn sub" data-a="reject"'+(busy ? ' disabled' : '')+'>見送る</button>';
    } else {
      h += '<button class="btn" data-a="ack"'+(busy ? ' disabled' : '')+'>'+(x.kind === 'report' ? '読んだ' : '確認した')+'</button>';
    }
  }
  if(x.status === 'running') h += '<div class="inline-loading"><span class="spinner"></span>実行中…（数分かかることがあります）</div>';
  if(x.status === 'waiting') h += '<button class="btn sub" data-a="reopen">選び直す</button>';
  if(OPEN_ST.indexOf(x.status) < 0) h += '<button class="btn sub" data-a="reopen">未対応に戻す</button>';
  h += '</div></div>';
  return h;
}
function kpiCards(groups){
  return groups.map(function(g){
    return (g.title ? '<div class="kgt">'+esc(g.title)+'</div>' : '') + '<div class="kg">' + g.items.map(function(c){
      return '<div class="kc'+(String(c.value == null ? '' : c.value).length > 12 ? ' txt' : '')+(c.tone ? ' '+esc(c.tone) : '')+'"><div class="l">'+esc(c.label)+'</div><div class="v">'+esc(c.value)+'</div>'
        + (c.sub ? '<div class="s">'+esc(c.sub)+'</div>' : '') + '</div>';
    }).join('') + '</div>';
  }).join('');
}
function chatBox(text){
  return '<div class="chatbox">これはボタンでは実行しません。Claude のチャット（夜に届く送付確認など）に次の一言を送ってください。'
    + '<pre>'+esc(text || '送って')+'</pre><button class="btn sub" data-a="copy" data-t="'+esc(text || '送って')+'">コピーする</button></div>';
}
function find(k){ return S.items.filter(function(x){ return x.key === k; })[0]; }
function act(key, body, okMsg){
  S.busy[key] = true; render();
  return api('dact', Object.assign({ key: key }, body)).then(function(r){
    toast(r.ok ? okMsg : (r.error || r.result || '失敗しました'), !r.ok);
  }).catch(function(e){ toast(e.message, true); })
    .then(function(){ delete S.busy[key]; loadDesk(); });
}
$('root').addEventListener('click', function(e){
  var b = e.target.closest('[data-a]'); if(!b) return;
  var k = b.closest('.card').getAttribute('data-k'), x = find(k), a = b.getAttribute('data-a');
  if(a === 'more'){ S.open[k] = !S.open[k]; render(); return; }
  if(a === 'copy'){
    var t = b.getAttribute('data-t');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast('コピーしました'); },
      function(){ toast('コピーできませんでした。長押しで選んでください', true); });
    return;
  }
  if(a === 'ack'){ act(k, { act:'ack' }, '片付けました'); return; }
  if(a === 'reject'){ if(confirm('「'+x.title+'」を見送りますか？')) act(k, { act:'reject' }, '見送りました'); return; }
  if(a === 'reopen'){ act(k, { act:'reopen' }, '未対応に戻しました'); return; }
  if(a === 'choose'){
    var c = (x.choices || []).filter(function(y){ return y.id === b.getAttribute('data-c'); })[0];
    if(!c) return;
    if(c.type === 'gas' && !confirm(c.id+'「'+c.label+'」を実行します。\n本番に書き込みます。よろしいですか？')) return;
    var body = { act:'approve', choice: c.id };
    if(c.needNote){
      var note = prompt('却下の理由を入れてください（本人にLINEで届きます）');
      if(note === null) return;
      note = note.trim(); if(!note){ toast('理由が空です', true); return; }
      body.note = note;
    } else if(c.type === 'att' && !confirm('「'+x.title+'」を'+c.label+'します。\n勤怠記録に反映し、本人へLINEが届きます。よろしいですか？')) return;
    act(k, body, (c.type === 'gas' || c.type === 'att') ? '実行しました' : c.type === 'chat' ? 'チャットで「送って」を送ってください' : '片付けました');
  }
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
    t.classList.add('on'); S.tab = t.getAttribute('data-t'); render();
  });
});
$('reload').addEventListener('click', function(){ $('root').innerHTML = '<div class="inline-loading"><span class="spinner"></span>読み込み中…</div>'; loadDesk(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden && firebase.apps && firebase.apps.length && firebase.auth().currentUser) loadDesk(); });
login_().then(function(ok){
  if(ok === true) afterLogin_();
  else if(ok === null) showPwGate_();
}).catch(function(e){ showPwGate_('ログインに失敗しました（' + e.message + '）'); });
</script>
</body>
