  const head = document.getElementById('bm-modal-head');
  head.classList.toggle('bm-has-sellout', hasSO);

  const histLabels = ['先週','2週前','3週前','4週前'];
  let histHtml = '<table class="bm-modal-history-table">';
  for (let i = 0; i < 4; i++) {
    const h = c.hist[i];
    const isSO = (i === 0 && hasSO);
    const trCls = isSO ? 'bm-is-sellout' : '';
    const mark = isSO ? '<span class="bm-sellout-mark-inline">🔴 ' + soTime + '完売</span>' : '';
    histHtml += '<tr class="' + trCls + '"><td class="bm-h-label">' + histLabels[i] + '<br><span style="font-size:7.5pt;color:#888;font-weight:normal;">' + h.date + '</span></td><td class="bm-h-value">' + h.value + '個 ' + mark + '</td></tr>';
  }

  const w = bmServerData.weights;

  let calcHtml = '<div class="bm-modal-calc">';
  calcHtml += '<div class="bm-modal-calc-row"><span class="bm-modal-calc-label">加重平均(W1:' + w.w1 + '/W2:' + w.w2 + '/W3:' + w.w3 + '/W4:' + w.w4 + ')</span><span class="bm-modal-calc-value">' + wAvg + '個</span></div>';
  if (hasSO) {

  }
  calcHtml += '<div class="bm-modal-calc-row bm-final ' + (hasSO ? 'bm-has-sellout' : '') + '"><span class="bm-modal-calc-label">翌週提案</span><span class="bm-modal-calc-value bm-final-value ' + (hasSO ? 'bm-has-sellout' : '') + '">' + c.proposed + '個</span></div>';
  calcHtml += '</div>';
  // v3.34: 拠点合計クランプで素案から調整された場合に内訳を明示
  if (c.clamped) {
    const rawPropM = Math.max(0, Math.round((Number(c.weightedAvg) || 0) + (Number(soBonus) || 0)));
    if (rawPropM !== c.proposed) {
      calcHtml += '<div class="bm-modal-note" style="background:#fff3e0;border-left-color:#ef6c00;">🔧 <b>拠点合計クランプ</b>：素案 ' + rawPropM + '個 → <b>' + c.proposed + '個</b><br>拠点の合計納品数を今週比の上限/下限（％設定）に収め、完売頻度の弱い商品から調整しています。</div>';
    }
  }
  if (hasSO) {
    calcHtml += '<div class="bm-modal-note">💡 完売は<b>直近の同曜日のみ</b>翌週に加算されます。それ以前の完売は加重平均に反映済のため追加加算しません。</div>';
  }

// 操作
async function bmSetWeek(week) {
  if (week === bmCurrentWeek) return;
  bmCurrentWeek = week;
  bmRenderWeekTabs();
  // 切り替え先の週の最初の日付（または今日に最も近い日付）を選択
  const dates = (week === 'next') ? bmNextWeekDates : bmThisWeekDates;
  if (!dates || dates.length === 0) {
    bmRenderDayTabs();
    return;
  }
  // this 週なら「今日」or 今日より過去の最終日 or 月曜
  // next 週なら最初の日（月曜）
  let target = dates[0];
  if (week === 'this') {
    const today = bmTodayStr();
    if (dates.indexOf(today) >= 0) target = today;
    else {
      // 今日が日付配列に無いなら最も近い日（過去寄り）を選ぶ
      for (let i = dates.length - 1; i >= 0; i--) {
        if (dates[i] <= today) { target = dates[i]; break; }
      }
    }
  }
  await bmSetDate(target);
}

async function bmSetDate(dateStr) {
  if (dateStr === bmCurrentDate && bmServerData) return;
  bmCurrentDate = dateStr;
  // 週の自動切替
  if (bmNextWeekDates.indexOf(dateStr) >= 0) bmCurrentWeek = 'next';
  else if (bmThisWeekDates.indexOf(dateStr) >= 0) bmCurrentWeek = 'this';
  await bmLoadDate(dateStr);
}

async function bmLoadDate(dateStr) {
  const wrap = document.getElementById('bm-matrix-wrap');
  wrap.innerHTML = '<div class="bm-loading">配分調整を読み込み中...</div>';
  document.getElementById('bm-calc-info').innerHTML = '';
  // Phase 4: ドライバー色マップを並列取得
  const [r, colorMap] = await Promise.all([
    bmFetchMatrix(dateStr),
    loadDriverColorMap(dateStr)
  ]);
  if (!r.ok) {
    wrap.innerHTML = '<div class="bm-error">取得エラー: ' + bmEscape(r.error || '不明') + '</div>';
    return;
  }
  bmServerData = r;
  bmDriverColorMap = colorMap || {};  // Phase 4
  bmLoadedDates.add(dateStr);
  // サーバーから受け取った表示対象日付配列を保存
  if (r.thisWeekDates) bmThisWeekDates = r.thisWeekDates;
  if (r.nextWeekDates) bmNextWeekDates = r.nextWeekDates;
  // 古い編集キャッシュを掃除（範囲外日付）
  const allDates = bmThisWeekDates.concat(bmNextWeekDates);
  bmPurgeOldEdits(allDates);
  bmRenderAll();
  bmUpdateSaveDirty();             // v3.19: 保存ボタン状態更新
}

async function bmReload() {
  await bmLoadDate(bmCurrentDate);
}

async function bmConfirmLoc(lid) {
  // v3.23: K列方式。確定済みなら解除（K列クリア・数字は残す）、未確定なら確定（編集値保存+空セルH補完+K=1）。いずれも即サーバー。
  if (!bmServerData) return;
  const locName = (bmServerData.locations.find(l => l.id === lid) || {}).name || lid;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);

  if (bmIsLocConfirmed(lid)) {
    // 解除
    if (!confirm('「' + locName + '」の確定を解除しますか？\n（入力済みの数字は残ります）')) return;
    const r = await bmPostAction('unconfirmBasicMasterLocation', { date: bmCurrentDate, locId: lid });
    if (!r.ok) { alert('解除失敗: ' + (r.error || '')); return; }
    await bmLoadDate(bmCurrentDate);
    wpToast('「' + locName + '」の確定を解除', 'info');
    return;
  }

  // 確定：この拠点の編集値を集めて送信（空セルはGAS側でH列補完・既存G列は維持）
  const items = {};
  for (const p of products) {
    const e = bmGetEdit(bmCurrentDate, p.id, lid);
    if (e !== null && e !== undefined && e !== '') items[p.id] = Number(e);
  }
  const r = await bmPostAction('confirmBasicMasterLocation', { date: bmCurrentDate, locId: lid, items: items });
  if (!r.ok) { alert('確定失敗: ' + (r.error || '')); return; }
  bmClearEditsForLoc(bmCurrentDate, lid);
  await bmLoadDate(bmCurrentDate);
  wpToast('「' + locName + '」を確定', 'success');
}

function bmRecommendLoc(lid) {
  // v3.23: 推奨値(H列)を編集値として入力するだけ（確定はしない）。確定したい場合は別途✓確定を押す。
  if (!bmServerData) return;
  const locName = (bmServerData.locations.find(l => l.id === lid) || {}).name || lid;
  if (!confirm(locName + ' の全商品を推奨値で上書きします。編集値があれば破棄されます。よろしいですか？\n（数字を入力するだけ・確定はされません。💾保存 または ✓確定で反映）')) return;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const changes = [];
  for (const p of products) {
    const c = bmServerData.cells[p.id + '_' + lid];
    const pro = c ? (c.proposed || 0) : 0;
    if (pro > 0) {
      changes.push({ date: bmCurrentDate, pid: p.id, lid: lid, newVal: pro });
    }
  }
  if (changes.length > 0) bmSetEditsBulk(changes);
  bmUpdateCellsDOM(changes);
  bmUpdateSaveDirty();
  wpToast('「' + locName + '」に推奨値を入力（💾保存 または ✓確定で反映）', 'success');
}

async function bmConfirmAll() {
  // v3.23: K列方式。全拠点確定済みなら全解除（全行K列クリア・数字は残す）、未確定なら全確定（編集値保存+空セルH補完+全行K=1）。即サーバー。
  if (!bmServerData) return;
  const dateLabel = bmFmtDateLabel(bmCurrentDate);
  const btn = document.getElementById('bm-confirm-all');

  if (bmIsAllConfirmed()) {
    if (!confirm(dateLabel + ' の全拠点の確定を解除しますか？\n（入力済みの数字は残ります）')) return;
    if (btn) { btn.disabled = true; btn.textContent = '解除中...'; }
    const r = await bmPostAction('unconfirmBasicMasterAll', { date: bmCurrentDate });
    if (btn) btn.disabled = false;
    if (!r.ok) { alert('解除失敗: ' + (r.error || '')); bmUpdateConfirmAllBtn(); return; }
    await bmLoadDate(bmCurrentDate);
    wpToast('全拠点の確定を解除', 'info');
    return;
  }

  if (!confirm(dateLabel + ' の全拠点を確定します。\n（編集値は保存、空セルは提案値で補完、入力済みの数字は維持）\nよろしいですか？')) return;
  // 全拠点の編集値を itemsByLoc にまとめる
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const itemsByLoc = {};
  for (const loc of bmServerData.locations) {
    const li = {};
    for (const p of products) {
      const e = bmGetEdit(bmCurrentDate, p.id, loc.id);
      if (e !== null && e !== undefined && e !== '') li[p.id] = Number(e);
    }
    itemsByLoc[loc.id] = li;
  }
  if (btn) { btn.disabled = true; btn.textContent = '確定中...'; }
  const r = await bmPostAction('confirmBasicMasterAll', { date: bmCurrentDate, itemsByLoc: itemsByLoc });
  if (btn) btn.disabled = false;
  if (!r.ok) { alert('確定失敗: ' + (r.error || '')); bmUpdateConfirmAllBtn(); return; }
  bmEditsCache[bmCurrentDate] = {};
  bmSaveEdits();
  await bmLoadDate(bmCurrentDate);
  wpToast('全拠点を確定（更新' + (r.updated || 0) + '件）', 'success');
}
async function bmSaveAll() {
  // v3.23: 「数字の保存」のみ。編集セルだけG列に書く（K列=確定フラグは一切触らない＝確定にならない）。
  if (!bmServerData) return;
  const itemsByLoc = {};
  const locSet = new Set();
  let cellCount = 0;
  const cache = bmEditsCache[bmCurrentDate];
  if (cache) {
    for (const k of Object.keys(cache)) {
      const v = cache[k];
      if (v === null || v === undefined || v === '') continue;
      // pid と lid を最後の '_' で安全に分離（pid に '_' を含む場合に対応）
      const lastUnderscore = k.lastIndexOf('_');
      if (lastUnderscore < 0) continue;
      const lid = k.substring(lastUnderscore + 1);
      const pid = k.substring(0, lastUnderscore);
      if (!lid || !pid) continue;
      if (!itemsByLoc[lid]) itemsByLoc[lid] = {};
      itemsByLoc[lid][pid] = Number(v);
      locSet.add(lid);
      cellCount++;
    }
  }

  if (cellCount === 0) {
    wpToast('保存する変更がありません', 'info');
    return;
  }

  const btn = document.getElementById('bm-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  const r = await bmPostAction('saveBasicMasterNumbers', {
    date: bmCurrentDate,
    itemsByLoc: itemsByLoc
  });
  if (btn) btn.disabled = false;
  if (!r.ok) {
    alert('保存失敗: ' + (r.error || ''));
    bmUpdateSaveDirty();
    return;
  }

  // v3.33: 実際に保存された件数を確認（新規拠点=既存行なしでもGAS側で追加保存される）
  const savedCount = (r.saved !== undefined && r.saved !== null)
    ? Number(r.saved)
    : (Number(r.updated || 0) + Number(r.appended || 0));
  const appendedCount = Number(r.appended || 0);

  if (savedCount < cellCount) {
    // 一部が保存されなかった → 「保存完了」を出さず警告（編集内容は破棄しない＝再保存できる）
    alert('一部が保存できませんでした。\n要求 ' + cellCount + ' セル中 ' + savedCount + ' セルのみ保存。\n（拠点や商品がマスタに無い可能性があります。編集内容は破棄していません）');
    bmUpdateSaveDirty();
    return;
  }

  // ローカル編集キャッシュをリセット
  bmEditsCache[bmCurrentDate] = {};
  bmSaveEdits();

  // サーバーから取り直し＋全画面再描画
  await bmLoadDate(bmCurrentDate);
  const bmSaveExtra = appendedCount > 0 ? ('・うち新規' + appendedCount) : '';
  wpToast('保存完了（' + locSet.size + '拠点・' + savedCount + 'セル' + bmSaveExtra + '）', 'success');
}
  function bmEscape(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

  if (bmInitialized) return;
  bmInitialized = true;

  const today = bmTodayStr();
  bmCurrentDate = today;
  bmCurrentWeek = 'this';
  // 初回ロード：サーバーから visibleDates を取得する
  await bmLoadDate(today);
  // サーバー応答後に thisWeekDates が空（今日が土日など）の場合は、可能なら月曜にフォールバック
  if (bmServerData && bmServerData.thisWeekDates && bmServerData.thisWeekDates.length > 0) {
    if (bmServerData.thisWeekDates.indexOf(today) < 0) {
      // 今日が土日等で範囲外 → 今週月曜（thisWeekDates[0]）に切替
      await bmSetDate(bmServerData.thisWeekDates[0]);
    }
  }
}

// ============================================================
// ヘルパー
// ============================================================
function wpEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function wpToast(msg, type) {
  type = type || 'info';
  let t = document.getElementById('wp-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'wp-toast';
    t.className = 'wp-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'wp-toast wp-show wp-' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.className = 'wp-toast wp-' + type;
  }, 2500);
}

async function wpFetch(action, params) {
  const usp = new URLSearchParams();
  usp.set('action', action);
  if (params) {
    for (const k of Object.keys(params)) {
      usp.set(k, params[k]);
    }
  }
  try {
    const res = await fetch(GAS_URL + '?' + usp.toString());
    return await res.json();
  } catch (err) {
    return { ok: false, error: String(err) };
  }
}

// ============================================================
// F7 Undo/Redo: 編集の履歴管理
// ============================================================
function bmPushHistory(actions) {
  // actions: [{date, pid, lid, oldVal, newVal}]
  if (!actions || actions.length === 0) return;
  bmUndoStack.push({ actions: actions });
  if (bmUndoStack.length > BM_HISTORY_MAX) bmUndoStack.shift();
  bmRedoStack = []; // 新操作でRedo履歴クリア
  bmUpdateUndoBtns();
}

function bmApplyHistoryActions(actions, isUndo) {
  // isUndo=true → oldVal を適用、false → newVal を適用
  for (const a of actions) {
    const v = isUndo ? a.oldVal : a.newVal;
    if (v === null || v === undefined) {
      bmSetEdit(a.date, a.pid, a.lid, null);
    } else {
      bmSetEdit(a.date, a.pid, a.lid, v);
    }
  }
}

function bmDoUndo() {
  if (bmUndoStack.length === 0) return;
  const entry = bmUndoStack.pop();
  bmApplyHistoryActions(entry.actions, true);
  bmRedoStack.push(entry);
  if (bmRedoStack.length > BM_HISTORY_MAX) bmRedoStack.shift();
  bmUpdateCellsDOM(entry.actions);  // v3.18: 全再描画を回避
  bmUpdateUndoBtns();
  wpToast('元に戻しました（' + entry.actions.length + '件）', 'info');
}

function bmDoRedo() {
  if (bmRedoStack.length === 0) return;
  const entry = bmRedoStack.pop();
  bmApplyHistoryActions(entry.actions, false);
  bmUndoStack.push(entry);
  if (bmUndoStack.length > BM_HISTORY_MAX) bmUndoStack.shift();
  bmUpdateCellsDOM(entry.actions);  // v3.18: 全再描画を回避
  bmUpdateUndoBtns();
  wpToast('やり直しました（' + entry.actions.length + '件）', 'info');
}

function bmUpdateUndoBtns() {
  const ub = document.getElementById('bm-undo-btn');
  const rb = document.getElementById('bm-redo-btn');
  if (ub) ub.disabled = (bmUndoStack.length === 0);
  if (rb) rb.disabled = (bmRedoStack.length === 0);
}

// 編集を1件単位で履歴に積む（既存 bmSetEdit のラッパ）
function bmSetEditWithHistory(date, pid, lid, newVal) {
  const oldVal = bmGetEdit(date, pid, lid);
  if (oldVal === newVal) return;
  bmSetEdit(date, pid, lid, newVal);
  bmPushHistory([{ date, pid, lid, oldVal, newVal }]);
}

// 複数編集をまとめて履歴に積む
function bmSetEditsBulk(changes) {
  // changes: [{date, pid, lid, newVal}]
  const actions = [];
  for (const c of changes) {
    const oldVal = bmGetEdit(c.date, c.pid, c.lid);
    if (oldVal === c.newVal) continue;
    bmSetEdit(c.date, c.pid, c.lid, c.newVal);
    actions.push({ date: c.date, pid: c.pid, lid: c.lid, oldVal: oldVal, newVal: c.newVal });
  }
  if (actions.length > 0) {
    bmPushHistory(actions);
  }
  bmUpdateSaveDirty();  // v3.19: 保存ボタンの未保存状態を更新
  return actions.length;
}

// ============================================================
// F3 範囲選択
// ============================================================
function bmCellKey(pid, lid) { return pid + '_' + lid; }
function bmIsSelected(pid, lid) { return bmSelectedCells.has(bmCellKey(pid, lid)); }

function bmClearSelection() {
  bmSelectedCells.clear();
  bmUpdateSelectionUI();
  bmUpdateActionBar();
}

function bmAddToSelection(pid, lid) {
  bmSelectedCells.add(bmCellKey(pid, lid));
}

function bmUpdateSelectionUI() {
  // DOM上の選択状態を反映
  const cells = document.querySelectorAll('#tab-master .bm-cell-sales[data-pid]');
  cells.forEach(el => {
    const k = bmCellKey(el.dataset.pid, el.dataset.lid);
    if (bmSelectedCells.has(k)) el.classList.add('bm-selected');
    else el.classList.remove('bm-selected');
  });
}

function bmSelectRange(startPid, startLid, endPid, endLid) {
  if (!bmServerData) return;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const pids = products.map(p => p.id);
  const lids = bmServerData.locations.map(l => l.id);
  const pi1 = pids.indexOf(startPid), pi2 = pids.indexOf(endPid);
  const li1 = lids.indexOf(startLid), li2 = lids.indexOf(endLid);
  if (pi1 < 0 || pi2 < 0 || li1 < 0 || li2 < 0) return;
  const pMin = Math.min(pi1, pi2), pMax = Math.max(pi1, pi2);
  const lMin = Math.min(li1, li2), lMax = Math.max(li1, li2);
  bmSelectedCells.clear();
  for (let i = pMin; i <= pMax; i++) {
    for (let j = lMin; j <= lMax; j++) {
      bmAddToSelection(pids[i], lids[j]);
    }
  }
  bmUpdateSelectionUI();
  bmUpdateActionBar();
}

function bmOnCellMouseDown(e, pid, lid) {
  if (e.button !== 0) return; // 左クリックのみ
  // contenteditable のクリック編集を邪魔しないように、Shift/Ctrl 押下時のみ範囲動作
  if (!e.shiftKey && !e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  if (e.shiftKey && bmRangeStart) {
    // 範囲指定
    bmSelectRange(bmRangeStart.pid, bmRangeStart.lid, pid, lid);
  } else {
    // 単一選択開始
    bmRangeStart = { pid, lid };
    bmSelectedCells.clear();
    bmAddToSelection(pid, lid);
    bmUpdateSelectionUI();
    bmUpdateActionBar();
    bmRangeDragging = true;
  }
}

function bmOnCellMouseEnter(e, pid, lid) {
  if (!bmRangeDragging || !bmRangeStart) return;
  bmSelectRange(bmRangeStart.pid, bmRangeStart.lid, pid, lid);
}

function bmOnGlobalMouseUp() {
  bmRangeDragging = false;
}

function bmUpdateActionBar() {

    bar.classList.remove('bm-visible');
  } else {
    bar.classList.add('bm-visible');
    const cnt = document.getElementById('bm-action-count');
    if (cnt) cnt.textContent = bmSelectedCells.size;
  }
}

function bmActionClearZero() {
  if (bmSelectedCells.size === 0) return;
  const changes = [];
  for (const k of bmSelectedCells) {
    const [pid, lid] = k.split('_');
    changes.push({ date: bmCurrentDate, pid, lid, newVal: 0 });
  }
  const n = bmSetEditsBulk(changes);
  bmUpdateCellsDOM(changes);  // v3.18: 全再描画を回避
  wpToast(n + '件を0にしました', 'success');

}

function bmActionDeselect() {
  bmClearSelection();

function bmActionCopy() {
  if (bmSelectedCells.size === 0) return;
  const cells = [];
  for (const k of bmSelectedCells) {
    const [pid, lid] = k.split('_');
    const v = bmGetDisplaySales(pid, lid);
    cells.push({ pid, lid, val: v });
  }
  bmCopyBuffer = { type: 'range', cells: cells };
  wpToast('コピーしました（' + cells.length + 'セル）', 'info');
}

function bmActionPaste() {
  if (!bmCopyBuffer || bmCopyBuffer.type !== 'range' || bmSelectedCells.size === 0) {
    wpToast('貼り付け先を選択してください', 'error');
    return;
  }
  // 単純実装：選択範囲の左上に貼り付け（オフセット計算）
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const pids = products.map(p => p.id);
  const lids = bmServerData.locations.map(l => l.id);

  // コピー元の左上を求める
  const srcPids = [...new Set(bmCopyBuffer.cells.map(c => c.pid))];
  const srcLids = [...new Set(bmCopyBuffer.cells.map(c => c.lid))];
  const srcPiMin = Math.min(...srcPids.map(p => pids.indexOf(p)));
  const srcLiMin = Math.min(...srcLids.map(l => lids.indexOf(l)));

  // 貼り付け先の左上を求める
  const dstPids = [...new Set([...bmSelectedCells].map(k => k.split('_')[0]))];
  const dstLids = [...new Set([...bmSelectedCells].map(k => k.split('_')[1]))];
  const dstPiMin = Math.min(...dstPids.map(p => pids.indexOf(p)));
  const dstLiMin = Math.min(...dstLids.map(l => lids.indexOf(l)));

  const dPi = dstPiMin - srcPiMin;
  const dLi = dstLiMin - srcLiMin;

  // F8 カテゴリ違い警告
  const srcCats = new Set();
  const dstCats = new Set();
  for (const c of bmCopyBuffer.cells) {
    const p = products.find(x => x.id === c.pid);
    if (p) srcCats.add(p.group || p.category || '');
  }
  for (const cell of bmCopyBuffer.cells) {
    const srcPi = pids.indexOf(cell.pid);
    const newPi = srcPi + dPi;
    if (newPi < 0 || newPi >= pids.length) continue;
    const p = products.find(x => x.id === pids[newPi]);
    if (p) dstCats.add(p.group || p.category || '');
  }
  const srcCatArr = [...srcCats];
  const dstCatArr = [...dstCats];
  if (srcCatArr.length > 0 && dstCatArr.length > 0 &&
      !srcCatArr.every(c => dstCatArr.includes(c))) {
    if (!confirm('コピー元と貼り付け先のカテゴリが違います。\n続行しますか？')) return;
  }

  const changes = [];
  for (const cell of bmCopyBuffer.cells) {
    const srcPi = pids.indexOf(cell.pid);
    const srcLi = lids.indexOf(cell.lid);
    const newPi = srcPi + dPi;
    const newLi = srcLi + dLi;
    if (newPi < 0 || newPi >= pids.length) continue;
    if (newLi < 0 || newLi >= lids.length) continue;
    changes.push({
      date: bmCurrentDate,
      pid: pids[newPi],
      lid: lids[newLi],
      newVal: cell.val
    });
  }
  const n = bmSetEditsBulk(changes);
  bmUpdateCellsDOM(changes);  // v3.18: 全再描画を回避
  wpToast(n + 'セルに貼り付けました', 'success');
  bmClearSelection();
}

// v3.22: コピー優先順「編集値 > confirmed（G列）> proposed（H列）> 0」
// 画面表示（bmGetDisplaySales）と整合させる
function bmCopyProductRow(pid) {
  if (!bmServerData) return;
  const values = {};
  for (const loc of bmServerData.locations) {
    // 1) 編集値あり → 編集値
    const e = bmGetEdit(bmCurrentDate, pid, loc.id);
    if (e !== null && e !== undefined && e !== '') {
      values[loc.id] = Number(e);
      continue;
    }
    const c = bmServerData.cells[pid + '_' + loc.id];
    if (c) {
      // 2) 編集値なし & confirmed（G列）あり → confirmed
      if (c.confirmed !== null && c.confirmed !== undefined) {
        values[loc.id] = Number(c.confirmed);
      // 3) 編集値なし & confirmedなし & proposed（H列）> 0 → proposed
      } else if (c.proposed) {
        values[loc.id] = Number(c.proposed);
      } else {
        values[loc.id] = 0;
      }
    } else {
      values[loc.id] = 0;
    }
  }
  bmCopyBuffer = { type: 'row', pid: pid, values: values };
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const p = products.find(x => x.id === pid);
  const pname = p ? ((p.displayName && p.displayName.length > 0) ? p.displayName : p.name) : pid;
  // コピーした実値の合計を確認用に出す
  let nonZero = 0;
  for (const lid of Object.keys(values)) {
    if (values[lid] > 0) nonZero++;
  }
  wpToast('「' + pname + '」をコピー（' + nonZero + '/' + Object.keys(values).length + '拠点に値あり）→ ⧉で貼付先選択', 'info');
  bmOpenRowPasteModal(pid);
}

function bmOpenRowPasteModal(srcPid) {
  if (!bmCopyBuffer || bmCopyBuffer.type !== 'row') return;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const srcP = products.find(x => x.id === srcPid);
  const srcCat = srcP ? (srcP.group || srcP.category || '') : '';
  const srcShowName = (srcP.displayName && srcP.displayName.length > 0) ? srcP.displayName : srcP.name;
  let html = '<div style="margin-bottom:10px;font-size:10pt;color:#555;">「<b>' + wpEsc(srcShowName) + '</b>」の値を貼り付ける商品を選んでください</div>';
  html += '<div style="display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto;">';
  for (const p of products) {
    if (p.id === srcPid) continue;
    const cat = p.group || p.category || '';
    const warn = (cat !== srcCat) ? ' <span style="color:#c62828;font-size:8.5pt;">⚠️ カテゴリ違い</span>' : '';
    const showName = (p.displayName && p.displayName.length > 0) ? p.displayName : p.name;
    html += '<label style="display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid #eee;border-radius:3px;cursor:pointer;">'
      + '<input type="checkbox" class="wp-paste-target" data-pid="' + wpEsc(p.id) + '" data-cat="' + wpEsc(cat) + '">'
      + '<span>' + wpEsc(showName) + '</span>'
      + warn
      + '</label>';
  }
  html += '</div>';
  wpOpenModal('行コピー：貼付先選択', html, [
    { label: 'キャンセル', onclick: 'wpCloseModal()' },
    { label: '貼り付け', primary: true, onclick: 'bmExecRowPaste(\'' + srcPid + '\')' }
  ]);
}

function bmExecRowPaste(srcPid) {
  if (!bmCopyBuffer || bmCopyBuffer.type !== 'row') { wpCloseModal(); return; }
  const targets = document.querySelectorAll('.wp-paste-target:checked');
  if (targets.length === 0) { wpToast('貼付先を選んでください', 'error'); return; }
  // カテゴリチェック
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const srcP = products.find(x => x.id === srcPid);
  const srcCat = srcP ? (srcP.group || srcP.category || '') : '';
  let hasCatMismatch = false;
  for (const t of targets) {
    if (t.dataset.cat !== srcCat) { hasCatMismatch = true; break; }
  }
  if (hasCatMismatch) {
    if (!confirm('カテゴリ違いの貼付先があります。続行しますか？')) return;
  }
  const changes = [];
  for (const t of targets) {
    const dstPid = t.dataset.pid;
    for (const lid of Object.keys(bmCopyBuffer.values)) {
      changes.push({
        date: bmCurrentDate,
        pid: dstPid,
        lid: lid,
        newVal: bmCopyBuffer.values[lid]
      });
    }
  }
  const n = bmSetEditsBulk(changes);
  bmUpdateCellsDOM(changes);  // v3.18: 全再描画を回避
  wpCloseModal();
  wpToast(targets.length + '商品 × ' + Object.keys(bmCopyBuffer.values).length + '拠点 = ' + n + '件を貼り付けました', 'success');
}

// ============================================================
// 汎用モーダル
// ============================================================
function wpOpenModal(title, bodyHtml, buttons) {
  let overlay = document.getElementById('wp-modal-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'wp-modal-overlay';
    overlay.className = 'wp-modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) wpCloseModal(); };
    document.body.appendChild(overlay);
  }
  const btnsHtml = (buttons || []).map(b => {
    const cls = b.primary ? 'wp-primary' : (b.danger ? 'wp-danger' : '');
    return '<button class="' + cls + '" onclick="' + b.onclick + '">' + wpEsc(b.label) + '</button>';
  }).join('');
  overlay.innerHTML =
    '<div class="wp-modal" onclick="event.stopPropagation()">' +
      '<div class="wp-modal-head">' +
        '<div class="wp-modal-title">' + wpEsc(title) + '</div>' +
        '<button class="wp-modal-close" onclick="wpCloseModal()">✕</button>' +
      '</div>' +
      '<div class="wp-modal-body">' + bodyHtml + '</div>' +
      (btnsHtml ? '<div class="wp-modal-foot">' + btnsHtml + '</div>' : '') +
    '</div>';
  overlay.classList.add('wp-show');
}

function wpCloseModal() {
  const overlay = document.getElementById('wp-modal-overlay');
  if (overlay) overlay.classList.remove('wp-show');
}

// ============================================================
// F5 プリセット適用
// ============================================================
async function wpLoadPresets() {
  const r = await wpFetch('getWeatherPresets');
  if (!r.ok) {
    wpToast('プリセット取得失敗: ' + (r.error || '不明'), 'error');
    return false;
  }
  // ゴミデータ「プリセット名」を除外
  wpPresets = (r.presets || []).filter(p => p.name && p.name !== 'プリセット名' && p.rows && p.rows.length > 1);
  wpLocations = r.locations || [];
  return true;
}

async function wpOpenPresetSelector() {
  wpToast('プリセット読み込み中...', 'info');
  const ok = await wpLoadPresets();
  if (!ok) return;
  if (wpPresets.length === 0) {
    wpOpenModal('プリセット選択', '<div style="padding:20px;text-align:center;color:#888;">プリセットが登録されていません。<br>設定タブで作成してください。</div>',
      [{ label: '閉じる', onclick: 'wpCloseModal()' }]);
    return;
  }
  let html = '<div class="wp-preview-info">対象日：<b>' + wpEsc(bmCurrentDate) + '</b> に適用します（G列を上書き）</div>';
  html += '<div class="wp-preset-list">';
  for (const p of wpPresets) {
    const valid = p.rows.filter(r => r.locId);
    const off = valid.filter(r => r.ratio === 0).length;
    const reduce = valid.filter(r => r.ratio > 0 && r.ratio < 100).length;
    const keep = valid.filter(r => r.ratio === 100).length;
    const inc = valid.filter(r => r.ratio > 100).length;
    html += '<div class="wp-preset-row" onclick="wpPreviewPreset(\'' + wpEsc(p.name).replace(/'/g, "\\'") + '\')">';
    html += '<div><div class="wp-preset-row-name">' + wpEsc(p.name) + '</div>';
    html += '<div class="wp-preset-row-detail">' + valid.length + '拠点設定 / 0%:' + off + ' / 80%帯:' + reduce + ' / 100%:' + keep + ' / 増量:' + inc + '</div></div>';
    html += '<div class="wp-preset-row-actions"><button class="wp-primary" style="padding:4px 12px;">適用 →</button></div>';
    html += '</div>';
  }
  html += '</div>';
  wpOpenModal('📋 プリセット選択', html, [
    { label: '閉じる', onclick: 'wpCloseModal()' }
  ]);
}

function wpPreviewPreset(presetName) {
  const preset = wpPresets.find(p => p.name === presetName);
  if (!preset) return;
  // 影響を受ける拠点数を計算
  let html = '<div class="wp-preview-info">';
  html += '<b>' + wpEsc(presetName) + '</b> を <b>' + wpEsc(bmCurrentDate) + '</b> に適用します。<br>';
  html += '基本数 × 係数(%) を <b>切上げ</b>で計算し、G列（現在値）に上書きします。<br>';
  html += 'H列（翌週提案値）は変更されません。';
  html += '</div>';
  html += '<table style="width:100%;font-size:9.5pt;border-collapse:collapse;">';
  html += '<thead><tr><th style="text-align:left;padding:4px 8px;background:#fafafa;">拠点</th><th style="padding:4px 8px;background:#fafafa;">係数</th><th style="padding:4px 8px;background:#fafafa;">区分</th></tr></thead>';
  html += '<tbody>';
  for (const r of preset.rows) {
    if (!r.locId) continue;
    const loc = wpLocations.find(l => l.id === r.locId);
    const flagCls = loc && loc.outdoor === '屋外' ? 'wp-outdoor' : 'wp-indoor';
    const flag = loc ? loc.outdoor : '?';
    const ratioBg = r.ratio === 0 ? '#ffcdd2' : (r.ratio < 100 ? '#fff9c4' : (r.ratio > 100 ? '#c8e6c9' : '#f5f5f5'));
    html += '<tr style="border-bottom:1px solid #eee;">';
    html += '<td style="padding:4px 8px;">' + wpEsc((loc && loc.displayName && loc.displayName.length > 0) ? loc.displayName : (r.locName || r.locId)) + '</td>';
    html += '<td style="padding:4px 8px;text-align:center;background:' + ratioBg + ';font-weight:bold;">' + r.ratio + '%</td>';
    html += '<td style="padding:4px 8px;text-align:center;"><span class="wp-loc-flag ' + flagCls + '">' + wpEsc(flag) + '</span></td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  wpOpenModal('プレビュー：' + presetName, html, [
    { label: '← 戻る', onclick: 'wpOpenPresetSelector()' },
    { label: '✓ ' + presetName + ' を適用', primary: true, onclick: 'wpApplyPreset(\'' + presetName.replace(/'/g, "\\'") + '\')' }
  ]);
}

async function wpApplyPreset(presetName) {
  if (!confirm(presetName + ' を ' + bmCurrentDate + ' に適用しますか？')) return;
  wpToast('適用中...', 'info');
  const r = await wpFetch('applyWeatherPreset', { presetName: presetName, date: bmCurrentDate });
  if (!r.ok) {
    wpToast('適用失敗: ' + (r.error || '不明'), 'error');
    return;
  }
  wpToast(r.message || '適用完了', 'success');
  wpCloseModal();
  // 編集キャッシュをクリア（サーバー側のG列が変わるため）
  if (bmEditsCache[bmCurrentDate]) {
    delete bmEditsCache[bmCurrentDate];
    bmSaveEdits();
  }
  // Undo履歴クリア（サーバ側変更のため）
  bmUndoStack = [];
  bmRedoStack = [];
  bmUpdateUndoBtns();
  await bmReload();
}

// F6 設定タブ：プリセット編集UI
// ============================================================
async function wpRenderSettingsTab() {
  const wrap = document.getElementById('tab-settings');
  if (!wrap) return;
  wrap.innerHTML = '<div class="wp-page"><div style="text-align:center;padding:30px;color:#888;">読み込み中...</div></div>';

  if (!ok) {
    wrap.innerHTML = '<div class="wp-page"><div style="text-align:center;padding:30px;color:#c62828;">プリセット取得に失敗しました</div></div>';

  }

  html += waSectionHtml();

  html += sbSectionHtml();
  html += '<div style="height:18px;"></div>';
  html += '<div class="wp-section-title">🌤️ 天候プリセット管理</div>';
  html += '<div class="wp-section-desc">雨天や猛暑日など、天候に応じて配分を一括変更するプリセットを管理します。「📋 プリセット」ボタンから単日に適用できます。</div>';
  html += '<button class="wp-add-btn" onclick="wpOpenNewPresetEditor()">+ 新規プリセット</button>';
  html += '<table class="wp-presets-table">';
  html += '<thead><tr><th>プリセット名</th><th>登録拠点数</th><th>0%</th><th>増量</th><th class="wp-row-actions">操作</th></tr></thead><tbody>';
  if (wpPresets.length === 0) {
    html += '<tr><td colspan="5" style="text-align:center;padding:20px;color:#888;">プリセットがありません</td></tr>';
  }
  for (const p of wpPresets) {
    const valid = p.rows.filter(r => r.locId);
    const off = valid.filter(r => r.ratio === 0).length;
    const inc = valid.filter(r => r.ratio > 100).length;
    html += '<tr>';
    html += '<td><b>' + wpEsc(p.name) + '</b></td>';
    html += '<td>' + valid.length + '</td>';
    html += '<td>' + (off > 0 ? off + '拠点' : '–') + '</td>';
    html += '<td>' + (inc > 0 ? inc + '拠点' : '–') + '</td>';
    html += '<td class="wp-row-actions">';
    html += '<button class="wp-btn-edit" onclick="wpOpenEditPresetEditor(\'' + wpEsc(p.name).replace(/'/g, "\\'") + '\')">編集</button>';
    html += '<button class="wp-btn-del" onclick="wpDeletePresetConfirm(\'' + wpEsc(p.name).replace(/'/g, "\\'") + '\')">削除</button>';

function wpOpenNewPresetEditor() {
  const name = prompt('プリセット名を入力してください（例：🌧️ 雨天）');
  if (!name || !name.trim()) return;
  // 既存名チェック
  if (wpPresets.some(p => p.name === name.trim())) {
    alert('同名のプリセットが既に存在します');
    return;
  }
  wpCurrentEditPreset = name.trim();
  // 全拠点を100%で初期化した編集モーダルを開く
  const newPreset = {
    name: wpCurrentEditPreset,
    rows: wpLocations.map(l => ({ locId: l.id, locName: l.name, ratio: 100, note: '' }))
  };
  wpRenderEditModal(newPreset, true);
}

function wpOpenEditPresetEditor(presetName) {
  const p = wpPresets.find(x => x.name === presetName);
  if (!p) return;
  wpCurrentEditPreset = presetName;
  // 拠点マスタの全拠点を反映（プリセットにない拠点は100%で補完）
  const rows = wpLocations.map(l => {
    const r = p.rows.find(x => x.locId === l.id);
    return r ? { locId: l.id, locName: l.name, ratio: r.ratio, note: r.note || '' }
             : { locId: l.id, locName: l.name, ratio: 100, note: '' };
  });
  wpRenderEditModal({ name: presetName, rows: rows }, false);
}

function wpRenderEditModal(preset, isNew) {
  let html = '';
  html += '<div class="wp-edit-name-row">';
  html += '<label>プリセット名：</label>';
  html += '<input type="text" id="wp-edit-name" value="' + wpEsc(preset.name) + '" ' + (isNew ? '' : 'readonly') + '>';
  html += '</div>';
  html += '<div class="wp-edit-bulk-row">';
  html += '<b>一括設定：</b>';
  html += '<button onclick="wpBulkSet(\'all\', 0)">全拠点 0%</button>';
  html += '<button onclick="wpBulkSet(\'all\', 100)">全拠点 100%</button>';
  html += '<button onclick="wpBulkSet(\'outdoor\', 0)">屋外のみ 0%</button>';
  html += '<button onclick="wpBulkSet(\'indoor\', 80)">屋内のみ 80%</button>';
  html += '<span style="margin-left:auto;">指定値で一括: <input type="number" id="wp-bulk-val" value="100" min="0" max="500"> %';
  html += ' <button onclick="wpBulkSet(\'all\', null)">適用</button></span>';
  html += '</div>';
  html += '<table class="wp-edit-loc-table">';
  html += '<thead><tr><th class="wp-loc-name">拠点</th><th style="width:80px;text-align:center;">区分</th><th style="text-align:center;">係数(%)</th></tr></thead>';
  html += '<tbody>';
  for (const r of preset.rows) {
    const loc = wpLocations.find(l => l.id === r.locId);
    const flagCls = loc && loc.outdoor === '屋外' ? 'wp-outdoor' : 'wp-indoor';
    const flag = loc ? loc.outdoor : '屋内';
    html += '<tr>';
    html += '<td class="wp-loc-name">' + wpEsc((loc && loc.displayName && loc.displayName.length > 0) ? loc.displayName : r.locName) + ' <span style="color:#888;font-size:8.5pt;">(' + wpEsc(r.locId) + ')</span></td>';
    html += '<td style="text-align:center;"><span class="wp-loc-flag ' + flagCls + '" data-flag="' + wpEsc(flag) + '">' + wpEsc(flag) + '</span></td>';
    html += '<td style="text-align:center;"><input type="number" class="wp-ratio-input" data-lid="' + wpEsc(r.locId) + '" value="' + r.ratio + '" min="0" max="500"></td>';
    html += '</tr>';
  }
  html += '</tbody></table>';

  const buttons = [
    { label: 'キャンセル', onclick: 'wpCloseModal()' }
  ];
  if (!isNew) {
    buttons.push({ label: '🗑 削除', danger: true, onclick: 'wpDeletePresetConfirm(\'' + preset.name.replace(/'/g, "\\'") + '\')' });
  }
  buttons.push({ label: '💾 保存', primary: true, onclick: 'wpSaveCurrentEdit()' });

  wpOpenModal((isNew ? '新規プリセット作成' : 'プリセット編集：') + preset.name, html, buttons);
}

function wpBulkSet(scope, value) {
  let val = value;
  if (val === null) {
    const inp = document.getElementById('wp-bulk-val');
    val = parseInt(inp.value, 10);
    if (isNaN(val) || val < 0) { alert('有効な数値を入力してください'); return; }
  }
  const inputs = document.querySelectorAll('.wp-ratio-input');
  let n = 0;
  inputs.forEach(inp => {
    const lid = inp.dataset.lid;
    const loc = wpLocations.find(l => l.id === lid);
    const outdoor = loc ? loc.outdoor : '屋内';
    if (scope === 'all' || (scope === 'outdoor' && outdoor === '屋外') || (scope === 'indoor' && outdoor === '屋内')) {
      inp.value = val;
      n++;
    }
  });
  wpToast(n + '拠点を ' + val + '% に設定', 'info');
}

async function wpSaveCurrentEdit() {
  const nameInp = document.getElementById('wp-edit-name');
  const newName = nameInp.value.trim();
  if (!newName) { alert('プリセット名を入力してください'); return; }

  const inputs = document.querySelectorAll('.wp-ratio-input');
  const rows = [];
  inputs.forEach(inp => {
    const lid = inp.dataset.lid;
    const ratio = parseInt(inp.value, 10);
    if (isNaN(ratio) || ratio < 0) return;
    rows.push({ locId: lid, ratio: ratio, note: '' });
  });
  if (rows.length === 0) { alert('1拠点以上設定してください'); return; }

  wpToast('保存中...', 'info');
  // GET経由（URLが長くなる可能性あるがOK）
  const usp = new URLSearchParams();
  usp.set('action', 'saveWeatherPreset');
  usp.set('presetName', newName);
  usp.set('rows', JSON.stringify(rows));
  try {
    const res = await fetch(GAS_URL + '?' + usp.toString());
    const r = await res.json();
    if (!r.ok) { wpToast('保存失敗: ' + (r.error || '不明'), 'error'); return; }
    wpToast(r.message || '保存完了', 'success');
    wpCloseModal();
    await wpRenderSettingsTab();
  } catch (err) {
    wpToast('保存失敗: ' + String(err), 'error');
  }
}

async function wpDeletePresetConfirm(presetName) {
  if (!confirm('プリセット「' + presetName + '」を削除しますか？\nこの操作は取り消せません。')) return;
  const r = await wpFetch('deleteWeatherPreset', { presetName: presetName });
  if (!r.ok) { wpToast('削除失敗: ' + (r.error || '不明'), 'error'); return; }
  wpToast(r.message || '削除完了', 'success');
  wpCloseModal();
  await wpRenderSettingsTab();
}

// ============================================================
// v3.26 🔴 完売増量（設定タブ・案B：時間帯[開始〜終了]＋個数を自由追加/削除）
//   読込 = getSelloutBonusRules(GET) / 保存 = saveSelloutBonusRules(POST)
//   保存するとサーバーが「完売増量マスタ」を全書換→キャッシュクリア→全曜日を即再計算（H列=提案値のみ）
//   完売増量の真実はサーバー。BM_SELLOUT_RULES等のローカル定数は未使用。
// ============================================================
let sbRules = [];  // [{from:'HH:MM', to:'HH:MM', bonus:Number}]

async function sbLoadRules() {
  const r = await wpFetch('getSelloutBonusRules');
  sbRules = (r && r.ok && Array.isArray(r.rules)) ? r.rules : [];
}

function sbSectionHtml() {
  let h = '';
  h += '<div class="wp-section-title">🔴 完売増量</div>';
  h += '<div class="wp-section-desc">完売した時刻の時間帯ごとに、翌週の推奨数へ自動で上乗せする個数(+N)を設定します。時間帯は開始時刻順に並び、重複する場合は<b>早い開始が優先</b>。該当なしは +0 です。<b>保存すると即座に全曜日の推奨数を再計算します（十数秒）。</b></div>';
  h += '<table class="sb-table"><thead><tr><th>開始</th><th>終了</th><th>増量(+個)</th><th style="width:44px;"></th></tr></thead><tbody id="sb-tbody">';
  h += sbRowsHtml();
  h += '</tbody></table>';
  h += '<div class="sb-actions">';
  h += '<button class="sb-add-btn" onclick="sbAddRow()">＋ 行を追加</button>';
  h += '<button class="sb-save-btn" id="sb-save-btn" onclick="sbSaveRules()">💾 保存して再計算</button>';
  h += '</div>';
  return h;
}

function sbRowsHtml() {
  if (!sbRules.length) {
    return '<tr id="sb-empty"><td colspan="4" style="color:#888;padding:16px;">行がありません。「＋ 行を追加」で追加してください。</td></tr>';
  }
  let h = '';
  for (const r of sbRules) {
    h += sbOneRowHtml(r.from || '', r.to || '', (r.bonus != null ? r.bonus : 0));
  }
  return h;
}

function sbOneRowHtml(from, to, bonus) {
  return '<tr class="sb-row">'
    + '<td><input type="time" class="sb-from" value="' + bmEscape(from) + '"></td>'
    + '<td><input type="time" class="sb-to" value="' + bmEscape(to) + '"></td>'
    + '<td><input type="number" class="sb-bonus" min="0" step="1" value="' + bmEscape(String(bonus)) + '"></td>'
    + '<td><button class="sb-del-btn" onclick="sbDeleteRow(this)" title="この行を削除">🗑</button></td>'
    + '</tr>';
}

// DOMの入力値を sbRules に取り込む（行追加/削除の前に呼ぶ＝編集消失防止）
function sbSyncFromDOM() {
  const rows = document.querySelectorAll('#sb-tbody tr.sb-row');
  const arr = [];
  rows.forEach(tr => {
    const fromEl = tr.querySelector('.sb-from');
    const toEl   = tr.querySelector('.sb-to');
    const bonusEl = tr.querySelector('.sb-bonus');
    const from = fromEl ? fromEl.value : '';
    const to   = toEl ? toEl.value : '';
    const raw  = bonusEl ? bonusEl.value : '';
    let bonus = (raw === '' || raw == null) ? 0 : parseInt(raw, 10);
    if (isNaN(bonus)) bonus = 0;
    arr.push({ from: from, to: to, bonus: bonus });
  });
  sbRules = arr;
}

function sbRerenderRows() {
  const tb = document.getElementById('sb-tbody');
  if (tb) tb.innerHTML = sbRowsHtml();
}

function sbAddRow() {
  sbSyncFromDOM();
  sbRules.push({ from: '', to: '', bonus: 0 });
  sbRerenderRows();
}

function sbDeleteRow(btn) {
  sbSyncFromDOM();
  const tr = btn.closest('tr.sb-row');
  if (!tr) return;
  const rows = Array.prototype.slice.call(document.querySelectorAll('#sb-tbody tr.sb-row'));
  const idx = rows.indexOf(tr);
  if (idx >= 0) sbRules.splice(idx, 1);
  sbRerenderRows();
}

async function sbSaveRules() {
  sbSyncFromDOM();
  // バリデーション＆完全空行の除外
  const rules = [];
  for (let i = 0; i < sbRules.length; i++) {
    const r = sbRules[i];
    const from = (r.from || '').trim();
    const to   = (r.to || '').trim();
    const isEmptyRow = (!from && !to && (!r.bonus || Number(r.bonus) === 0));
    if (isEmptyRow) continue;  // 完全な空行はスキップ
    if (!/^\d{2}:\d{2}$/.test(from) || !/^\d{2}:\d{2}$/.test(to)) {
      wpToast((i + 1) + '行目：開始・終了を HH:MM 形式で入力してください', 'error');
      return;
    }
    if (!(from < to)) {
      wpToast((i + 1) + '行目：開始は終了より前にしてください（' + from + '〜' + to + '）', 'error');
      return;
    }
    let bonus = parseInt(r.bonus, 10);
    if (isNaN(bonus) || bonus < 0) {
      wpToast((i + 1) + '行目：増量は 0 以上の整数で入力してください', 'error');
      return;
    }
    rules.push({ from: from, to: to, bonus: bonus });
  }

  const btn = document.getElementById('sb-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…再計算（十数秒）'; }
  const res = await bmPostAction('saveSelloutBonusRules', { rules: rules });
  if (btn) { btn.disabled = false; btn.textContent = '💾 保存して再計算'; }

  if (!res || !res.ok) {
    wpToast('保存失敗: ' + ((res && res.error) || '不明'), 'error');
    return;
  }
  wpToast('保存＋再計算しました（' + (res.count != null ? res.count : rules.length) + '区分 / ' + (res.processed || 0) + '件更新）', 'success');
  // サーバー正規化結果（昇順ソート等）をUIへ反映
  await sbLoadRules();
  sbRerenderRows();
  // 配分調整が読み込み済みなら再描画（+N反映）
  if (typeof bmCurrentDate !== 'undefined' && bmCurrentDate && typeof bmLoadDate === 'function') {
    try { await bmLoadDate(bmCurrentDate); } catch (e) {}
  }
}

// ============================================================
// v3.27 📊 加重平均（W1〜W4の重み・最小UI）
//   読込 = getSettingWeights(GET) / 保存 = saveSettingWeights(POST)
//   保存すると設定シートの weight_w1〜w4 を更新→キャッシュクリア→全曜日を即再計算
// ============================================================
let waWeights = { w1: 40, w2: 30, w3: 20, w4: 10 };

async function waLoadWeights() {
  const r = await wpFetch('getSettingWeights');
  if (r && r.ok && r.weights) {
    waWeights = {
      w1: Number(r.weights.w1), w2: Number(r.weights.w2),
      w3: Number(r.weights.w3), w4: Number(r.weights.w4)
    };
  }
}

function waSectionHtml() {
  const w = waWeights;
  const sum = (Number(w.w1) || 0) + (Number(w.w2) || 0) + (Number(w.w3) || 0) + (Number(w.w4) || 0);
  let h = '';
  h += '<div class="wp-section-title">📊 加重平均（直近4週の重み）</div>';
  h += '<div class="wp-section-desc">過去4週の同曜日の販売数を、どの比率で平均するかを設定します（先週ほど重く）。合計100%が目安です（合計が100でなくても内部で正規化して計算します）。<b>保存すると全曜日の推奨数を即再計算します（十数秒）。</b></div>';
  h += '<div class="wa-grid">';
  h += waCellHtml('wa-w1', '先週 (W1)', w.w1);
  h += waCellHtml('wa-w2', '2週前 (W2)', w.w2);
  h += waCellHtml('wa-w3', '3週前 (W3)', w.w3);
  h += waCellHtml('wa-w4', '4週前 (W4)', w.w4);
  h += '<span class="wa-sum' + (sum !== 100 ? ' wa-warn' : '') + '" id="wa-sum">合計 <b id="wa-sum-val">' + sum + '</b> %</span>';
  h += '</div>';
  h += '<div class="sb-actions"><button class="sb-save-btn" id="wa-save-btn" onclick="waSaveWeights()">💾 保存して再計算</button></div>';
  return h;
}

function waCellHtml(id, label, val) {
  return '<label>' + bmEscape(label)
    + '<input type="number" id="' + id + '" min="0" step="1" value="' + bmEscape(String(val)) + '" oninput="waUpdateSum()"></label>';
}

function waUpdateSum() {
  const ids = ['wa-w1', 'wa-w2', 'wa-w3', 'wa-w4'];
  let sum = 0;
  ids.forEach(function (id) {
    const el = document.getElementById(id);
    const v = el ? parseInt(el.value, 10) : 0;
    if (!isNaN(v)) sum += v;
  });
  const val = document.getElementById('wa-sum-val');
  if (val) val.textContent = sum;
  const box = document.getElementById('wa-sum');
  if (box) box.classList.toggle('wa-warn', sum !== 100);
}

async function waSaveWeights() {
  const getv = function (id) {
    const el = document.getElementById(id);
    const v = el ? parseInt(el.value, 10) : NaN;
    return isNaN(v) ? -1 : v;
  };
  const w1 = getv('wa-w1'), w2 = getv('wa-w2'), w3 = getv('wa-w3'), w4 = getv('wa-w4');
  if ([w1, w2, w3, w4].some(function (v) { return v < 0; })) {
    wpToast('W1〜W4は0以上の整数で入力してください', 'error');
    return;
  }
  if (w1 + w2 + w3 + w4 === 0) {
    wpToast('合計が0です。1つ以上に重みを入れてください', 'error');
    return;
  }

  const btn = document.getElementById('wa-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…再計算（十数秒）'; }
  const res = await bmPostAction('saveSettingWeights', { weights: { w1: w1, w2: w2, w3: w3, w4: w4 } });
  if (btn) { btn.disabled = false; btn.textContent = '💾 保存して再計算'; }

  if (!res || !res.ok) {
    wpToast('保存失敗: ' + ((res && res.error) || '不明'), 'error');
    return;
  }
  if (res.weights) {
    waWeights = {
      w1: Number(res.weights.w1), w2: Number(res.weights.w2),
      w3: Number(res.weights.w3), w4: Number(res.weights.w4)
    };
  }
  wpToast('保存＋再計算しました（重み ' + waWeights.w1 + '/' + waWeights.w2 + '/' + waWeights.w3 + '/' + waWeights.w4 + ' ・' + (res.processed || 0) + '件更新）', 'success');
  // 配分調整が読み込み済みなら再描画
  if (typeof bmCurrentDate !== 'undefined' && bmCurrentDate && typeof bmLoadDate === 'function') {
    try { await bmLoadDate(bmCurrentDate); } catch (e) {}
  }
}

// マウスアップでドラッグ終了
document.addEventListener('mouseup', bmOnGlobalMouseUp);

// キーボードショートカット（既存handlerに追加）
document.addEventListener('keydown', function(e) {
  // tab-master がアクティブなときのみ
  const tabMaster = document.getElementById('tab-master');
  if (!tabMaster || !tabMaster.classList.contains('active')) return;
  // 編集中（contenteditableにフォーカス）なら無視（Ctrl+Z/Yはブラウザに任せたほうが安全だが、選択範囲操作は別）
  const isEditing = document.activeElement && document.activeElement.isContentEditable;
  // Ctrl+Z / Cmd+Z → Undo
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z' && !isEditing) {
    e.preventDefault();
    bmDoUndo();
    return;
  }
  // Ctrl+Y or Ctrl+Shift+Z → Redo
  if (((e.ctrlKey || e.metaKey) && e.key === 'y') ||
      ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'z' || e.key === 'Z'))) {
    if (isEditing) return;
    e.preventDefault();
    bmDoRedo();
    return;
  }
  // Delete / Backspace → 範囲を0クリア
  if ((e.key === 'Delete' || e.key === 'Backspace') && !isEditing && bmSelectedCells.size > 0) {
    e.preventDefault();
    bmActionClearZero();
    return;
  }
  // Ctrl+C → 範囲コピー
  if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !isEditing && bmSelectedCells.size > 0) {
    e.preventDefault();
    bmActionCopy();
    return;
  }
  // Ctrl+V → 範囲ペースト
  if ((e.ctrlKey || e.metaKey) && e.key === 'v' && !isEditing && bmSelectedCells.size > 0) {
    e.preventDefault();
    bmActionPaste();
    return;
  }
  // Escape → 選択解除
  if (e.key === 'Escape' && !isEditing) {
    bmClearSelection();
    return;
  }
});

// 設定タブ初回表示時にプリセット読み込み
let wpSettingsLoaded = false;
function wpEnsureSettingsLoaded() {
  if (wpSettingsLoaded) return;
  wpSettingsLoaded = true;
  wpRenderSettingsTab();
}


// ═══════════════════════════════════════════════════════════════
// 一括印刷機能 (v3.10 NEW 2026-05-25)
// sheet1の日付を全シートに同期 → 拠点配分(2部) → 午前便 → (午後便あれば) → 仕込み
// の順に afterprint イベントで連鎖印刷
// ═══════════════════════════════════════════════════════════════
let _printAllQueue = [];      // 印刷順序の配列 例: ['sheet1','sheet1','sheet2','sheet3','sheet4']
let _printAllIdx = 0;          // 現在の印刷インデックス
let _printAllBound = false;    // afterprint ハンドラ登録済みフラグ

async function printAllForDay() {
  // ① sheet1日付取得
  const dateVal = document.getElementById('s1-date-input').value;
  if (!dateVal) {
    alert('sheet1で日付を選択してください');
    return;
  }
  // 既に一括印刷中なら拒否
  if (_printAllQueue.length > 0) {
    alert('既に一括印刷が進行中です');
    return;
  }
  // ② 事前確認
  const okConfirm = confirm(
    dateVal + ' の一括印刷を開始します。\n\n' +
    '印刷ダイアログが順番に 4〜5 回開きます。\n' +
    '各ダイアログで「印刷」を押してください。\n' +
    '(キャンセルしても次のダイアログが開きます)\n\n' +
    '開始しますか?'
  );
  if (!okConfirm) return;

  // ③ 全シートの日付入力を sheet1 と同期
  document.getElementById('s2-date-input').value = dateVal;
  document.getElementById('s3-date-input').value = dateVal;

  // ④ sheet4の日付選択を sheet1日付のみに同期
  s4SelectedDates.clear();
  s4SelectedDates.add(dateVal);
  document.querySelectorAll('#s4-date-row .s4-date-lbl').forEach(lbl => {
    const cb = lbl.querySelector('input');
    if (!cb) return;
    if (lbl.dataset.date === dateVal) {
      cb.checked = true;
      lbl.classList.add('checked');
    } else {
      cb.checked = false;
      lbl.classList.remove('checked');
    }
  });
  updateS4SelInfo();

  // ⑤ sheet1〜3 のデータを並列取得 + 描画
  s1SetStatus('一括印刷の準備中... データ取得');
  let hasAfternoon = false;
  try {
    const [s1Res, s2Res, s3Res, colorMap] = await Promise.all([
      fetch(GAS_URL + '?action=getSheet1Data&date=' + dateVal).then(r => r.json()),
      fetch(GAS_URL + '?action=getSheet2Data&date=' + dateVal).then(r => r.json()),
      fetch(GAS_URL + '?action=getSheet3Data&date=' + dateVal).then(r => r.json()),
      loadDriverColorMap(dateVal)
    ]);
    if (!s1Res.ok) throw new Error('シート1: ' + (s1Res.error || '不明'));
    if (!s2Res.ok) throw new Error('シート2: ' + (s2Res.error || '不明'));
    if (!s3Res.ok) throw new Error('シート3: ' + (s3Res.error || '不明'));

    s1Res._driverColorMap = colorMap;
    renderSheet1(s1Res);
    renderSheet2(s2Res);

    // 午後便有無判定
    hasAfternoon = (s3Res.deliveries && s3Res.deliveries.length > 0);
    if (hasAfternoon) {
      renderSheet3(s3Res);
    } else {
      // 午後便なしの場合は sheet3 をクリア
      document.getElementById('sheet3-body').innerHTML = '<div style="padding:20px;color:#999;">この日の午後便はありません</div>';
    }
  } catch (e) {
    s1SetStatus('一括印刷準備失敗: ' + e.message, true);
    return;
  }

  // ⑥ sheet4 取得 (既存fetchSheet4をそのまま使う)
  s1SetStatus('一括印刷の準備中... 仕込み取得');
  try {
    await fetchSheet4();
  } catch (e) {
    s1SetStatus('仕込み取得失敗: ' + e.message, true);
    return;
  }

  // ⑦ 印刷キュー構築
  _printAllQueue = ['sheet1', 'sheet1', 'sheet2'];  // 拠点配分は2部
  if (hasAfternoon) {
    _printAllQueue.push('sheet3');
  }
  _printAllQueue.push('sheet4');
  _printAllIdx = 0;

  // ⑧ afterprint ハンドラを登録 (初回のみ)
  if (!_printAllBound) {
    window.addEventListener('afterprint', _printAllOnAfter);
    _printAllBound = true;
  }

  // ⑨ 最初の印刷を起動
  s1SetStatus('一括印刷中... (1/' + _printAllQueue.length + ') ' + _printAllLabel(_printAllQueue[0]));
  _printAllStartCurrent();
}

// 現在キューのタブをアクティブ化してwindow.print()を起動
function _printAllStartCurrent() {
  if (_printAllIdx >= _printAllQueue.length) {
    _printAllFinish();
    return;
  }
  const tabName = _printAllQueue[_printAllIdx];
  // タブ切替
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  const tabBtn  = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  const tabPane = document.getElementById('tab-' + tabName);
  if (tabBtn)  tabBtn.classList.add('active');
  if (tabPane) tabPane.classList.add('active');

  // 描画反映を待ってから印刷ダイアログ
  setTimeout(function() {
    window.print();
  }, 200);
}

// afterprint コールバック (キューが空なら何もしない=単体印刷時)
function _printAllOnAfter() {
  if (_printAllQueue.length === 0) return;
  _printAllIdx++;
  if (_printAllIdx >= _printAllQueue.length) {
    _printAllFinish();
    return;
  }
  const tabName = _printAllQueue[_printAllIdx];
  s1SetStatus('一括印刷中... (' + (_printAllIdx + 1) + '/' + _printAllQueue.length + ') ' + _printAllLabel(tabName));
  // ブラウザがブロックしないよう遅延
  setTimeout(_printAllStartCurrent, 500);
}

// 全完了処理
function _printAllFinish() {
  _printAllQueue = [];
  _printAllIdx = 0;
  // sheet1に戻す
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  const sheet1Btn = document.querySelector('.tab-btn[data-tab="sheet1"]');
  const sheet1Pane = document.getElementById('tab-sheet1');
  if (sheet1Btn) sheet1Btn.classList.add('active');
  if (sheet1Pane) sheet1Pane.classList.add('active');
  s1SetStatus('✅ 一括印刷完了');
  setTimeout(function() { s1SetStatus(''); }, 4000);
}

// タブ名→日本語ラベル
function _printAllLabel(tabName) {
  const labels = {
    'sheet1': '拠点配分',
    'sheet2': '午前便盛り出し',
    'sheet3': '午後便盛り出し',
    'sheet4': '仕込み'
  };
  return labels[tabName] || tabName;
}
