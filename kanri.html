<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍱 納品管理</title>
<style>
@page { size: A4 landscape; margin: 4mm; }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: 13px;
  background: #f5f5f5;
  color: #212121;
}

/* ── ヘッダー ── */
.app-header {
  background: #1a3c5e;
  color: white;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header h1 { font-size: 15px; font-weight: bold; }

/* ── タブバー ── */
.tab-bar {
  background: #1a3c5e;
  border-bottom: 2px solid #0d2a42;
  display: flex;
  padding: 0 8px;
  position: sticky;
  top: 37px;
  z-index: 99;
}
.tab-btn {
  padding: 7px 14px;
  color: rgba(255,255,255,0.65);
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color 0.15s;
}
.tab-btn:hover { color: rgba(255,255,255,0.9); }
.tab-btn.active { color: #fff; border-bottom-color: #64b5f6; font-weight: bold; }
.tab-btn:disabled { color: rgba(255,255,255,0.3); cursor: default; }

/* ── タブコンテンツ ── */
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.active { display: block; }
.placeholder-msg { text-align: center; padding: 60px; color: #888; font-size: 15px; }

/* ── コントロールバー（共通） ── */
.ctrl-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.ctrl-bar label { font-size: 12px; color: #555; }
.ctrl-bar input[type="date"] {
  padding: 4px 8px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-family: inherit;
  font-size: 13px;
}
.btn {
  padding: 5px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
}
.btn-primary { background: #1a3c5e; color: white; }
.btn-primary:hover { background: #274f7a; }
.btn-print { background: #546e7a; color: white; }
.btn-print:hover { background: #607d8b; }

.status-msg {
  font-size: 12px;
  color: #888;
  margin-left: 4px;
}
.status-msg.err { color: #c62828; }

/* ── シート1 コンテンツ ── */
.sheet1-content {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

/* ── テーブルエリア（共通） ── */
.table-wrap { overflow-x: auto; flex: 1; min-width: 0; }

.page-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

/* ── メインテーブル（共通） ── */
.matrix-table {
  border-collapse: collapse;
  font-size: 7.5pt;
  white-space: nowrap;
}
.matrix-table th,
.matrix-table td {
  border: 1px solid #888;
  padding: 0 3px;
  text-align: center;
  height: 14px;
  line-height: 14px;
  min-width: 22px;
}
.matrix-table th {
  background: #e0e0e0;
  font-weight: bold;
}

/* 商品名セル */
.matrix-table td.cell-name {
  text-align: left;
  padding: 0 5px;
  width: 82px;
  background: #f5f5f5;
  font-weight: bold;
}

/* 数値セル */
.matrix-table td.cell-data { }

/* 中間計・合計 */
.matrix-table td.cell-sub  { background: #e8eaf6; font-weight: bold; }
.matrix-table td.cell-tot  { background: #c5cae9; font-weight: bold; }
.matrix-table th.cell-sub  { background: #c5cae9; }
.matrix-table th.cell-tot  { background: #9fa8da; color: #fff; }

/* 拠点合計（シート2用） */
.matrix-table th.cell-kyoten { background: #c5cae9; }
.matrix-table td.cell-kyoten { background: #e8eaf6; font-weight: bold; }

/* セクションラベル行 */
.matrix-table td.cell-section-rice {
  background: #424242; color: white;
  font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px;
  height: 16px; line-height: 16px;
}
.matrix-table td.cell-section-brown {
  background: #5d4037; color: white;
  font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px;
  height: 16px; line-height: 16px;
}

/* 商品グループ色（白米） */
.matrix-table tr.g-blue  td.cell-data { background: #e3f2fd; }
.matrix-table tr.g-green td.cell-data { background: #e8f5e9; }
.matrix-table tr.g-yel   td.cell-data { background: #fff9c4; }

/* 商品グループ色（玄米） */
.matrix-table tr.g-blue.brown-row  td.cell-data { background: #fff3e0; }
.matrix-table tr.g-green.brown-row td.cell-data { background: #ffe0b2; }
.matrix-table tr.g-yel.brown-row   td.cell-data { background: #ffcc80; }

/* ── シート2：グレード配色（配達列セル背景） ── */
.cell-ume   { background: #ffffff !important; }
.cell-take  { background: #c8e6c9 !important; }
.cell-matsu { background: #d1c4e9 !important; }
.ohm        { color: #c62828; font-weight: bold; }

/* 凡例 */
.legend {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 10px;
  margin-left: 8px;
}
.legend-item {
  display: inline-block;
  padding: 1px 8px;
  border: 1px solid #888;
  font-size: 9.5px;
}
.legend-ohm { color: #c62828; font-weight: bold; font-size: 9.5px; }

/* ── シート2：3エリアレイアウト ── */
.sheet2-container {
  display: grid;
  grid-template-columns: 5fr 5fr 2.5fr;
  gap: 8px;
  align-items: start;
}

/* ── 配達カードエリア ── */
.delivery-area {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.delivery-card {
  border: 1px solid #555;
  background: white;
  overflow: hidden;
}
.delivery-header {
  font-weight: bold;
  padding: 2px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #aaa;
  font-size: 8pt;
  flex-shrink: 0;
  line-height: 1.3;
}
.delivery-header.grade-matsu { background: #d1c4e9; }
.delivery-header.grade-take  { background: #c8e6c9; }
.delivery-header.grade-ume   { background: #ffffff; }
.delivery-header.grade-empty { background: #f5f5f5; color: #aaa; }

.grade-badge {
  font-size: 7.5pt;
  padding: 0 4px;
  border: 1px solid #666;
  background: white;
  font-weight: bold;
  line-height: 1.3;
}
.delivery-body {
  padding: 3px 6px;
  font-size: 7.5pt;
}
.delivery-row {
  display: flex;
  line-height: 1.5;
  border-bottom: 1px dotted #ddd;
  padding-bottom: 1px;
}
.delivery-row:last-child { border-bottom: none; }
.delivery-row .lbl {
  flex-shrink: 0;
  width: 38px;
  color: #555;
  font-weight: bold;
  font-size: 7pt;
}
.delivery-row .val {
  flex: 1;
  font-size: 7.5pt;
  word-break: break-all;
}
.return-badge {
  display: inline-block;
  background: #fff3e0;
  border: 1px solid #ff9800;
  border-radius: 2px;
  padding: 0 3px;
  font-size: 6.5pt;
  color: #e65100;
  font-weight: bold;
}
.no-delivery-msg {
  text-align: center;
  color: #888;
  font-size: 12px;
  padding: 20px 0;
}

/* ── 拠点リスト（右パネル） ── */
.ref-panel { flex-shrink: 0; }
.ref-table {
  border-collapse: collapse;
  font-size: 7.5pt;
  white-space: nowrap;
}
.ref-table th,
.ref-table td {
  border: 1px solid #aaa;
  padding: 0 4px;
  height: 14px;
  line-height: 14px;
}
.ref-table th { background: #e0e0e0; text-align: center; }
.ref-table td.col-no   { width: 22px; text-align: center; background: #fffde7; font-weight: bold; }
.ref-table td.col-name { width: 88px; text-align: left; padding-left: 4px; font-weight: bold; }
.ref-table td.col-wh   { width: 60px; text-align: center; font-size: 7pt; color: #555; }

/* ── 印刷スタイル ── */
@media print {
  body { background: white; }
  .app-header, .tab-bar, .ctrl-bar, .legend { display: none !important; }
  .tab-pane { display: none !important; padding: 0; }
  .tab-pane.active { display: block !important; }
  .sheet1-content, .sheet2-container { page-break-inside: avoid; }
  .table-wrap { overflow: visible; }
  .page-title { margin-bottom: 4px; font-size: 12pt; }
  .delivery-area { gap: 2px; }
}
</style>
</head>
<body>

<div class="app-header">
  <h1>🍱 納品管理</h1>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="sheet1">📋 シート1 拠点配分</button>
  <button class="tab-btn" data-tab="sheet2">📦 シート2 1便盛り出し</button>
  <button class="tab-btn" disabled data-tab="sheet3">シート3 2便盛り出し <small>準備中</small></button>
  <button class="tab-btn" disabled data-tab="sheet4">シート4 仕込み・発注 <small>準備中</small></button>
  <button class="tab-btn" disabled data-tab="master">基本数マスタ <small>準備中</small></button>
  <button class="tab-btn" disabled data-tab="settings">設定 <small>準備中</small></button>
</div>

<!-- シート1 -->
<div class="tab-pane active" id="tab-sheet1">
  <div class="ctrl-bar">
    <label>日付：</label>
    <input type="date" id="s1-date-input">
    <button class="btn btn-primary" id="s1-btn-fetch">取得</button>
    <button class="btn btn-print" onclick="window.print()">🖨 印刷</button>
    <span class="status-msg" id="s1-status-msg"></span>
  </div>
  <div id="sheet1-body"></div>
</div>

<!-- シート2 -->
<div class="tab-pane" id="tab-sheet2">
  <div class="ctrl-bar">
    <label>日付：</label>
    <input type="date" id="s2-date-input">
    <button class="btn btn-primary" id="s2-btn-fetch">取得</button>
    <button class="btn btn-print" onclick="window.print()">🖨 印刷</button>
    <span class="status-msg" id="s2-status-msg"></span>
    <div class="legend">
      <span>色：</span>
      <span class="legend-item" style="background:#fff;">梅</span>
      <span class="legend-item" style="background:#c8e6c9;">竹</span>
      <span class="legend-item" style="background:#d1c4e9;">松</span>
      <span class="legend-ohm">大盛り</span>
    </div>
  </div>
  <div id="sheet2-body"></div>
</div>

<!-- 他タブ（準備中） -->
<div class="tab-pane" id="tab-sheet3"><div class="placeholder-msg">シート3（2便盛り出し表）は準備中です</div></div>
<div class="tab-pane" id="tab-sheet4"><div class="placeholder-msg">シート4（仕込み・発注）は準備中です</div></div>
<div class="tab-pane" id="tab-master"><div class="placeholder-msg">基本数マスタ画面は準備中です</div></div>
<div class="tab-pane" id="tab-settings"><div class="placeholder-msg">設定画面は準備中です</div></div>

<script>
'use strict';

// ─────────────────────────────────────────
// 設定
// ─────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycby2w7DLb-HULShiC5rKhD_wKg_TGjpx5nURr4Mk-E4Mzg_koC7eJbBedQ6u5QfwsJ_T4Q/exec';

// ★ 単価マスタの「カテゴリー」列の実値に合わせて変更してください
const CATEGORY_COLOR = {
  '海苔弁系': 'blue',
  '満腹系':   'green',
  '全六':     'yellow',
  '他社商品': 'yellow',
  '全':       'yellow',
};

// カテゴリー未設定時のフォールバック（商品名パターン）
const NAME_COLOR_RULES = [
  { re: /^(あいもり|銀鮭|塩麹|照り焼き|鯖から|アジフライ|柚子焼き|マグロ|あさひめ)/, color: 'blue' },
  { re: /^(メンチ|カレー|満腹)/,                                                        color: 'green' },
];

// グレード（日本語） → CSS クラス
const GRADE_CLASS = { '松': 'matsu', '竹': 'take', '梅': 'ume' };

function getColor(category, baseName) {
  if (category && CATEGORY_COLOR[category]) return CATEGORY_COLOR[category];
  for (const rule of NAME_COLOR_RULES) {
    if (rule.re.test(baseName)) return rule.color;
  }
  return 'yellow';
}

// ─────────────────────────────────────────
// タブ切替
// ─────────────────────────────────────────
document.querySelectorAll('.tab-btn:not(:disabled)').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const pane = document.getElementById('tab-' + btn.dataset.tab);
    if (pane) pane.classList.add('active');
  });
});

// ─────────────────────────────────────────
// 日付ピッカー初期化（今日・JST）
// ─────────────────────────────────────────
function toJstDateStr() {
  const now = new Date();
  const jst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}
const TODAY = toJstDateStr();
document.getElementById('s1-date-input').value = TODAY;
document.getElementById('s2-date-input').value = TODAY;

// ─────────────────────────────────────────
// ユーティリティ
// ─────────────────────────────────────────
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════
// シート1
// ═══════════════════════════════════════

const s1Status = document.getElementById('s1-status-msg');

function s1SetStatus(msg, isErr) {
  s1Status.textContent = msg;
  s1Status.className = 'status-msg' + (isErr ? ' err' : '');
}

document.getElementById('s1-btn-fetch').addEventListener('click', fetchSheet1);

async function fetchSheet1() {
  const dateVal = document.getElementById('s1-date-input').value;
  if (!dateVal) { s1SetStatus('日付を選択してください', true); return; }
  s1SetStatus('取得中…');
  document.getElementById('sheet1-body').innerHTML = '';
  try {
    const res  = await fetch(GAS_URL + '?action=getSheet1Data&date=' + dateVal);
    const data = await res.json();
    if (!data.ok) { s1SetStatus(data.error || '取得エラー', true); return; }
    s1SetStatus('');
    renderSheet1(data);
  } catch(e) {
    s1SetStatus('通信エラー: ' + e.message, true);
  }
}

function renderSheet1(data) {
  const body = document.getElementById('sheet1-body');
  const { dateLabel, locations, rice, brown, subtotalSplit } = data;
  const locIds = locations.map(l => l.id);

  function buildTableHTML(rows, isBrown) {
    if (!rows || rows.length === 0) return '';
    const sectionClass = isBrown ? 'cell-section-brown' : 'cell-section-rice';
    const sectionLabel = isBrown ? '▼ 玄米' : '▼ 白米';
    const rowClass     = isBrown ? 'brown-row' : '';
    const colspan      = 1 + locIds.length + 1 + 1;

    let html = '';
    html += `<tr><td colspan="${colspan}" class="${sectionClass}">${sectionLabel}</td></tr>`;
    html += '<tr>';
    html += '<th style="width:82px;text-align:left;padding-left:5px;">商品</th>';
    locIds.forEach((lid, idx) => {
      const loc   = locations.find(l => l.id === lid);
      const name  = loc ? loc.name : lid;
      const short = name.length > 5 ? name.slice(0, 4) + '…' : name;
      if (idx === subtotalSplit) {
        html += `<th class="cell-sub" title="中間計(前${subtotalSplit}拠点)">中計</th>`;
      }
      html += `<th title="${name}">${short}</th>`;
    });
    html += '<th class="cell-tot">合計</th>';
    html += '</tr>';

    rows.forEach(row => {
      const color  = getColor(row.category, row.baseName);
      const trCls  = `g-${color}${rowClass ? ' ' + rowClass : ''}`;
      html += `<tr class="${trCls}">`;
      html += `<td class="cell-name">${escHtml(row.baseName)}</td>`;
      locIds.forEach((lid, idx) => {
        if (idx === subtotalSplit) {
          html += `<td class="cell-sub">${row.subtotal || ''}</td>`;
        }
        const q = row.byLocation[lid];
        html += `<td class="cell-data">${q ? q : ''}</td>`;
      });
      html += `<td class="cell-tot">${row.total || ''}</td>`;
      html += '</tr>';
    });

    return html;
  }

  const tableHTML = '<table class="matrix-table">'
    + buildTableHTML(rice,  false)
    + buildTableHTML(brown, true)
    + '</table>';

  let refHTML = '<table class="ref-table">'
    + '<tr><th class="col-no">No.</th><th class="col-name">拠点名</th><th class="col-wh">勤務時間</th></tr>';
  locations.forEach((loc, idx) => {
    refHTML += `<tr>`
      + `<td class="col-no">${idx + 1}</td>`
      + `<td class="col-name">${escHtml(loc.name)}</td>`
      + `<td class="col-wh">${escHtml(loc.workHours)}</td>`
      + `</tr>`;
  });
  refHTML += '</table>';

  body.innerHTML = `
    <div class="page-title">📋 ${escHtml(dateLabel)}　拠点配分表</div>
    <div class="sheet1-content">
      <div class="table-wrap">${tableHTML}</div>
      <div class="ref-panel">${refHTML}</div>
    </div>`;
}

// ═══════════════════════════════════════
// シート2
// ═══════════════════════════════════════

const s2Status = document.getElementById('s2-status-msg');

function s2SetStatus(msg, isErr) {
  s2Status.textContent = msg;
  s2Status.className = 'status-msg' + (isErr ? ' err' : '');
}

document.getElementById('s2-btn-fetch').addEventListener('click', fetchSheet2);

async function fetchSheet2() {
  const dateVal = document.getElementById('s2-date-input').value;
  if (!dateVal) { s2SetStatus('日付を選択してください', true); return; }
  s2SetStatus('取得中…');
  document.getElementById('sheet2-body').innerHTML = '';
  try {
    const res  = await fetch(GAS_URL + '?action=getSheet2Data&date=' + dateVal);
    const data = await res.json();
    if (!data.ok) { s2SetStatus(data.error || '取得エラー', true); return; }
    s2SetStatus('');
    renderSheet2(data);
  } catch(e) {
    s2SetStatus('通信エラー: ' + e.message, true);
  }
}

function renderSheet2(data) {
  const body = document.getElementById('sheet2-body');
  const { dateLabel, deliveries, rice, brown } = data;
  const dCount = deliveries.length;

  // ── マトリクス HTML 構築 ──
  function buildMatrixHTML(rows, isBrown) {
    const sectionClass = isBrown ? 'cell-section-brown' : 'cell-section-rice';
    const sectionLabel = isBrown ? '▼ 玄米' : '▼ 白米';
    const rowClass     = isBrown ? ' brown-row' : '';
    const colspan      = 1 + 1 + dCount + 1; // 商品名 + 拠点合計 + N配達 + 計

    let html = '<thead>';
    html += `<tr><td colspan="${colspan}" class="${sectionClass}">${sectionLabel}</td></tr>`;
    html += '<tr>';
    html += '<th style="text-align:left;padding-left:5px;min-width:80px;">商品</th>';
    html += '<th class="cell-kyoten">拠点</th>';
    for (let d = 0; d < dCount; d++) {
      const tip = escHtml(deliveries[d].address || deliveries[d].orderNum);
      html += `<th title="${tip}" style="min-width:20px;">${d + 1}</th>`;
    }
    html += '<th class="cell-tot">計</th>';
    html += '</tr></thead><tbody>';

    (rows || []).forEach(row => {
      const color  = getColor(row.category, row.baseName);
      const trCls  = `g-${color}${rowClass}`;
      html += `<tr class="${trCls}">`;
      html += `<td class="cell-name">${escHtml(row.baseName)}</td>`;
      html += `<td class="cell-kyoten">${row.kyotenTotal || ''}</td>`;

      for (let d = 0; d < dCount; d++) {
        const qty  = row.deliveryQtys[d];
        const ohm  = row.deliveryOhm[d];
        const gc   = GRADE_CLASS[deliveries[d].grade];
        const bgCls = (qty > 0 && gc) ? `cell-${gc}` : '';
        const txt  = qty ? (ohm ? `<span class="ohm">${qty}</span>` : qty) : '';
        html += `<td class="${bgCls}">${txt}</td>`;
      }
      html += `<td class="cell-tot">${row.total || ''}</td>`;
      html += '</tr>';
    });

    html += '</tbody>';
    return html;
  }

  const riceHTML  = '<table class="matrix-table">' + buildMatrixHTML(rice,  false) + '</table>';
  const brownHTML = '<table class="matrix-table">' + buildMatrixHTML(brown, true)  + '</table>';

  // ── 配達カード HTML 構築 ──
  let cardsHTML = '';

  if (dCount === 0) {
    cardsHTML = '<div class="no-delivery-msg">本日の1便配達データはありません</div>';
  } else {
    deliveries.forEach(d => {
      const gc      = GRADE_CLASS[d.grade] ? `grade-${GRADE_CLASS[d.grade]}` : 'grade-empty';
      const addrFull = d.address + (d.detail ? '　' + d.detail : '');
      const returnBadge = d.hasReturn
        ? `<span class="return-badge">🔄 回収 ${d.returnTime || ''}</span>`
        : '';

      cardsHTML += `
        <div class="delivery-card">
          <div class="delivery-header ${gc}">
            <span>配達 ${d.n}</span>
            <span class="grade-badge">${escHtml(d.grade) || '—'}</span>
          </div>
          <div class="delivery-body">
            <div class="delivery-row">
              <span class="lbl">時間</span>
              <span class="val">${escHtml(d.time)}</span>
            </div>
            <div class="delivery-row">
              <span class="lbl">届先</span>
              <span class="val">${escHtml(addrFull)}</span>
            </div>
            ${d.contact ? `<div class="delivery-row"><span class="lbl">担当</span><span class="val">${escHtml(d.contact)}</span></div>` : ''}
            ${d.note ? `<div class="delivery-row"><span class="lbl">備考</span><span class="val">${escHtml(d.note)}</span></div>` : ''}
            ${d.hasReturn ? `<div class="delivery-row"><span class="lbl">回収</span><span class="val">${returnBadge}</span></div>` : ''}
          </div>
        </div>`;
    });
  }

  // ── 組み合わせ ──
  body.innerHTML = `
    <div class="page-title">📋 ${escHtml(dateLabel)}　1便盛り出し表（配達 ${dCount} 件）</div>
    <div class="sheet2-container">
      <div class="table-wrap">${riceHTML}</div>
      <div class="table-wrap">${brownHTML}</div>
      <div class="delivery-area">${cardsHTML}</div>
    </div>`;
}
</script>
</body>
</html>
