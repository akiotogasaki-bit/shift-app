<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍱 納品管理</title>
<style id="app-style">
/* @page は全環境で確実に効く静的指定（用紙＝縦）。横向きはシート1・2をCSS回転で実現（A案） */
@page { size: A4; margin: 3mm; }
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

body {
  font-family: 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: 13px;
  background: #f5f5f5;
  color: #212121;
}

/* ── ヘッダー ── */
.app-header {
  background: #1a3c5e;
  color: white;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header h1 { font-size: 15px; font-weight: bold; }

/* ── タブバー ── */
.tab-bar {
  background: #1a3c5e;
  border-bottom: 2px solid #0d2a42;
  display: flex;
  padding: 0 8px;
  position: sticky;
  top: 37px;
  z-index: 99;
}
.tab-btn {
  padding: 7px 14px;
  color: rgba(255,255,255,0.65);
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color 0.15s;
}
.tab-btn:hover { color: rgba(255,255,255,0.9); }
.tab-btn.active { color: #fff; border-bottom-color: #64b5f6; font-weight: bold; }
.tab-btn:disabled { color: rgba(255,255,255,0.3); cursor: default; }

/* ── タブコンテンツ ── */
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.active { display: block; }
.placeholder-msg { text-align: center; padding: 60px; color: #888; font-size: 15px; }

/* ── コントロールバー（共通） ── */
.ctrl-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.ctrl-bar label { font-size: 12px; color: #555; }
.ctrl-bar input[type="date"] {
  padding: 4px 8px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-family: inherit;
  font-size: 13px;
}
.btn {
  padding: 5px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
}
.btn-primary { background: #1a3c5e; color: white; }
.btn-primary:hover { background: #274f7a; }
.btn-print { background: #546e7a; color: white; }
.btn-print:hover { background: #607d8b; }

.status-msg {
  font-size: 12px;
  color: #888;
  margin-left: 4px;
}
.status-msg.err { color: #c62828; }

/* ── シート1 コンテンツ ── */
.sheet1-content {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

/* ── テーブルエリア（共通） ── */
.table-wrap { overflow-x: auto; flex: 1; min-width: 0; }

.page-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

/* ── メインテーブル（共通） ── */
.matrix-table {
  border-collapse: collapse;
  font-size: 7.5pt;
  white-space: nowrap;
}
.matrix-table th,
.matrix-table td {
  border: 1px solid #888;
  padding: 0 3px;
  text-align: center;
  height: 14px;
  line-height: 14px;
  min-width: 22px;
}
.matrix-table th {
  background: #e0e0e0;
  font-weight: bold;
}

/* 商品名セル */
.matrix-table td.cell-name {
  text-align: left;
  padding: 0 5px;
  width: 82px;
  background: #f5f5f5;
  font-weight: bold;
}

/* 数値セル（全シート共通でボールド） */
.matrix-table td { font-weight: bold; }

/* 中間計・合計 */
.matrix-table td.cell-sub  { background: #e8eaf6; font-weight: bold; }
.matrix-table td.cell-tot  { background: #c5cae9; font-weight: bold; }
.matrix-table th.cell-sub  { background: #c5cae9; }
.matrix-table th.cell-tot  { background: #9fa8da; color: #fff; }

/* 拠点合計（シート2用） */
.matrix-table th.cell-kyoten { background: #c5cae9; }
.matrix-table td.cell-kyoten { background: #e8eaf6; font-weight: bold; }

/* セクションラベル行 */
.matrix-table td.cell-section-rice {
  background: #424242; color: white;
  font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px;
  height: 16px; line-height: 16px;
}
.matrix-table td.cell-section-brown {
  background: #5d4037; color: white;
  font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px;
  height: 16px; line-height: 16px;
}

/* 商品グループ色（白米） */
.matrix-table tr.g-blue  td.cell-data { background: #e3f2fd; }
.matrix-table tr.g-green td.cell-data { background: #e8f5e9; }
.matrix-table tr.g-yel   td.cell-data { background: #fff9c4; }

/* 商品グループ色（玄米） */
.matrix-table tr.g-blue.brown-row  td.cell-data { background: #fff3e0; }
.matrix-table tr.g-green.brown-row td.cell-data { background: #ffe0b2; }
.matrix-table tr.g-yel.brown-row   td.cell-data { background: #ffcc80; }

/* ── シート2：グレード配色（配達列セル背景） ── */
.cell-ume   { background: #ffffff !important; }
.cell-take  { background: #c8e6c9 !important; }
.cell-matsu { background: #d1c4e9 !important; }
.ohm        { color: #c62828; font-weight: bold; }

/* 凡例 */
.legend {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 10px;
  margin-left: 8px;
}
.legend-item {
  display: inline-block;
  padding: 1px 8px;
  border: 1px solid #888;
  font-size: 9.5px;
}
.legend-ohm { color: #c62828; font-weight: bold; font-size: 9.5px; }

/* ── シート2：3エリアレイアウト ── */
.sheet2-container {
  display: grid;
  grid-template-columns: 5fr 5fr 2.5fr;
  gap: 8px;
  align-items: start;
}

/* ── 配達カードエリア ── */
.delivery-area {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.delivery-card {
  border: 1px solid #555;
  background: white;
  overflow: hidden;
}
.delivery-header {
  font-weight: bold;
  padding: 2px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #aaa;
  font-size: 8pt;
  flex-shrink: 0;
  line-height: 1.3;
}
.delivery-header.grade-matsu { background: #d1c4e9; }
.delivery-header.grade-take  { background: #c8e6c9; }
.delivery-header.grade-ume   { background: #ffffff; }
.delivery-header.grade-empty { background: #f5f5f5; color: #aaa; }

.grade-badge {
  font-size: 7.5pt;
  padding: 0 4px;
  border: 1px solid #666;
  background: white;
  font-weight: bold;
  line-height: 1.3;
}
.delivery-body {
  padding: 3px 6px;
  font-size: 7.5pt;
}
  .grade-badge.grade-matsu { background: #d1c4e9; }
.grade-badge.grade-take  { background: #c8e6c9; }
.grade-badge.grade-ume   { background: #ffffff; }
.grade-badge.grade-empty { background: #f5f5f5; color: #aaa; }
.delivery-row {
  display: flex;
  line-height: 1.5;
  border-bottom: 1px dotted #ddd;
  padding-bottom: 1px;
}
.delivery-row:last-child { border-bottom: none; }
.delivery-row .lbl {
  flex-shrink: 0;
  width: 38px;
  color: #555;
  font-weight: bold;
  font-size: 7pt;
}
.delivery-row .val {
  flex: 1;
  font-size: 7.5pt;
  word-break: break-all;
}
.return-badge {
  display: inline-block;
  background: #fff3e0;
  border: 1px solid #ff9800;
  border-radius: 2px;
  padding: 0 3px;
  font-size: 6.5pt;
  color: #e65100;
  font-weight: bold;
}
.no-delivery-msg {
  text-align: center;
  color: #888;
  font-size: 12px;
  padding: 20px 0;
}

/* ── 拠点リスト（右パネル） ── */
.ref-panel { flex-shrink: 0; }
.ref-table {
  border-collapse: collapse;
  font-size: 7.5pt;
  white-space: nowrap;
}
.ref-table th,
.ref-table td {
  border: 1px solid #aaa;
  padding: 0 4px;
  height: 14px;
  line-height: 14px;
}
.ref-table th { background: #e0e0e0; text-align: center; }
.ref-table td.col-no   { width: 22px; text-align: center; background: #fffde7; font-weight: bold; }
.ref-table td.col-name { width: 88px; text-align: left; padding-left: 4px; font-weight: bold; }
.ref-table td.col-sp   { width: 72px; text-align: center; font-size: 7pt; color: #333; }

/* ── シート4：仕込みタブ ── */
.kawari-box {
  background: var(--color-bg, #fff);
  border: 0.5px solid #bbb;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.kawari-title {
  font-size: 12px;
  font-weight: bold;
  color: #555;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.kawari-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.kawari-sep {
  font-size: 12px;
  font-weight: bold;
  padding-bottom: 4px;
  border-bottom: 0.5px solid #ddd;
  margin-bottom: 6px;
}
.kawari-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 6px;
}
.kawari-lbl { font-size: 11px; color: #777; }
.kawari-item select {
  padding: 5px 8px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-family: inherit;
  font-size: 13px;
}
.kawari-footer {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.save-badge {
  font-size: 11px;
  color: #388e3c;
  display: none;
  align-items: center;
  gap: 3px;
}
.kaito-box {
  background: var(--color-bg, #fff);
  border: 0.5px solid #bbb;
  border-radius: 8px;
  padding: 10px 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.kaito-title {
  font-size: 12px;
  font-weight: bold;
  color: #555;
  white-space: nowrap;
}
.kaito-items {
  display: flex;
  gap: 0;
  flex: 1;
}
.kaito-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
.kaito-main  { font-size: 20px; font-weight: bold; color: #1a3c5e; }
.kaito-actual { font-size: 12px; color: #888; }
.kaito-sub   { font-size: 11px; color: #888; margin-top: 1px; }
.kaito-divider {
  width: 0.5px;
  background: #ddd;
  align-self: stretch;
  margin: 2px 8px;
}
.kaito-total .kaito-main { color: #c62828; }
.s4-section-title {
  font-size: 12px;
  font-weight: bold;
  color: #555;
  margin-bottom: 8px;
}
.prep-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 0.5px solid #bbb;
  border-radius: 6px;
  overflow: hidden;
}
.prep-table th {
  background: #f5f5f5;
  font-size: 11px;
  font-weight: bold;
  color: #666;
  padding: 6px 12px;
  text-align: left;
  border-bottom: 0.5px solid #ccc;
}
.prep-table th.r { text-align: right; }
.prep-table td {
  padding: 7px 12px;
  font-size: 13px;
  border-bottom: 0.5px solid #eee;
}
.prep-table td.r {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.prep-table tr:last-child td { border-bottom: none; }
.pack-val { font-weight: bold; }
.pack-ceil { font-size: 11px; color: #888; margin-left: 4px; }

/* ── 発注タブ ── */
.order-ctrl { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.order-week-btn {
  padding: 4px 13px;
  border: 1px solid #64b5f6;
  border-radius: 14px;
  background: transparent;
  color: #90caf9;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: background 0.15s;
}
.order-week-btn:hover { background: rgba(100,181,246,0.15); }
.order-date-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.order-date-lbl {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 11px;
  border: 1px solid #aaa;
  border-radius: 14px;
  cursor: pointer;
  font-size: 12px;
  user-select: none;
  transition: background 0.12s, color 0.12s;
}
.order-date-lbl:hover { border-color: #64b5f6; }
.order-date-lbl.checked { background: #1565c0; color: #fff; border-color: #1565c0; font-weight: bold; }
.order-date-lbl input { display: none; }
.order-sel-info { font-size: 12px; color: #555; margin-bottom: 10px; min-height: 18px; }
.order-vendor-list { display: flex; flex-direction: column; gap: 10px; }
.order-vendor-card { border: 2px solid #bbb; border-radius: 6px; overflow: hidden; background: white; }
.order-vendor-head {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  gap: 8px;
}
.order-vendor-name { font-size: 13px; font-weight: bold; flex: 1; }
.order-vendor-summary { font-size: 11px; opacity: 0.85; font-weight: normal; }
.order-done-wrap { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.order-done-cb { width: 15px; height: 15px; cursor: pointer; accent-color: #fff; }
.order-copy-btn {
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px solid white;
  background: rgba(255,255,255,0.15);
  color: white;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: background 0.12s;
}
.order-copy-btn:hover { background: rgba(255,255,255,0.3); }
.order-vendor-body { padding: 10px 14px; }
.order-vendor-card.collapsed .order-vendor-body { display: none; }
.order-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }
.order-table th, .order-table td { padding: 5px 8px; border: 0.5px solid #ddd; }
.order-table th { background: rgba(0,0,0,0.04); font-weight: bold; font-size: 12px; }
.order-table td.order-qty { font-size: 15px; font-weight: bold; text-align: right; width: 30%; }
.order-bd-toggle {
  font-size: 11px;
  color: #1565c0;
  cursor: pointer;
  padding: 2px 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: none;
  background: none;
  font-family: inherit;
  margin-top: 4px;
}
.order-bd-toggle:hover { text-decoration: underline; }
.order-breakdown { display: none; margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px; }
.order-breakdown.open { display: block; }
.order-bd-row {
  display: flex;
  gap: 6px;
  padding: 3px 0;
  border-bottom: 1px dotted #eee;
  font-size: 11px;
}
.order-bd-row:last-child { border-bottom: none; }
.order-bd-date { color: #555; min-width: 80px; flex-shrink: 0; }
.order-bd-items { flex: 1; color: #333; }
/* 業者カラー */
.ovc-red    { border-color: #c62828; }
.ovc-red    .order-vendor-head { background: #c62828; color: white; }
.ovc-blue   { border-color: #1565c0; }
.ovc-blue   .order-vendor-head { background: #1565c0; color: white; }
.ovc-orange { border-color: #e65100; }
.ovc-orange .order-vendor-head { background: #e65100; color: white; }
.ovc-brown  { border-color: #4e342e; }
.ovc-brown  .order-vendor-head { background: #4e342e; color: white; }
.ovc-purple { border-color: #6a1b9a; }
.ovc-purple .order-vendor-head { background: #6a1b9a; color: white; }
.ovc-teal   { border-color: #00695c; }
.ovc-teal   .order-vendor-head { background: #00695c; color: white; }
.ovc-gray   { border-color: #546e7a; }
.ovc-gray   .order-vendor-head { background: #546e7a; color: white; }
.order-vendor-card.done { opacity: 0.55; }

/* ── シート3：2便盛り出し コンテナ ── */
.sheet3-container {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sheet3-matrix {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  align-items: start;
}
.sheet3-delivery {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}

/* ── 画面表示：配分表・盛り出し表を画面いっぱいに ── */
@media screen {
  /* テーブルを横幅いっぱいに伸ばす */
  #tab-sheet1 .matrix-table,
  #tab-sheet2 .matrix-table,
  #tab-sheet3 .matrix-table {
    width: 100%;
    font-size: 13px;
  }
  #tab-sheet1 .matrix-table th,
  #tab-sheet1 .matrix-table td,
  #tab-sheet2 .matrix-table th,
  #tab-sheet2 .matrix-table td,
  #tab-sheet3 .matrix-table th,
  #tab-sheet3 .matrix-table td {
    height: 28px;
    line-height: 28px;
    padding: 0 6px;
  }
  /* 商品名セル：表示名が収まるよう内容なりの幅に */
  #tab-sheet1 .matrix-table td.cell-name,
  #tab-sheet2 .matrix-table td.cell-name,
  #tab-sheet3 .matrix-table td.cell-name {
    width: auto;
    min-width: 110px;
    font-size: 13px;
  }
  /* セクション見出し行（白米／玄米）も拡大 */
  #tab-sheet1 .matrix-table td.cell-section-rice,
  #tab-sheet1 .matrix-table td.cell-section-brown,
  #tab-sheet2 .matrix-table td.cell-section-rice,
  #tab-sheet2 .matrix-table td.cell-section-brown,
  #tab-sheet3 .matrix-table td.cell-section-rice,
  #tab-sheet3 .matrix-table td.cell-section-brown {
    font-size: 14px;
    height: 32px;
    line-height: 32px;
  }
  /* シート1：右の拠点リストも合わせて拡大 */
  #tab-sheet1 .ref-table { font-size: 12px; }
  #tab-sheet1 .ref-table th,
  #tab-sheet1 .ref-table td { height: 26px; line-height: 26px; }
  #tab-sheet1 .ref-table td.col-name { width: 130px; }
  #tab-sheet1 .ref-table td.col-sp   { width: 90px; font-size: 11px; }
  /* シート3：配達カードを画面では少し見やすく */
  #tab-sheet3 .delivery-card .delivery-body { font-size: 11px; }
  #tab-sheet3 .delivery-row .lbl { font-size: 10px; width: 42px; }
  #tab-sheet3 .delivery-row .val { font-size: 11px; }
}

/* ── 印刷スタイル ── */
@media print {
  /* ── 色を維持 ── */
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  body { background: white; padding: 0; margin: 0; }

  /* 画面用UIを全て非表示 */
  .app-header, .tab-bar, .ctrl-bar, .legend { display: none !important; }
  .tab-pane { display: none !important; }

  .page-title {
    font-size: 13pt;
    font-weight: bold;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  /* 竹・松を印刷でもはっきり区別（緑／紫） */
  .cell-take,
  .delivery-header.grade-take,
  .grade-badge.grade-take      { background: #a5d6a7 !important; }
  .cell-matsu,
  .delivery-header.grade-matsu,
  .grade-badge.grade-matsu     { background: #ce93d8 !important; }
  /* ════════ シート1：縦用紙上で横長に回転（A案） ════════ */
  #tab-sheet1.active {
    display: block !important;
    padding: 2mm;
    position: absolute;
    top: 0;
    left: 0;
    width: 291mm;     /* 横向きの幅＝用紙の縦-余白 */
    height: 204mm;    /* 横向きの高さ＝用紙の横-余白 */
    transform-origin: top left;
    transform: rotate(-90deg) translateX(-100%);
  }
  #tab-sheet1 .sheet1-content {
    display: flex;
    gap: 4px;
    align-items: flex-start;
  }
  #tab-sheet1 .table-wrap {
    flex: 0 0 auto;
    overflow: visible;
    min-width: 0;
  }
  #tab-sheet1 .ref-panel { flex: 0 0 auto; }
  #tab-sheet1 .matrix-table { font-size: 9.5pt; }
  /* データセル：2文字基準の正方形（24×24px）・数字を大きく */
  #tab-sheet1 .matrix-table th,
  #tab-sheet1 .matrix-table td {
    width: 24px;
    height: 24px;
    line-height: 24px;
    padding: 0;
  }
  /* 商品名セル：固定幅・はみ出しは切り詰め */
  #tab-sheet1 .matrix-table th:first-child,
  #tab-sheet1 .matrix-table td.cell-name {
    width: 60px;
    max-width: 60px;
    height: 24px;
    line-height: 24px;
    padding: 0 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #tab-sheet1 .ref-table { font-size: 8pt; }
  #tab-sheet1 .ref-table th,
  #tab-sheet1 .ref-table td {
    height: 14px;
    line-height: 14px;
  }

  /* ════════ シート2：縦用紙上で横長に回転（A案） ════════ */
  #tab-sheet2.active {
    display: block !important;
    padding: 2mm;
    position: absolute;
    top: 0;
    left: 0;
    width: 291mm;     /* 横向きの幅＝用紙の縦-余白 */
    height: 204mm;    /* 横向きの高さ＝用紙の横-余白 */
    transform-origin: top left;
    transform: rotate(-90deg) translateX(-100%);
  }
  /* 白米｜玄米｜配達カード を 5fr 5fr 2.5fr 横並び（引き伸ばしなし） */
  #tab-sheet2 .sheet2-container {
    display: grid;
    grid-template-columns: 5fr 5fr 2.5fr;
    gap: 5px;
    align-items: start;
  }
  #tab-sheet2 .table-wrap { overflow: visible; min-width: 0; }
  /* マトリクスは引き伸ばさず自然な高さ */
  #tab-sheet2 .matrix-table {
    width: auto;
    font-size: 9pt;
  }
  /* データセル・拠点列・計列：39×33px に統一・数字13pt */
  #tab-sheet2 .matrix-table th,
  #tab-sheet2 .matrix-table td {
    width: 39px;
    height: 33px;
    line-height: 33px;
    padding: 0;
    font-size: 13pt;
  }
  /* 商品名セル：66px固定・はみ出しは切り詰め（高さはデータセルに追従） */
  #tab-sheet2 .matrix-table th:first-child,
  #tab-sheet2 .matrix-table td.cell-name {
    width: 66px;
    max-width: 66px;
    height: 33px;
    line-height: 33px;
    padding: 0 4px;
    font-size: 9pt;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 空の配達列（その表に数量が1つも無い列）は印刷時のみ非表示 */
  #tab-sheet2 .matrix-table .col-empty-print { display: none; }
  /* セクション見出し行（白米／玄米）は横いっぱい・固定高 */
  #tab-sheet2 .matrix-table td.cell-section-rice,
  #tab-sheet2 .matrix-table td.cell-section-brown {
    width: auto;
    height: 20px;
    line-height: 20px;
    font-size: 9.5pt;
  }
  /* 配達カードエリア：自然流し */
  #tab-sheet2 .delivery-area {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #tab-sheet2 .delivery-card { overflow: hidden; }

  /* ════════ シート3：A4縦（前チャット実装済み・維持／用紙既定が縦） ════════ */
  #tab-sheet3.active {
    display: flex !important;
    flex-direction: column;
    width: 204mm;     /* ← 追加：A4縦の有効幅を明示してブラウザ自動スケール防止 */
    height: 285mm;
    padding: 2mm;
    box-sizing: border-box;
    overflow: hidden;
  }
  #tab-sheet3 .sheet3-container { flex: 1; min-height: 0; gap: 4px; }
  /* マトリクス並びを grid から flex に変更（テーブルが押し縮められないように） */
  #tab-sheet3 .sheet3-matrix {
    display: flex !important;
    flex-direction: row;
    gap: 4px;
    align-items: flex-start;
    flex: 2;
    min-height: 0;
  }
  #tab-sheet3 .sheet3-delivery { flex: 1; min-height: 0; }
  #tab-sheet3 .table-wrap {
    flex: 0 0 auto;
    overflow: visible;
    min-width: 0;
  }
  #tab-sheet3 .delivery-card { overflow: hidden; }
  /* マトリクスはシート2より一回り大きく（コンテンツ少なくてもページに見映えするよう調整） */
  #tab-sheet3 .matrix-table {
    width: auto;
    font-size: 11pt;
  }
  /* データセル・計列：50×42px・数字16pt */
  #tab-sheet3 .matrix-table th,
  #tab-sheet3 .matrix-table td {
    width: 50px;
    height: 42px;
    line-height: 42px;
    padding: 0;
    font-size: 16pt;
  }
  /* 商品名セル：84px固定・はみ出しは切り詰め（高さはデータセルに追従） */
  #tab-sheet3 .matrix-table th:first-child,
  #tab-sheet3 .matrix-table td.cell-name {
    width: 84px;
    max-width: 84px;
    height: 42px;
    line-height: 42px;
    padding: 0 4px;
    font-size: 11pt;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* セクション見出し行（白米／玄米）は横いっぱい・固定高 */
  #tab-sheet3 .matrix-table td.cell-section-rice,
  #tab-sheet3 .matrix-table td.cell-section-brown {
    width: auto;
    height: 26px;
    line-height: 26px;
    font-size: 12pt;
  }

  /* ════════ シート4・発注：縦流し（維持） ════════ */
  #tab-sheet4.active,
  #tab-order.active {
    display: block !important;
    padding: 2mm;
  }
  #tab-sheet4 .kawari-box,
  #tab-sheet4 .kaito-box { page-break-inside: avoid; }
}

<script>

// 設定

const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkcAI-Nkl3aoUZKgluss5AawPDc7aluPokONkYz6f2ikwl0S487JvhKdKh6QSp1xhEhA/exec';

// ★ 単価マスタの「カテゴリー」列の実値に合わせて変更してください
const CATEGORY_COLOR = {
  '海苔弁系': 'blue',
  '満腹系':   'green',
  '全六':     'yellow',
  '他社商品': 'yellow',
  '全':       'yellow',
};

// カテゴリー未設定時のフォールバック（商品名パターン）
const NAME_COLOR_RULES = [
  { re: /^(あいもり|銀鮭|塩麹|照り焼き|鯖から|アジフライ|柚子焼き|マグロ|あさひめ)/, color: 'blue' },
  { re: /^(メンチ|カレー|満腹)/,                                                        color: 'green' },
];

// グレード（日本語） → CSS クラス
function gradeClassOf(g) {
  if (g == null) return '';
  const s = String(g).trim().toLowerCase();
  if (s.indexOf('松') >= 0 || s.indexOf('matsu') >= 0) return 'matsu';
  if (s.indexOf('竹') >= 0 || s.indexOf('take')  >= 0) return 'take';
  if (s.indexOf('梅') >= 0 || s.indexOf('ume')   >= 0) return 'ume';
  return '';
}
function gradeLabelJa(g) {
  const c = gradeClassOf(g);
  if (c === 'matsu') return '松';
  if (c === 'take')  return '竹';
  if (c === 'ume')   return '梅';
  return '—';
}

function getColor(category, baseName) {
  if (category && CATEGORY_COLOR[category]) return CATEGORY_COLOR[category];
  for (const rule of NAME_COLOR_RULES) {
    if (rule.re.test(baseName)) return rule.color;
  }
  return 'yellow';
}

const s4Status = document.getElementById('s4-status-msg');

  s4Status.textContent = msg;

}

document.getElementById('s4-btn-fetch').addEventListener('click', fetchSheet4);

async function fetchSheet4() {
  const dateVal = document.getElementById('s4-date-input').value;
  if (!dateVal) { s4SetStatus('日付を選択してください', true); return; }
  s4SetStatus('取得中…');
  document.getElementById('sheet4-body').innerHTML = '';
  try {
    // ① 保存済み日替わり選択を取得
    const kRes  = await fetch(GAS_URL + '?action=getKawariSelections&date=' + dateVal);
    const kData = await kRes.json();
    const kawari = (kData.ok && kData.selections) ? kData.selections : {};

    // ② 仕込み表データを取得
    const kawariJson = encodeURIComponent(JSON.stringify(kawari));
    const res  = await fetch(GAS_URL + '?action=getSheet4Data&date=' + dateVal + '&kawari=' + kawariJson);

    s4SetStatus('');
    renderSheet4(data);

    // 保存済みバッジを表示（選択が1件でもあれば）
    const hasSelection = Object.values(kawari).some(v => v !== '');

  } catch(e) {
    s4SetStatus('通信エラー: ' + e.message, true);
  }
}

async function onS4KawariSave() {
  const dateVal    = document.getElementById('s4-date-input').value;
  const selections = getS4KawariSelections();
  s4SetStatus('保存中…');
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveKawariSelections', date: dateVal, selections })
    });
    showS4SavedBadge(dateVal);

    // 仕込み表を選択内容で再計算
    const kawariJson = encodeURIComponent(JSON.stringify(selections));
    const res  = await fetch(GAS_URL + '?action=getSheet4Data&date=' + dateVal + '&kawari=' + kawariJson);
    const data = await res.json();
    if (!data.ok) { s4SetStatus(data.error || '更新エラー', true); return; }
    s4SetStatus('');
    renderSheet4(data);
    showS4SavedBadge(dateVal);
  } catch(e) {
    s4SetStatus('通信エラー: ' + e.message, true);
  }
}

function getS4KawariSelections() {
  return {
    '全六あり主菜1': document.getElementById('s4-zr-s1') ? document.getElementById('s4-zr-s1').value : '',

function renderSheet1(data) {
  const body = document.getElementById('sheet1-body');
  const { dateLabel, locations, rice, brown, subtotalSplit } = data;
  const locIds = locations.map(l => l.id);

  function buildTableHTML(rows, isBrown) {
    if (!rows || rows.length === 0) return '';
    const sectionClass = isBrown ? 'cell-section-brown' : 'cell-section-rice';
    const sectionLabel = isBrown ? '▼ 玄米' : '▼ 白米';
    const rowClass     = isBrown ? 'brown-row' : '';
    const colspan      = 1 + locIds.length + 1 + 1;

    let html = '';
    html += `<tr><td colspan="${colspan}" class="${sectionClass}">${sectionLabel}</td></tr>`;
    html += '<tr>';
    html += '<th style="width:82px;text-align:left;padding-left:5px;">商品</th>';
    locIds.forEach((lid, idx) => {
      const loc   = locations.find(l => l.id === lid);
      const name  = loc ? loc.name : lid;
      const short = name.slice(0, 2);   // 列見出し＝拠点名の先頭2文字
      if (idx === subtotalSplit) {
        html += `<th class="cell-sub" title="中間計(前${subtotalSplit}拠点)">中計</th>`;
      }
      html += `<th title="${name}">${short}</th>`;
    });
    html += '<th class="cell-tot">合計</th>';
    html += '</tr>';

    rows.forEach(row => {
      if (!row.total) return;
      const color  = getColor(row.category, row.baseName);
      const trCls  = `g-${color}${rowClass ? ' ' + rowClass : ''}`;
      html += `<tr class="${trCls}">`;
      html += `<td class="cell-name">${escHtml(row.baseName)}</td>`;
      locIds.forEach((lid, idx) => {
        if (idx === subtotalSplit) {
          html += `<td class="cell-sub">${row.subtotal || ''}</td>`;
        }
        const q = row.byLocation[lid];
        html += `<td class="cell-data">${q ? q : ''}</td>`;
      });
      html += `<td class="cell-tot">${row.total || ''}</td>`;
      html += '</tr>';
    });

    return html;
  }

  const tableHTML = '<table class="matrix-table">'
    + buildTableHTML(rice,  false)
    + buildTableHTML(brown, true)
    + '</table>';

  let refHTML = '<table class="ref-table">'
    + '<tr><th class="col-name">拠点名</th><th class="col-sp">販売員名</th></tr>';
  locations.forEach((loc) => {
    refHTML += `<tr>`
      + `<td class="col-name">${escHtml(loc.name)}</td>`
      + `<td class="col-sp">${escHtml(loc.salesPerson || '')}</td>`
      + `</tr>`;
  });
  refHTML += '</table>';

  body.innerHTML = `
    <div class="page-title">📋 ${escHtml(dateLabel)}　拠点配分表</div>
    <div class="sheet1-content">
      <div class="table-wrap">${tableHTML}</div>
      <div class="ref-panel">${refHTML}</div>
    </div>`;
}

function renderSheet2(data) {
  const body = document.getElementById('sheet2-body');
  const { dateLabel, deliveries, rice, brown } = data;
  const dCount = deliveries.length;

  // ── マトリクス HTML 構築 ──
  function buildMatrixHTML(rows, isBrown) {
    const sectionClass = isBrown ? 'cell-section-brown' : 'cell-section-rice';
    const sectionLabel = isBrown ? '▼ 玄米' : '▼ 白米';
    const rowClass     = isBrown ? ' brown-row' : '';
    const colspan      = 1 + 1 + dCount + 1; // 商品名 + 拠点合計 + N配達 + 計

    // この表に数量が1つも無い配達列を判定（印刷時のみ非表示・列番号は元のまま維持）
    const activeRows = (rows || []).filter(r => r.total);
    const colEmpty = [];
    for (let d = 0; d < dCount; d++) {
      colEmpty[d] = !activeRows.some(r => r.deliveryQtys[d] > 0);
    }
    const colEmptyCls = d => colEmpty[d] ? ' col-empty-print' : '';

    let html = '<thead>';
    html += `<tr><td colspan="${colspan}" class="${sectionClass}">${sectionLabel}</td></tr>`;
    html += '<tr>';
    html += '<th style="text-align:left;padding-left:5px;min-width:80px;">商品</th>';
    html += '<th class="cell-kyoten">拠点</th>';
    for (let d = 0; d < dCount; d++) {
      const tip = escHtml(deliveries[d].address || deliveries[d].orderNum);
      html += `<th title="${tip}" class="${colEmptyCls(d).trim()}" style="min-width:20px;">${d + 1}</th>`;
    }
    html += '<th class="cell-tot">計</th>';
    html += '</tr></thead><tbody>';

    activeRows.forEach(row => {
      const color  = getColor(row.category, row.baseName);
      const trCls  = `g-${color}${rowClass}`;
      html += `<tr class="${trCls}">`;
      html += `<td class="cell-name">${escHtml(row.baseName)}</td>`;
      html += `<td class="cell-kyoten">${row.kyotenTotal || ''}</td>`;

      for (let d = 0; d < dCount; d++) {
        const qty  = row.deliveryQtys[d];
        const ohm  = row.deliveryOhm[d];
        const gc   = gradeClassOf(deliveries[d].grade)
        const bgCls = (qty > 0 && gc) ? `cell-${gc}` : '';
        const txt  = qty ? (ohm ? `<span class="ohm">${qty}</span>` : qty) : '';
        html += `<td class="${(bgCls + colEmptyCls(d)).trim()}">${txt}</td>`;
      }
      html += `<td class="cell-tot">${row.total || ''}</td>`;
      html += '</tr>';
    });

    html += '</tbody>';
    return html;
  }

  const riceHTML  = '<table class="matrix-table">' + buildMatrixHTML(rice,  false) + '</table>';
  const brownHTML = '<table class="matrix-table">' + buildMatrixHTML(brown, true)  + '</table>';

  // ── 配達カード HTML 構築 ──
  let cardsHTML = '';

  if (dCount === 0) {
    cardsHTML = '<div class="no-delivery-msg">本日の1便配達データはありません</div>';
  } else {
    deliveries.forEach(d => {
      const gc      = gradeClassOf(d.grade) ? `grade-${gradeClassOf(d.grade)}` : 'grade-empty';
      const addrFull = d.address + (d.detail ? '　' + d.detail : '');
      const returnBadge = d.hasReturn
        ? `<span class="return-badge">🔄 回収 ${d.returnTime || ''}</span>`
        : '';

      cardsHTML += `
        <div class="delivery-card">
          <div class="delivery-header ${gc}">
            <span>配達 ${d.n}</span>
            <span class="grade-badge grade-${gradeClassOf(d.grade) || 'empty'}">${gradeLabelJa(d.grade)}</span>
          </div>
          <div class="delivery-body">
            <div class="delivery-row">
              <span class="lbl">時間</span>
              <span class="val">${escHtml(d.time)}</span>
            </div>
            <div class="delivery-row">
              <span class="lbl">届先</span>
              <span class="val">${escHtml(addrFull)}</span>
            </div>
            ${d.contact ? `<div class="delivery-row"><span class="lbl">担当</span><span class="val">${escHtml(d.contact)}</span></div>` : ''}
            ${d.note ? `<div class="delivery-row"><span class="lbl">備考</span><span class="val">${escHtml(d.note)}</span></div>` : ''}
            ${d.hasReturn ? `<div class="delivery-row"><span class="lbl">回収</span><span class="val">${returnBadge}</span></div>` : ''}
          </div>
        </div>`;
    });
  }

  // ── 組み合わせ ──
  body.innerHTML = `
    <div class="page-title">📋 ${escHtml(dateLabel)}　1便盛り出し表（配達 ${dCount} 件）</div>
    <div class="sheet2-container">
      <div class="table-wrap">${riceHTML}</div>
      <div class="table-wrap">${brownHTML}</div>
      <div class="delivery-area">${cardsHTML}</div>
    </div>`;
}

  // ── 組み合わせ ──

// 選択日セット
const orderSelectedDates = new Set();

// 日付チェックボックス初期化（翌日から10平日分 = 今週+来週）
function initOrderDateChecks() {
  const jst = new Date(new Date().getTime() + 9 * 60 * 60 * 1000);
  const DOW = ['日','月','火','水','木','金','土'];
  const row = document.getElementById('order-date-row');
  row.innerHTML = '';
  orderSelectedDates.clear();

  // 翌日から14日先まで走査して平日を収集
  let weekCounter = 0; // 0=今週, 1=来週
  let prevMonday = null;
  for (let i = 1; i <= 14; i++) {
    const d = new Date(jst);
    d.setDate(d.getDate() + i);
    const dow = d.getDay();
    if (dow === 0 || dow === 6) continue;
    // 月曜日が来たら週番号を上げる
    if (dow === 1) {
      if (prevMonday !== null) weekCounter++;
      prevMonday = d.toISOString().slice(0, 10);
    } else if (prevMonday === null) {
      // 今週の途中から始まる場合
      weekCounter = 0;
    }
    const dateStr = d.toISOString().slice(0, 10);
    const m = d.getMonth() + 1, day = d.getDate();
    const wn = weekCounter;

    const lbl = document.createElement('label');
    lbl.className = 'order-date-lbl';
    lbl.dataset.date = dateStr;
    lbl.dataset.week = wn;
    lbl.innerHTML = `<input type="checkbox" value="${dateStr}"> ${m}/${day}(${DOW[dow]})`;
    lbl.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) { orderSelectedDates.add(dateStr); lbl.classList.add('checked'); }
      else { orderSelectedDates.delete(dateStr); lbl.classList.remove('checked'); }
    });
    row.appendChild(lbl);
  }
}

function orderSelectWeek(wn) {
  document.querySelectorAll('#order-date-row .order-date-lbl').forEach(lbl => {
    const cb = lbl.querySelector('input');
    const dateStr = lbl.dataset.date;
    if (parseInt(lbl.dataset.week) === wn) {
      cb.checked = true; orderSelectedDates.add(dateStr); lbl.classList.add('checked');
    } else {
      cb.checked = false; orderSelectedDates.delete(dateStr); lbl.classList.remove('checked');
    }
  });
}

const orderStatus = document.getElementById('order-status-msg');
function orderSetStatus(msg, isErr) {
  orderStatus.textContent = msg;
  orderStatus.className = 'status-msg' + (isErr ? ' err' : '');
}

document.getElementById('order-btn-fetch').addEventListener('click', fetchOrderData);

document.getElementById('order-btn-week1').addEventListener('click', () => orderSelectWeek(1));

async function fetchOrderData() {
  const dates = Array.from(orderSelectedDates).sort();
  if (dates.length === 0) { orderSetStatus('日付を1日以上選択してください', true); return; }
  orderSetStatus('取得中…');
  document.getElementById('order-body').innerHTML = '';
  try {
    const res  = await fetch(GAS_URL + '?action=getOrderData&dates=' + encodeURIComponent(JSON.stringify(dates)));
    const data = await res.json();
    if (!data.ok) { orderSetStatus(data.error || '取得エラー', true); return; }
    orderSetStatus('');
    loadOrderDoneFlags(dates.join('_'));
    renderOrderData(data);
  } catch(e) {
    orderSetStatus('通信エラー: ' + e.message, true);
  }
}

function renderOrderData(data) {
  const { dates, vendors, dailyBreakdown } = data;
  const DOW = ['日','月','火','水','木','金','土'];

  const datesLabel = dates.map(d => {
    const dt = new Date(d.replace(/-/g, '/'));
    return `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
  }).join('・');
  document.getElementById('order-sel-info').textContent = `選択中：${datesLabel}（${dates.length}日分合計）`;

  const body = document.getElementById('order-body');
  if (!vendors || vendors.length === 0) {
    body.innerHTML = '<div class="placeholder-msg">発注データがありません<br><small>食材マスタと単価マスタの食材ID列を確認してください</small></div>';
    return;
  }

  let html = '';
  vendors.forEach(v => {
    const cc    = getVendorColorClass(v.name);
    const safeN = v.name.replace(/[^\w\u3000-\u9FFF]/g, '_'); // CSSセーフなID用
    const isDone = _orderDoneFlags[v.name] || false;

    // 食材テーブル
    const rows = v.items.map(it =>
      `<tr><td>${escHtml(it.name)}</td><td class="order-qty">${it.packCeil} パック</td></tr>`
    ).join('');

    // 日別内訳
    const bdId = 'order-bd-' + safeN;
    let bdRows = '';
    dates.forEach(d => {
      const dayItems = (dailyBreakdown[d] || []).filter(it => it.vendorName === v.name);
      if (!dayItems.length) return;
      const dt = new Date(d.replace(/-/g, '/'));
      const lbl = `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
      const items = dayItems.map(it => `${escHtml(it.name)} ${it.packCeil}P`).join(' / ');
      bdRows += `<div class="order-bd-row"><span class="order-bd-date">${lbl}</span><span class="order-bd-items">${items}</span></div>`;
    });
    const bdSection = bdRows
      ? `<button class="order-bd-toggle" onclick="toggleOrderBd('${bdId}')"><span id="${bdId}-arrow">▶</span> 日別内訳</button>
         <div class="order-breakdown" id="${bdId}">${bdRows}</div>`
      : '';

    html += `
      <div class="order-vendor-card ${cc}${isDone ? ' done' : ''}" id="ovc-${safeN}">
        <div class="order-vendor-head" onclick="toggleOrderCard('${safeN}')">
          <span class="order-vendor-name">${escHtml(v.name)}</span>
          <span class="order-vendor-summary">（${v.items.length}品目）</span>
          <div style="display:flex;align-items:center;gap:8px;margin-left:auto;" onclick="event.stopPropagation()">
            <label class="order-done-wrap">
              <input type="checkbox" class="order-done-cb" data-vendor="${escHtml(v.name)}"
                ${isDone ? 'checked' : ''} onchange="onOrderDone('${escHtml(v.name)}',this.checked)">
              発注済み
            </label>
            <button class="order-copy-btn" onclick="copyOrderText('${escHtml(v.name)}')">📋 コピー</button>
          </div>
        </div>
        <div class="order-vendor-body" id="ovcb-${safeN}">
          <table class="order-table">
            <thead><tr><th style="text-align:left">食材名</th><th style="text-align:right;width:30%">発注量</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${bdSection}
        </div>
      </div>`;
  });
  body.innerHTML = html;
  window._orderData = data;
}

function toggleOrderCard(safeN) {
  const body = document.getElementById('ovcb-' + safeN);
  if (body) body.style.display = body.style.display === 'none' ? '' : 'none';
}

function toggleOrderBd(bdId) {
  const el    = document.getElementById(bdId);
  const arrow = document.getElementById(bdId + '-arrow');
  if (!el) return;
  el.classList.toggle('open');
  if (arrow) arrow.textContent = el.classList.contains('open') ? '▼' : '▶';
}

function onOrderDone(vendorName, checked) {
  _orderDoneFlags[vendorName] = checked;
  saveOrderDoneFlags();
  const safeN = vendorName.replace(/[^\w\u3000-\u9FFF]/g, '_');
  const card  = document.getElementById('ovc-' + safeN);
  if (card) card.classList.toggle('done', checked);
}

function copyOrderText(vendorName) {
  const data = window._orderData;
  if (!data) return;
  const vendor = data.vendors.find(v => v.name === vendorName);
  if (!vendor) return;
  const DOW = ['日','月','火','水','木','金','土'];
  const datesStr = data.dates.map(d => {
    const dt = new Date(d.replace(/-/g, '/'));
    return `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
  }).join('・');

  const lines = [vendorName + ' 発注 ' + datesStr, ''];
  vendor.items.forEach(it => lines.push(`${it.name}\t${it.packCeil}パック`));
  const text = lines.join('\n');

  navigator.clipboard.writeText(text).then(
    () => { orderSetStatus(vendorName + ' のコピー完了'); setTimeout(() => orderSetStatus(''), 2500); },
    () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); orderSetStatus(vendorName + ' のコピー完了'); setTimeout(() => orderSetStatus(''), 2500); }
      catch(e2) { orderSetStatus('コピー失敗', true); }
      finally { document.body.removeChild(ta); }
    }
  );
}

// localStorage 読込
function bmLoadEdits() {
  try {
    const raw = localStorage.getItem(BM_LS_KEY);
    bmEditsCache = raw ? JSON.parse(raw) : {};
  } catch(e) { bmEditsCache = {}; }
}
function bmSaveEdits() {
  try { localStorage.setItem(BM_LS_KEY, JSON.stringify(bmEditsCache)); } catch(e) {}
}
function bmGetEdit(dayId, pid, lid) {
  return (bmEditsCache[dayId] && bmEditsCache[dayId][pid + '_' + lid] !== undefined)
    ? bmEditsCache[dayId][pid + '_' + lid] : null;
}
function bmSetEdit(dayId, pid, lid, val) {
  if (!bmEditsCache[dayId]) bmEditsCache[dayId] = {};
  if (val === null || val === undefined) {
    delete bmEditsCache[dayId][pid + '_' + lid];
  } else {
    bmEditsCache[dayId][pid + '_' + lid] = val;
  }
  bmSaveEdits();
}
function bmClearEditsForLoc(dayId, lid) {
  if (!bmEditsCache[dayId]) return;
  const keys = Object.keys(bmEditsCache[dayId]);
  for (const k of keys) {
    if (k.endsWith('_' + lid)) delete bmEditsCache[dayId][k];
  }
  bmSaveEdits();
}

// 完売増量
function bmGetSelloutBonus(timeStr) {
  if (!timeStr) return 0;
  const s = String(timeStr).substring(0,5);
  for (const r of BM_SELLOUT_RULES) {
    if (s >= r.from && s <= r.to) return r.bonus;
  }
  return 0;
}

// 確定状態：拠点の全商品でG列に値があるか（cell.confirmed が null でない）
function bmIsLocConfirmed(lid) {
  if (!bmServerData) return false;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  for (const p of products) {
    const c = bmServerData.cells[p.id + '_' + lid];
    if (!c) continue;
    if (c.confirmed === null || c.confirmed === undefined) return false;
  }
  return true;
}
function bmIsAllConfirmed() {
  if (!bmServerData) return false;
  for (const loc of bmServerData.locations) {
    if (!bmIsLocConfirmed(loc.id)) return false;
  }
  return true;
}

// セルの「表示する販売数」を取得（編集値 > サーバーweekSales）
function bmGetDisplaySales(pid, lid) {
  const edit = bmGetEdit(bmCurrentDay, pid, lid);
  if (edit !== null && edit !== undefined && edit !== '') return Number(edit);
  if (!bmServerData) return 0;
  const c = bmServerData.cells[pid + '_' + lid];
  return c ? c.weekSales : 0;
}

function bmRenderCalcInfo() {
  const el = document.getElementById('bm-calc-info');
  if (!bmServerData) { el.innerHTML = ''; return; }
  const d = BM_DAYS.find(x => x.id === bmCurrentDay);
  const w = bmServerData.weights;
  let confirmedCount = 0;
  for (const loc of bmServerData.locations) if (bmIsLocConfirmed(loc.id)) confirmedCount++;
  let selloutCount = 0, diffCount = 0;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  for (const loc of bmServerData.locations) {
    for (const p of products) {
      const c = bmServerData.cells[p.id + '_' + loc.id];
      if (!c) continue;
      if (c.selloutTime) selloutCount++;
      const sales = bmGetDisplaySales(p.id, loc.id);
      if (c.proposed !== sales && c.proposed > 0) diffCount++;
    }
  }
  let html = '';
  html += `<span><b>計算式:</b> W1:${w.w1} / W2:${w.w2} / W3:${w.w3} / W4:${w.w4}</span>`;
  if (bmServerData.isPastOrToday) {
    html += `<span><b>今週${d.label}:</b> ${bmServerData.thisWeekDate} 実績</span>`;
  } else {
    html += `<span><b>今週${d.label}:</b> ${bmServerData.thisWeekDate} <span style="color:#999;">未計上(先週分グレー)</span></span>`;
  }
  html += `<span><b>反映先:</b> ${bmServerData.nextReflectDate}</span>`;
  html += `<span class="bm-diff-summary">変動: ${diffCount}件</span>`;
  html += `<span class="bm-sellout-summary">🔴 完売: ${selloutCount}件</span>`;
  html += `<span class="bm-progress-summary">確定: ${confirmedCount}/${bmServerData.locations.length}拠点</span>`;
  el.innerHTML = html;
}

function bmRenderMatrix() {
  const wrap = document.getElementById('bm-matrix-wrap');
  if (!bmServerData) { wrap.innerHTML = '<div class="bm-loading">読み込み中...</div>'; return; }
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const totalCols = 1 + bmServerData.locations.length + 1;
  let html = '<table class="bm-matrix">';
  html += '<thead><tr>';
  html += '<th rowspan="2" class="bm-product-cell">商品名</th>';
  for (const loc of bmServerData.locations) {
    const cf = bmIsLocConfirmed(loc.id) ? 'bm-loc-confirmed-h' : '';
    html += `<th class="bm-loc-id-h ${cf}">${loc.no}</th>`;
  }
  html += '<th rowspan="2" class="bm-total-col">合計</th></tr><tr>';
  for (const loc of bmServerData.locations) {
    const cf = bmIsLocConfirmed(loc.id) ? 'bm-loc-confirmed-h' : '';
    html += `<th class="bm-loc-name-h ${cf}">${bmEscape(loc.name)}</th>`;
  }
  html += '</tr></thead>';

  // 白米
  html += '<tbody>';
  html += `<tr><td class="bm-section-label" colspan="${totalCols}">▼ 白米</td></tr>`;
  for (const p of bmServerData.products.rice) html += bmRenderRow(p);
  html += '</tbody>';
  // 玄米
  html += '<tbody class="bm-brown">';
  html += `<tr><td class="bm-section-label bm-brown-label" colspan="${totalCols}">▼ 玄米</td></tr>`;
  for (const p of bmServerData.products.brown) html += bmRenderRow(p);
  html += '</tbody>';

  // 拠点合計
  html += '<tbody>';
  html += '<tr class="bm-summary-row"><td class="bm-product-cell">拠点合計</td>';
  let grand = 0;
  for (const loc of bmServerData.locations) {
    let sum = 0;
    for (const p of products) sum += bmGetDisplaySales(p.id, loc.id);
    grand += sum;
    const cf = bmIsLocConfirmed(loc.id) ? 'bm-loc-confirmed' : '';
    html += `<td class="${cf}">${sum}</td>`;
  }
  html += `<td class="bm-total-col">${grand}</td></tr>`;

  // カテゴリ別合計
  for (const cat of BM_CATEGORIES) html += bmRenderCategoryRow(cat);

  // 確定ボタン行
  html += '<tr class="bm-loc-confirm-row"><td class="bm-product-cell">確定</td>';
  for (const loc of bmServerData.locations) {
    const isC = bmIsLocConfirmed(loc.id);
    const cls = isC ? 'bm-loc-confirm-btn bm-done' : 'bm-loc-confirm-btn';
    const txt = isC ? '✓' : '確定';
    html += `<td><button class="${cls}" data-lid="${loc.id}" onclick="bmConfirmLoc('${loc.id}')">${txt}</button></td>`;
  }
  html += `<td class="bm-total-col">—</td></tr>`;

  // 推奨ボタン行
  html += '<tr class="bm-loc-recommend-row"><td class="bm-product-cell">推奨</td>';
  for (const loc of bmServerData.locations) {
    const isC = bmIsLocConfirmed(loc.id);
    const dis = isC ? 'disabled' : '';
    html += `<td><button class="bm-loc-recommend-btn" data-lid="${loc.id}" onclick="bmRecommendLoc('${loc.id}')" ${dis} title="提案値を採用+確定">→推奨</button></td>`;
  }
  html += `<td class="bm-total-col">—</td></tr>`;
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function bmRenderRow(p) {
  let html = `<tr><td class="bm-product-cell">${bmEscape(p.name)}</td>`;
  let total = 0;
  for (const loc of bmServerData.locations) {
    total += bmGetDisplaySales(p.id, loc.id);
    html += bmRenderCell(p.id, loc.id);
  }
  html += `<td class="bm-total-col">${total}</td></tr>`;
  return html;
}

function bmRenderCell(pid, lid) {
  const c = bmServerData.cells[pid + '_' + lid];
  if (!c) return '<td class="bm-data-cell"></td>';
  const sales = bmGetDisplaySales(pid, lid);
  const pro = c.proposed;
  const diff = pro - sales;
  const isLocC = bmIsLocConfirmed(lid);
  const hasSO = !!c.selloutTime;
  const isZero = !pro && !sales;
  const edit = bmGetEdit(bmCurrentDay, pid, lid);
  const isEdited = (edit !== null && edit !== undefined);

  let cls = 'bm-data-cell';
  if (isLocC) cls += ' bm-loc-confirmed';
  if (isZero) cls += ' bm-zero-cell';

  let salesCls = 'bm-cell-sales';
  if (c.isFallback && !isEdited) salesCls += ' bm-fallback';
  if (isEdited) salesCls += ' bm-edited';
  if (!sales && !isZero) salesCls += ' bm-no-sales';
  if (isZero) salesCls += ' bm-no-sales';

  const proStr = pro || '–';
  const salStr = (sales || sales === 0) && pro ? String(sales) : (sales ? String(sales) : '–');

  let ind = '';
  if (diff > 0 && pro > 0) ind = '<span class="bm-ind-up">▲</span>';
  else if (diff < 0 && pro > 0) ind = '<span class="bm-ind-down">▼</span>';
  const badge = hasSO ? '<span class="bm-sellout-badge"></span>' : '';

  const editable = !isZero;
  const editAttrs = editable
    ? `contenteditable="true" inputmode="numeric" data-pid="${pid}" data-lid="${lid}" onkeydown="bmOnSalesKey(event)" onblur="bmOnSalesBlur(this)" onfocus="bmOnSalesFocus(this)"`
    : '';
  const proClick = isZero ? '' : `onclick="bmOpenModal('${pid}','${lid}')"`;

  return `<td class="${cls}">
    <div class="bm-cell-2col">${badge}<div class="${salesCls}" ${editAttrs}>${salStr}</div><div class="bm-cell-proposal" ${proClick}>${proStr}${ind}</div></div>
  </td>`;
}

function bmRenderCategoryRow(cat) {
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  let html = `<tr class="bm-cat-row"><td class="bm-product-cell bm-cat-label">${cat.label}</td>`;
  let totalNext = 0, totalSales = 0;
  for (const loc of bmServerData.locations) {
    let sumP = 0, sumS = 0;
    for (const p of products) {
      if (p.group !== cat.id) continue;
      const c = bmServerData.cells[p.id + '_' + loc.id];
      if (!c) continue;
      sumP += c.proposed;
      sumS += bmGetDisplaySales(p.id, loc.id);
    }
    totalNext += sumP;
    totalSales += sumS;
    const isC = bmIsLocConfirmed(loc.id);
    const isZero = !sumP && !sumS;
    let cls = 'bm-cat-cell';
    if (isC) cls += ' bm-loc-confirmed';
    if (isZero) cls += ' bm-cat-cell-zero';
    html += `<td class="${cls}"><div class="bm-cat-cell-actual">${sumS || '–'}</div><div class="bm-cat-cell-next">${sumP || '–'}</div></td>`;
  }
  html += `<td class="bm-total-col"><div class="bm-cat-cell-actual">${totalSales}</div><div class="bm-cat-cell-next">${totalNext}</div></td></tr>`;
  return html;
}

function bmUpdateConfirmAllBtn() {
  const btn = document.getElementById('bm-confirm-all');
  if (!btn) return;
  if (bmIsAllConfirmed()) {
    btn.classList.add('bm-done');
    btn.textContent = '✓ 全拠点確定済（クリックで解除）';
  } else {
    btn.classList.remove('bm-done');
    btn.textContent = '✓ 全拠点確定';
  }
}
function bmUpdateSubtitle() {
  const d = BM_DAYS.find(x => x.id === bmCurrentDay);
  const el = document.getElementById('bm-subtitle');
  if (!el || !bmServerData) { if(el) el.textContent = '読み込み中...'; return; }
  const r = bmServerData.products.rice.length;
  const b = bmServerData.products.brown.length;
  el.textContent = `${d.label}曜 / ${bmServerData.locations.length}拠点 × ${r+b}SKU`;
}

// 編集ハンドラ
function bmOnSalesFocus(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  if (el.classList.contains('bm-fallback')) el.textContent = '';
}
function bmOnSalesKey(e) {
  const allowed = /^[0-9]$/.test(e.key) || ['Backspace','Delete','Tab','ArrowLeft','ArrowRight'].includes(e.key);
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Escape') { e.target.blur(); return; }
  if (!allowed) e.preventDefault();
}
function bmOnSalesBlur(el) {
  const pid = el.dataset.pid;
  const lid = el.dataset.lid;
  const raw = (el.textContent || '').trim();
  const c = bmServerData.cells[pid + '_' + lid];
  if (raw === '') {
    bmSetEdit(bmCurrentDay, pid, lid, null);
  } else {
    const v = parseInt(raw, 10);
    if (isNaN(v) || v < 0) {
      bmSetEdit(bmCurrentDay, pid, lid, null);
    } else {
      // 元値と同じなら編集解除
      const orig = c ? c.weekSales : 0;
      if (v === orig) bmSetEdit(bmCurrentDay, pid, lid, null);
      else bmSetEdit(bmCurrentDay, pid, lid, v);
    }
  }
  bmRenderMatrix();
  bmRenderCalcInfo();
}

// 内訳モーダル
function bmOpenModal(pid, lid) {
  const c = bmServerData.cells[pid + '_' + lid];
  if (!c || (!c.proposed && !c.weekSales)) return;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const p = products.find(x => x.id === pid);
  const loc = bmServerData.locations.find(x => x.id === lid);
  const d = BM_DAYS.find(x => x.id === bmCurrentDay);
  const isBrown = bmServerData.products.brown.some(b => b.id === pid);
  const productLabel = isBrown ? `${p.name}(玄米)` : `${p.name}(白米)`;
  const hasSO = !!c.selloutTime;

  document.getElementById('bm-modal-title').textContent = `${productLabel} @ ${loc.name}`;
  document.getElementById('bm-modal-subtitle').textContent = `${d.label}曜 / 翌週提案の計算内訳`;
  const head = document.getElementById('bm-modal-head');
  head.classList.toggle('bm-has-sellout', hasSO);

  const histLabels = ['先週','2週前','3週前','4週前'];
  let histHtml = '<table class="bm-modal-history-table">';
  for (let i = 0; i < 4; i++) {
    const h = c.hist[i];
    const isSO = (i === 0 && hasSO);
    const trCls = isSO ? 'bm-is-sellout' : '';
    const mark = isSO ? `<span class="bm-sellout-mark-inline">🔴 ${c.selloutTime}完売</span>` : '';
    histHtml += `<tr class="${trCls}"><td class="bm-h-label">${histLabels[i]}<br><span style="font-size:7.5pt;color:#888;font-weight:normal;">${h.date}</span></td><td class="bm-h-value">${h.value}個 ${mark}</td></tr>`;
  }
  histHtml += '</table>';

  const w = bmServerData.weights;
  const wAvg = c.weightedAvg.toFixed(1);
  let calcHtml = '<div class="bm-modal-calc">';
  calcHtml += `<div class="bm-modal-calc-row"><span class="bm-modal-calc-label">加重平均(W1:${w.w1}/W2:${w.w2}/W3:${w.w3}/W4:${w.w4})</span><span class="bm-modal-calc-value">${wAvg}個</span></div>`;
  if (hasSO) {
    calcHtml += `<div class="bm-modal-calc-row"><span class="bm-modal-calc-label">🔴 完売増量(${c.selloutTime})</span><span class="bm-modal-calc-value bm-bonus">+${c.selloutBonus}個</span></div>`;
  } else {
    calcHtml += `<div class="bm-modal-calc-row" style="color:#999;"><span class="bm-modal-calc-label">完売増量</span><span class="bm-modal-calc-value">+0個</span></div>`;
  }
  calcHtml += `<div class="bm-modal-calc-row bm-final ${hasSO ? 'bm-has-sellout' : ''}"><span class="bm-modal-calc-label">翌週提案</span><span class="bm-modal-calc-value bm-final-value ${hasSO ? 'bm-has-sellout' : ''}">${c.proposed}個</span></div>`;
  calcHtml += '</div>';
  if (hasSO) {
    calcHtml += `<div class="bm-modal-note">💡 完売は<b>直近の同曜日のみ</b>翌週に加算されます。それ以前の完売は加重平均に反映済のため追加加算しません。</div>`;
  }

  let weekInfo = '';
  if (c.isFallback) {
    weekInfo = `<div class="bm-modal-note" style="background:#eceff1;border-left-color:#90a4ae;">📅 今週${d.label}曜(${bmServerData.thisWeekDate})は<b>未計上</b>のため、参考として先週${d.label}曜の販売数(${c.hist[0].value}個)を表示しています。</div>`;
  } else {
    const sales = bmGetDisplaySales(pid, lid);
    const edit = bmGetEdit(bmCurrentDay, pid, lid);
    const tag = (edit !== null && edit !== undefined) ? '(編集中)' : '';
    weekInfo = `<div class="bm-modal-note" style="background:#e3f2fd;border-left-color:#1976d2;">📊 今週${d.label}曜(${bmServerData.thisWeekDate})の販売数: <b>${sales}個</b>${tag}</div>`;
  }

  let body = weekInfo;
  body += `<div class="bm-modal-section"><div class="bm-modal-section-title">📅 過去4週の${d.label}曜販売実績</div>${histHtml}</div>`;
  body += `<div class="bm-modal-section"><div class="bm-modal-section-title">🧮 計算内訳</div>${calcHtml}</div>`;
  document.getElementById('bm-modal-body').innerHTML = body;
  document.getElementById('bm-modal-overlay').classList.add('bm-show');
}
function bmCloseModal(e) {
  if (e && e.target.id !== 'bm-modal-overlay' && e.type !== undefined) return;
  document.getElementById('bm-modal-overlay').classList.remove('bm-show');
}

// 操作
async function bmSetDay(dayId) {
  if (dayId === bmCurrentDay && bmServerData) return;
  bmCurrentDay = dayId;
  await bmLoadDay(dayId);
}

async function bmLoadDay(dayId) {
  const wrap = document.getElementById('bm-matrix-wrap');
  wrap.innerHTML = '<div class="bm-loading">基本数マスタを読み込み中...</div>';
  document.getElementById('bm-calc-info').innerHTML = '';
  const r = await bmFetchMatrix(dayId);
  if (!r.ok) {
    wrap.innerHTML = `<div class="bm-error">取得エラー: ${bmEscape(r.error || '不明')}</div>`;
    return;
  }
  bmServerData = r;
  bmLoadedDays.add(dayId);
  bmRenderAll();
}

async function bmReload() {
  await bmLoadDay(bmCurrentDay);
}

// 確定／推奨／全拠点確定
async function bmConfirmLoc(lid) {
  if (!bmServerData) return;
  if (bmIsLocConfirmed(lid)) {
    // 解除
    const locName = (bmServerData.locations.find(l => l.id === lid) || {}).name || lid;
    if (!confirm(`${locName} の確定を解除しますか？\n(G列をクリアします)`)) return;
    const r = await bmPostAction('unconfirmBasicMasterLocation', { dayId: bmCurrentDay, locId: lid });
    if (!r.ok) { alert('解除失敗: ' + (r.error || '')); return; }
    await bmLoadDay(bmCurrentDay);
    return;
  }
  // 確定：編集値を items に集約
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const items = {};
  for (const p of products) {
    const e = bmGetEdit(bmCurrentDay, p.id, lid);
    if (e !== null && e !== undefined) items[p.id] = Number(e);
  }
  const r = await bmPostAction('confirmBasicMasterLocation', { dayId: bmCurrentDay, locId: lid, items });
  if (!r.ok) { alert('確定失敗: ' + (r.error || '')); return; }
  // 編集値クリア（G列に反映済）
  bmClearEditsForLoc(bmCurrentDay, lid);
  await bmLoadDay(bmCurrentDay);
}

async function bmRecommendLoc(lid) {
  if (!bmServerData) return;
  const locName = (bmServerData.locations.find(l => l.id === lid) || {}).name || lid;
  if (!confirm(`${locName} の全商品を提案値で確定します。編集値があれば破棄されます。よろしいですか？`)) return;
  const r = await bmPostAction('recommendBasicMasterLocation', { dayId: bmCurrentDay, locId: lid });
  if (!r.ok) { alert('推奨失敗: ' + (r.error || '')); return; }
  bmClearEditsForLoc(bmCurrentDay, lid);
  await bmLoadDay(bmCurrentDay);
}

async function bmConfirmAll() {
  if (!bmServerData) return;
  if (bmIsAllConfirmed()) {
    if (!confirm(`${bmCurrentDay}曜の全25拠点の確定を解除しますか？\n(G列をすべてクリアします)`)) return;
    // 全拠点の G列クリア（順次）
    for (const loc of bmServerData.locations) {
      await bmPostAction('unconfirmBasicMasterLocation', { dayId: bmCurrentDay, locId: loc.id });
    }
    bmEditsCache[bmCurrentDay] = {};
    bmSaveEdits();
    await bmLoadDay(bmCurrentDay);
    return;
  }
  if (!confirm(`${bmCurrentDay}曜の全25拠点を確定します。\n(編集値あれば編集値、なければ提案値をG列に保存)\nよろしいですか？`)) return;
  // 編集値を itemsByLoc に集約
  const itemsByLoc = {};
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  for (const loc of bmServerData.locations) {
    const locItems = {};
    for (const p of products) {
      const e = bmGetEdit(bmCurrentDay, p.id, loc.id);
      if (e !== null && e !== undefined) locItems[p.id] = Number(e);
    }
    if (Object.keys(locItems).length > 0) itemsByLoc[loc.id] = locItems;
  }
  const r = await bmPostAction('confirmBasicMasterAll', { dayId: bmCurrentDay, itemsByLoc });
  if (!r.ok) { alert('全拠点確定失敗: ' + (r.error || '')); return; }
  bmEditsCache[bmCurrentDay] = {};
  bmSaveEdits();
  await bmLoadDay(bmCurrentDay);
}

function bmEscape(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

// 初期化（tab-master を開いた時にトリガー）
function bmInitIfNeeded() {
  if (bmInitialized) return;
  bmInitialized = true;
  bmLoadEdits();
  bmRenderDayTabs();
  // 今日の曜日に自動で合わせる（土日は月曜）
  const dow = new Date().getDay();
  const map = { 0:'mon', 1:'mon', 2:'tue', 3:'wed', 4:'thu', 5:'fri', 6:'mon' };
  bmCurrentDay = map[dow] || 'mon';
  bmLoadDay(bmCurrentDay);
}

// タブ切替フック：master タブを開いたら初期化
document.querySelectorAll('.tab-btn').forEach(btn => {
  if (btn.dataset.tab === 'master') {
    btn.addEventListener('click', () => { bmInitIfNeeded(); });
  }
});

// ESC でモーダル閉じる
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') bmCloseModal();
});

</script>
</body>
</html>
