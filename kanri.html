<style id="app-style">
/* @page は全環境で確実に効く静的指定（用紙＝縦）。横向きはシート1・2をCSS回転で実現（A案） */
@page { size: A4; margin: 3mm; }
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

body {
  font-family: 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: 13px;
  background: #f5f5f5;
  color: #212121;
}

/* ── ヘッダー ── */
.app-header {
  background: #1a3c5e;
  color: white;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header h1 { font-size: 15px; font-weight: bold; }

/* ── タブバー ── */
.tab-bar {
  background: #1a3c5e;
  border-bottom: 2px solid #0d2a42;
  display: flex;
  padding: 0 8px;
  position: sticky;
  top: 37px;
  z-index: 99;
  /* v3.28: スマホで横にはみ出した分は白背景に乗らずスクロールで見せる */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;       /* Firefox: スクロールバー非表示 */
  -ms-overflow-style: none;    /* IE/Edge: 同上 */
}
.tab-bar::-webkit-scrollbar { display: none; }  /* Chrome/Safari: 同上 */
.tab-btn {
  padding: 7px 14px;
  color: rgba(255,255,255,0.65);
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  flex: 0 0 auto;   /* v3.28: 縮小させずサイズ維持（横スクロール用） */
  transition: color 0.15s;
}
.tab-btn:hover { color: rgba(255,255,255,0.9); }
.tab-btn.active { color: #fff; border-bottom-color: #64b5f6; font-weight: bold; }
.tab-btn:disabled { color: rgba(255,255,255,0.3); cursor: default; }

/* ── タブコンテンツ ── */
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.active { display: block; }
.placeholder-msg { text-align: center; padding: 60px; color: #888; font-size: 15px; }

/* ── コントロールバー（共通） ── */
.ctrl-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.ctrl-bar label { font-size: 12px; color: #555; }
.ctrl-bar input[type="date"] {
  padding: 4px 8px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-family: inherit;
  font-size: 13px;
}
.btn {
  padding: 5px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
}
.btn-primary { background: #1a3c5e; color: white; }
.btn-primary:hover { background: #274f7a; }
.btn-print { background: #546e7a; color: white; }
.btn-print:hover { background: #607d8b; }

.status-msg {
  font-size: 12px;
  color: #888;
  margin-left: 4px;
}
.status-msg.err { color: #c62828; }

/* ── シート1 コンテンツ ── */
.sheet1-content {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

/* ── テーブルエリア（共通） ── */
.table-wrap { overflow-x: auto; flex: 1; min-width: 0; }

.page-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

/* ── メインテーブル（共通） ── */
.matrix-table {
  border-collapse: collapse;
  font-size: 7.5pt;
  white-space: nowrap;
}
.matrix-table th,
.matrix-table td {
  border: 1px solid #888;
  padding: 0 3px;
  text-align: center;
  height: 14px;
  line-height: 14px;
  min-width: 22px;
}
.matrix-table th {
  background: #e0e0e0;
  font-weight: bold;
}

/* 商品名セル */
.matrix-table td.cell-name {
  text-align: left;
  padding: 0 5px;
  width: 82px;
  background: #f5f5f5;
  font-weight: bold;
}

/* 数値セル（全シート共通でボールド） */
.matrix-table td { font-weight: bold; }

/* 中間計・合計 */
.matrix-table td.cell-sub  { background: #e8eaf6; font-weight: bold; }
.matrix-table td.cell-tot  { background: #c5cae9; font-weight: bold; }
.matrix-table th.cell-sub  { background: #c5cae9; }
.matrix-table th.cell-tot  { background: #9fa8da; color: #fff; }

/* 拠点合計（シート2用） */
.matrix-table th.cell-kyoten { background: #c5cae9; }
.matrix-table td.cell-kyoten { background: #e8eaf6; font-weight: bold; }

/* セクションラベル行 */
.matrix-table td.cell-section-rice {
  background: #424242; color: white;
  font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px;
  height: 16px; line-height: 16px;
}
.matrix-table td.cell-section-brown {
  background: #5d4037; color: white;
  font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px;
  height: 16px; line-height: 16px;
}
.matrix-table td.cell-section-cat {
  background: #1565c0; color: white;
  font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px;
  height: 16px; line-height: 16px;
}
.matrix-table tr.cat-row td { background:#e3f2fd; font-weight:bold; }
.matrix-table tr.cat-row td.cat-label { background:#fff3e0; text-align:left; padding-left:5px; }
.matrix-table tr.cat-grand td { background:#fce4ec; font-weight:bold; }
.matrix-table tr.cat-grand td.cat-label { background:#f8bbd0; text-align:left; padding-left:5px; }

/* 商品グループ色（白米） */
.matrix-table tr.g-blue  td.cell-data { background: #e3f2fd; }
.matrix-table tr.g-green td.cell-data { background: #e8f5e9; }
.matrix-table tr.g-yel   td.cell-data { background: #fff9c4; }

/* 商品グループ色（玄米） */
.matrix-table tr.g-blue.brown-row  td.cell-data { background: #fff3e0; }
.matrix-table tr.g-green.brown-row td.cell-data { background: #ffe0b2; }
.matrix-table tr.g-yel.brown-row   td.cell-data { background: #ffcc80; }

/* ─────────────────────────────────────────
   拠点グループ区切り線（v3.9 NEW 2026-05-25）
   1-12: 3拠点ごと / 13-14: 2拠点 / 15以降: 4拠点ごと
   ───────────────────────────────────────── */
/* sheet1 拠点配分タブ（matrix-table）：列方向の縦線 */
.matrix-table th.cell-bold-boundary,
.matrix-table td.cell-bold-boundary {
  border-right: 3px solid #000 !important;
}
/* ref-panel（拠点名右側パネル）：行方向の横線 */
.ref-table tr.cell-bold-boundary-row td {
  border-bottom: 3px solid #000 !important;
}

/* ── シート2：グレード配色（配達列セル背景） ── */
.cell-ume   { background: #ffffff !important; }
.cell-take  { background: #c8e6c9 !important; }
.cell-matsu { background: #d1c4e9 !important; }
.ohm        { color: #c62828; font-weight: bold; }

/* 凡例 */
.legend {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 10px;
  margin-left: 8px;
}
.legend-item {
  display: inline-block;
  padding: 1px 8px;
  border: 1px solid #888;

/* ── シート2：3エリアレイアウト ── */

  .grade-badge.grade-matsu { background: #d1c4e9; }

  border: 0.5px solid #bbb;
  border-radius: 8px;
  padding: 10px 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
}
/* ── 米セクション（解凍の上、最も目立つ位置） ── */
.rice-box {
  background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
  border: 2px solid #f9a825;
  border-radius: 10px;
  padding: 12px 18px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 18px;
  box-shadow: 0 2px 6px rgba(249,168,37,0.25);
}
.rice-title {
  font-size: 22px;
  font-weight: bold;
  color: #e65100;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.rice-items {
  display: flex;
  gap: 18px;
  flex: 1;
}
.rice-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  background: rgba(255,255,255,0.7);
  border-radius: 8px;
  padding: 8px 6px;
  border: 1px solid rgba(249,168,37,0.4);
}
.rice-name {
  font-size: 16px;
  font-weight: bold;
  color: #5d4037;
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.rice-order {
  font-size: 24px;
  font-weight: bold;
  color: #bf360c;
  line-height: 1.1;
}
.rice-order-sub { font-size: 12px; color: #6d4c41; margin-top: 1px; }
.rice-amount {
  font-size: 14px;
  font-weight: bold;
  color: #4e342e;
  margin-top: 4px;
}
.rice-pack {
  font-size: 18px;
  font-weight: bold;
  color: #1565c0;
  margin-top: 2px;
}
.rice-pack-sub { font-size: 11px; color: #888; font-weight: normal; }
.kaito-title {
  font-size: 12px;
  font-weight: bold;
  color: #555;
  white-space: nowrap;
}
.kaito-items {
  display: flex;
  gap: 0;
  flex: 1;
}
.kaito-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
.kaito-main  { font-size: 20px; font-weight: bold; color: #1a3c5e; }
.kaito-actual { font-size: 12px; color: #888; }
.kaito-sub   { font-size: 11px; color: #888; margin-top: 1px; }
.kaito-divider {
  width: 0.5px;
  background: #ddd;
  align-self: stretch;
  margin: 2px 8px;
}
.kaito-total .kaito-main { color: #c62828; }
.s4-section-title {
  font-size: 12px;
  font-weight: bold;
  color: #555;
  margin-bottom: 8px;
}
.prep-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 0.5px solid #bbb;
  border-radius: 6px;
  overflow: hidden;
}
.prep-table th {
  background: #f5f5f5;
  font-size: 11px;
  font-weight: bold;
  color: #666;
  padding: 6px 12px;
  text-align: left;
  border-bottom: 0.5px solid #ccc;
}
.prep-table th.r { text-align: right; }
.prep-table td {
  padding: 7px 12px;
  font-size: 13px;
  border-bottom: 0.5px solid #eee;
}
.prep-table td.r {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.prep-table tr:last-child td { border-bottom: none; }
.pack-val { font-weight: bold; }
.pack-ceil { font-size: 11px; color: #888; margin-left: 4px; }
  .prep-list {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 8px 0;
}
.prep-header {
  background: #e3f2fd;
  padding: 8px 14px;
  font-weight: bold;
  font-size: 15px;
  color: #1565c0;
  border-top: 1px solid #bbdefb;
  border-bottom: 1px solid #bbdefb;
  margin-top: 6px;
}
.prep-header:first-child { margin-top: 0; }
.prep-portion {
  margin-left: 6px;
  font-size: 13px;
  color: #555;
  font-weight: normal;
}
.prep-ing {
  padding: 4px 14px 4px 32px;
  font-size: 14px;
  display: grid;
  grid-template-columns: 1fr 100px 60px;
  gap: 12px;
  align-items: center;
  border-bottom: 1px dotted #f0f0f0;
}
.prep-ing-name { color: #333; }
.prep-ing-amt {
  font-family: 'Courier New', monospace;
  color: #1565c0;
  font-weight: bold;
  text-align: right;
}
.prep-ing-pack {
  font-family: 'Courier New', monospace;
  color: #666;
  text-align: right;
}
.prep-direct-section {
  background: #fff3e0;
  padding: 6px 14px;
  font-weight: bold;
  color: #e65100;
  margin-top: 12px;
  border-top: 2px solid #ffb74d;
  border-bottom: 1px solid #ffb74d;
  text-align: center;
  font-size: 13px;
}
.prep-direct {
  padding: 6px 14px;
  font-size: 14px;
  display: grid;
  grid-template-columns: 1fr 80px 80px 80px;
  gap: 8px;
  align-items: center;
  border-bottom: 1px dotted #f0f0f0;
}
.prep-direct-name { color: #333; }
.prep-direct-order,
.prep-direct-amt,
.prep-direct-pack {
  font-family: 'Courier New', monospace;
  color: #e65100;
  font-weight: bold;
  text-align: right;
}
/* ── v3.29: 仕込み 合計/午前/午後 トグル ── */
.s4-toggle {
  display: inline-flex;
  margin: 0 0 12px;
  border: 1px solid #cfd8dc;
  border-radius: 8px;
  overflow: hidden;
  background: #f5f7f8;
}
.s4-toggle-btn {
  appearance: none;
  -webkit-appearance: none;
  border: none;
  background: transparent;
  padding: 7px 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
  color: #607d8b;
  cursor: pointer;
  border-right: 1px solid #cfd8dc;
  transition: background .12s, color .12s;
  white-space: nowrap;
}
.s4-toggle-btn:last-child { border-right: none; }
.s4-toggle-btn:hover { background: #eceff1; }
.s4-toggle-btn.active { background: #1565c0; color: #fff; }
@media print {
  .s4-toggle { display: none !important; }
  .delivery-move { display: none !important; }
}

/* ── 発注タブ ── */
.order-ctrl { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.order-week-btn {
  padding: 4px 13px;
  border: 1px solid #64b5f6;
  border-radius: 14px;
  background: transparent;
  color: #90caf9;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: background 0.15s;
}
.order-week-btn:hover { background: rgba(100,181,246,0.15); }
.order-date-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.order-date-lbl {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 11px;
  border: 1px solid #aaa;
  border-radius: 14px;
  cursor: pointer;
  font-size: 12px;
  user-select: none;
  transition: background 0.12s, color 0.12s;
}
.order-date-lbl:hover { border-color: #64b5f6; }
.order-date-lbl.checked { background: #1565c0; color: #fff; border-color: #1565c0; font-weight: bold; }
.order-date-lbl input { display: none; }
.order-date-lbl.disabled {
  background: #eee;
  color: #aaa;
  cursor: not-allowed;
  opacity: 0.6;
}
  .s4-ctrl {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.s4-week-btn {
  padding: 6px 12px;
  border: 1px solid #1976d2;
  background: #e3f2fd;
  color: #1976d2;
  cursor: pointer;
  border-radius: 4px;
  font-size: 10pt;
}
.s4-week-btn:hover { background: #bbdefb; }
 
.s4-date-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.s4-date-lbl {
  padding: 6px 10px;
  border: 1px solid #aaa;
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
  font-size: 10pt;
  background: #fafafa;

}
.s4-date-lbl:hover { border-color: #64b5f6; }
.s4-date-lbl.checked {
  background: #1565c0;
  color: #fff;
  border-color: #1565c0;

}
.s4-date-lbl.disabled {

}
.s4-date-lbl.today { border-color: #ef6c00; border-width: 2px; }
.s4-date-lbl input { display: none; }
 
.s4-sel-info {
  font-size: 9.5pt;
  color: #555;
  margin-bottom: 10px;
}
 
.s4-meta {
  font-size: 9pt;
  color: #777;
  margin: 8px 0 4px;
}
.s4-warn-box {
  background: #fff8e1;
  border: 1px solid #ffe082;
  padding: 10px 14px;
  border-radius: 4px;
  margin-top: 12px;
  font-size: 10pt;
}
.s4-warn-row {
  margin: 4px 0;
  line-height: 1.5;
  word-break: break-all;
}
.order-sel-info { font-size: 12px; color: #555; margin-bottom: 10px; min-height: 18px; }
.order-vendor-list { display: flex; flex-direction: column; gap: 10px; }
.order-vendor-card { border: 2px solid #bbb; border-radius: 6px; overflow: hidden; background: white; }
.order-vendor-head {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  gap: 8px;
}
.order-vendor-name { font-size: 13px; font-weight: bold; flex: 1; }
.order-vendor-summary { font-size: 11px; opacity: 0.85; font-weight: normal; }
.order-done-wrap { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.order-done-cb { width: 15px; height: 15px; cursor: pointer; accent-color: #fff; }
.order-copy-btn {
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px solid white;
  background: rgba(255,255,255,0.15);
  color: white;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: background 0.12s;
}
.order-copy-btn:hover { background: rgba(255,255,255,0.3); }
.order-vendor-body { padding: 10px 14px; }
.order-vendor-card.collapsed .order-vendor-body { display: none; }
.order-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }
.order-table th, .order-table td { padding: 5px 8px; border: 0.5px solid #ddd; }
.order-table th { background: rgba(0,0,0,0.04); font-weight: bold; font-size: 12px; }
.order-table td.order-need { font-size: 14px; text-align: right; width: 28%; color: #333; }
.order-table td.order-qty  { font-size: 15px; font-weight: bold; text-align: right; width: 22%; color: #0d47a1; }
/* ── 未マッピング警告エリア ── */
.order-warn-wrap {
  margin: 8px 0;
  border: 1px solid #ffcc80;
  background: #fff8e1;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12px;
}
.order-warn-head {
  font-weight: bold;
  color: #e65100;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.order-warn-body { display: none; margin-top: 6px; padding-left: 18px; }
.order-warn-body.open { display: block; }
.order-warn-section { margin-top: 6px; }
.order-warn-section:first-child { margin-top: 0; }
.order-warn-label { font-weight: bold; color: #bf360c; margin-bottom: 2px; }
.order-warn-items { color: #555; line-height: 1.5; word-break: break-all; }
.order-bd-toggle {
  font-size: 11px;
  color: #1565c0;
  cursor: pointer;
  padding: 2px 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: none;
  background: none;
  font-family: inherit;
  margin-top: 4px;
}
.order-bd-toggle:hover { text-decoration: underline; }
.order-breakdown { display: none; margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px; }
.order-breakdown.open { display: block; }
.order-bd-row {
  display: flex;
  gap: 6px;
  padding: 3px 0;
  border-bottom: 1px dotted #eee;
  font-size: 11px;
}
.order-bd-row:last-child { border-bottom: none; }
.order-bd-date { color: #555; min-width: 80px; flex-shrink: 0; }
.order-bd-items { flex: 1; color: #333; }
/* ── 定数発注セクション (v3.12) ── */
.order-constants-section { margin-top: 14px; padding-top: 12px; border-top: 2px dashed #999; }
.order-constants-head { font-weight: bold; margin-bottom: 8px; color: #1A3C5E; font-size: 14px; }
.order-constants-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.order-constants-table th, .order-constants-table td { padding: 5px 8px; border: 0.5px solid #ddd; }
.order-constants-table th { background: rgba(0,0,0,0.04); font-weight: bold; font-size: 12px; }
.order-constants-table td.const-name { text-align: left; }
.order-constants-table td.const-qty { text-align: right; width: 30%; }
.order-constants-table td.const-unit { text-align: center; width: 15%; color: #555; }
.order-constants-table input[type="number"] { width: 90px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; text-align: right; font-size: 14px; }
.order-constants-table input[type="number"]:focus { border-color: #1976d2; outline: none; box-shadow: 0 0 0 2px rgba(25,118,210,0.2); }
.order-constants-table input.saving { border-color: #ff9800; background: #fff8e1; }
.order-constants-table input.saved { border-color: #4caf50; background: #e8f5e9; transition: background 0.4s; }
/* v3.31: 定数を横に参考表示 + テンキー入力 */
.order-constants-table .const-qty-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.order-constants-table .const-ref { font-size: 11px; color: #999; white-space: nowrap; }
/* 業者カラー */

.ovc-blue   .order-vendor-head { background: #1565c0; color: white; }

/* ── シート3：2便盛り出し コンテナ ── */
.sheet3-container {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sheet3-matrix {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  align-items: start;
}
.sheet3-delivery {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}

/* ── 画面表示：配分表・盛り出し表を画面いっぱいに ── */
@media screen {
  /* テーブルを横幅いっぱいに伸ばす */
  #tab-sheet1 .matrix-table,
  #tab-sheet2 .matrix-table,
  #tab-sheet3 .matrix-table {
    width: 100%;
    font-size: 13px;
  }
  #tab-sheet1 .matrix-table th,
  #tab-sheet1 .matrix-table td,
  #tab-sheet2 .matrix-table th,
  #tab-sheet2 .matrix-table td,
  #tab-sheet3 .matrix-table th,
  #tab-sheet3 .matrix-table td {
    height: 28px;
    line-height: 28px;
    padding: 0 6px;
  }
  /* 商品名セル：表示名が収まるよう内容なりの幅に */
  #tab-sheet1 .matrix-table td.cell-name,
  #tab-sheet2 .matrix-table td.cell-name,
  #tab-sheet3 .matrix-table td.cell-name {
    width: auto;
    min-width: 110px;
    font-size: 13px;
  }
  /* セクション見出し行（白米／玄米）も拡大 */
  #tab-sheet1 .matrix-table td.cell-section-rice,
  #tab-sheet1 .matrix-table td.cell-section-brown,
  #tab-sheet2 .matrix-table td.cell-section-rice,
  #tab-sheet2 .matrix-table td.cell-section-brown,
  #tab-sheet3 .matrix-table td.cell-section-rice,
  #tab-sheet3 .matrix-table td.cell-section-brown {
    font-size: 14px;
    height: 32px;
    line-height: 32px;
  }
  /* シート1：右の拠点リストも合わせて拡大 */
  #tab-sheet1 .ref-table { font-size: 12px; }
  #tab-sheet1 .ref-table th,
  #tab-sheet1 .ref-table td { height: 26px; line-height: 26px; }
  #tab-sheet1 .ref-table td.col-name { width: 130px; }
  #tab-sheet1 .ref-table td.col-sp   { width: 90px; font-size: 11px; }
  /* シート3：配達カードを画面では少し見やすく */
  #tab-sheet3 .delivery-card .delivery-body { font-size: 11px; }
  #tab-sheet3 .delivery-row .lbl { font-size: 10px; width: 42px; }
  #tab-sheet3 .delivery-row .val { font-size: 11px; }
}

/* ── 印刷スタイル ── */
@media print {
  /* ── 色を維持 ── */
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  body { background: white; padding: 0; margin: 0; }

  /* 画面用UIを全て非表示 */
  .app-header, .tab-bar, .ctrl-bar, .legend { display: none !important; }
  .tab-pane { display: none !important; }

  /* 拠点グループ区切り線（v3.9 NEW 2026-05-25）印刷時もコントラスト維持 */
  .matrix-table th.cell-bold-boundary,
  .matrix-table td.cell-bold-boundary,
  .bm-matrix    th.cell-bold-boundary,
  .bm-matrix    td.cell-bold-boundary {
    border-right: 2.5px solid #000 !important;
  }
  .ref-table tr.cell-bold-boundary-row td {
    border-bottom: 2.5px solid #000 !important;
  }

  .page-title {
    font-size: 13pt;
    font-weight: bold;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  /* 竹・松を印刷でもはっきり区別（緑／紫） */
  .cell-take,
  .delivery-header.grade-take,
  .grade-badge.grade-take      { background: #a5d6a7 !important; }
  .cell-matsu,
  .delivery-header.grade-matsu,
  .grade-badge.grade-matsu     { background: #ce93d8 !important; }
  /* ════════ シート1：縦用紙上で横長に回転（A案） ════════ */
  #tab-sheet1.active {
    display: block !important;
    padding: 2mm;
    position: absolute;
    top: 0;
    left: 0;
    width: 291mm;     /* 横向きの幅＝用紙の縦-余白 */
    height: 204mm;    /* 横向きの高さ＝用紙の横-余白 */
    transform-origin: top left;
    transform: rotate(-90deg) translateX(-100%);
  }
  #tab-sheet1 .sheet1-content {
    display: flex;
    gap: 4px;
    align-items: flex-start;
  }
  #tab-sheet1 .table-wrap {
    flex: 0 0 auto;
    overflow: visible;
    min-width: 0;
  }
  #tab-sheet1 .ref-panel { flex: 0 0 auto; }
  #tab-sheet1 .matrix-table { font-size: 9.5pt; }
  /* データセル：2文字基準の正方形（24×24px）・数字を大きく */
  #tab-sheet1 .matrix-table th,
  #tab-sheet1 .matrix-table td {
    width: 24px;
    height: 24px;
    line-height: 24px;
    padding: 0;
  }
  /* 商品名セル：固定幅・はみ出しは切り詰め */
  #tab-sheet1 .matrix-table th:first-child,
  #tab-sheet1 .matrix-table td.cell-name {
    width: 60px;
    max-width: 60px;
    height: 24px;
    line-height: 24px;
    padding: 0 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #tab-sheet1 .ref-table { font-size: 8pt; }
  #tab-sheet1 .ref-table th,
  #tab-sheet1 .ref-table td {
    height: 14px;
    line-height: 14px;
  }

  /* ════════ シート2：縦用紙上で横長に回転（A案） ════════ */
  #tab-sheet2.active {
    display: block !important;
    padding: 2mm;
    position: absolute;
    top: 0;
    left: 0;
    width: 291mm;     /* 横向きの幅＝用紙の縦-余白 */
    height: 204mm;    /* 横向きの高さ＝用紙の横-余白 */
    transform-origin: top left;
    transform: rotate(-90deg) translateX(-100%);
  }
  /* 白米｜玄米｜配達カード を 5fr 5fr 2.5fr 横並び（引き伸ばしなし） */
  #tab-sheet2 .sheet2-container {
    display: grid;
    grid-template-columns: 5fr 5fr 2.5fr;
    gap: 5px;
    align-items: start;
  }
  #tab-sheet2 .table-wrap { overflow: visible; min-width: 0; }

<script>
'use strict';

// ─────────────────────────────────────────
// 設定
// ─────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkcAI-Nkl3aoUZKgluss5AawPDc7aluPokONkYz6f2ikwl0S487JvhKdKh6QSp1xhEhA/exec';

// ═══════════════════════════════════════════════════════════
// ドライバー色連動 Phase 4（2026-05-21 v3.4 追加）
// 拠点名セル背景色：代理 > 主担当 > 既定#E9ECEF
// データソース：?action=getLocationsWithAssignment&date=YYYY-MM-DD
// ═══════════════════════════════════════════════════════════
const DRIVER_DEFAULT_BG = '#E9ECEF';
const driverColorCache = {};  // { 'YYYY-MM-DD': { locationId: {color, name, type} } }

async function loadDriverColorMap(dateStr) {
  if (!dateStr) return {};
  if (driverColorCache[dateStr]) return driverColorCache[dateStr];
  try {
    const res  = await fetch(GAS_URL + '?action=getLocationsWithAssignment&date=' + encodeURIComponent(dateStr));
    const data = await res.json();
    if (!Array.isArray(data)) {
      console.warn('[driverColor] unexpected response:', data);
      driverColorCache[dateStr] = {};
      return {};
    }
    const map = {};
    data.forEach(item => {
      if (item && item.locationId) {
        map[item.locationId] = {
          color: item.color || '',
          name:  item.name  || '',
          type:  item.type  || '',
        };
      }
    });
    driverColorCache[dateStr] = map;
    return map;
  } catch (e) {
    console.warn('[driverColor] fetch failed:', e);
    driverColorCache[dateStr] = {};
    return {};
  }
}

// 拠点IDからinline style属性文字列を生成（先頭半角スペース含む）
// 例: ' style="background-color:#FFF0D9 !important;"'
function driverColorStyleAttr(locId, colorMap) {
  if (!colorMap) return '';
  const info = colorMap[locId];
  const color = (info && info.color) ? info.color : DRIVER_DEFAULT_BG;
  return ' style="background-color:' + color + ' !important;"';
}

// 拠点配分タブ・配分調整タブで共通利用するキャッシュ無効化
// （将来GASでマスタ更新後に呼ぶ用途）
function invalidateDriverColorCache(dateStr) {
  if (dateStr) delete driverColorCache[dateStr];
  else Object.keys(driverColorCache).forEach(k => delete driverColorCache[k]);
}

// ★ 単価マスタの「カテゴリー」列の実値に合わせて変更してください
const CATEGORY_COLOR = {
  '海苔弁系': 'blue',
  '満腹系':   'green',
  '全六':     'yellow',
  '他社商品': 'yellow',
  '全':       'yellow',
};

// カテゴリー未設定時のフォールバック（商品名パターン）
const NAME_COLOR_RULES = [
  { re: /^(あいもり|銀鮭|塩麹|照り焼き|鯖から|アジフライ|柚子焼き|マグロ|あさひめ)/, color: 'blue' },
  { re: /^(メンチ|カレー|満腹)/,                                                        color: 'green' },
];

// グレード（日本語） → CSS クラス
function gradeClassOf(g) {
  if (g == null) return '';
  const s = String(g).trim().toLowerCase();
  if (s.indexOf('松') >= 0 || s.indexOf('matsu') >= 0) return 'matsu';
  if (s.indexOf('竹') >= 0 || s.indexOf('take')  >= 0) return 'take';
  if (s.indexOf('梅') >= 0 || s.indexOf('ume')   >= 0) return 'ume';
  return '';
}
function gradeLabelJa(g) {
  const c = gradeClassOf(g);
  if (c === 'matsu') return '松';
  if (c === 'take')  return '竹';
  if (c === 'ume')   return '梅';
  return '—';
}

function getColor(category, baseName) {
  if (category && CATEGORY_COLOR[category]) return CATEGORY_COLOR[category];
  for (const rule of NAME_COLOR_RULES) {
    if (rule.re.test(baseName)) return rule.color;
  }
  return 'yellow';
}

// 複数日選択の状態管理
const s4SelectedDates = new Set();
 
// 日付チェックボックス初期化(今週月〜日 + 来週月〜日 = 14日分)
// v2.1: タイムゾーンバグ修正(UTC date算術に統一)
function initS4DateChecks() {
  const jstNow = new Date(new Date().getTime() + 9 * 60 * 60 * 1000);
  const todayStr = jstNow.toISOString().slice(0, 10);
  const [tYear, tMonth, tDay] = todayStr.split('-').map(Number);
  const todayDow = jstNow.getUTCDay();
  const daysFromMonday = (todayDow === 0) ? 6 : todayDow - 1;
  const thisMondayUtc = new Date(Date.UTC(tYear, tMonth - 1, tDay - daysFromMonday));

  const DOW = ['日','月','火','水','木','金','土'];
  const row = document.getElementById('s4-date-row');
  row.innerHTML = '';
  s4SelectedDates.clear();

  for (let i = 0; i < 14; i++) {
    const d = new Date(thisMondayUtc.getTime() + i * 86400000);
    const dateStr = d.toISOString().slice(0, 10);
    const dispDay = d.getUTCDate();
    const dispDow = d.getUTCDay();
    const isPast = dateStr < todayStr;
    const isToday = dateStr === todayStr;
    const wn = (i < 7) ? 0 : 1;

    const lbl = document.createElement('label');
    let cls = 's4-date-lbl';
    if (isPast)  cls += ' disabled';
    if (isToday) cls += ' today';
    lbl.className = cls;
    lbl.dataset.date = dateStr;
    lbl.dataset.week = wn;

    if (isPast) {
      lbl.innerHTML = `${DOW[dispDow]}${dispDay}`;
    } else {
      const checked = isToday ? ' checked' : '';
      lbl.innerHTML = `<input type="checkbox" value="${dateStr}"${checked}> ${DOW[dispDow]}${dispDay}`;
      if (isToday) {
        lbl.classList.add('checked');
        s4SelectedDates.add(dateStr);
      }
      lbl.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) {
          s4SelectedDates.add(dateStr);
          lbl.classList.add('checked');
        } else {
          s4SelectedDates.delete(dateStr);
          lbl.classList.remove('checked');
        }
        updateS4SelInfo();
      });
    }
    row.appendChild(lbl);
  }
  updateS4SelInfo();
}
 
// 週一括選択（0=今週 / 1=来週）— 過去日は除外
function s4SelectWeek(wn) {
  document.querySelectorAll('#s4-date-row .s4-date-lbl').forEach(lbl => {
    if (lbl.classList.contains('disabled')) return;
    const cb = lbl.querySelector('input');
    if (!cb) return;
    const dateStr = lbl.dataset.date;
    if (parseInt(lbl.dataset.week) === wn) {
      cb.checked = true;
      s4SelectedDates.add(dateStr);
      lbl.classList.add('checked');
    } else {
      cb.checked = false;
      s4SelectedDates.delete(dateStr);
      lbl.classList.remove('checked');
    }
  });
  updateS4SelInfo();
}
 
// 選択情報の更新表示(v2.1: UTC基準でJST日付を正しく表示)
function updateS4SelInfo() {
  const info = document.getElementById('s4-sel-info');
  const dates = Array.from(s4SelectedDates).sort();
  if (dates.length === 0) {
    info.textContent = '日付を選択して取得ボタンを押してください';
    return;
  }
  const DOW = ['日','月','火','水','木','金','土'];
  const labels = dates.map(d => {
    const [y, m, dd] = d.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, dd));
    return m + '/' + dd + '(' + DOW[dt.getUTCDay()] + ')';
  });
  info.textContent = `選択中: ${labels.join(' / ')} （${dates.length}日分）`;
}
 
// 取得ボタン押下時の処理
async function fetchSheet4() {
  const dates = Array.from(s4SelectedDates).sort();
  if (dates.length === 0) {
    s4SetStatus('日付を1日以上選択してください', true);
    return;
  }
  s4SetStatus('取得中…');
  document.getElementById('sheet4-body').innerHTML = '';
  try {
    // ① 最初の日の保存済み日替わり選択を取得
    const kRes  = await fetch(GAS_URL + '?action=getKawariSelections&date=' + dates[0]);
    const kData = await kRes.json();
    const kawari = (kData.ok && kData.selections) ? kData.selections : {};
 
    // ② 仕込み表データを取得（複数日合算）
    const kawariJson = encodeURIComponent(JSON.stringify(kawari));
    const res  = await fetch(GAS_URL + '?action=getSheet4Data&dates=' + dates.join(',') + '&kawari=' + kawariJson);
    const data = await res.json();
    if (!data.ok) {
      s4SetStatus(data.error || '取得エラー', true);
      return;
    }
    s4SetStatus('');
    renderSheet4(data);
 
    // 保存済みバッジ
    const hasSelection = Object.values(kawari).some(v => v !== '');
    if (hasSelection) showS4SavedBadge(dates[0]);
  } catch(e) {
    s4SetStatus('通信エラー: ' + e.message, true);
  }
}
 
// 日替わり保存後の再計算
async function onS4KawariSave() {
  const dates = Array.from(s4SelectedDates).sort();
  if (dates.length === 0) {
    s4SetStatus('日付を1日以上選択してください', true);
    return;
  }
  const targetDate = dates[0];   // 最初の日に保存
  const selections = getS4KawariSelections();
  s4SetStatus('保存中…');
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveKawariSelections', date: targetDate, selections })
    });
    showS4SavedBadge(targetDate);
 
    // 仕込み表を再計算
    const kawariJson = encodeURIComponent(JSON.stringify(selections));
    const res  = await fetch(GAS_URL + '?action=getSheet4Data&dates=' + dates.join(',') + '&kawari=' + kawariJson);
    const data = await res.json();
    if (!data.ok) {
      s4SetStatus(data.error || '更新エラー', true);
      return;
    }
    s4SetStatus('');
    renderSheet4(data);
    showS4SavedBadge(targetDate);
  } catch(e) {
    s4SetStatus('通信エラー: ' + e.message, true);
  }
}

function showS4SavedBadge(dateVal) {
  const badge = document.getElementById('s4-save-badge');
  if (!badge) return;
  const [y, m, dd] = dateVal.split('-').map(Number);

function buildKawariSelect(id, cands, selected) {
  // v3.13: cands は `[{id, name}, ...]` (新形式・仕込みマスタベース)
  //        後方互換: 文字列要素の場合は {id: c, name: c} として扱う
  let html = `<select id="${id}" style="padding:5px 8px;border:1px solid #bbb;border-radius:4px;font-family:inherit;font-size:13px;">`;
  html += `<option value="">-- 未選択 --</option>`;
  (cands || []).forEach(c => {
    const cid   = (typeof c === 'object' && c !== null) ? String(c.id || '')   : String(c || '');
    const cname = (typeof c === 'object' && c !== null) ? String(c.name || '') : String(c || '');
    if (!cid) return;
    const isSel = (cid === selected);
    html += `<option value="${escHtml(cid)}"${isSel ? ' selected' : ''}>${escHtml(cname)}</option>`;
  });
  html += '</select>';
  return html;
}

let s4LastData = null;
let s4Sections = null;
let s4View = 'total';   // 'total' | 'am' | 'pm'

function renderSheet4(data) {
  const body = document.getElementById('sheet4-body');
  if (!body) return;

  if (!data || !data.ok) {
    body.innerHTML = `<div class="s4-error">${escHtml(data && data.error || '取得失敗')}</div>`;
    return;
  }

  s4LastData = data;

  // セクション（後方互換: sections が無ければ合計のみを合成）
  s4Sections = data.sections || {
    total: { rows: data.rows || [], kaito: data.kaito, rice: data.rice, meta: data.meta || {} },
    am: null,
    pm: null
  };
  if (s4View === 'am' && !s4Sections.am) s4View = 'total';
  if (s4View === 'pm' && !s4Sections.pm) s4View = 'total';

  const dateLabel = (data.dateLabels || []).join(' / ');
  const dateCount = data.dateCount || 0;
  const candidates = data.candidates || {};
  const kawari = data.kawari || {};
  const warnings = data.warnings || {};

  const zrC = candidates['全六あり'] || [];
  const znC = candidates['全六なし'] || [];

  // 日替わり選択ボックス
  const kawariHTML = `
    <div class="kawari-box">
      <div class="kawari-title">🔄 当日おかず選択（日替わり）</div>
      <div class="kawari-grid">
        <div>
          <div class="kawari-sep">全六あり</div>
          <div class="kawari-item"><span class="kawari-lbl">主菜1</span>${buildKawariSelect('s4-zr-s1', zrC, kawari['全六あり主菜1'] || '')}</div>
          <div class="kawari-item"><span class="kawari-lbl">主菜2</span>${buildKawariSelect('s4-zr-s2', zrC, kawari['全六あり主菜2'] || '')}</div>
        </div>
        <div>
          <div class="kawari-sep">全六なし</div>
          <div class="kawari-item"><span class="kawari-lbl">主菜1</span>${buildKawariSelect('s4-zn-s1', znC, kawari['全六なし主菜1'] || '')}</div>
          <div class="kawari-item"><span class="kawari-lbl">主菜2</span>${buildKawariSelect('s4-zn-s2', znC, kawari['全六なし主菜2'] || '')}</div>
        </div>
      </div>
      <div class="kawari-footer">
        <button class="btn btn-primary" id="s4-kawari-save" style="font-size:12px;padding:4px 14px;">保存</button>
        <span id="s4-save-badge" class="save-badge"></span>
      </div>
    </div>`;

  // トグル（合計/午前/午後）— データが無い区分は出さない
  const segs = [{ key: 'total', label: '合計' }];
  if (s4Sections.am) segs.push({ key: 'am', label: '午前(1便)' });
  if (s4Sections.pm) segs.push({ key: 'pm', label: '午後(2便)' });
  let toggleHTML = '';
  if (segs.length > 1) {
    toggleHTML = '<div class="s4-toggle">' + segs.map(s =>
      `<button class="s4-toggle-btn${s.key === s4View ? ' active' : ''}" data-view="${s.key}">${escHtml(s.label)}</button>`
    ).join('') + '</div>';
  }

  // 選択中区分の中身（米・解凍・仕込み表）
  const sectionHTML = s4BuildSectionHTML(s4Sections[s4View] || s4Sections.total);

  // 警告（マスタ未紐付け）は合計基準で1回だけ表示
  let warnHtml = '';
  if (warnings.unmappedProducts && warnings.unmappedProducts.length > 0) {
    warnHtml = `<div class="s4-warn" style="margin-top:8px;padding:8px;background:#fff3e0;border-left:4px solid #ff9800;font-size:12px;">⚠️ 仕込みID/食材ID未紐付け商品 ${warnings.unmappedProducts.length}件:<br>`;
    warnHtml += warnings.unmappedProducts.slice(0, 20).map(escHtml).join(', ');
    if (warnings.unmappedProducts.length > 20) warnHtml += ` ...他${warnings.unmappedProducts.length - 20}件`;
    warnHtml += `</div>`;
  }

  body.innerHTML = `
    <div class="page-title">🍳 ${escHtml(dateLabel)}　仕込み表${dateCount > 1 ? ' (' + dateCount + '日分合算)' : ''}</div>
    ${kawariHTML}
    ${toggleHTML}
    <div id="s4-section-wrap">${sectionHTML}</div>
    ${warnHtml}`;

  document.getElementById('s4-kawari-save').addEventListener('click', onS4KawariSave);

  // トグル: セクション部分のみ差し替え（日替わり選択の入力状態を保持）
  document.querySelectorAll('.s4-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      s4View = btn.dataset.view;
      const wrap = document.getElementById('s4-section-wrap');
      if (wrap) wrap.innerHTML = s4BuildSectionHTML(s4Sections[s4View] || s4Sections.total);
      document.querySelectorAll('.s4-toggle-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === s4View);
      });
    });
  });
}

// セクション1区分（合計/午前/午後いずれか）の米・解凍・仕込み表HTMLを生成
function s4BuildSectionHTML(sec) {
  sec = sec || {};
  const rows = sec.rows || [];
  const kaito = sec.kaito || { cut:{display:0,packCeil:0}, full:{display:0,packCeil:0}, sum:{display:0,packCeil:0} };
  const rice = sec.rice || { hakumai: { orderCount:0, amount:0, unit:'', packCeil:0 }, genmai: { orderCount:0, amount:0, unit:'', packCeil:0 } };
  const meta = sec.meta || {};

  function fmtRiceAmount(amt, unit) {
    if (!amt) return '0' + (unit || '');
    const u = String(unit || '').trim();
    if (u === 'g' && amt >= 1000)  return (Math.round(amt / 100) / 10) + 'kg';
    if (u === 'ml' && amt >= 1000) return (Math.round(amt / 100) / 10) + 'L';
    const r = Math.round(amt * 10) / 10;
    return (r === Math.floor(r) ? String(Math.floor(r)) : r.toFixed(1)) + u;
  }

  const riceHTML = `
    <div class="rice-box">
      <span class="rice-title">🍚 米</span>
      <div class="rice-items">
        <div class="rice-item">
          <div class="rice-name">白米</div>
          <div class="rice-order">${rice.hakumai.orderCount || 0}<span class="rice-order-sub">人前</span></div>
          <div class="rice-amount">${fmtRiceAmount(rice.hakumai.amount, rice.hakumai.unit)}</div>
          <div class="rice-pack">${rice.hakumai.packCeil || 0}P<span class="rice-pack-sub">（袋）</span></div>
        </div>
        <div class="rice-item">
          <div class="rice-name">玄米</div>
          <div class="rice-order">${rice.genmai.orderCount || 0}<span class="rice-order-sub">人前</span></div>
          <div class="rice-amount">${fmtRiceAmount(rice.genmai.amount, rice.genmai.unit)}</div>
          <div class="rice-pack">${rice.genmai.packCeil || 0}P<span class="rice-pack-sub">（袋）</span></div>
        </div>
      </div>
    </div>`;

  const { cut, full, sum } = kaito;
  const kaitoHTML = `
    <div class="kaito-box">
      <span class="kaito-title">解凍</span>
      <div class="kaito-items">
        <div class="kaito-item">
          <span class="kaito-main">${cut.display}P</span>
          <span class="kaito-actual">(${cut.packCeil}P)</span>
          <span class="kaito-sub">カット</span>
        </div>
        <div class="kaito-divider"></div>
        <div class="kaito-item">
          <span class="kaito-main">${full.display}P</span>
          <span class="kaito-actual">(${full.packCeil}P)</span>
          <span class="kaito-sub">正肉</span>
        </div>
        <div class="kaito-divider"></div>
        <div class="kaito-item kaito-total">
          <span class="kaito-main">${sum.display}P</span>
          <span class="kaito-actual">(${sum.packCeil}P)</span>
          <span class="kaito-sub">合計</span>
        </div>
      </div>
    </div>`;

  let tableContent;
  if (rows.length === 0) {
    tableContent = '<div class="no-delivery-msg">この区分の仕込みデータはありません</div>';
  } else {
    let listHtml = '<div class="prep-list">';
    let directSectionStarted = false;
    rows.forEach(r => {
      if (r.type === 'shikomi_header') {
        listHtml += `<div class="prep-header">${escHtml(r.shikomiName)}<span class="prep-portion">(${r.portion}人前)</span></div>`;
      } else if (r.type === 'shikomi_ing') {
        const amt = (r.amount != null) ? (r.amount + (r.unit || '')) : '–';
        const pack = (r.packCount != null) ? (r.packCount.toFixed(1) + 'P') : '';
        listHtml += `<div class="prep-ing">
          <span class="prep-ing-name">${escHtml(r.ingName)}</span>
          <span class="prep-ing-amt">${escHtml(amt)}</span>
          <span class="prep-ing-pack">${escHtml(pack)}</span>
        </div>`;
      } else if (r.type === 'direct') {
        if (!directSectionStarted) {
          listHtml += `<div class="prep-direct-section">───── 食材直接 ─────</div>`;
          directSectionStarted = true;
        }
        const amt = (r.amount != null) ? (r.amount + (r.unit || '')) : '–';
        const pack = (r.packCount != null) ? (r.packCount.toFixed(1) + 'P') : '–';
        listHtml += `<div class="prep-direct">
          <span class="prep-direct-name">${escHtml(r.ingName)}</span>
          <span class="prep-direct-order">${r.orderCount}人前</span>
          <span class="prep-direct-amt">${escHtml(amt)}</span>
          <span class="prep-direct-pack">${escHtml(pack)}</span>
        </div>`;
      }
    });
    listHtml += '</div>';
    tableContent = listHtml;
  }

  const metaHtml = `<div class="s4-meta" style="margin-top:8px;font-size:12px;color:#666;">📊 拠点分: ${meta.kyotenItems || 0}件 / 配達分: ${meta.deliveryItems || 0}件</div>`;

  return `
    ${riceHTML}
    ${kaitoHTML}
    <div class="s4-section-title">仕込み表</div>
    ${tableContent}
    ${metaHtml}`;
}

function escHtml(str) {

// ═══════════════════════════════════════
// 拠点グループ区切り線判定（v3.9 NEW 2026-05-25）
// 拠点配分タブ・配分調整タブで使用
// グループ仕様:
//   1〜12: 3拠点ごと（3, 6, 9, 12 の右に線）
//   13, 14: 2拠点でひとくくり（14 の右に線）
//   15以降: 4拠点ごと（18, 22, 26, ... の右に線）
// @param n 拠点番号（1始まり・表示順）
// @returns {boolean} n の右側に太字区切り線を入れるなら true
// ═══════════════════════════════════════
function isBoldBoundary(n) {
  if (n >= 1 && n <= 12) {
    // 1-12: 3拠点ごと（3, 6, 9, 12 の右に線）
    return (n % 3 === 0);
  }
  if (n === 14) {
    // 13-14 の2拠点グループ終わり
    return true;
  }
  if (n >= 15) {
    // 15以降は4拠点ごと（18, 22, 26, ... の右に線）
    return ((n - 14) % 4 === 0);
  }
  return false;
}
// 便利ヘルパー：クラス文字列（先頭スペース付き／未対象なら空文字）
function boundaryCls(idx0) {
  // idx0 は 0始まりインデックス → 表示順は idx0+1
  return isBoldBoundary(idx0 + 1) ? ' cell-bold-boundary' : '';
}

const s1Status = document.getElementById('s1-status-msg');

function s1SetStatus(msg, isErr) {
  s1Status.textContent = msg;
  s1Status.className = 'status-msg' + (isErr ? ' err' : '');
}

document.getElementById('s1-btn-fetch').addEventListener('click', fetchSheet1);

async function fetchSheet1() {
  const dateVal = document.getElementById('s1-date-input').value;
  if (!dateVal) { s1SetStatus('日付を選択してください', true); return; }
  s1SetStatus('取得中…');
  document.getElementById('sheet1-body').innerHTML = '';
  try {
    // ドライバー色マップを並列取得（Phase 4）
    const [res, colorMap] = await Promise.all([
      fetch(GAS_URL + '?action=getSheet1Data&date=' + dateVal),
      loadDriverColorMap(dateVal)
    ]);
    const data = await res.json();
    if (!data.ok) { s1SetStatus(data.error || '取得エラー', true); return; }
    s1SetStatus('');
    data._driverColorMap = colorMap;
    renderSheet1(data);
  } catch(e) {
    s1SetStatus('通信エラー: ' + e.message, true);
  }
}

function renderSheet1(data) {
  const body = document.getElementById('sheet1-body');
  const { dateLabel, locations, rice, brown, subtotalSplit } = data;
  const locIds = locations.map(l => l.id);
  const colorMap = data._driverColorMap || {};  // Phase 4: ドライバー色マップ

  // お茶判定（商品名に「お茶」を含む行を除外）
  const isTea = (r) => r && r.baseName && r.baseName.indexOf('お茶') >= 0;

  // カテゴリー集計用：白米+玄米を結合してお茶を除外
  const allRows = [].concat(rice || [], brown || []).filter(r => !isTea(r));

  // シート1用カテゴリー定義（match に複数の表記揺れを許容）
  const SHEET1_CATEGORIES = [
    { label: '海苔弁系', matches: ['海苔弁系'],                   color: 'blue'   },
    { label: '満腹系',   matches: ['満腹系', '満腹シリーズ'],     color: 'green'  },
    { label: '全六',     matches: ['全六', '全'],                 color: 'yellow' },
    { label: '他社商品', matches: ['他社商品', '他社製品', 'other'], color: 'yellow' }
  ];

  function buildTableHTML(rows, isBrown) {
    if (!rows || rows.length === 0) return '';
    const sectionClass = isBrown ? 'cell-section-brown' : 'cell-section-rice';
    const sectionLabel = isBrown ? '▼ 玄米' : '▼ 白米';
    const rowClass     = isBrown ? 'brown-row' : '';
    const colspan      = 1 + locIds.length + 1 + 1;

    let html = '';
    html += `<tr><td colspan="${colspan}" class="${sectionClass}">${sectionLabel}</td></tr>`;
    html += '<tr>';
    html += '<th style="width:82px;text-align:left;padding-left:5px;">商品</th>';
    locIds.forEach((lid, idx) => {
      const loc      = locations.find(l => l.id === lid);
      const fullName = loc ? loc.name : lid;
      // 表示名優先、空なら拠点名の先頭2文字
      const showName = (loc && loc.displayName && loc.displayName.length > 0)
                        ? loc.displayName
                        : fullName.slice(0, 2);
      if (idx === subtotalSplit) {
        html += `<th class="cell-sub" title="中間計(前${subtotalSplit}拠点)">中計</th>`;
      }
      // Phase 4: ドライバー色を背景色として適用
      const styleAttr = driverColorStyleAttr(lid, colorMap);
      // v3.9 NEW: 拠点グループ区切り線
      const bcls = boundaryCls(idx);
      html += `<th class="${bcls.trim()}" title="${escHtml(fullName)}"${styleAttr}>${escHtml(showName)}</th>`;
    });
    html += '<th class="cell-tot">合計</th>';
    html += '</tr>';

    rows.forEach(row => {
      if (!row.total) return;
      if (isTea(row)) return;  // お茶を除外
      const color  = getColor(row.category, row.baseName);
      const trCls  = `g-${color}${rowClass ? ' ' + rowClass : ''}`;
      html += `<tr class="${trCls}">`;
      html += `<td class="cell-name">${escHtml(row.baseName)}</td>`;
      locIds.forEach((lid, idx) => {
        if (idx === subtotalSplit) {
          html += `<td class="cell-sub">${row.subtotal || ''}</td>`;
        }
        const q = row.byLocation[lid];
        // v3.9 NEW: 拠点グループ区切り線
        const bcls = boundaryCls(idx);
        html += `<td class="cell-data${bcls}">${q ? q : ''}</td>`;
      });
      html += `<td class="cell-tot">${row.total || ''}</td>`;
      html += '</tr>';
    });

    return html;
  }

  // カテゴリー別合計行（白米+玄米合算、お茶除外）
  function buildCategoryRowsHTML() {
    const colspan = 1 + locIds.length + 1 + 1;
    let html = '';
    html += `<tr><td colspan="${colspan}" class="cell-section-cat">▼ カテゴリー別合計</td></tr>`;

    SHEET1_CATEGORIES.forEach(cat => {
      const catRows = allRows.filter(r => cat.matches.indexOf(r.category) >= 0);
      if (catRows.length === 0) return;

      // 拠点ごとの合計を計算
      const byLocation = {};
      let subtotal = 0, total = 0;
      locIds.forEach((lid, idx) => {
        let sum = 0;
        catRows.forEach(r => { sum += Number(r.byLocation[lid]) || 0; });
        byLocation[lid] = sum;
        total += sum;
        if (idx < subtotalSplit) subtotal += sum;
      });
      if (total === 0) return;  // 全拠点ゼロなら行ごと省略

      html += `<tr class="cat-row g-${cat.color}">`;
      html += `<td class="cell-name cat-label">${cat.label}</td>`;
      locIds.forEach((lid, idx) => {
        if (idx === subtotalSplit) {
          html += `<td class="cell-sub">${subtotal || ''}</td>`;
        }
        const v = byLocation[lid];
        // v3.9 NEW: 拠点グループ区切り線
        const bcls = boundaryCls(idx);
        html += `<td class="cell-data${bcls}">${v || ''}</td>`;
      });
      html += `<td class="cell-tot">${total}</td>`;
      html += '</tr>';
    });

    // 拠点合計行（全カテゴリー合算）
    const grandByLoc = {};
    let grandSub = 0, grandTotal = 0;
    locIds.forEach((lid, idx) => {
      let sum = 0;
      allRows.forEach(r => { sum += Number(r.byLocation[lid]) || 0; });
      grandByLoc[lid] = sum;
      grandTotal += sum;
      if (idx < subtotalSplit) grandSub += sum;
    });
    html += '<tr class="cat-row cat-grand">';
    html += '<td class="cell-name cat-label">拠点合計</td>';
    locIds.forEach((lid, idx) => {
      if (idx === subtotalSplit) {
        html += `<td class="cell-sub">${grandSub || ''}</td>`;
      }
      // v3.9 NEW: 拠点グループ区切り線
      const bcls = boundaryCls(idx);
      html += `<td class="cell-data${bcls}">${grandByLoc[lid] || ''}</td>`;
    });
    html += `<td class="cell-tot">${grandTotal}</td>`;
    html += '</tr>';

    return html;
  }

  const tableHTML = '<table class="matrix-table">'
    + buildTableHTML(rice,  false)
    + buildTableHTML(brown, true)
    + buildCategoryRowsHTML()
    + '</table>';

  let refHTML = '<table class="ref-table">'
    + '<tr><th class="col-name">拠点名</th><th class="col-sp">販売員名</th></tr>';
  locations.forEach((loc, idx) => {
    // Phase 4: ref-panelの拠点名セルにもドライバー色を適用
    const styleAttr = driverColorStyleAttr(loc.id, colorMap);
    // v3.9 NEW: 拠点グループ区切り線（行下方向）
    const rowCls = isBoldBoundary(idx + 1) ? ' class="cell-bold-boundary-row"' : '';
    refHTML += `<tr${rowCls}>`
      + `<td class="col-name"${styleAttr}>${escHtml(loc.name)}</td>`
      + `<td class="col-sp">${escHtml(loc.salesPerson || '')}</td>`
      + `</tr>`;
  });
  refHTML += '</table>';

  body.innerHTML = `
    <div class="page-title">📋 ${escHtml(dateLabel)}　拠点配分表</div>
    <div class="sheet1-content">
      <div class="table-wrap">${tableHTML}</div>
      <div class="ref-panel">${refHTML}</div>
    </div>`;
}

function renderSheet2(data) {
  const body = document.getElementById('sheet2-body');
  const { dateLabel, deliveries, rice, brown } = data;
  const dCount = deliveries.length;

  // ── マトリクス HTML 構築 ──
  function buildMatrixHTML(rows, isBrown) {
    const sectionClass = isBrown ? 'cell-section-brown' : 'cell-section-rice';
    const sectionLabel = isBrown ? '▼ 玄米' : '▼ 白米';
    const rowClass     = isBrown ? ' brown-row' : '';
    const colspan      = 1 + 1 + dCount + 1; // 商品名 + 拠点合計 + N配達 + 計

    // この表に数量が1つも無い配達列を判定（印刷時のみ非表示・列番号は元のまま維持）
    const activeRows = (rows || []).filter(r => r.total);
    const colEmpty = [];
    for (let d = 0; d < dCount; d++) {
      colEmpty[d] = !activeRows.some(r => r.deliveryQtys[d] > 0);
    }
    const colEmptyCls = d => colEmpty[d] ? ' col-empty-print' : '';

    let html = '<thead>';
    html += `<tr><td colspan="${colspan}" class="${sectionClass}">${sectionLabel}</td></tr>`;
    html += '<tr>';
    html += '<th style="text-align:left;padding-left:5px;min-width:80px;">商品</th>';
    html += '<th class="cell-kyoten">拠点</th>';
    for (let d = 0; d < dCount; d++) {
      const tip = escHtml(deliveries[d].address || deliveries[d].orderNum);
      html += `<th title="${tip}" class="${colEmptyCls(d).trim()}" style="min-width:20px;">${d + 1}</th>`;
    }
    html += '<th class="cell-tot">計</th>';
    html += '</tr></thead><tbody>';

    activeRows.forEach(row => {
      const color  = getColor(row.category, row.baseName);
      const trCls  = `g-${color}${rowClass}`;
      html += `<tr class="${trCls}">`;
      html += `<td class="cell-name">${escHtml(row.baseName)}</td>`;
      html += `<td class="cell-kyoten">${row.kyotenTotal || ''}</td>`;

      for (let d = 0; d < dCount; d++) {
        const qty  = row.deliveryQtys[d];
        const ohm  = row.deliveryOhm[d];
        const gc   = gradeClassOf(deliveries[d].grade)
        const bgCls = (qty > 0 && gc) ? `cell-${gc}` : '';
        const txt  = qty ? (ohm ? `<span class="ohm">${qty}</span>` : qty) : '';
        html += `<td class="${(bgCls + colEmptyCls(d)).trim()}">${txt}</td>`;
      }
      html += `<td class="cell-tot">${row.total || ''}</td>`;
      html += '</tr>';
    });

    html += '</tbody>';
    return html;
  }

  const riceHTML  = '<table class="matrix-table">' + buildMatrixHTML(rice,  false) + '</table>';
  const brownHTML = '<table class="matrix-table">' + buildMatrixHTML(brown, true)  + '</table>';

  // ── 配達カード HTML 構築 ──
  let cardsHTML = '';

  if (dCount === 0) {
    cardsHTML = '<div class="no-delivery-msg">本日の1便配達データはありません</div>';
  } else {
    deliveries.forEach(d => {
      const gc      = gradeClassOf(d.grade) ? `grade-${gradeClassOf(d.grade)}` : 'grade-empty';
      const addrFull = d.address + (d.detail ? '　' + d.detail : '');
      const returnBadge = d.hasReturn
        ? `<span class="return-badge">🔄 回収 ${d.returnTime || ''}</span>`
        : '';

      cardsHTML += `
        <div class="delivery-card">
          <div class="delivery-header ${gc}">
            <span>配達 ${d.n}</span>
            <span class="grade-badge grade-${gradeClassOf(d.grade) || 'empty'}">${gradeLabelJa(d.grade)}</span>
          </div>
          <div class="delivery-body">
            <div class="delivery-row">
              <span class="lbl">時間</span>
              <span class="val">${escHtml(d.time)}</span>
            </div>
            <div class="delivery-row">
              <span class="lbl">届先</span>
              <span class="val">${escHtml(addrFull)}</span>
            </div>
            ${d.contact ? `<div class="delivery-row"><span class="lbl">担当</span><span class="val">${escHtml(d.contact)}</span></div>` : ''}
            ${d.note ? `<div class="delivery-row"><span class="lbl">備考</span><span class="val">${escHtml(d.note)}</span></div>` : ''}
            ${d.hasReturn ? `<div class="delivery-row"><span class="lbl">回収</span><span class="val">${returnBadge}</span></div>` : ''}
          </div>
          <div class="delivery-move">
            <button class="move-bin-btn move-to-pm" data-order="${escHtml(d.orderNum)}" data-bin="2">▶ 午後便へ移動</button>
          </div>
        </div>`;
    });
  }

  // ── 組み合わせ ──
  body.innerHTML = `
    <div class="page-title">📋 ${escHtml(dateLabel)}　1便盛り出し表（配達 ${dCount} 件）</div>
    <div class="sheet2-container">
      <div class="table-wrap">${riceHTML}</div>
      <div class="table-wrap">${brownHTML}</div>
      <div class="delivery-area">${cardsHTML}</div>
    </div>`;
}

// ═══════════════════════════════════════
// 便 移動（午前/午後）— カードのボタンから呼ぶ（v3.32）
//   GAS「便上書き」へオーダー番号キーで保存。成功後に盛り出しを再取得。
// ═══════════════════════════════════════
async function moveBin(orderNum, bin) {
  if (!orderNum) return;
  const onSrc = (Number(bin) === 2) ? s2SetStatus : s3SetStatus;
  onSrc(Number(bin) === 2 ? '午後便へ移動中…' : '午前便へ移動中…');
  try {
    const res = await fetch(GAS_URL + '?action=setBinOverride&orderNum='
      + encodeURIComponent(orderNum) + '&bin=' + encodeURIComponent(bin));
    const data = await res.json();
    if (!data || !data.ok) { onSrc((data && data.error) || '移動に失敗しました', true); return; }
    // 両盛り出しを再取得（日付が入っている方のみ）
    const s2d = (document.getElementById('s2-date-input') || {}).value;
    const s3d = (document.getElementById('s3-date-input') || {}).value;
    if (s2d) await fetchSheet2();
    if (s3d) await fetchSheet3();
    onSrc(Number(bin) === 2 ? '午後便へ移動しました' : '午前便へ移動しました');
  } catch (e) {
    onSrc('通信エラー: ' + e.message, true);
  }
}
// カード内ボタンのクリックを委譲で受ける（再描画後も有効）
document.addEventListener('click', function(ev) {
  const btn = ev.target.closest && ev.target.closest('.move-bin-btn');
  if (!btn) return;
  ev.preventDefault();
  if (btn.dataset.busy === '1') return;
  btn.dataset.busy = '1';
  const order = btn.getAttribute('data-order') || '';
  const bin   = btn.getAttribute('data-bin') || '';
  moveBin(order, bin).finally(function(){ btn.dataset.busy = ''; });
});

  ['卵','orange'],['玉子','orange'],['野菜','orange'],
  ['米','brown'],['穀','brown'],
  ['食品','purple'],['問屋','purple'],
  ['豆腐','teal'],['乳','teal'],
];
function getVendorColorClass(n) {
  if (VENDOR_COLOR_MAP[n]) return 'ovc-' + VENDOR_COLOR_MAP[n];
  for (const [kw, col] of VENDOR_KW_MAP) { if (n.includes(kw)) return 'ovc-' + col; }

const orderSelectedDates = new Set();

// 日付チェックボックス初期化（翌日から月〜日・14日分・今日以前はdisabled）
// v2.1: 土日含む対応＋タイムゾーンバグ修正（UTC算術で統一）
function initOrderDateChecks() {
  const jstNow = new Date(new Date().getTime() + 9 * 60 * 60 * 1000);
  const todayStr = jstNow.toISOString().slice(0, 10);
  const [tYear, tMonth, tDay] = todayStr.split('-').map(Number);

  const startUtc = new Date(Date.UTC(tYear, tMonth - 1, tDay + 1));
  const startDow = startUtc.getUTCDay();
  const daysFromMonday = (startDow === 0) ? 6 : startDow - 1;
  const thisMondayUtc = new Date(startUtc.getTime() - daysFromMonday * 86400000);

  const DOW = ['日','月','火','水','木','金','土'];
  const row = document.getElementById('order-date-row');
  row.innerHTML = '';
  orderSelectedDates.clear();

  for (let i = 0; i < 14; i++) {
    const d = new Date(thisMondayUtc.getTime() + i * 86400000);
    const dateStr = d.toISOString().slice(0, 10);
    const dispDay = d.getUTCDate();
    const dispMonth = d.getUTCMonth() + 1;
    const dispDow = d.getUTCDay();
    const isDisabled = dateStr <= todayStr;
    const wn = (i < 7) ? 0 : 1;

    const lbl = document.createElement('label');
    let cls = 'order-date-lbl';
    if (isDisabled) cls += ' disabled';
    lbl.className = cls;
    lbl.dataset.date = dateStr;
    lbl.dataset.week = wn;

    if (isDisabled) {
      lbl.innerHTML = `${dispMonth}/${dispDay}(${DOW[dispDow]})`;
    } else {
      lbl.innerHTML = `<input type="checkbox" value="${dateStr}"> ${dispMonth}/${dispDay}(${DOW[dispDow]})`;
      lbl.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) {
          orderSelectedDates.add(dateStr);
          lbl.classList.add('checked');
        } else {
          orderSelectedDates.delete(dateStr);
          lbl.classList.remove('checked');
        }
      });
    }
    row.appendChild(lbl);
  }
}

function orderSelectWeek(wn) {
  document.querySelectorAll('#order-date-row .order-date-lbl').forEach(lbl => {
    if (lbl.classList.contains('disabled')) return;
    const cb = lbl.querySelector('input');
    if (!cb) return;
    const dateStr = lbl.dataset.date;
    if (parseInt(lbl.dataset.week) === wn) {
      cb.checked = true;
      orderSelectedDates.add(dateStr);
      lbl.classList.add('checked');
    } else {
      cb.checked = false;
      orderSelectedDates.delete(dateStr);
      lbl.classList.remove('checked');
    }
  });
}

async function fetchOrderData() {
  const dates = Array.from(orderSelectedDates).sort();
  if (dates.length === 0) { orderSetStatus('日付を1日以上選択してください', true); return; }
  orderSetStatus('取得中…');
  document.getElementById('order-body').innerHTML = '';
  document.getElementById('order-warn-wrap').style.display = 'none';
  document.getElementById('order-warn-wrap').innerHTML = '';
  try {
    const res  = await fetch(GAS_URL + '?action=getOrderData&dates=' + encodeURIComponent(JSON.stringify(dates)));
    const data = await res.json();
    if (!data.ok) { orderSetStatus(data.error || '取得エラー', true); return; }
    orderSetStatus('');
    loadOrderDoneFlags(dates.join('_'));
    renderOrderWarnings(data.warnings);
    renderOrderData(data);
  } catch(e) {
    orderSetStatus('通信エラー: ' + e.message, true);
  }
}

// 必要量の表示用フォーマット（数値＋単位、小数1桁、kg帯は kg 換算）
function formatNeedAmount(total, unit) {
  const u = String(unit || '').trim();
  // g → 1000 以上で kg 表示
  if (u === 'g' && total >= 1000) {
    return (Math.round(total / 100) / 10) + 'kg';
  }
  // ml → 1000 以上で L 表示
  if (u === 'ml' && total >= 1000) {
    return (Math.round(total / 100) / 10) + 'L';
  }
  // 小数1桁表示（整数になればドット省略）
  const rounded = Math.round(total * 10) / 10;
  const display = (rounded === Math.floor(rounded)) ? String(Math.floor(rounded)) : rounded.toFixed(1);
  return display + u;
}

function renderOrderData(data) {
  const { dates, vendors, dailyBreakdown } = data;
  const DOW = ['日','月','火','水','木','金','土'];

  const datesLabel = dates.map(d => {
    const dt = new Date(d.replace(/-/g, '/'));
    return `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
  }).join('・');
  document.getElementById('order-sel-info').textContent = `選択中：${datesLabel}（${dates.length}日分合計）`;

  const body = document.getElementById('order-body');
  if (!vendors || vendors.length === 0) {
    body.innerHTML = '<div class="placeholder-msg">発注データがありません<br><small>食材マスタと単価マスタの食材ID/仕込みID列を確認してください</small></div>';
    return;
  }

  let html = '';
  vendors.forEach(v => {
    const cc    = getVendorColorClass(v.name);
    const safeN = v.name.replace(/[^\w\u3000-\u9FFF]/g, '_'); // CSSセーフなID用
    const isDone = _orderDoneFlags[v.name] || false;

    // 食材テーブル（3列：食材名 / 必要量 / パック数）
    const rows = v.items.map(it =>
      `<tr>
         <td>${escHtml(it.name)}</td>
         <td class="order-need">${formatNeedAmount(it.total, it.unit)}</td>
         <td class="order-qty">${it.packCeil}P</td>
       </tr>`
    ).join('');

    // 日別内訳
    const bdId = 'order-bd-' + safeN;
    let bdRows = '';
    dates.forEach(d => {
      const dayItems = (dailyBreakdown[d] || []).filter(it => it.vendorName === v.name);
      if (!dayItems.length) return;
      const dt = new Date(d.replace(/-/g, '/'));
      const lbl = `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
      const items = dayItems.map(it => `${escHtml(it.name)} ${formatNeedAmount(it.total, it.unit)}(${it.packCeil}P)`).join(' / ');
      bdRows += `<div class="order-bd-row"><span class="order-bd-date">${lbl}</span><span class="order-bd-items">${items}</span></div>`;
    });
    const bdSection = bdRows
      ? `<button class="order-bd-toggle" onclick="toggleOrderBd('${bdId}')"><span id="${bdId}-arrow">▶</span> 日別内訳</button>
         <div class="order-breakdown" id="${bdId}">${bdRows}</div>`
      : '';

    // 定数発注セクション (v3.12)
    let constSection = '';
    const consts = v.constants || [];
    if (consts.length > 0) {
      const constRows = consts.map(c => {
        const safeVendor = escHtml(v.name);
        const safeConstId = escHtml(c.id);
        const savedQty = (c.currentQty !== undefined && c.currentQty !== null) ? Number(c.currentQty) : 0; // v3.31: 既定は0（定数は横に参考表示）
        return `<tr>
          <td class="const-name">${escHtml(c.name)}</td>
          <td class="const-qty"><div class="const-qty-wrap"><input type="number" inputmode="numeric" min="0" step="1" value="${savedQty}"
            data-vendor="${safeVendor}" data-const-id="${safeConstId}"
            data-default="${c.defaultQty}" data-saved="${savedQty}"
            onfocus="onConstFocus(this)" onblur="saveConstantInput(this)" /><span class="const-ref">定数 ${escHtml(String(c.defaultQty))}</span></div></td>
          <td class="const-unit">${escHtml(c.unit || '')}</td>
        </tr>`;
      }).join('');
      constSection = `<div class="order-constants-section">
        <div class="order-constants-head">📦 定数発注</div>
        <table class="order-constants-table">
          <thead><tr>
            <th style="text-align:left">品目名</th>
            <th style="text-align:right">数量</th>
            <th style="text-align:center">単位</th>
          </tr></thead>
          <tbody>${constRows}</tbody>
        </table>
      </div>`;
    }

    html += `
      <div class="order-vendor-card ${cc}${isDone ? ' done' : ''}" id="ovc-${safeN}">
        <div class="order-vendor-head" onclick="toggleOrderCard('${safeN}')">
          <span class="order-vendor-name">${escHtml(v.name)}</span>
          <span class="order-vendor-summary">（${v.items.length}品目${consts.length > 0 ? '＋定数' + consts.length : ''}）</span>
          <div style="display:flex;align-items:center;gap:8px;margin-left:auto;" onclick="event.stopPropagation()">
            <label class="order-done-wrap">
              <input type="checkbox" class="order-done-cb" data-vendor="${escHtml(v.name)}"
                ${isDone ? 'checked' : ''} onchange="onOrderDone('${escHtml(v.name)}',this.checked)">
              発注済み
            </label>
            <button class="order-copy-btn" onclick="copyOrderText('${escHtml(v.name)}')">📋 コピー</button>
          </div>
        </div>
        <div class="order-vendor-body" id="ovcb-${safeN}">
          <table class="order-table">
            <thead><tr>
              <th style="text-align:left">食材名</th>
              <th style="text-align:right;width:28%">必要量</th>
              <th style="text-align:right;width:22%">パック数</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${constSection}
          ${bdSection}
        </div>
      </div>`;
  });
  body.innerHTML = html;
  window._orderData = data;
}

function copyOrderText(vendorName) {
  const data = window._orderData;
  if (!data) return;
  const vendor = data.vendors.find(v => v.name === vendorName);
  if (!vendor) return;
 
  const DOW = ['日','月','火','水','木','金','土'];
 
  // 先頭日付のみ表示
  let dateLabel = '';
  const firstDate = data.dates && data.dates[0];
  if (firstDate) {
    const dt = new Date(firstDate.replace(/-/g, '/'));
    dateLabel = `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
  }
 
  // v3.11: 食材ごとに unitMode を取得（食材マスタJ列「発注単位区分」由来）
  // 食材J列が空欄の場合は 'pack' をデフォルトとする
  const itemLines = vendor.items.map(it => {
    const need = formatNeedAmount(it.total, it.unit);
    const pack = `${it.packCeil}パック`;
    const unitMode = it.unitMode || 'pack';
    let qty;
    if (unitMode === 'kg') {
      qty = need;
    } else if (unitMode === 'both') {
      qty = `${need} / ${pack}`;
    } else {
      // default: pack
      qty = pack;
    }
    return `・${it.name} ${qty}`;
  });

  // v3.12: 定数発注リスト（0/空欄スキップ・現在の入力値を優先）
  const constants = vendor.constants || [];
  // DOM から最新の入力値を取得（保存前の編集中の値も反映）
  const constLines = constants
    .map(c => {
      const safeVendor = vendorName.replace(/"/g, '\\"');
      const inputEl = document.querySelector(`input[data-vendor="${safeVendor}"][data-const-id="${c.id}"]`);
      const qty = inputEl ? Number(inputEl.value) || 0 : (Number(c.currentQty) || 0);
      return { name: c.name, unit: c.unit || '', qty: qty };
    })
    .filter(c => c.qty > 0)
    .map(c => `・${c.name} ${c.qty}${c.unit}`);
 
  // 案C: 区切り線フォーマット
  const sep = '━━━━━━━━━━━━━━━━';
  const lines = [
    'お世話になっております。お江戸弁当です。',
    '下記、発注をお願いいたします。',
    '',
    `▼納品日：${dateLabel}`,
    sep,
    ...itemLines
  ];
  // 定数発注があればセクション追加
  if (constLines.length > 0) {
    lines.push(sep);
    lines.push(...constLines);
  }
  lines.push(sep);
  lines.push('');
  lines.push('よろしくお願いいたします。');

  const text = lines.join('\n');
 
  navigator.clipboard.writeText(text).then(
    () => { orderSetStatus(vendorName + ' のコピー完了'); setTimeout(() => orderSetStatus(''), 2500); },
    () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); orderSetStatus(vendorName + ' のコピー完了'); setTimeout(() => orderSetStatus(''), 2500); }
      catch(e2) { orderSetStatus('コピー失敗', true); }
      finally { document.body.removeChild(ta); }
    }
  );
}

// v3.31: 入力欄フォーカス時、既定の「0」は消して入力しやすく（非0は全選択）
function onConstFocus(inputEl) {
  if (inputEl.value === '0') inputEl.value = '';
  else inputEl.select();
}

// v3.12 / v3.31: 定数発注の入力値をGAS経由で保存（blur時に自動呼出）
async function saveConstantInput(inputEl) {
  const vendorName = inputEl.dataset.vendor;
  const constId = inputEl.dataset.constId;
  let qty = parseInt(inputEl.value, 10);
  if (isNaN(qty) || qty < 0) qty = 0;
  inputEl.value = String(qty);              // v3.31: 空欄や不正値は0に正規化して表示
  const prevSaved = parseInt(inputEl.dataset.saved, 10);
  const prev = isNaN(prevSaved) ? 0 : prevSaved;
  if (qty === prev) return;                 // v3.31: 変化なし（タップして離れただけ等）は保存しない
  const data = window._orderData;
  if (!data) return;
  const firstDate = data.firstDate || (data.dates && data.dates[0]);
  if (!firstDate) return;

  // 視覚フィードバック（保存中）
  inputEl.classList.remove('saved');
  inputEl.classList.add('saving');

  try {
    let userId = '';
    try {
      if (typeof getCurrentUserId === 'function') userId = getCurrentUserId() || '';
    } catch(_) {}

    const params = new URLSearchParams();
    params.append('action', 'saveConstantOrderInput');
    params.append('date', firstDate);
    params.append('vendorName', vendorName);
    params.append('constId', constId);
    params.append('qty', String(qty));
    params.append('userId', userId);

    const res = await fetch(GAS_URL, { method: 'POST', body: params });
    const json = await res.json();

    inputEl.classList.remove('saving');
    if (json && json.success) {
      inputEl.classList.add('saved');
      setTimeout(() => inputEl.classList.remove('saved'), 1500);
      // メモリ内データも更新
      inputEl.dataset.saved = String(qty);   // v3.31: 保存済み値を更新（変化なし判定用）
      const vendor = data.vendors.find(v => v.name === vendorName);
      if (vendor && vendor.constants) {
        const c = vendor.constants.find(x => x.id === constId);
        if (c) c.currentQty = qty;
      }
    } else {
      console.warn('定数発注入力保存失敗', json && json.error);
      orderSetStatus('保存失敗: ' + (json && json.error ? json.error : '不明'), true);
    }
  } catch(e) {
    inputEl.classList.remove('saving');
    console.warn('定数発注入力保存エラー', e);
    orderSetStatus('保存通信エラー', true);
  }
}

  bmSaveEdits();
}
function bmClearEditsForLoc(dateStr, lid) {
  if (!bmEditsCache[dateStr]) return;
  const keys = Object.keys(bmEditsCache[dateStr]);
  for (const k of keys) {
    if (k.endsWith('_' + lid)) delete bmEditsCache[dateStr][k];
  }
  bmSaveEdits();
}

// 古い日付の編集キャッシュをクリア（範囲外の日付を削除）
function bmPurgeOldEdits(validDates) {
  const validSet = new Set(validDates);
  const keys = Object.keys(bmEditsCache);
  let purged = 0;
  for (const k of keys) {
    if (!validSet.has(k)) {
      delete bmEditsCache[k];
      purged++;
    }
  }
  if (purged > 0) bmSaveEdits();
  return purged;
}

// 完売増量
function bmGetSelloutBonus(timeStr) {
  if (!timeStr) return 0;
  const s = String(timeStr).substring(0,5);
  for (const r of BM_SELLOUT_RULES) {
    if (s >= r.from && s <= r.to) return r.bonus;
  }
  return 0;
}

// v3.25: 完売時刻を必ず HH:MM に整形（Date文字列/HH:mm:ss/小数シリアル等の表記ゆれを吸収）
function bmFmtSelloutTime(v) {
  if (v === null || v === undefined) return '';
  const s = String(v).trim();
  if (s === '') return '';
  // 1) 文字列中の最初の HH:MM を抽出（"11:30" / "11:30:00" / Date文字列 / ISO に対応）
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (m) return ('0' + m[1]).slice(-2) + ':' + m[2];
  // 2) 小数シリアル（0〜1 のスプレッドシート時刻）→ HH:MM
  const num = Number(s);
  if (!isNaN(num) && num >= 0 && num < 1) {
    const total = Math.round(num * 24 * 60);
    return ('0' + Math.floor(total / 60)).slice(-2) + ':' + ('0' + (total % 60)).slice(-2);
  }
  return s; // 最後の手段
}

// 日付フォーマット系
function bmFmtDateLabel(dateStr) {
  // 'YYYY-MM-DD' → 'M/D(曜)'
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  // JS Date を JST 解釈：YYYY-MM-DD は UTC扱いになるので注意
  // ローカル時刻でつくる
  const dt = new Date(parseInt(parts[0],10), m-1, d);
  const dow = BM_DOW_JA[dt.getDay()];
  return m + '/' + d + '(' + dow + ')';
}
function bmFmtDateFull(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const y = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  const dt = new Date(y, m-1, d);
  const dow = BM_DOW_JA[dt.getDay()];
  return y + '年' + m + '月' + d + '日(' + dow + ')';
}

// 今日の日付取得（YYYY-MM-DD 形式・ローカル時刻）
function bmTodayStr() {
  const t = new Date();
  const y = t.getFullYear();
  const m = String(t.getMonth() + 1).padStart(2, '0');
  const d = String(t.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

// 確定状態：拠点の全商品でG列に値があるか
function bmIsLocConfirmed(lid) {
  // v3.23: 確定判定は「G列の有無」ではなく「K列フラグ(サーバーconfirmedLocs)」で行う
  if (bmLocalConfirmedLocs.has(lid)) return true;  // 念のため（通常は空）
  if (!bmServerData) return false;
  const cl = bmServerData.confirmedLocs || [];
  return cl.indexOf(lid) !== -1;
}
function bmIsAllConfirmed() {
  if (!bmServerData) return false;
  for (const loc of bmServerData.locations) {

// セルの「表示する販売数」を取得（編集値 > サーバーweekSales）
// v3.21: 表示優先順「編集値 > confirmed（G列）> weekSales（先週実績）」
function bmGetDisplaySales(pid, lid) {
  const edit = bmGetEdit(bmCurrentDate, pid, lid);
  if (edit !== null && edit !== undefined && edit !== '') return Number(edit);
  if (!bmServerData) return 0;
  const c = bmServerData.cells[pid + '_' + lid];
  if (!c) return 0;
  // G列確定値（confirmed）があれば優先表示
  if (c.confirmed !== null && c.confirmed !== undefined) return Number(c.confirmed);
  // 確定値なし → 先週実績
  return c.weekSales || 0;
}

// v3.9 NEW: 第3引数 idx0 を追加（拠点グループ区切り線判定用）
function bmRenderCell(pid, lid, idx0) {
  const bcls = (typeof idx0 === 'number') ? boundaryCls(idx0) : '';
  const c = bmServerData.cells[pid + '_' + lid];
  if (!c) return '<td class="bm-data-cell' + bcls + '"></td>';
  const sales = bmGetDisplaySales(pid, lid);
  const pro = c.proposed;
  const diff = pro - sales;
  const isLocC = bmIsLocConfirmed(lid);
  // v3.24/v3.25: 未来日付(isFallback)は反映元(直近同曜=先週)の完売、過去日・当日は表示日自身の完売。時刻は必ずHH:MMに整形
  const isFuture = !!c.isFallback;
  const rawSO = isFuture ? (c.refSelloutTime || null) : (c.selloutTime || null);
  const soTime = rawSO ? bmFmtSelloutTime(rawSO) : '';
  const hasSO = !!soTime;
  const isZero = !pro && !sales;
  const edit = bmGetEdit(bmCurrentDate, pid, lid);
  const isEdited = (edit !== null && edit !== undefined);

  let cls = 'bm-data-cell';
  if (isLocC) cls += ' bm-loc-confirmed';
  if (isZero) cls += ' bm-zero-cell';
  cls += bcls;  // v3.9 NEW: 区切り線クラス追加

  let salesCls = 'bm-cell-sales';
  if (c.isFallback && !isEdited) salesCls += ' bm-fallback';
  if (isEdited) salesCls += ' bm-edited';
  if (!sales && !isZero) salesCls += ' bm-no-sales';
  if (isZero) salesCls += ' bm-no-sales';

  const proStr = pro || '–';
  const salStr = (sales || sales === 0) && pro ? String(sales) : (sales ? String(sales) : '–');

  let ind = '';
  if (diff > 0 && pro > 0) ind = '<span class="bm-ind-up">▲</span>';
  else if (diff < 0 && pro > 0) ind = '<span class="bm-ind-down">▼</span>';
  // v3.25: 過去日・当日は絶対配置の赤ドット。未来日付は上部ストリップ(soLine)に🔴＋時刻（推奨数と重ならない）
  let badge = '';
  let soLine = '';
  if (hasSO) {
    if (isFuture) {
      const refDate = (c.hist && c.hist[0]) ? c.hist[0].date : '';
      const soTitle = '反映元(' + refDate + ') ' + soTime + '完売';
      soLine = '<div class="bm-cell-so-line" title="' + bmEscape(soTitle) + '"><span class="bm-so-dot"></span>' + bmEscape(soTime) + '</div>';
    } else {
      badge = '<span class="bm-sellout-badge" title="' + bmEscape(soTime + '完売') + '"></span>';
    }
  }

  const editable = true;
  const rangeAttrs = ' onmousedown="bmOnCellMouseDown(event,\'' + pid + '\',\'' + lid + '\')" onmouseenter="bmOnCellMouseEnter(event,\'' + pid + '\',\'' + lid + '\')"';
  const editAttrs = editable
    ? 'contenteditable="true" inputmode="numeric" data-pid="' + pid + '" data-lid="' + lid + '" onkeydown="bmOnSalesKey(event)" onblur="bmOnSalesBlur(this)" onfocus="bmOnSalesFocus(this)"' + rangeAttrs
    : 'data-pid="' + pid + '" data-lid="' + lid + '"' + rangeAttrs;
  const proClick = isZero ? '' : 'onclick="bmOpenModal(\'' + pid + '\',\'' + lid + '\')"';

  return '<td class="' + cls + '">'
    + soLine
    + '<div class="bm-cell-2col">' + badge
    + '<div class="' + salesCls + '" ' + editAttrs + '>' + salStr + '</div>'
    + '<div class="bm-cell-proposal" ' + proClick + '>' + proStr + ind + '</div>'
    + '</div></td>';
}

function bmRenderCategoryRow(cat) {
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  let html = '<tr class="bm-cat-row"><td class="bm-product-cell bm-cat-label">' + cat.label + '</td>';
  let totalNext = 0, totalSales = 0;
  // v3.9 NEW: idx を追加（拠点グループ区切り線対応）
  bmServerData.locations.forEach((loc, idx) => {
    let sumP = 0, sumS = 0;
    for (const p of products) {
      if (p.group !== cat.id) continue;
      const c = bmServerData.cells[p.id + '_' + loc.id];
      if (!c) continue;
      sumP += c.proposed;
      sumS += bmGetDisplaySales(p.id, loc.id);
    }
    totalNext += sumP;
    totalSales += sumS;
    const isC = bmIsLocConfirmed(loc.id);
    const isZero = !sumP && !sumS;
    let cls = 'bm-cat-cell';
    if (isC) cls += ' bm-loc-confirmed';
    if (isZero) cls += ' bm-cat-cell-zero';
    cls += boundaryCls(idx);  // v3.9 NEW: 区切り線クラス
    html += '<td class="' + cls + '"><div class="bm-cat-cell-actual">' + (sumS || '–') + '</div><div class="bm-cat-cell-next">' + (sumP || '–') + '</div></td>';

  html += '<td class="bm-total-col"><div class="bm-cat-cell-actual">' + totalSales + '</div><div class="bm-cat-cell-next">' + totalNext + '</div></td></tr>';
  return html;
}

}
function bmOnSalesKey(e) {
  const allowed = /^[0-9]$/.test(e.key) || ['Backspace','Delete','Tab','ArrowLeft','ArrowRight'].includes(e.key);
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Escape') { e.target.blur(); return; }
  if (!allowed) { e.preventDefault(); return; }
  // v3.30: 実際に値を編集するキー（数字・Backspace・Delete）が押された時だけ touched を立てる
  if (/^[0-9]$/.test(e.key) || e.key === 'Backspace' || e.key === 'Delete') {
    e.target.dataset.touched = '1';
  }
}
// v3.30: キー入力で実際に編集した時だけ記録（旧orig比較を撤廃）。
//        打った値（0を含む）はそのまま編集値に。無入力でクリック外れただけなら既存値を維持。
function bmOnSalesBlur(el) {
  const pid = el.dataset.pid;
  const lid = el.dataset.lid;
  const touched = (el.dataset.touched === '1');
  const raw = (el.textContent || '').trim();
  let newVal;
  if (!touched) {
    // 数字キーを押していない＝クリックして外れただけ → 記録は変えない（既存の編集値を維持）
    newVal = bmGetEdit(bmCurrentDate, pid, lid);
  } else if (raw === '') {
    newVal = null;
  } else {
    const v = parseInt(raw, 10);
    newVal = (isNaN(v) || v < 0) ? null : v;  // 0も明示入力として保持
  }
  el.dataset.touched = '';
  bmSetEditWithHistory(bmCurrentDate, pid, lid, newVal);
  bmUpdateCellDOM(pid, lid);
  bmUpdateSaveDirty();
}
function bmUpdateCellsDOM(changes) {
  if (!bmServerData || !changes || changes.length === 0) return;
  const pidSet = new Set();
  const lidSet = new Set();
 
  // 1. 各セル本体を更新
  for (const ch of changes) {
    const pid = ch.pid, lid = ch.lid;
    if (!pid || !lid) continue;
    const el = document.querySelector('.bm-cell-sales[data-pid="' + pid + '"][data-lid="' + lid + '"]');
    if (!el) continue;
    const c = bmServerData.cells[pid + '_' + lid];
    const sales = bmGetDisplaySales(pid, lid);
    const edit = bmGetEdit(bmCurrentDate, pid, lid);
    const isEdited = (edit !== null && edit !== undefined);
    const pro = c ? c.proposed : 0;
    const isZero = !pro && !sales;
    const salStr = (sales || sales === 0) && pro ? String(sales) : (sales ? String(sales) : '–');
    el.textContent = salStr;
    el.classList.remove('bm-fallback', 'bm-edited', 'bm-no-sales');
    if (c && c.isFallback && !isEdited) el.classList.add('bm-fallback');
    if (isEdited) el.classList.add('bm-edited');
    if (!sales && !isZero) el.classList.add('bm-no-sales');
    if (isZero) el.classList.add('bm-no-sales');
    pidSet.add(pid);
    lidSet.add(lid);
  }
 
  // 2. 影響を受けた商品行の合計列を1回ずつ更新
  for (const pid of pidSet) {
    const anyEl = document.querySelector('.bm-cell-sales[data-pid="' + pid + '"]');
    if (!anyEl) continue;
    const tr = anyEl.closest('tr');
    if (!tr) continue;
    const totalCell = tr.querySelector('.bm-total-col');
    if (!totalCell) continue;
    let total = 0;
    for (const loc of bmServerData.locations) {
      total += bmGetDisplaySales(pid, loc.id);
    }
    totalCell.textContent = total;
  }
 
  // 3. 影響を受けた拠点列の拠点合計を1回ずつ更新
  const summaryRow = document.querySelector('#tab-master .bm-matrix .bm-summary-row');
  if (summaryRow) {
    const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
    for (const lid of lidSet) {
      const idx = bmServerData.locations.findIndex(l => l.id === lid);
      if (idx < 0) continue;
      const colIdx = idx + 1; // 商品名列分シフト
      if (!summaryRow.children[colIdx]) continue;
      let sum = 0;
      for (const p of products) sum += bmGetDisplaySales(p.id, lid);
      summaryRow.children[colIdx].textContent = sum;
    }
  }
}
 
// v3.18: 単一セル用ラッパー（bmOnSalesBlur から呼ばれる）
function bmUpdateCellDOM(pid, lid) {

}

function bmOpenModal(pid, lid) {

  const isFutureM = !!c.isFallback;
  const rawSOm = isFutureM ? (c.refSelloutTime || null) : (c.selloutTime || null);
  const soTime = rawSOm ? bmFmtSelloutTime(rawSOm) : '';
  const soBonus = isFutureM ? (c.refSelloutBonus || 0) : (c.selloutBonus || 0);

  document.getElementById('bm-modal-title').textContent = productLabel + ' @ ' + loc.name;
