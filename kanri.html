function wpOpenNewPresetEditor() {
  const name = prompt('プリセット名を入力してください（例：🌧️ 雨天）');
  if (!name || !name.trim()) return;
  // 既存名チェック
  if (wpPresets.some(p => p.name === name.trim())) {
    alert('同名のプリセットが既に存在します');
    return;
  }
  wpCurrentEditPreset = name.trim();
  // 全拠点を100%で初期化した編集モーダルを開く
  const newPreset = {
    name: wpCurrentEditPreset,
    rows: wpLocations.map(l => ({ locId: l.id, locName: l.name, ratio: 100, note: '' }))
  };
  wpRenderEditModal(newPreset, true);
}

function wpOpenEditPresetEditor(presetName) {
  const p = wpPresets.find(x => x.name === presetName);
  if (!p) return;
  wpCurrentEditPreset = presetName;
  // 拠点マスタの全拠点を反映（プリセットにない拠点は100%で補完）
  const rows = wpLocations.map(l => {
    const r = p.rows.find(x => x.locId === l.id);
    return r ? { locId: l.id, locName: l.name, ratio: r.ratio, note: r.note || '' }
             : { locId: l.id, locName: l.name, ratio: 100, note: '' };
  });
  wpRenderEditModal({ name: presetName, rows: rows }, false);
}

function wpRenderEditModal(preset, isNew) {
  let html = '';
  html += '<div class="wp-edit-name-row">';
  html += '<label>プリセット名：</label>';
  html += '<input type="text" id="wp-edit-name" value="' + wpEsc(preset.name) + '" ' + (isNew ? '' : 'readonly') + '>';
  html += '</div>';
  html += '<div class="wp-edit-bulk-row">';
  html += '<b>一括設定：</b>';
  html += '<button onclick="wpBulkSet(\'all\', 0)">全拠点 0%</button>';
  html += '<button onclick="wpBulkSet(\'all\', 100)">全拠点 100%</button>';
  html += '<button onclick="wpBulkSet(\'outdoor\', 0)">屋外のみ 0%</button>';
  html += '<button onclick="wpBulkSet(\'indoor\', 80)">屋内のみ 80%</button>';
  html += '<span style="margin-left:auto;">指定値で一括: <input type="number" id="wp-bulk-val" value="100" min="0" max="500"> %';
  html += ' <button onclick="wpBulkSet(\'all\', null)">適用</button></span>';
  html += '</div>';
  html += '<table class="wp-edit-loc-table">';
  html += '<thead><tr><th class="wp-loc-name">拠点</th><th style="width:80px;text-align:center;">区分</th><th style="text-align:center;">係数(%)</th></tr></thead>';
  html += '<tbody>';
  for (const r of preset.rows) {
    const loc = wpLocations.find(l => l.id === r.locId);
    const flagCls = loc && loc.outdoor === '屋外' ? 'wp-outdoor' : 'wp-indoor';
    const flag = loc ? loc.outdoor : '屋内';
    html += '<tr>';
    html += '<td class="wp-loc-name">' + wpEsc((loc && loc.displayName && loc.displayName.length > 0) ? loc.displayName : r.locName) + ' <span style="color:#888;font-size:8.5pt;">(' + wpEsc(r.locId) + ')</span></td>';
    html += '<td style="text-align:center;"><span class="wp-loc-flag ' + flagCls + '" data-flag="' + wpEsc(flag) + '">' + wpEsc(flag) + '</span></td>';
    html += '<td style="text-align:center;"><input type="number" class="wp-ratio-input" data-lid="' + wpEsc(r.locId) + '" value="' + r.ratio + '" min="0" max="500"></td>';
    html += '</tr>';
  }
  html += '</tbody></table>';

  const buttons = [
    { label: 'キャンセル', onclick: 'wpCloseModal()' }
  ];
  if (!isNew) {
    buttons.push({ label: '🗑 削除', danger: true, onclick: 'wpDeletePresetConfirm(\'' + preset.name.replace(/'/g, "\\'") + '\')' });
  }
  buttons.push({ label: '💾 保存', primary: true, onclick: 'wpSaveCurrentEdit()' });

  wpOpenModal((isNew ? '新規プリセット作成' : 'プリセット編集：') + preset.name, html, buttons);
}

function wpBulkSet(scope, value) {
  let val = value;
  if (val === null) {
    const inp = document.getElementById('wp-bulk-val');
    val = parseInt(inp.value, 10);
    if (isNaN(val) || val < 0) { alert('有効な数値を入力してください'); return; }
  }
  const inputs = document.querySelectorAll('.wp-ratio-input');
  let n = 0;
  inputs.forEach(inp => {
    const lid = inp.dataset.lid;
    const loc = wpLocations.find(l => l.id === lid);
    const outdoor = loc ? loc.outdoor : '屋内';
    if (scope === 'all' || (scope === 'outdoor' && outdoor === '屋外') || (scope === 'indoor' && outdoor === '屋内')) {
      inp.value = val;
      n++;
    }
  });
  wpToast(n + '拠点を ' + val + '% に設定', 'info');
}

async function wpSaveCurrentEdit() {
  const nameInp = document.getElementById('wp-edit-name');
  const newName = nameInp.value.trim();
  if (!newName) { alert('プリセット名を入力してください'); return; }

  const inputs = document.querySelectorAll('.wp-ratio-input');
  const rows = [];
  inputs.forEach(inp => {
    const lid = inp.dataset.lid;
    const ratio = parseInt(inp.value, 10);
    if (isNaN(ratio) || ratio < 0) return;
    rows.push({ locId: lid, ratio: ratio, note: '' });
  });
  if (rows.length === 0) { alert('1拠点以上設定してください'); return; }

  wpToast('保存中...', 'info');
  // GET経由（URLが長くなる可能性あるがOK）
  const usp = new URLSearchParams();
  usp.set('action', 'saveWeatherPreset');
  usp.set('presetName', newName);
  usp.set('rows', JSON.stringify(rows));
  try {
    const res = await fetch(GAS_URL + '?' + usp.toString());
    const r = await res.json();
    if (!r.ok) { wpToast('保存失敗: ' + (r.error || '不明'), 'error'); return; }
    wpToast(r.message || '保存完了', 'success');
    wpCloseModal();
    await wpRenderSettingsTab();
  } catch (err) {
    wpToast('保存失敗: ' + String(err), 'error');
  }
}

async function wpDeletePresetConfirm(presetName) {
  if (!confirm('プリセット「' + presetName + '」を削除しますか？\nこの操作は取り消せません。')) return;
  const r = await wpFetch('deleteWeatherPreset', { presetName: presetName });
  if (!r.ok) { wpToast('削除失敗: ' + (r.error || '不明'), 'error'); return; }
  wpToast(r.message || '削除完了', 'success');
  wpCloseModal();
  await wpRenderSettingsTab();
}

// ============================================================
// 初期化フック
// ============================================================
// マウスアップでドラッグ終了
document.addEventListener('mouseup', bmOnGlobalMouseUp);

// キーボードショートカット（既存handlerに追加）
document.addEventListener('keydown', function(e) {
  // tab-master がアクティブなときのみ
  const tabMaster = document.getElementById('tab-master');
  if (!tabMaster || !tabMaster.classList.contains('active')) return;
  // 編集中（contenteditableにフォーカス）なら無視（Ctrl+Z/Yはブラウザに任せたほうが安全だが、選択範囲操作は別）
  const isEditing = document.activeElement && document.activeElement.isContentEditable;
  // Ctrl+Z / Cmd+Z → Undo
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z' && !isEditing) {
    e.preventDefault();
    bmDoUndo();
    return;
  }
  // Ctrl+Y or Ctrl+Shift+Z → Redo
  if (((e.ctrlKey || e.metaKey) && e.key === 'y') ||
      ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'z' || e.key === 'Z'))) {
    if (isEditing) return;
    e.preventDefault();
    bmDoRedo();
    return;
  }
  // Delete / Backspace → 範囲を0クリア
  if ((e.key === 'Delete' || e.key === 'Backspace') && !isEditing && bmSelectedCells.size > 0) {
    e.preventDefault();
    bmActionClearZero();
    return;
  }
  // Ctrl+C → 範囲コピー
  if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !isEditing && bmSelectedCells.size > 0) {
    e.preventDefault();
    bmActionCopy();
    return;
  }
  // Ctrl+V → 範囲ペースト
  if ((e.ctrlKey || e.metaKey) && e.key === 'v' && !isEditing && bmSelectedCells.size > 0) {
    e.preventDefault();
    bmActionPaste();
    return;
  }
  // Escape → 選択解除
  if (e.key === 'Escape' && !isEditing) {
    bmClearSelection();
    return;
  }
});

// 設定タブ初回表示時にプリセット読み込み
let wpSettingsLoaded = false;
function wpEnsureSettingsLoaded() {
  if (wpSettingsLoaded) return;
  wpSettingsLoaded = true;
  wpRenderSettingsTab();
}
