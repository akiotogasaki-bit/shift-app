<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍱 配分表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: 13px;
  background: #f5f5f5;
  color: #212121;
}
.app-header {
  background: #1a3c5e; color: white;
  padding: 8px 16px; display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.app-header h1 { font-size: 15px; font-weight: bold; }
.tab-bar {
  background: #1a3c5e; border-bottom: 2px solid #0d2a42;
  display: flex; padding: 0 8px;
  position: sticky; top: 37px; z-index: 99;
}
.tab-btn {
  padding: 7px 14px; color: rgba(255,255,255,0.65);
  border: none; background: transparent; cursor: pointer;
  font-size: 12px; font-family: inherit;
  border-bottom: 3px solid transparent; white-space: nowrap; transition: color 0.15s;
}
.tab-btn:hover { color: rgba(255,255,255,0.9); }
.tab-btn.active { color: #fff; border-bottom-color: #64b5f6; font-weight: bold; }
.tab-btn:disabled { color: rgba(255,255,255,0.3); cursor: default; }
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.active { display: block; }
.placeholder-msg { text-align: center; padding: 60px; color: #888; font-size: 15px; }
.ctrl-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; flex-wrap: wrap;
}
.ctrl-bar label { font-size: 12px; color: #555; }
.ctrl-bar input[type="date"] {
  padding: 4px 8px; border: 1px solid #bbb; border-radius: 4px;
  font-family: inherit; font-size: 13px;
}
.btn {
  padding: 5px 14px; border: none; border-radius: 4px;
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold;
}
.btn-primary { background: #1a3c5e; color: white; }
.btn-primary:hover { background: #274f7a; }
.btn-print { background: #546e7a; color: white; }
.btn-print:hover { background: #607d8b; }
.status-msg { font-size: 12px; color: #888; margin-left: 4px; }
.status-msg.err { color: #c62828; }
.legend { display: flex; gap: 6px; align-items: center; font-size: 10px; margin-left: 8px; }
.legend-item { display: inline-block; padding: 1px 8px; border: 1px solid #888; font-size: 9.5px; }
.legend-ohm { color: #c62828; font-weight: bold; font-size: 9.5px; }
.table-wrap { overflow-x: auto; flex: 1; min-width: 0; }
.page-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
.matrix-table {
  border-collapse: collapse; font-size: 7.5pt; white-space: nowrap; width: 100%;
}
.matrix-table th, .matrix-table td {
  border: 1px solid #888; padding: 0 3px;
  text-align: center; height: 14px; line-height: 14px; min-width: 22px;
}
.matrix-table th { background: #e0e0e0; font-weight: bold; }
.matrix-table td.cell-name {
  text-align: left; padding: 0 5px; width: 82px;
  background: #f5f5f5; font-weight: bold;
}
.matrix-table td.cell-sub  { background: #e8eaf6; font-weight: bold; }
.matrix-table td.cell-tot  { background: #c5cae9; font-weight: bold; }
.matrix-table th.cell-sub  { background: #c5cae9; }
.matrix-table th.cell-tot  { background: #9fa8da; color: #fff; }
.matrix-table th.cell-kyoten { background: #c5cae9; }
.matrix-table td.cell-kyoten { background: #e8eaf6; font-weight: bold; }
.matrix-table td.cell-section-rice {
  background: #424242; color: white; font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px; height: 16px; line-height: 16px;
}
.matrix-table td.cell-section-brown {
  background: #5d4037; color: white; font-weight: bold; font-size: 8pt;
  text-align: left; padding-left: 8px; height: 16px; line-height: 16px;
}
.matrix-table tr.g-blue  td.cell-data { background: #e3f2fd; }
.matrix-table tr.g-green td.cell-data { background: #e8f5e9; }
.matrix-table tr.g-yel   td.cell-data { background: #fff9c4; }
.matrix-table tr.g-blue.brown-row  td.cell-data { background: #fff3e0; }
.matrix-table tr.g-green.brown-row td.cell-data { background: #ffe0b2; }
.matrix-table tr.g-yel.brown-row   td.cell-data { background: #ffcc80; }
.cell-ume   { background: #ffffff !important; }
.cell-take  { background: #c8e6c9 !important; }
.cell-matsu { background: #d1c4e9 !important; }
.ohm        { color: #c62828; font-weight: bold; }

/* シート1 */
.sheet1-content { display: flex; gap: 10px; align-items: flex-start; }
.ref-panel { flex-shrink: 0; }
.ref-table { border-collapse: collapse; font-size: 7.5pt; white-space: nowrap; }
.ref-table th, .ref-table td { border: 1px solid #aaa; padding: 0 4px; height: 14px; line-height: 14px; }
.ref-table th { background: #e0e0e0; text-align: center; }
.ref-table td.col-no   { width: 22px; text-align: center; background: #fffde7; font-weight: bold; }
.ref-table td.col-name { width: 88px; text-align: left; padding-left: 4px; font-weight: bold; }
.ref-table td.col-wh   { width: 60px; text-align: center; font-size: 7pt; color: #555; }

/* シート2 レイアウト（横3カラム） */
.sheet2-container { display: grid; grid-template-columns: 5fr 5fr 2.5fr; gap: 8px; align-items: start; }
.delivery-area-vertical { display: flex; flex-direction: column; gap: 3px; }

/* シート3 レイアウト（縦2段） */
.sheet3-container { display: flex; flex-direction: column; gap: 8px; }
.sheet3-matrix-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
.delivery-area-horizontal { display: grid; gap: 4px; }

/* 配達カード共通 */
.delivery-card { border: 1px solid #555; background: white; overflow: hidden; }
.delivery-header {
  font-weight: bold; padding: 2px 6px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #aaa; font-size: 8pt; line-height: 1.3;
}
.delivery-header.grade-matsu { background: #d1c4e9; }
.delivery-header.grade-take  { background: #c8e6c9; }
.delivery-header.grade-ume   { background: #ffffff; }
.delivery-header.grade-empty { background: #f5f5f5; color: #aaa; }
.grade-badge {
  font-size: 7.5pt; padding: 0 4px;
  border: 1px solid #666; background: white; font-weight: bold;
}
.delivery-body { padding: 3px 6px; font-size: 7.5pt; }
.delivery-row { display: flex; line-height: 1.5; border-bottom: 1px dotted #ddd; padding-bottom: 1px; }
.delivery-row:last-child { border-bottom: none; }
.delivery-row .lbl { flex-shrink: 0; width: 38px; color: #555; font-weight: bold; font-size: 7pt; }
.delivery-row .val { flex: 1; font-size: 7.5pt; word-break: break-all; }
.return-badge {
  display: inline-block; background: #fff3e0;
  border: 1px solid #ff9800; border-radius: 2px;
  padding: 0 3px; font-size: 6.5pt; color: #e65100; font-weight: bold;
}
.no-delivery-msg {
  text-align: center; color: #888; font-size: 13px;
  padding: 40px 0; background: white; border: 1px dashed #ccc; border-radius: 4px;
}

@media print {
  body { background: white; }
  .app-header, .tab-bar, .ctrl-bar, .legend { display: none !important; }
  .tab-pane { display: none !important; padding: 0; }
  .tab-pane.active { display: block !important; }
  .table-wrap { overflow: visible; }
  .page-title { margin-bottom: 4px; font-size: 12pt; }
}
</style>
</head>
<body>

<div class="app-header">
  <h1>🍱 配分表</h1>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="sheet1" data-orientation="landscape">📋 拠点配分</button>
  <button class="tab-btn" data-tab="sheet2" data-orientation="landscape">📦 午前盛り出し</button>
  <button class="tab-btn" data-tab="sheet3" data-orientation="portrait">🚚 午後便盛り出し</button>
  <button class="tab-btn" disabled data-tab="sheet4">🍳 仕込み <small>準備中</small></button>
  <button class="tab-btn" disabled data-tab="order">📋 発注 <small>準備中</small></button>
  <button class="tab-btn" disabled data-tab="master">基本数マスタ <small>準備中</small></button>
  <button class="tab-btn" disabled data-tab="settings">設定 <small>準備中</small></button>
</div>

<!-- シート1 拠点配分 -->
<div class="tab-pane active" id="tab-sheet1">
  <div class="ctrl-bar">
    <label>日付：</label><input type="date" id="s1-date-input">
    <button class="btn btn-primary" id="s1-btn-fetch">取得</button>
    <button class="btn btn-print" onclick="window.print()">🖨 印刷</button>
    <span class="status-msg" id="s1-status-msg"></span>
  </div>
  <div id="sheet1-body"></div>
</div>

<!-- シート2 午前盛り出し -->
<div class="tab-pane" id="tab-sheet2">
  <div class="ctrl-bar">
    <label>日付：</label><input type="date" id="s2-date-input">
    <button class="btn btn-primary" id="s2-btn-fetch">取得</button>
    <button class="btn btn-print" onclick="window.print()">🖨 印刷</button>
    <span class="status-msg" id="s2-status-msg"></span>
    <div class="legend">
      <span>色：</span>
      <span class="legend-item" style="background:#fff;">梅</span>
      <span class="legend-item" style="background:#c8e6c9;">竹</span>
      <span class="legend-item" style="background:#d1c4e9;">松</span>
      <span class="legend-ohm">大盛り</span>
    </div>
  </div>
  <div id="sheet2-body"></div>
</div>

<!-- シート3 午後便盛り出し -->
<div class="tab-pane" id="tab-sheet3">
  <div class="ctrl-bar">
    <label>日付：</label><input type="date" id="s3-date-input">
    <button class="btn btn-primary" id="s3-btn-fetch">取得</button>
    <button class="btn btn-print" onclick="window.print()">🖨 印刷（A4縦）</button>
    <span class="status-msg" id="s3-status-msg"></span>
    <div class="legend">
      <span>色：</span>
      <span class="legend-item" style="background:#fff;">梅</span>
      <span class="legend-item" style="background:#c8e6c9;">竹</span>
      <span class="legend-item" style="background:#d1c4e9;">松</span>
      <span class="legend-ohm">大盛り</span>
    </div>
  </div>
  <div id="sheet3-body"></div>
</div>

<!-- 準備中タブ -->
<div class="tab-pane" id="tab-sheet4"><div class="placeholder-msg">🍳 仕込みは準備中です</div></div>
<div class="tab-pane" id="tab-order"><div class="placeholder-msg">📋 発注は準備中です</div></div>
<div class="tab-pane" id="tab-master"><div class="placeholder-msg">基本数マスタ画面は準備中です</div></div>
<div class="tab-pane" id="tab-settings"><div class="placeholder-msg">設定画面は準備中です</div></div>

<script>
'use strict';

const GAS_URL = 'https://script.google.com/macros/s/AKfycby2w7DLb-HULShiC5rKhD_wKg_TGjpx5nURr4Mk-E4Mzg_koC7eJbBedQ6u5QfwsJ_T4Q/exec';

const CATEGORY_COLOR = {
  '海苔弁系': 'blue',
  '満腹系':   'green',
  '全六':     'yellow',
  '他社商品': 'yellow',
  '全':       'yellow',
};
const NAME_COLOR_RULES = [
  { re: /^(あいもり|銀鮭|塩麹|照り焼き|鯖から|アジフライ|柚子焼き|マグロ|あさひめ)/, color: 'blue' },
  { re: /^(メンチ|カレー|満腹)/, color: 'green' },
];
const GRADE_CLASS = { '松': 'matsu', '竹': 'take', '梅': 'ume' };

function getColor(cat, name) {
  if (cat && CATEGORY_COLOR[cat]) return CATEGORY_COLOR[cat];
  for (const r of NAME_COLOR_RULES) if (r.re.test(name)) return r.color;
  return 'yellow';
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 印刷向き切替 ──
let _pageStyle = null;
function setPrintOrientation(o) {
  if (!_pageStyle) {
    _pageStyle = document.createElement('style');
    document.head.appendChild(_pageStyle);
  }
  _pageStyle.textContent = `@page { size: A4 ${o||'landscape'}; margin: 4mm; }`;
}
setPrintOrientation('landscape');

// ── タブ切替 ──
document.querySelectorAll('.tab-btn:not(:disabled)').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const pane = document.getElementById('tab-' + btn.dataset.tab);
    if (pane) pane.classList.add('active');
    setPrintOrientation(btn.dataset.orientation || 'landscape');
  });
});

// ── 日付初期化 ──
const TODAY = (() => {
  const jst = new Date(Date.now() + 9*3600000);
  return jst.toISOString().slice(0,10);
})();
['s1','s2','s3'].forEach(p => {
  const el = document.getElementById(p+'-date-input');
  if (el) el.value = TODAY;
});

// ── 配達カード HTML（共通）──
function buildCardHTML(d) {
  const gc  = GRADE_CLASS[d.grade] ? `grade-${GRADE_CLASS[d.grade]}` : 'grade-empty';
  const addr = d.address + (d.detail ? '　'+d.detail : '');
  return `<div class="delivery-card">
    <div class="delivery-header ${gc}">
      <span>配達 ${d.n}</span><span class="grade-badge">${escHtml(d.grade)||'—'}</span>
    </div>
    <div class="delivery-body">
      <div class="delivery-row"><span class="lbl">時間</span><span class="val">${escHtml(d.time)}</span></div>
      <div class="delivery-row"><span class="lbl">届先</span><span class="val">${escHtml(addr)}</span></div>
      ${d.contact?`<div class="delivery-row"><span class="lbl">担当</span><span class="val">${escHtml(d.contact)}</span></div>`:''}
      ${d.note?`<div class="delivery-row"><span class="lbl">備考</span><span class="val">${escHtml(d.note)}</span></div>`:''}
      ${d.hasReturn?`<div class="delivery-row"><span class="lbl">回収</span><span class="val"><span class="return-badge">🔄 ${escHtml(d.returnTime||'時間未定')}</span></span></div>`:''}
    </div>
  </div>`;
}

// ════════════════════════════
// シート1 拠点配分
// ════════════════════════════
document.getElementById('s1-btn-fetch').addEventListener('click', async () => {
  const v = document.getElementById('s1-date-input').value;
  const st = document.getElementById('s1-status-msg');
  if (!v) { st.textContent='日付を選択してください'; st.className='status-msg err'; return; }
  st.textContent='取得中…'; st.className='status-msg';
  document.getElementById('sheet1-body').innerHTML='';
  try {
    const data = await fetch(GAS_URL+'?action=getSheet1Data&date='+v).then(r=>r.json());
    if (!data.ok) { st.textContent=data.error||'取得エラー'; st.className='status-msg err'; return; }
    st.textContent='';
    const { dateLabel, locations, rice, brown, subtotalSplit } = data;
    const locIds = locations.map(l=>l.id);
    function tbl(rows, isBrown) {
      if (!rows||!rows.length) return '';
      const sc = isBrown?'cell-section-brown':'cell-section-rice';
      const sl = isBrown?'▼ 玄米':'▼ 白米';
      const rc = isBrown?' brown-row':'';
      const cs = 1+locIds.length+1+1;
      let h = `<tr><td colspan="${cs}" class="${sc}">${sl}</td></tr><tr>`;
      h += '<th style="width:82px;text-align:left;padding-left:5px;">商品</th>';
      locIds.forEach((lid,i)=>{
        const loc=locations.find(l=>l.id===lid);
        const nm=loc?loc.name:lid;
        const sh=nm.length>5?nm.slice(0,4)+'…':nm;
        if (i===subtotalSplit) h+=`<th class="cell-sub" title="中間計(前${subtotalSplit}拠点)">中計</th>`;
        h+=`<th title="${nm}">${sh}</th>`;
      });
      h+='<th class="cell-tot">合計</th></tr>';
      rows.forEach(row=>{
        const c=getColor(row.category,row.baseName);
        h+=`<tr class="g-${c}${rc}"><td class="cell-name">${escHtml(row.baseName)}</td>`;
        locIds.forEach((lid,i)=>{
          if (i===subtotalSplit) h+=`<td class="cell-sub">${row.subtotal||''}</td>`;
          h+=`<td class="cell-data">${row.byLocation[lid]||''}</td>`;
        });
        h+=`<td class="cell-tot">${row.total||''}</td></tr>`;
      });
      return h;
    }
    let ref='<table class="ref-table"><tr><th class="col-no">No.</th><th class="col-name">拠点名</th><th class="col-wh">勤務時間</th></tr>';
    locations.forEach((l,i)=>{
      ref+=`<tr><td class="col-no">${i+1}</td><td class="col-name">${escHtml(l.name)}</td><td class="col-wh">${escHtml(l.workHours)}</td></tr>`;
    });
    ref+='</table>';
    document.getElementById('sheet1-body').innerHTML=`
      <div class="page-title">📋 ${escHtml(dateLabel)}　拠点配分表</div>
      <div class="sheet1-content">
        <div class="table-wrap"><table class="matrix-table">${tbl(rice,false)}${tbl(brown,true)}</table></div>
        <div class="ref-panel">${ref}</div>
      </div>`;
  } catch(e) { st.textContent='通信エラー: '+e.message; st.className='status-msg err'; }
});

// ════════════════════════════
// シート2 午前盛り出し
// ════════════════════════════
document.getElementById('s2-btn-fetch').addEventListener('click', async () => {
  const v = document.getElementById('s2-date-input').value;
  const st = document.getElementById('s2-status-msg');
  if (!v) { st.textContent='日付を選択してください'; st.className='status-msg err'; return; }
  st.textContent='取得中…'; st.className='status-msg';
  document.getElementById('sheet2-body').innerHTML='';
  try {
    const data = await fetch(GAS_URL+'?action=getSheet2Data&date='+v).then(r=>r.json());
    if (!data.ok) { st.textContent=data.error||'取得エラー'; st.className='status-msg err'; return; }
    st.textContent='';
    const { dateLabel, deliveries, rice, brown } = data;
    const dc = deliveries.length;
    function mTbl(rows, isBrown) {
      const sc=isBrown?'cell-section-brown':'cell-section-rice';
      const sl=isBrown?'▼ 玄米':'▼ 白米';
      const rc=isBrown?' brown-row':'';
      const cs=1+1+dc+1;
      let h=`<thead><tr><td colspan="${cs}" class="${sc}">${sl}</td></tr><tr>`;
      h+='<th style="text-align:left;padding-left:5px;min-width:80px;">商品</th><th class="cell-kyoten">拠点</th>';
      for(let d=0;d<dc;d++) h+=`<th title="${escHtml(deliveries[d].address)}" style="min-width:20px;">${d+1}</th>`;
      h+='<th class="cell-tot">計</th></tr></thead><tbody>';
      (rows||[]).forEach(row=>{
        const c=getColor(row.category,row.baseName);
        h+=`<tr class="g-${c}${rc}"><td class="cell-name">${escHtml(row.baseName)}</td><td class="cell-kyoten">${row.kyotenTotal||''}</td>`;
        for(let d=0;d<dc;d++){
          const q=row.deliveryQtys[d],ohm=row.deliveryOhm[d];
          const gc=GRADE_CLASS[deliveries[d].grade];
          h+=`<td class="${q>0&&gc?'cell-'+gc:''}">${q?(ohm?`<span class="ohm">${q}</span>`:q):''}</td>`;
        }
        h+=`<td class="cell-tot">${row.total||''}</td></tr>`;
      });
      return h+'</tbody>';
    }
    const cards=dc===0?'<div class="no-delivery-msg">本日の午前便配達データはありません</div>':deliveries.map(buildCardHTML).join('');
    document.getElementById('sheet2-body').innerHTML=`
      <div class="page-title">📋 ${escHtml(dateLabel)}　午前盛り出し表（配達 ${dc} 件）</div>
      <div class="sheet2-container">
        <div class="table-wrap"><table class="matrix-table">${mTbl(rice,false)}</table></div>
        <div class="table-wrap"><table class="matrix-table">${mTbl(brown,true)}</table></div>
        <div class="delivery-area-vertical">${cards}</div>
      </div>`;
  } catch(e) { st.textContent='通信エラー: '+e.message; st.className='status-msg err'; }
});

// ════════════════════════════
// シート3 午後便盛り出し
// ════════════════════════════
document.getElementById('s3-btn-fetch').addEventListener('click', async () => {
  const v = document.getElementById('s3-date-input').value;
  const st = document.getElementById('s3-status-msg');
  if (!v) { st.textContent='日付を選択してください'; st.className='status-msg err'; return; }
  st.textContent='取得中…'; st.className='status-msg';
  document.getElementById('sheet3-body').innerHTML='';
  try {
    const data = await fetch(GAS_URL+'?action=getSheet3Data&date='+v).then(r=>r.json());
    if (!data.ok) { st.textContent=data.error||'取得エラー'; st.className='status-msg err'; return; }
    st.textContent='';
    const body = document.getElementById('sheet3-body');
    if (data.empty) {
      body.innerHTML=`<div class="page-title">📋 ${escHtml(data.dateLabel)}　午後便盛り出し表</div><div class="no-delivery-msg">本日は午後便の配達はありません</div>`;
      return;
    }
    const { dateLabel, deliveries, rice, brown } = data;
    const dc = deliveries.length;
    function mTbl3(rows, isBrown) {
      const sc=isBrown?'cell-section-brown':'cell-section-rice';
      const sl=isBrown?'▼ 玄米':'▼ 白米';
      const rc=isBrown?' brown-row':'';
      const cs=1+dc+1; // 拠点合計列なし
      let h=`<thead><tr><td colspan="${cs}" class="${sc}">${sl}</td></tr><tr>`;
      h+='<th style="text-align:left;padding-left:5px;min-width:80px;">商品</th>';
      for(let d=0;d<dc;d++) h+=`<th title="${escHtml(deliveries[d].address)}" style="min-width:22px;">${d+1}</th>`;
      h+='<th class="cell-tot">計</th></tr></thead><tbody>';
      (rows||[]).forEach(row=>{
        const c=getColor(row.category,row.baseName);
        h+=`<tr class="g-${c}${rc}"><td class="cell-name">${escHtml(row.baseName)}</td>`;
        for(let d=0;d<dc;d++){
          const q=row.deliveryQtys[d],ohm=row.deliveryOhm[d];
          const gc=GRADE_CLASS[deliveries[d].grade];
          h+=`<td class="${q>0&&gc?'cell-'+gc:''}">${q?(ohm?`<span class="ohm">${q}</span>`:q):''}</td>`;
        }
        h+=`<td class="cell-tot">${row.total||''}</td></tr>`;
      });
      return h+'</tbody>';
    }
    const cardCols = Math.min(dc, 6);
    body.innerHTML=`
      <div class="page-title">📋 ${escHtml(dateLabel)}　午後便盛り出し表（配達 ${dc} 件）</div>
      <div class="sheet3-container">
        <div class="sheet3-matrix-row">
          <div class="table-wrap"><table class="matrix-table">${mTbl3(rice,false)}</table></div>
          <div class="table-wrap"><table class="matrix-table">${mTbl3(brown,true)}</table></div>
        </div>
        <div class="delivery-area-horizontal" style="grid-template-columns:repeat(${cardCols},1fr);">
          ${deliveries.map(buildCardHTML).join('')}
        </div>
      </div>`;
  } catch(e) { st.textContent='通信エラー: '+e.message; st.className='status-msg err'; }
});
</script>
</body>
</html>
