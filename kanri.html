<style id="app-style">
/* @page は全環境で確実に効く静的指定（用紙＝縦）。横向きはシート1・2をCSS回転で実現（A案） */
@page { size: A4; margin: 3mm; }
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

body {
  font-family: 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: 13px;
  background: #f5f5f5;
  color: #212121;
}

/* ── ヘッダー ── */
.app-header {
  background: #1a3c5e;
  color: white;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header h1 { font-size: 15px; font-weight: bold; }

/* ── タブバー ── */
.tab-bar {
  background: #1a3c5e;
  border-bottom: 2px solid #0d2a42;
  display: flex;
  padding: 0 8px;
  position: sticky;
  top: 37px;
  z-index: 99;
}
.tab-btn {
  padding: 7px 14px;
  color: rgba(255,255,255,0.65);
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color 0.15s;
}
.tab-btn:hover { color: rgba(255,255,255,0.9); }
.tab-btn.active { color: #fff; border-bottom-color: #64b5f6; font-weight: bold; }
.tab-btn:disabled { color: rgba(255,255,255,0.3); cursor: default; }

/* ── タブコンテンツ ── */
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.active { display: block; }
.placeholder-msg { text-align: center; padding: 60px; color: #888; font-size: 15px; }

/* ── コントロールバー（共通） ── */
.ctrl-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.ctrl-bar label { font-size: 12px; color: #555; }
.ctrl-bar input[type="date"] {
  padding: 4px 8px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-family: inherit;

}
.btn {

  border: none;
  border-radius: 4px;

  font-family: inherit;
  font-size: 13px;
  font-weight: bold;

.btn-primary { background: #1a3c5e; color: white; }
.btn-primary:hover { background: #274f7a; }

  margin-left: 4px;

}
.sheet3-matrix {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  align-items: start;
}

  #tab-sheet1 .matrix-table td,

  #tab-sheet2 .matrix-table td,

  #tab-sheet1 .ref-table td.col-sp   { width: 90px; font-size: 11px; }
  /* シート3：配達カードを画面では少し見やすく */

  #tab-sheet3 .delivery-row .val { font-size: 11px; }

/* ── 印刷スタイル ── */
@media print {
  /* ── 色を維持 ── */
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  body { background: white; padding: 0; margin: 0; }

  /* 画面用UIを全て非表示 */
  .app-header, .tab-bar, .ctrl-bar, .legend { display: none !important; }
  .tab-pane { display: none !important; }

  .page-title {
    font-size: 13pt;
    font-weight: bold;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  /* 竹・松を印刷でもはっきり区別（緑／紫） */
  .cell-take,
  .delivery-header.grade-take,
  .grade-badge.grade-take      { background: #a5d6a7 !important; }
  .cell-matsu,
  .delivery-header.grade-matsu,
  .grade-badge.grade-matsu     { background: #ce93d8 !important; }
  /* ════════ シート1：縦用紙上で横長に回転（A案） ════════ */
  #tab-sheet1.active {
    display: block !important;
    padding: 2mm;
    position: absolute;
    top: 0;
    left: 0;
    width: 291mm;     /* 横向きの幅＝用紙の縦-余白 */
    height: 204mm;    /* 横向きの高さ＝用紙の横-余白 */
    transform-origin: top left;
    transform: rotate(-90deg) translateX(-100%);
  }
  #tab-sheet1 .sheet1-content {
    display: flex;
    gap: 4px;
    align-items: flex-start;
  }
  #tab-sheet1 .table-wrap {
    flex: 0 0 auto;
    overflow: visible;
    min-width: 0;
  }
  #tab-sheet1 .ref-panel { flex: 0 0 auto; }
  #tab-sheet1 .matrix-table { font-size: 9.5pt; }
  /* データセル：2文字基準の正方形（24×24px）・数字を大きく */
  #tab-sheet1 .matrix-table th,
  #tab-sheet1 .matrix-table td {
    width: 24px;
    height: 24px;
    line-height: 24px;
    padding: 0;
  }
  /* 商品名セル：固定幅・はみ出しは切り詰め */
  #tab-sheet1 .matrix-table th:first-child,
  #tab-sheet1 .matrix-table td.cell-name {
    width: 60px;
    max-width: 60px;
    height: 24px;
    line-height: 24px;
    padding: 0 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #tab-sheet1 .ref-table { font-size: 8pt; }
  #tab-sheet1 .ref-table th,
  #tab-sheet1 .ref-table td {
    height: 14px;
    line-height: 14px;
  }

  /* ════════ シート2：縦用紙上で横長に回転（A案） ════════ */
  #tab-sheet2.active {
    display: block !important;
    padding: 2mm;
    position: absolute;
    top: 0;
    left: 0;
    width: 291mm;     /* 横向きの幅＝用紙の縦-余白 */
    height: 204mm;    /* 横向きの高さ＝用紙の横-余白 */
    transform-origin: top left;
    transform: rotate(-90deg) translateX(-100%);
  }
  /* 白米｜玄米｜配達カード を 5fr 5fr 2.5fr 横並び（引き伸ばしなし） */
  #tab-sheet2 .sheet2-container {
    display: grid;
    grid-template-columns: 5fr 5fr 2.5fr;
    gap: 5px;
    align-items: start;
  }
  #tab-sheet2 .table-wrap { overflow: visible; min-width: 0; }
  /* マトリクスは引き伸ばさず自然な高さ */
  #tab-sheet2 .matrix-table {
    width: auto;
    font-size: 9pt;
  }
  /* データセル・拠点列・計列：39×33px に統一・数字13pt */
  #tab-sheet2 .matrix-table th,
  #tab-sheet2 .matrix-table td {
    width: 39px;
    height: 33px;
    line-height: 33px;
    padding: 0;
    font-size: 13pt;
  }
  /* 商品名セル：66px固定・はみ出しは切り詰め（高さはデータセルに追従） */
  #tab-sheet2 .matrix-table th:first-child,
  #tab-sheet2 .matrix-table td.cell-name {
    width: 66px;
    max-width: 66px;
    height: 33px;
    line-height: 33px;
    padding: 0 4px;
    font-size: 9pt;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 空の配達列（その表に数量が1つも無い列）は印刷時のみ非表示 */
  #tab-sheet2 .matrix-table .col-empty-print { display: none; }
  /* セクション見出し行（白米／玄米）は横いっぱい・固定高 */
  #tab-sheet2 .matrix-table td.cell-section-rice,
  #tab-sheet2 .matrix-table td.cell-section-brown {
    width: auto;
    height: 20px;
    line-height: 20px;
    font-size: 9.5pt;
  }
  /* 配達カードエリア：自然流し */
  #tab-sheet2 .delivery-area {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #tab-sheet2 .delivery-card { overflow: hidden; }

  /* ════════ シート3：A4縦（前チャット実装済み・維持／用紙既定が縦） ════════ */
  #tab-sheet3.active {
    display: flex !important;
    flex-direction: column;
    width: 204mm;     /* ← 追加：A4縦の有効幅を明示してブラウザ自動スケール防止 */
    height: 285mm;
    padding: 2mm;
    box-sizing: border-box;
    overflow: hidden;
  }
  #tab-sheet3 .sheet3-container { flex: 1; min-height: 0; gap: 4px; }
  /* マトリクス並びを grid から flex に変更（テーブルが押し縮められないように） */
  #tab-sheet3 .sheet3-matrix {
    display: flex !important;
    flex-direction: row;
    gap: 4px;
    align-items: flex-start;
    flex: 2;
    min-height: 0;
  }
  #tab-sheet3 .sheet3-delivery { flex: 1; min-height: 0; }
  #tab-sheet3 .table-wrap {
    flex: 0 0 auto;
    overflow: visible;
    min-width: 0;
  }
  #tab-sheet3 .delivery-card { overflow: hidden; }
  /* マトリクスはシート2より一回り大きく（コンテンツ少なくてもページに見映えするよう調整） */
  #tab-sheet3 .matrix-table {
    width: auto;
    font-size: 11pt;
  }
  /* データセル・計列：50×42px・数字16pt */
  #tab-sheet3 .matrix-table th,
  #tab-sheet3 .matrix-table td {
    width: 50px;
    height: 42px;
    line-height: 42px;
    padding: 0;
    font-size: 16pt;
  }
  /* 商品名セル：84px固定・はみ出しは切り詰め（高さはデータセルに追従） */
  #tab-sheet3 .matrix-table th:first-child,
  #tab-sheet3 .matrix-table td.cell-name {
    width: 84px;
    max-width: 84px;
    height: 42px;
    line-height: 42px;
    padding: 0 4px;
    font-size: 11pt;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* セクション見出し行（白米／玄米）は横いっぱい・固定高 */
  #tab-sheet3 .matrix-table td.cell-section-rice,
  #tab-sheet3 .matrix-table td.cell-section-brown {
    width: auto;
    height: 26px;
    line-height: 26px;
    font-size: 12pt;
  }

  /* ════════ シート4・発注：縦流し（維持） ════════ */
  #tab-sheet4.active,
  #tab-order.active {
    display: block !important;
    padding: 2mm;
  }
  #tab-sheet4 .kawari-box,
  #tab-sheet4 .kaito-box { page-break-inside: avoid; }
}

<script>
'use strict';

// ─────────────────────────────────────────
// 設定
// ─────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkcAI-Nkl3aoUZKgluss5AawPDc7aluPokONkYz6f2ikwl0S487JvhKdKh6QSp1xhEhA/exec';

// ═══════════════════════════════════════════════════════════
// ドライバー色連動 Phase 4（2026-05-21 v3.4 追加）
// 拠点名セル背景色：代理 > 主担当 > 既定#E9ECEF
// データソース：?action=getLocationsWithAssignment&date=YYYY-MM-DD
// ═══════════════════════════════════════════════════════════
const DRIVER_DEFAULT_BG = '#E9ECEF';
const driverColorCache = {};  // { 'YYYY-MM-DD': { locationId: {color, name, type} } }

async function loadDriverColorMap(dateStr) {
  if (!dateStr) return {};
  if (driverColorCache[dateStr]) return driverColorCache[dateStr];
  try {
    const res  = await fetch(GAS_URL + '?action=getLocationsWithAssignment&date=' + encodeURIComponent(dateStr));
    const data = await res.json();
    if (!Array.isArray(data)) {
      console.warn('[driverColor] unexpected response:', data);
      driverColorCache[dateStr] = {};
      return {};
    }
    const map = {};
    data.forEach(item => {
      if (item && item.locationId) {
        map[item.locationId] = {
          color: item.color || '',
          name:  item.name  || '',
          type:  item.type  || '',
        };
      }
    });
    driverColorCache[dateStr] = map;
    return map;
  } catch (e) {
    console.warn('[driverColor] fetch failed:', e);
    driverColorCache[dateStr] = {};
    return {};
  }
}

// 拠点IDからinline style属性文字列を生成（先頭半角スペース含む）
// 例: ' style="background-color:#FFF0D9 !important;"'
function driverColorStyleAttr(locId, colorMap) {
  if (!colorMap) return '';
  const info = colorMap[locId];
  const color = (info && info.color) ? info.color : DRIVER_DEFAULT_BG;
  return ' style="background-color:' + color + ' !important;"';
}

// 拠点配分タブ・配分調整タブで共通利用するキャッシュ無効化
// （将来GASでマスタ更新後に呼ぶ用途）
function invalidateDriverColorCache(dateStr) {
  if (dateStr) delete driverColorCache[dateStr];
  else Object.keys(driverColorCache).forEach(k => delete driverColorCache[k]);
}

// ★ 単価マスタの「カテゴリー」列の実値に合わせて変更してください
const CATEGORY_COLOR = {
  '海苔弁系': 'blue',
  '満腹系':   'green',
  '全六':     'yellow',
  '他社商品': 'yellow',
  '全':       'yellow',
};

// カテゴリー未設定時のフォールバック（商品名パターン）
const NAME_COLOR_RULES = [
  { re: /^(あいもり|銀鮭|塩麹|照り焼き|鯖から|アジフライ|柚子焼き|マグロ|あさひめ)/, color: 'blue' },
  { re: /^(メンチ|カレー|満腹)/,                                                        color: 'green' },
];

// グレード（日本語） → CSS クラス
function gradeClassOf(g) {
  if (g == null) return '';
  const s = String(g).trim().toLowerCase();
  if (s.indexOf('松') >= 0 || s.indexOf('matsu') >= 0) return 'matsu';
  if (s.indexOf('竹') >= 0 || s.indexOf('take')  >= 0) return 'take';
  if (s.indexOf('梅') >= 0 || s.indexOf('ume')   >= 0) return 'ume';
  return '';
}
function gradeLabelJa(g) {
  const c = gradeClassOf(g);
  if (c === 'matsu') return '松';
  if (c === 'take')  return '竹';
  if (c === 'ume')   return '梅';
  return '—';
}

function getColor(category, baseName) {
  if (category && CATEGORY_COLOR[category]) return CATEGORY_COLOR[category];
  for (const rule of NAME_COLOR_RULES) {
    if (rule.re.test(baseName)) return rule.color;
  }
  return 'yellow';
}

// 複数日選択の状態管理
const s4SelectedDates = new Set();
 
// 日付チェックボックス初期化(今週月〜日 + 来週月〜日 = 14日分)
// v2.1: タイムゾーンバグ修正(UTC date算術に統一)
function initS4DateChecks() {
  const jstNow = new Date(new Date().getTime() + 9 * 60 * 60 * 1000);
  const todayStr = jstNow.toISOString().slice(0, 10);
  const [tYear, tMonth, tDay] = todayStr.split('-').map(Number);
  const todayDow = jstNow.getUTCDay();
  const daysFromMonday = (todayDow === 0) ? 6 : todayDow - 1;
  const thisMondayUtc = new Date(Date.UTC(tYear, tMonth - 1, tDay - daysFromMonday));

  const DOW = ['日','月','火','水','木','金','土'];
  const row = document.getElementById('s4-date-row');
  row.innerHTML = '';
  s4SelectedDates.clear();

  for (let i = 0; i < 14; i++) {
    const d = new Date(thisMondayUtc.getTime() + i * 86400000);
    const dateStr = d.toISOString().slice(0, 10);
    const dispDay = d.getUTCDate();
    const dispDow = d.getUTCDay();
    const isPast = dateStr < todayStr;
    const isToday = dateStr === todayStr;
    const wn = (i < 7) ? 0 : 1;

    const lbl = document.createElement('label');
    let cls = 's4-date-lbl';
    if (isPast)  cls += ' disabled';
    if (isToday) cls += ' today';
    lbl.className = cls;
    lbl.dataset.date = dateStr;
    lbl.dataset.week = wn;

    if (isPast) {
      lbl.innerHTML = `${DOW[dispDow]}${dispDay}`;
    } else {
      const checked = isToday ? ' checked' : '';
      lbl.innerHTML = `<input type="checkbox" value="${dateStr}"${checked}> ${DOW[dispDow]}${dispDay}`;
      if (isToday) {
        lbl.classList.add('checked');
        s4SelectedDates.add(dateStr);
      }
      lbl.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) {
          s4SelectedDates.add(dateStr);
          lbl.classList.add('checked');
        } else {
          s4SelectedDates.delete(dateStr);
          lbl.classList.remove('checked');
        }
        updateS4SelInfo();
      });
    }
    row.appendChild(lbl);
  }
  updateS4SelInfo();
}
 
// 週一括選択（0=今週 / 1=来週）— 過去日は除外
function s4SelectWeek(wn) {
  document.querySelectorAll('#s4-date-row .s4-date-lbl').forEach(lbl => {
    if (lbl.classList.contains('disabled')) return;
    const cb = lbl.querySelector('input');
    if (!cb) return;
    const dateStr = lbl.dataset.date;
    if (parseInt(lbl.dataset.week) === wn) {
      cb.checked = true;
      s4SelectedDates.add(dateStr);
      lbl.classList.add('checked');
    } else {
      cb.checked = false;
      s4SelectedDates.delete(dateStr);
      lbl.classList.remove('checked');
    }
  });
  updateS4SelInfo();
}
 
// 選択情報の更新表示(v2.1: UTC基準でJST日付を正しく表示)
function updateS4SelInfo() {
  const info = document.getElementById('s4-sel-info');
  const dates = Array.from(s4SelectedDates).sort();
  if (dates.length === 0) {
    info.textContent = '日付を選択して取得ボタンを押してください';
    return;
  }
  const DOW = ['日','月','火','水','木','金','土'];
  const labels = dates.map(d => {
    const [y, m, dd] = d.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, dd));
    return m + '/' + dd + '(' + DOW[dt.getUTCDay()] + ')';
  });
  info.textContent = `選択中: ${labels.join(' / ')} （${dates.length}日分）`;
}
 
// 取得ボタン押下時の処理
async function fetchSheet4() {
  const dates = Array.from(s4SelectedDates).sort();
  if (dates.length === 0) {
    s4SetStatus('日付を1日以上選択してください', true);
    return;
  }
  s4SetStatus('取得中…');
  document.getElementById('sheet4-body').innerHTML = '';
  try {
    // ① 最初の日の保存済み日替わり選択を取得
    const kRes  = await fetch(GAS_URL + '?action=getKawariSelections&date=' + dates[0]);
    const kData = await kRes.json();
    const kawari = (kData.ok && kData.selections) ? kData.selections : {};
 
    // ② 仕込み表データを取得（複数日合算）
    const kawariJson = encodeURIComponent(JSON.stringify(kawari));
    const res  = await fetch(GAS_URL + '?action=getSheet4Data&dates=' + dates.join(',') + '&kawari=' + kawariJson);
    const data = await res.json();
    if (!data.ok) {
      s4SetStatus(data.error || '取得エラー', true);
      return;
    }
    s4SetStatus('');
    renderSheet4(data);
 
    // 保存済みバッジ
    const hasSelection = Object.values(kawari).some(v => v !== '');
    if (hasSelection) showS4SavedBadge(dates[0]);
  } catch(e) {
    s4SetStatus('通信エラー: ' + e.message, true);
  }
}
 
// 日替わり保存後の再計算
async function onS4KawariSave() {
  const dates = Array.from(s4SelectedDates).sort();
  if (dates.length === 0) {
    s4SetStatus('日付を1日以上選択してください', true);
    return;
  }
  const targetDate = dates[0];   // 最初の日に保存
  const selections = getS4KawariSelections();
  s4SetStatus('保存中…');
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveKawariSelections', date: targetDate, selections })
    });
    showS4SavedBadge(targetDate);
 
    // 仕込み表を再計算
    const kawariJson = encodeURIComponent(JSON.stringify(selections));
    const res  = await fetch(GAS_URL + '?action=getSheet4Data&dates=' + dates.join(',') + '&kawari=' + kawariJson);
    const data = await res.json();
    if (!data.ok) {
      s4SetStatus(data.error || '更新エラー', true);
      return;
    }
    s4SetStatus('');
    renderSheet4(data);
    showS4SavedBadge(targetDate);
  } catch(e) {
    s4SetStatus('通信エラー: ' + e.message, true);
  }
}

// 描画（Phase 3 v2 戻り値構造に対応）
function renderSheet4(data) {
  const main = document.getElementById('sheet4-body');
  if (!main) return;
 
  if (!data || !data.ok) {
    main.innerHTML = `<div class="s4-error">${escHtml(data && data.error || '取得失敗')}</div>`;
    return;
  }
 
  const dateLabel = (data.dateLabels || []).join(' / ');
  const dateCount = data.dateCount || 0;
  const rows = data.rows || [];
  const kaito = data.kaito || { cut:{}, full:{}, sum:{} };
  const warnings = data.warnings || {};
  const meta = data.meta || {};
 
  // ヘッダー
  let html = '';
  html += `<div class="s4-header">🍳 ${escHtml(dateLabel)} 仕込み表`;
  if (dateCount > 1) html += `<span class="s4-count">（${dateCount}日分合算）</span>`;
  html += `</div>`;
 
  // 日替わり選択UI（candidatesがあれば）
  if (data.candidates && Object.keys(data.candidates).length > 0) {
    html += `<div class="s4-kawari">`;
    html += `<div class="s4-kawari-title">🔄 当日おかず選択（日替わり）</div>`;
    Object.keys(data.candidates).forEach(base => {
      const cands = data.candidates[base];
      ['主菜1', '主菜2'].forEach(slot => {
        const cur = (data.kawari && data.kawari[base + slot]) || '';
        let opts = '<option value="">-- 選択 --</option>';
        cands.forEach(c => {
          const sel = (c === cur) ? ' selected' : '';
          opts += `<option value="${escHtml(c)}"${sel}>${escHtml(c)}</option>`;
        });
        html += `<div class="s4-kawari-row">
          <span class="s4-kawari-label">${escHtml(base)} ${slot}:</span>
          <select class="s4-kawari-sel" data-key="${escHtml(base + slot)}">${opts}</select>
        </div>`;
      });
    });
    html += `<button class="s4-save-btn" onclick="saveSheet4Kawari()">保存</button>`;
    html += `<span class="s4-save-badge" id="s4-save-badge" style="display:none"></span>`;
    html += `</div>`;
  }
 
  // 解凍セクション
  html += `<div class="s4-kaito">`;
  html += `<div class="s4-kaito-title">❄ 解凍</div>`;
  html += `<div class="s4-kaito-row">`;
  html += `<span>カット <strong>${kaito.cut.display}P</strong> <small>(実${kaito.cut.packCeil}P)</small></span>`;
  html += `<span>正肉 <strong>${kaito.full.display}P</strong> <small>(実${kaito.full.packCeil}P)</small></span>`;
  html += `<span>合計 <strong>${kaito.sum.display}P</strong> <small>(実${kaito.sum.packCeil}P)</small></span>`;
  html += `</div></div>`;
 
  // 仕込み表（グループ展開）
  if (!rows.length) {
    html += `<div class="no-delivery-msg">仕込み対象がありません</div>`;
  } else {
    html += `<div class="prep-list">`;
    let directSectionStarted = false;
    rows.forEach(r => {
      if (r.type === 'shikomi_header') {
        html += `<div class="prep-header">${escHtml(r.shikomiName)}<span class="prep-portion">(${r.portion}人前)</span></div>`;
      } else if (r.type === 'shikomi_ing') {
        const amt = (r.amount != null) ? (r.amount + (r.unit || '')) : '–';
        html += `<div class="prep-ing">
          <span class="prep-ing-name">${escHtml(r.ingName)}</span>
          <span class="prep-ing-amt">${escHtml(amt)}</span>
        </div>`;
      } else if (r.type === 'direct') {
        if (!directSectionStarted) {
          html += `<div class="prep-direct-section">───── 食材直接 ─────</div>`;
          directSectionStarted = true;
        }
        const amt = (r.amount != null) ? (r.amount + (r.unit || '')) : '–';
        const pack = (r.packCeil != null) ? (r.packCeil + 'P') : '–';
        html += `<div class="prep-direct">
          <span class="prep-direct-name">${escHtml(r.ingName)}</span>
          <span class="prep-direct-order">${r.orderCount}人前</span>
          <span class="prep-direct-amt">${escHtml(amt)}</span>
          <span class="prep-direct-pack">${escHtml(pack)}</span>
        </div>`;
      }
    });
    html += `</div>`;
  }
 
  // メタ情報
  html += `<div class="s4-meta">📊 拠点分: ${meta.kyotenItems || 0}件 / 配達分: ${meta.deliveryItems || 0}件</div>`;
 
  // 警告
  if (warnings.unmappedProducts && warnings.unmappedProducts.length > 0) {
    html += `<div class="s4-warn">⚠️ 仕込みID/食材ID未紐付け商品 ${warnings.unmappedProducts.length}件:<br>`;
    html += warnings.unmappedProducts.slice(0, 20).map(escHtml).join(', ');
    if (warnings.unmappedProducts.length > 20) html += ` ...他${warnings.unmappedProducts.length - 20}件`;
    html += `</div>`;
  }
 
  main.innerHTML = html;
 
  // 日替わり選択リスナー
  main.querySelectorAll('.s4-kawari-sel').forEach(sel => {
    sel.addEventListener('change', () => {
      const k = sel.dataset.key;
      if (!s4KawariDraft) s4KawariDraft = {};
      s4KawariDraft[k] = sel.value;
    });
  });
}

function renderSheet1(data) {
  const body = document.getElementById('sheet1-body');
  const { dateLabel, locations, rice, brown, subtotalSplit } = data;
  const locIds = locations.map(l => l.id);
  const colorMap = data._driverColorMap || {};  // Phase 4: ドライバー色マップ

  // お茶判定（商品名に「お茶」を含む行を除外）
  const isTea = (r) => r && r.baseName && r.baseName.indexOf('お茶') >= 0;

  // カテゴリー集計用：白米+玄米を結合してお茶を除外
  const allRows = [].concat(rice || [], brown || []).filter(r => !isTea(r));

  // シート1用カテゴリー定義（match に複数の表記揺れを許容）
  const SHEET1_CATEGORIES = [
    { label: '海苔弁系', matches: ['海苔弁系'],                   color: 'blue'   },
    { label: '満腹系',   matches: ['満腹系', '満腹シリーズ'],     color: 'green'  },
    { label: '全六',     matches: ['全六', '全'],                 color: 'yellow' },
    { label: '他社商品', matches: ['他社商品', '他社製品', 'other'], color: 'yellow' }
  ];

  function buildTableHTML(rows, isBrown) {
    if (!rows || rows.length === 0) return '';
    const sectionClass = isBrown ? 'cell-section-brown' : 'cell-section-rice';
    const sectionLabel = isBrown ? '▼ 玄米' : '▼ 白米';
    const rowClass     = isBrown ? 'brown-row' : '';
    const colspan      = 1 + locIds.length + 1 + 1;

    let html = '';
    html += `<tr><td colspan="${colspan}" class="${sectionClass}">${sectionLabel}</td></tr>`;
    html += '<tr>';
    html += '<th style="width:82px;text-align:left;padding-left:5px;">商品</th>';
    locIds.forEach((lid, idx) => {
      const loc      = locations.find(l => l.id === lid);
      const fullName = loc ? loc.name : lid;
      // 表示名優先、空なら拠点名の先頭2文字
      const showName = (loc && loc.displayName && loc.displayName.length > 0)
                        ? loc.displayName
                        : fullName.slice(0, 2);
      if (idx === subtotalSplit) {
        html += `<th class="cell-sub" title="中間計(前${subtotalSplit}拠点)">中計</th>`;
      }
      // Phase 4: ドライバー色を背景色として適用
      const styleAttr = driverColorStyleAttr(lid, colorMap);
      html += `<th title="${escHtml(fullName)}"${styleAttr}>${escHtml(showName)}</th>`;
    });
    html += '<th class="cell-tot">合計</th>';
    html += '</tr>';

    rows.forEach(row => {
      if (!row.total) return;
      if (isTea(row)) return;  // お茶を除外
      const color  = getColor(row.category, row.baseName);
      const trCls  = `g-${color}${rowClass ? ' ' + rowClass : ''}`;
      html += `<tr class="${trCls}">`;
      html += `<td class="cell-name">${escHtml(row.baseName)}</td>`;
      locIds.forEach((lid, idx) => {
        if (idx === subtotalSplit) {
          html += `<td class="cell-sub">${row.subtotal || ''}</td>`;
        }
        const q = row.byLocation[lid];
        html += `<td class="cell-data">${q ? q : ''}</td>`;
      });
      html += `<td class="cell-tot">${row.total || ''}</td>`;
      html += '</tr>';
    });

    return html;
  }

  // カテゴリー別合計行（白米+玄米合算、お茶除外）
  function buildCategoryRowsHTML() {
    const colspan = 1 + locIds.length + 1 + 1;
    let html = '';
    html += `<tr><td colspan="${colspan}" class="cell-section-cat">▼ カテゴリー別合計</td></tr>`;

    SHEET1_CATEGORIES.forEach(cat => {
      const catRows = allRows.filter(r => cat.matches.indexOf(r.category) >= 0);
      if (catRows.length === 0) return;

      // 拠点ごとの合計を計算
      const byLocation = {};
      let subtotal = 0, total = 0;
      locIds.forEach((lid, idx) => {
        let sum = 0;
        catRows.forEach(r => { sum += Number(r.byLocation[lid]) || 0; });
        byLocation[lid] = sum;
        total += sum;
        if (idx < subtotalSplit) subtotal += sum;
      });
      if (total === 0) return;  // 全拠点ゼロなら行ごと省略

      html += `<tr class="cat-row g-${cat.color}">`;
      html += `<td class="cell-name cat-label">${cat.label}</td>`;
      locIds.forEach((lid, idx) => {
        if (idx === subtotalSplit) {
          html += `<td class="cell-sub">${subtotal || ''}</td>`;
        }
        const v = byLocation[lid];
        html += `<td class="cell-data">${v || ''}</td>`;
      });
      html += `<td class="cell-tot">${total}</td>`;
      html += '</tr>';
    });

    // 拠点合計行（全カテゴリー合算）
    const grandByLoc = {};
    let grandSub = 0, grandTotal = 0;
    locIds.forEach((lid, idx) => {
      let sum = 0;
      allRows.forEach(r => { sum += Number(r.byLocation[lid]) || 0; });
      grandByLoc[lid] = sum;
      grandTotal += sum;
      if (idx < subtotalSplit) grandSub += sum;
    });
    html += '<tr class="cat-row cat-grand">';
    html += '<td class="cell-name cat-label">拠点合計</td>';
    locIds.forEach((lid, idx) => {
      if (idx === subtotalSplit) {
        html += `<td class="cell-sub">${grandSub || ''}</td>`;
      }
      html += `<td class="cell-data">${grandByLoc[lid] || ''}</td>`;
    });
    html += `<td class="cell-tot">${grandTotal}</td>`;
    html += '</tr>';

    return html;
  }

  const tableHTML = '<table class="matrix-table">'
    + buildTableHTML(rice,  false)
    + buildTableHTML(brown, true)

const VENDOR_COLOR_MAP = {
  '鶏肉業者': 'red',   '魚業者':   'blue',  '卵業者':   'orange',
  '米業者':   'brown', '食品問屋': 'purple', '豆腐業者': 'teal',

const VENDOR_KW_MAP = [
  ['鶏','red'],['肉','red'],['魚','blue'],['鮭','blue'],['水産','blue'],

function getVendorColorClass(n) {

// 発注済みフラグ（localStorage）
let _orderDoneFlags = {};
let _orderDoneFlagsKey = '';
function loadOrderDoneFlags(key) {
  _orderDoneFlagsKey = 'orderDone_' + key;
  try { _orderDoneFlags = JSON.parse(localStorage.getItem(_orderDoneFlagsKey) || '{}'); }
  catch(e) { _orderDoneFlags = {}; }
}
function saveOrderDoneFlags() {

}

// 選択日セット
const orderSelectedDates = new Set();

// 日付チェックボックス初期化（翌日から月〜日・14日分・今日以前はdisabled）
// v2.1: 土日含む対応＋タイムゾーンバグ修正（UTC算術で統一）
function initOrderDateChecks() {
  const jstNow = new Date(new Date().getTime() + 9 * 60 * 60 * 1000);
  const todayStr = jstNow.toISOString().slice(0, 10);
  const [tYear, tMonth, tDay] = todayStr.split('-').map(Number);

  const startUtc = new Date(Date.UTC(tYear, tMonth - 1, tDay + 1));
  const startDow = startUtc.getUTCDay();
  const daysFromMonday = (startDow === 0) ? 6 : startDow - 1;
  const thisMondayUtc = new Date(startUtc.getTime() - daysFromMonday * 86400000);

  const DOW = ['日','月','火','水','木','金','土'];
  const row = document.getElementById('order-date-row');
  row.innerHTML = '';
  orderSelectedDates.clear();

  for (let i = 0; i < 14; i++) {
    const d = new Date(thisMondayUtc.getTime() + i * 86400000);
    const dateStr = d.toISOString().slice(0, 10);
    const dispDay = d.getUTCDate();
    const dispMonth = d.getUTCMonth() + 1;
    const dispDow = d.getUTCDay();
    const isDisabled = dateStr <= todayStr;
    const wn = (i < 7) ? 0 : 1;

    const lbl = document.createElement('label');
    let cls = 'order-date-lbl';
    if (isDisabled) cls += ' disabled';
    lbl.className = cls;
    lbl.dataset.date = dateStr;
    lbl.dataset.week = wn;

    if (isDisabled) {
      lbl.innerHTML = `${dispMonth}/${dispDay}(${DOW[dispDow]})`;
    } else {
      lbl.innerHTML = `<input type="checkbox" value="${dateStr}"> ${dispMonth}/${dispDay}(${DOW[dispDow]})`;
      lbl.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) {
          orderSelectedDates.add(dateStr);
          lbl.classList.add('checked');
        } else {
          orderSelectedDates.delete(dateStr);
          lbl.classList.remove('checked');
        }
      });
    }
    row.appendChild(lbl);
  }
}

function orderSelectWeek(wn) {
  document.querySelectorAll('#order-date-row .order-date-lbl').forEach(lbl => {
    if (lbl.classList.contains('disabled')) return;
    const cb = lbl.querySelector('input');
    if (!cb) return;
    const dateStr = lbl.dataset.date;
    if (parseInt(lbl.dataset.week) === wn) {
      cb.checked = true;
      orderSelectedDates.add(dateStr);
      lbl.classList.add('checked');
    } else {
      cb.checked = false;
      orderSelectedDates.delete(dateStr);
      lbl.classList.remove('checked');
    }
  });
}

async function fetchOrderData() {
  const dates = Array.from(orderSelectedDates).sort();
  if (dates.length === 0) { orderSetStatus('日付を1日以上選択してください', true); return; }
  orderSetStatus('取得中…');
  document.getElementById('order-body').innerHTML = '';
  try {
    const res  = await fetch(GAS_URL + '?action=getOrderData&dates=' + encodeURIComponent(JSON.stringify(dates)));
    const data = await res.json();
    if (!data.ok) { orderSetStatus(data.error || '取得エラー', true); return; }
    orderSetStatus('');
    loadOrderDoneFlags(dates.join('_'));
    renderOrderData(data);
  } catch(e) {
    orderSetStatus('通信エラー: ' + e.message, true);
  }
}

function renderOrderData(data) {
  const { dates, vendors, dailyBreakdown } = data;
  const DOW = ['日','月','火','水','木','金','土'];

  const datesLabel = dates.map(d => {
    const dt = new Date(d.replace(/-/g, '/'));
    return `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
  }).join('・');
  document.getElementById('order-sel-info').textContent = `選択中：${datesLabel}（${dates.length}日分合計）`;

  const body = document.getElementById('order-body');
  if (!vendors || vendors.length === 0) {
    body.innerHTML = '<div class="placeholder-msg">発注データがありません<br><small>食材マスタと単価マスタの食材ID列を確認してください</small></div>';
    return;
  }

  let html = '';
  vendors.forEach(v => {
    const cc    = getVendorColorClass(v.name);
    const safeN = v.name.replace(/[^\w\u3000-\u9FFF]/g, '_'); // CSSセーフなID用
    const isDone = _orderDoneFlags[v.name] || false;

    // 食材テーブル
    const rows = v.items.map(it =>
      `<tr><td>${escHtml(it.name)}</td><td class="order-qty">${it.packCeil} パック</td></tr>`
    ).join('');

    // 日別内訳
    const bdId = 'order-bd-' + safeN;
    let bdRows = '';
    dates.forEach(d => {
      const dayItems = (dailyBreakdown[d] || []).filter(it => it.vendorName === v.name);
      if (!dayItems.length) return;
      const dt = new Date(d.replace(/-/g, '/'));
      const lbl = `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
      const items = dayItems.map(it => `${escHtml(it.name)} ${it.packCeil}P`).join(' / ');
      bdRows += `<div class="order-bd-row"><span class="order-bd-date">${lbl}</span><span class="order-bd-items">${items}</span></div>`;
    });
    const bdSection = bdRows
      ? `<button class="order-bd-toggle" onclick="toggleOrderBd('${bdId}')"><span id="${bdId}-arrow">▶</span> 日別内訳</button>
         <div class="order-breakdown" id="${bdId}">${bdRows}</div>`
      : '';

    html += `
      <div class="order-vendor-card ${cc}${isDone ? ' done' : ''}" id="ovc-${safeN}">
        <div class="order-vendor-head" onclick="toggleOrderCard('${safeN}')">
          <span class="order-vendor-name">${escHtml(v.name)}</span>
          <span class="order-vendor-summary">（${v.items.length}品目）</span>
          <div style="display:flex;align-items:center;gap:8px;margin-left:auto;" onclick="event.stopPropagation()">
            <label class="order-done-wrap">
              <input type="checkbox" class="order-done-cb" data-vendor="${escHtml(v.name)}"
                ${isDone ? 'checked' : ''} onchange="onOrderDone('${escHtml(v.name)}',this.checked)">
              発注済み
            </label>
            <button class="order-copy-btn" onclick="copyOrderText('${escHtml(v.name)}')">📋 コピー</button>
          </div>
        </div>
        <div class="order-vendor-body" id="ovcb-${safeN}">
          <table class="order-table">
            <thead><tr><th style="text-align:left">食材名</th><th style="text-align:right;width:30%">発注量</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${bdSection}
        </div>
      </div>`;
  });
  body.innerHTML = html;
  window._orderData = data;
}

function toggleOrderCard(safeN) {
  const body = document.getElementById('ovcb-' + safeN);
  if (body) body.style.display = body.style.display === 'none' ? '' : 'none';
}

function toggleOrderBd(bdId) {
  const el    = document.getElementById(bdId);
  const arrow = document.getElementById(bdId + '-arrow');
  if (!el) return;
  el.classList.toggle('open');
  if (arrow) arrow.textContent = el.classList.contains('open') ? '▼' : '▶';
}

function onOrderDone(vendorName, checked) {
  _orderDoneFlags[vendorName] = checked;
  saveOrderDoneFlags();
  const safeN = vendorName.replace(/[^\w\u3000-\u9FFF]/g, '_');
  const card  = document.getElementById('ovc-' + safeN);
  if (card) card.classList.toggle('done', checked);
}

function copyOrderText(vendorName) {
  const data = window._orderData;
  if (!data) return;
  const vendor = data.vendors.find(v => v.name === vendorName);
  if (!vendor) return;
  const DOW = ['日','月','火','水','木','金','土'];
  const datesStr = data.dates.map(d => {
    const dt = new Date(d.replace(/-/g, '/'));
    return `${dt.getMonth()+1}/${dt.getDate()}(${DOW[dt.getDay()]})`;
  }).join('・');

  const lines = [vendorName + ' 発注 ' + datesStr, ''];
  vendor.items.forEach(it => lines.push(`${it.name}\t${it.packCeil}パック`));
  const text = lines.join('\n');

  navigator.clipboard.writeText(text).then(
    () => { orderSetStatus(vendorName + ' のコピー完了'); setTimeout(() => orderSetStatus(''), 2500); },
    () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); orderSetStatus(vendorName + ' のコピー完了'); setTimeout(() => orderSetStatus(''), 2500); }
      catch(e2) { orderSetStatus('コピー失敗', true); }
      finally { document.body.removeChild(ta); }
    }
  );
}

const BM_CATEGORIES = [
  { id:'noriben', label:'海苔弁系' },
  { id:'manpuku', label:'満腹シリーズ' },
  { id:'zenroku', label:'全六' },
  { id:'other',   label:'他社製品' }
];
const BM_SELLOUT_RULES = [
  { from:'08:00', to:'10:59', bonus:5 },
  { from:'11:00', to:'11:59', bonus:3 },
  { from:'12:00', to:'12:59', bonus:2 },
  { from:'13:00', to:'13:59', bonus:1 }
];
const BM_DOW_JA = ['日','月','火','水','木','金','土'];

const BM_LS_KEY = 'kanri_bm_edits_v2_date';  // 旧キー(v1)とは別物。旧データは無効化
let bmCurrentDate = null;     // 'YYYY-MM-DD' 形式
let bmCurrentWeek = 'this';   // 'this' or 'next'
let bmServerData  = null;     // 現在表示中の日付のサーバーデータ
let bmEditsCache  = {};       // { dateStr: { 'pid_lid': editedValue } }
let bmInitialized = false;
let bmLoadedDates = new Set();
let bmThisWeekDates = [];     // ['2026-05-19','2026-05-20',...]
let bmNextWeekDates = [];
let bmDriverColorMap = {};    // Phase 4: 現在表示中の日付のドライバー色マップ

// localStorage 読込
function bmLoadEdits() {
  try {
    const raw = localStorage.getItem(BM_LS_KEY);
    bmEditsCache = raw ? JSON.parse(raw) : {};
  } catch(e) { bmEditsCache = {}; }
  // 旧版localStorage(kanri_bm_edits_v1)があれば削除（曜日キー版・無効化）
  try { localStorage.removeItem('kanri_bm_edits_v1'); } catch(e) {}
}
function bmSaveEdits() {
  try { localStorage.setItem(BM_LS_KEY, JSON.stringify(bmEditsCache)); } catch(e) {}
}
function bmGetEdit(dateStr, pid, lid) {
  return (bmEditsCache[dateStr] && bmEditsCache[dateStr][pid + '_' + lid] !== undefined)
    ? bmEditsCache[dateStr][pid + '_' + lid] : null;
}
function bmSetEdit(dateStr, pid, lid, val) {
  if (!bmEditsCache[dateStr]) bmEditsCache[dateStr] = {};
  if (val === null || val === undefined) {
    delete bmEditsCache[dateStr][pid + '_' + lid];
  } else {
    bmEditsCache[dateStr][pid + '_' + lid] = val;
  }
  bmSaveEdits();
}
function bmClearEditsForLoc(dateStr, lid) {
  if (!bmEditsCache[dateStr]) return;
  const keys = Object.keys(bmEditsCache[dateStr]);
  for (const k of keys) {
    if (k.endsWith('_' + lid)) delete bmEditsCache[dateStr][k];
  }
  bmSaveEdits();
}

// 古い日付の編集キャッシュをクリア（範囲外の日付を削除）
function bmPurgeOldEdits(validDates) {
  const validSet = new Set(validDates);
  const keys = Object.keys(bmEditsCache);
  let purged = 0;
  for (const k of keys) {
    if (!validSet.has(k)) {
      delete bmEditsCache[k];
      purged++;
    }
  }
  if (purged > 0) bmSaveEdits();
  return purged;
}

// 完売増量
function bmGetSelloutBonus(timeStr) {
  if (!timeStr) return 0;
  const s = String(timeStr).substring(0,5);
  for (const r of BM_SELLOUT_RULES) {
    if (s >= r.from && s <= r.to) return r.bonus;
  }
  return 0;
}

// 日付フォーマット系
function bmFmtDateLabel(dateStr) {
  // 'YYYY-MM-DD' → 'M/D(曜)'
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  // JS Date を JST 解釈：YYYY-MM-DD は UTC扱いになるので注意
  // ローカル時刻でつくる
  const dt = new Date(parseInt(parts[0],10), m-1, d);
  const dow = BM_DOW_JA[dt.getDay()];
  return m + '/' + d + '(' + dow + ')';
}
function bmFmtDateFull(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const y = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  const dt = new Date(y, m-1, d);
  const dow = BM_DOW_JA[dt.getDay()];
  return y + '年' + m + '月' + d + '日(' + dow + ')';
}

// 今日の日付取得（YYYY-MM-DD 形式・ローカル時刻）
function bmTodayStr() {
  const t = new Date();
  const y = t.getFullYear();
  const m = String(t.getMonth() + 1).padStart(2, '0');
  const d = String(t.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

// API
async function bmFetchMatrix(dateStr) {
  try {
    const res = await fetch(GAS_URL + '?action=getBasicMasterMatrix&date=' + encodeURIComponent(dateStr));
    const json = await res.json();
    return json;
  } catch(err) {
    return { ok: false, error: String(err) };
  }
}

async function bmPostAction(action, payload) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(Object.assign({ action }, payload || {}))
    });
    return await res.json();
  } catch(err) {
    return { ok: false, error: String(err) };
  }
}

// 確定状態：拠点の全商品でG列に値があるか
function bmIsLocConfirmed(lid) {
  if (!bmServerData) return false;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  for (const p of products) {
    const c = bmServerData.cells[p.id + '_' + lid];
    if (!c) continue;
    if (c.confirmed === null || c.confirmed === undefined) return false;
  }
  return true;
}
function bmIsAllConfirmed() {
  if (!bmServerData) return false;
  for (const loc of bmServerData.locations) {
    if (!bmIsLocConfirmed(loc.id)) return false;
  }
  return true;
}

// セルの「表示する販売数」を取得（編集値 > サーバーweekSales）
function bmGetDisplaySales(pid, lid) {
  const edit = bmGetEdit(bmCurrentDate, pid, lid);
  if (edit !== null && edit !== undefined && edit !== '') return Number(edit);
  if (!bmServerData) return 0;
  const c = bmServerData.cells[pid + '_' + lid];
  return c ? c.weekSales : 0;
}

// レンダリング
function bmRenderAll() {
  bmRenderWeekTabs();
  bmRenderDayTabs();
  bmRenderCalcInfo();
  bmRenderMatrix();
  bmUpdateConfirmAllBtn();
  bmUpdateSubtitle();
}

function bmRenderWeekTabs() {
  const wrap = document.getElementById('bm-week-tabs');
  if (!wrap) return;
  const buttons = wrap.querySelectorAll('.bm-week-tab');
  buttons.forEach(b => {
    if (b.dataset.week === bmCurrentWeek) b.classList.add('bm-active');
    else b.classList.remove('bm-active');
  });
}

function bmRenderDayTabs() {
  const wrap = document.getElementById('bm-day-tabs');
  if (!wrap) return;
  const dates = bmCurrentWeek === 'next' ? bmNextWeekDates : bmThisWeekDates;
  if (!dates || dates.length === 0) {
    wrap.innerHTML = '<span style="color:#999;font-size:9pt;">日付未取得</span>';
    return;
  }
  let html = '';
  for (const ds of dates) {
    const active = (ds === bmCurrentDate) ? 'bm-active' : '';
    html += '<button class="bm-day-tab ' + active + '" data-date="' + ds + '" onclick="bmSetDate(\'' + ds + '\')">' + bmFmtDateLabel(ds) + '</button>';
  }
  wrap.innerHTML = html;
}

function bmRenderCalcInfo() {
  const el = document.getElementById('bm-calc-info');
  if (!bmServerData) { el.innerHTML = ''; return; }
  const w = bmServerData.weights;
  let confirmedCount = 0;
  for (const loc of bmServerData.locations) if (bmIsLocConfirmed(loc.id)) confirmedCount++;
  let selloutCount = 0, diffCount = 0;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  for (const loc of bmServerData.locations) {
    for (const p of products) {
      const c = bmServerData.cells[p.id + '_' + loc.id];
      if (!c) continue;
      if (c.selloutTime) selloutCount++;
      const sales = bmGetDisplaySales(p.id, loc.id);
      if (c.proposed !== sales && c.proposed > 0) diffCount++;
    }
  }
  // 反映元（= 先週同曜の日付 = histDates[0]）
  const sourceDate = (bmServerData.histDates && bmServerData.histDates[0]) ? bmServerData.histDates[0] : '';
  let html = '';
  html += '<span><b>計算式:</b> W1:' + w.w1 + ' / W2:' + w.w2 + ' / W3:' + w.w3 + ' / W4:' + w.w4 + '</span>';
  html += '<span><b>反映元:</b> ' + bmFmtDateLabel(sourceDate) + '</span>';
  html += '<span><b>配達日:</b> ' + bmFmtDateLabel(bmServerData.thisWeekDate) + '</span>';
  html += '<span class="bm-diff-summary">変動: ' + diffCount + '件</span>';
  html += '<span class="bm-sellout-summary">🔴 完売: ' + selloutCount + '件</span>';
  html += '<span class="bm-progress-summary">確定: ' + confirmedCount + '/' + bmServerData.locations.length + '拠点</span>';
  el.innerHTML = html;
}

function bmRenderMatrix() {
  const wrap = document.getElementById('bm-matrix-wrap');
  if (!bmServerData) { wrap.innerHTML = '<div class="bm-loading">読み込み中...</div>'; return; }
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const totalCols = 1 + bmServerData.locations.length + 1;
  let html = '<table class="bm-matrix">';
  html += '<thead><tr>';
  html += '<th rowspan="2" class="bm-product-cell">商品名</th>';
  for (const loc of bmServerData.locations) {
    const cf = bmIsLocConfirmed(loc.id) ? 'bm-loc-confirmed-h' : '';
    html += '<th class="bm-loc-id-h ' + cf + '">' + loc.no + '</th>';
  }
  html += '<th rowspan="2" class="bm-total-col">合計</th></tr><tr>';
  for (const loc of bmServerData.locations) {
    const cf = bmIsLocConfirmed(loc.id) ? 'bm-loc-confirmed-h' : '';
    const copyBtn = '<span class="bm-copy-btn" onclick="event.stopPropagation();bmCopyLocationCol(\'' + loc.id + '\')" title="この拠点の列をコピー">⧉</span>';
    const clearBtn = '<span class="bm-clear-btn" onclick="event.stopPropagation();bmClearLocationCol(\'' + loc.id + '\')" title="この拠点の全商品を0にする">🗑</span>';
    // 表示名優先（空なら拠点名）
    const showName = (loc.displayName && loc.displayName.length > 0) ? loc.displayName : loc.name;
    const titleAttr = (loc.displayName && loc.displayName !== loc.name) ? (' title="' + bmEscape(loc.name) + '"') : '';
    // Phase 4: ドライバー色を背景色として適用（!importantで既存CSS上書き）
    const styleAttr = driverColorStyleAttr(loc.id, bmDriverColorMap);
    html += '<th class="bm-loc-name-h ' + cf + '"' + titleAttr + styleAttr + '>' + bmEscape(showName) + copyBtn + clearBtn + '</th>';
  }
  html += '</tr></thead>';

  // 白米
  html += '<tbody>';
  html += '<tr><td class="bm-section-label" colspan="' + totalCols + '">▼ 白米</td></tr>';
  for (const p of bmServerData.products.rice) html += bmRenderRow(p);
  html += '</tbody>';
  // 玄米
  html += '<tbody class="bm-brown">';
  html += '<tr><td class="bm-section-label bm-brown-label" colspan="' + totalCols + '">▼ 玄米</td></tr>';
  for (const p of bmServerData.products.brown) html += bmRenderRow(p);
  html += '</tbody>';

  // 拠点合計
  html += '<tbody>';
  html += '<tr class="bm-summary-row"><td class="bm-product-cell">拠点合計</td>';
  let grand = 0;
  for (const loc of bmServerData.locations) {
    let sum = 0;
    for (const p of products) sum += bmGetDisplaySales(p.id, loc.id);
    grand += sum;
    const cf = bmIsLocConfirmed(loc.id) ? 'bm-loc-confirmed' : '';
    html += '<td class="' + cf + '">' + sum + '</td>';
  }
  html += '<td class="bm-total-col">' + grand + '</td></tr>';

  // カテゴリ別合計
  for (const cat of BM_CATEGORIES) html += bmRenderCategoryRow(cat);

  // 確定ボタン行
  html += '<tr class="bm-loc-confirm-row"><td class="bm-product-cell">確定</td>';
  for (const loc of bmServerData.locations) {
    const isC = bmIsLocConfirmed(loc.id);
    const cls = isC ? 'bm-loc-confirm-btn bm-done' : 'bm-loc-confirm-btn';
    const txt = isC ? '✓' : '確定';
    html += '<td><button class="' + cls + '" data-lid="' + loc.id + '" onclick="bmConfirmLoc(\'' + loc.id + '\')">' + txt + '</button></td>';
  }
  html += '<td class="bm-total-col">—</td></tr>';

  // 推奨ボタン行
  html += '<tr class="bm-loc-recommend-row"><td class="bm-product-cell">推奨</td>';
  for (const loc of bmServerData.locations) {
    const isC = bmIsLocConfirmed(loc.id);
    const dis = isC ? 'disabled' : '';
    html += '<td><button class="bm-loc-recommend-btn" data-lid="' + loc.id + '" onclick="bmRecommendLoc(\'' + loc.id + '\')" ' + dis + ' title="提案値を採用+確定">→推奨</button></td>';
  }
  html += '<td class="bm-total-col">—</td></tr>';
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function bmRenderRow(p) {
  const copyBtn = '<span class="bm-copy-btn" onclick="event.stopPropagation();bmCopyProductRow(\'' + p.id + '\')" title="この商品の行をコピー">⧉</span>';
  const clearBtn = '<span class="bm-clear-btn" onclick="event.stopPropagation();bmClearProductRow(\'' + p.id + '\')" title="この商品の全拠点を0にする">🗑</span>';
  // 表示名優先、空ならname
  const showName = (p.displayName && p.displayName.length > 0) ? p.displayName : p.name;
  const titleAttr = (p.displayName && p.displayName !== p.name) ? (' title="' + bmEscape(p.name) + '"') : '';
  let html = '<tr><td class="bm-product-cell"' + titleAttr + '>' + bmEscape(showName) + copyBtn + clearBtn + '</td>';
  let total = 0;
  for (const loc of bmServerData.locations) {
    total += bmGetDisplaySales(p.id, loc.id);
    html += bmRenderCell(p.id, loc.id);
  }
  html += '<td class="bm-total-col">' + total + '</td></tr>';
  return html;
}

function bmRenderCell(pid, lid) {
  const c = bmServerData.cells[pid + '_' + lid];
  if (!c) return '<td class="bm-data-cell"></td>';
  const sales = bmGetDisplaySales(pid, lid);
  const pro = c.proposed;
  const diff = pro - sales;
  const isLocC = bmIsLocConfirmed(lid);
  const hasSO = !!c.selloutTime;
  const isZero = !pro && !sales;
  const edit = bmGetEdit(bmCurrentDate, pid, lid);
  const isEdited = (edit !== null && edit !== undefined);

  let cls = 'bm-data-cell';
  if (isLocC) cls += ' bm-loc-confirmed';
  if (isZero) cls += ' bm-zero-cell';

  let salesCls = 'bm-cell-sales';
  if (c.isFallback && !isEdited) salesCls += ' bm-fallback';
  if (isEdited) salesCls += ' bm-edited';
  if (!sales && !isZero) salesCls += ' bm-no-sales';
  if (isZero) salesCls += ' bm-no-sales';

  const proStr = pro || '–';
  const salStr = (sales || sales === 0) && pro ? String(sales) : (sales ? String(sales) : '–');

  let ind = '';
  if (diff > 0 && pro > 0) ind = '<span class="bm-ind-up">▲</span>';
  else if (diff < 0 && pro > 0) ind = '<span class="bm-ind-down">▼</span>';
  const badge = hasSO ? '<span class="bm-sellout-badge"></span>' : '';

  const editable = !isZero;
  const rangeAttrs = ' onmousedown="bmOnCellMouseDown(event,\'' + pid + '\',\'' + lid + '\')" onmouseenter="bmOnCellMouseEnter(event,\'' + pid + '\',\'' + lid + '\')"';
  const editAttrs = editable
    ? 'contenteditable="true" inputmode="numeric" data-pid="' + pid + '" data-lid="' + lid + '" onkeydown="bmOnSalesKey(event)" onblur="bmOnSalesBlur(this)" onfocus="bmOnSalesFocus(this)"' + rangeAttrs
    : 'data-pid="' + pid + '" data-lid="' + lid + '"' + rangeAttrs;
  const proClick = isZero ? '' : 'onclick="bmOpenModal(\'' + pid + '\',\'' + lid + '\')"';

  return '<td class="' + cls + '">'
    + '<div class="bm-cell-2col">' + badge
    + '<div class="' + salesCls + '" ' + editAttrs + '>' + salStr + '</div>'
    + '<div class="bm-cell-proposal" ' + proClick + '>' + proStr + ind + '</div>'
    + '</div></td>';
}

function bmRenderCategoryRow(cat) {
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  let html = '<tr class="bm-cat-row"><td class="bm-product-cell bm-cat-label">' + cat.label + '</td>';
  let totalNext = 0, totalSales = 0;
  for (const loc of bmServerData.locations) {
    let sumP = 0, sumS = 0;
    for (const p of products) {
      if (p.group !== cat.id) continue;
      const c = bmServerData.cells[p.id + '_' + loc.id];
      if (!c) continue;
      sumP += c.proposed;
      sumS += bmGetDisplaySales(p.id, loc.id);
    }
    totalNext += sumP;
    totalSales += sumS;
    const isC = bmIsLocConfirmed(loc.id);
    const isZero = !sumP && !sumS;
    let cls = 'bm-cat-cell';
    if (isC) cls += ' bm-loc-confirmed';
    if (isZero) cls += ' bm-cat-cell-zero';
    html += '<td class="' + cls + '"><div class="bm-cat-cell-actual">' + (sumS || '–') + '</div><div class="bm-cat-cell-next">' + (sumP || '–') + '</div></td>';
  }
  html += '<td class="bm-total-col"><div class="bm-cat-cell-actual">' + totalSales + '</div><div class="bm-cat-cell-next">' + totalNext + '</div></td></tr>';
  return html;
}

function bmUpdateConfirmAllBtn() {
  const btn = document.getElementById('bm-confirm-all');
  if (!btn) return;
  if (bmIsAllConfirmed()) {
    btn.classList.add('bm-done');
    btn.textContent = '✓ 全拠点確定済（クリックで解除）';
  } else {
    btn.classList.remove('bm-done');
    btn.textContent = '✓ 全拠点確定';
  }
}
function bmUpdateSubtitle() {
  const el = document.getElementById('bm-subtitle');
  if (!el || !bmServerData) { if(el) el.textContent = '読み込み中...'; return; }
  const r = bmServerData.products.rice.length;
  const b = bmServerData.products.brown.length;
  el.textContent = bmFmtDateFull(bmCurrentDate) + ' / ' + bmServerData.locations.length + '拠点 × ' + (r+b) + 'SKU';
}

// 編集ハンドラ
function bmOnSalesFocus(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  if (el.classList.contains('bm-fallback')) el.textContent = '';
}
function bmOnSalesKey(e) {
  const allowed = /^[0-9]$/.test(e.key) || ['Backspace','Delete','Tab','ArrowLeft','ArrowRight'].includes(e.key);
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Escape') { e.target.blur(); return; }
  if (!allowed) e.preventDefault();
}
function bmOnSalesBlur(el) {
  const pid = el.dataset.pid;
  const lid = el.dataset.lid;
  const raw = (el.textContent || '').trim();
  const c = bmServerData.cells[pid + '_' + lid];
  let newVal;
  if (raw === '') {
    newVal = null;
  } else {
    const v = parseInt(raw, 10);
    if (isNaN(v) || v < 0) {
      newVal = null;
    } else {
      const orig = c ? c.weekSales : 0;
      newVal = (v === orig) ? null : v;
    }
  }
  // Undo履歴付きで設定
  bmSetEditWithHistory(bmCurrentDate, pid, lid, newVal);
  bmRenderMatrix();
  bmRenderCalcInfo();
}

// 内訳モーダル
function bmOpenModal(pid, lid) {
  const c = bmServerData.cells[pid + '_' + lid];
  if (!c || (!c.proposed && !c.weekSales)) return;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const p = products.find(x => x.id === pid);
  const loc = bmServerData.locations.find(x => x.id === lid);
  const isBrown = bmServerData.products.brown.some(b => b.id === pid);
  const productLabel = isBrown ? p.name + '(玄米)' : p.name + '(白米)';
  const hasSO = !!c.selloutTime;
  const dowJa = bmServerData.dowJa || '';

  document.getElementById('bm-modal-title').textContent = productLabel + ' @ ' + loc.name;
  document.getElementById('bm-modal-subtitle').textContent = bmFmtDateLabel(bmCurrentDate) + ' / 翌週提案の計算内訳';
  const head = document.getElementById('bm-modal-head');
  head.classList.toggle('bm-has-sellout', hasSO);

  const histLabels = ['先週','2週前','3週前','4週前'];
  let histHtml = '<table class="bm-modal-history-table">';
  for (let i = 0; i < 4; i++) {
    const h = c.hist[i];
    const isSO = (i === 0 && hasSO);
    const trCls = isSO ? 'bm-is-sellout' : '';
    const mark = isSO ? '<span class="bm-sellout-mark-inline">🔴 ' + c.selloutTime + '完売</span>' : '';
    histHtml += '<tr class="' + trCls + '"><td class="bm-h-label">' + histLabels[i] + '<br><span style="font-size:7.5pt;color:#888;font-weight:normal;">' + h.date + '</span></td><td class="bm-h-value">' + h.value + '個 ' + mark + '</td></tr>';
  }
  histHtml += '</table>';

  const w = bmServerData.weights;
  const wAvg = c.weightedAvg.toFixed(1);
  let calcHtml = '<div class="bm-modal-calc">';
  calcHtml += '<div class="bm-modal-calc-row"><span class="bm-modal-calc-label">加重平均(W1:' + w.w1 + '/W2:' + w.w2 + '/W3:' + w.w3 + '/W4:' + w.w4 + ')</span><span class="bm-modal-calc-value">' + wAvg + '個</span></div>';
  if (hasSO) {
    calcHtml += '<div class="bm-modal-calc-row"><span class="bm-modal-calc-label">🔴 完売増量(' + c.selloutTime + ')</span><span class="bm-modal-calc-value bm-bonus">+' + c.selloutBonus + '個</span></div>';
  } else {

// 操作
async function bmSetWeek(week) {
  if (week === bmCurrentWeek) return;
  bmCurrentWeek = week;
  bmRenderWeekTabs();
  // 切り替え先の週の最初の日付（または今日に最も近い日付）を選択
  const dates = (week === 'next') ? bmNextWeekDates : bmThisWeekDates;
  if (!dates || dates.length === 0) {
    bmRenderDayTabs();
    return;
  }
  // this 週なら「今日」or 今日より過去の最終日 or 月曜
  // next 週なら最初の日（月曜）
  let target = dates[0];
  if (week === 'this') {
    const today = bmTodayStr();
    if (dates.indexOf(today) >= 0) target = today;
    else {
      // 今日が日付配列に無いなら最も近い日（過去寄り）を選ぶ
      for (let i = dates.length - 1; i >= 0; i--) {
        if (dates[i] <= today) { target = dates[i]; break; }
      }
    }
  }
  await bmSetDate(target);
}

async function bmSetDate(dateStr) {
  if (dateStr === bmCurrentDate && bmServerData) return;
  bmCurrentDate = dateStr;
  // 週の自動切替
  if (bmNextWeekDates.indexOf(dateStr) >= 0) bmCurrentWeek = 'next';
  else if (bmThisWeekDates.indexOf(dateStr) >= 0) bmCurrentWeek = 'this';
  await bmLoadDate(dateStr);
}

async function bmLoadDate(dateStr) {
  const wrap = document.getElementById('bm-matrix-wrap');
  wrap.innerHTML = '<div class="bm-loading">配分調整を読み込み中...</div>';
  document.getElementById('bm-calc-info').innerHTML = '';
  // Phase 4: ドライバー色マップを並列取得
  const [r, colorMap] = await Promise.all([
    bmFetchMatrix(dateStr),
    loadDriverColorMap(dateStr)
  ]);
  if (!r.ok) {
    wrap.innerHTML = '<div class="bm-error">取得エラー: ' + bmEscape(r.error || '不明') + '</div>';
    return;
  }
  bmServerData = r;
  bmDriverColorMap = colorMap || {};  // Phase 4
  bmLoadedDates.add(dateStr);
  // サーバーから受け取った表示対象日付配列を保存
  if (r.thisWeekDates) bmThisWeekDates = r.thisWeekDates;
  if (r.nextWeekDates) bmNextWeekDates = r.nextWeekDates;
  // 古い編集キャッシュを掃除（範囲外日付）
  const allDates = bmThisWeekDates.concat(bmNextWeekDates);
  bmPurgeOldEdits(allDates);
  bmRenderAll();
}

async function bmReload() {
  await bmLoadDate(bmCurrentDate);
}

async function bmConfirmLoc(lid) {
  if (!bmServerData) return;
  if (bmIsLocConfirmed(lid)) {
    // 解除
    const locName = (bmServerData.locations.find(l => l.id === lid) || {}).name || lid;
    if (!confirm(locName + ' の確定を解除しますか？\n(G列をクリアします)')) return;
    const r = await bmPostAction('unconfirmBasicMasterLocation', { date: bmCurrentDate, locId: lid });
    if (!r.ok) { alert('解除失敗: ' + (r.error || '')); return; }
    await bmLoadDate(bmCurrentDate);
    return;
  }
  // 確定：編集値を items に集約
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const items = {};
  for (const p of products) {
    const e = bmGetEdit(bmCurrentDate, p.id, lid);
    if (e !== null && e !== undefined) items[p.id] = Number(e);

  await bmLoadDate(bmCurrentDate);

async function bmConfirmAll() {
  if (!bmServerData) return;
  const dateLabel = bmFmtDateLabel(bmCurrentDate);
  if (bmIsAllConfirmed()) {
    if (!confirm(dateLabel + ' の全25拠点の確定を解除しますか？\n(G列をすべてクリアします)')) return;
    for (const loc of bmServerData.locations) {

    }
    bmEditsCache[bmCurrentDate] = {};
    bmSaveEdits();
    await bmLoadDate(bmCurrentDate);

  if (!confirm(dateLabel + ' の全25拠点を確定します。\n(編集値あれば編集値、なければ提案値をG列に保存)\nよろしいですか？')) return;
  const itemsByLoc = {};
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  for (const loc of bmServerData.locations) {
    const locItems = {};
    for (const p of products) {

}

function wpEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function wpToast(msg, type) {
  type = type || 'info';
  let t = document.getElementById('wp-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'wp-toast';
    t.className = 'wp-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'wp-toast wp-show wp-' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.className = 'wp-toast wp-' + type;
  }, 2500);
}

async function wpFetch(action, params) {
  const usp = new URLSearchParams();
  usp.set('action', action);
  if (params) {
    for (const k of Object.keys(params)) {
      usp.set(k, params[k]);
    }
  }
  try {
    const res = await fetch(GAS_URL + '?' + usp.toString());
    return await res.json();
  } catch (err) {
    return { ok: false, error: String(err) };
  }
}

// ============================================================
// F7 Undo/Redo: 編集の履歴管理
// ============================================================
function bmPushHistory(actions) {
  // actions: [{date, pid, lid, oldVal, newVal}]
  if (!actions || actions.length === 0) return;
  bmUndoStack.push({ actions: actions });
  if (bmUndoStack.length > BM_HISTORY_MAX) bmUndoStack.shift();
  bmRedoStack = []; // 新操作でRedo履歴クリア
  bmUpdateUndoBtns();
}

function bmApplyHistoryActions(actions, isUndo) {
  // isUndo=true → oldVal を適用、false → newVal を適用
  for (const a of actions) {
    const v = isUndo ? a.oldVal : a.newVal;
    if (v === null || v === undefined) {
      bmSetEdit(a.date, a.pid, a.lid, null);
    } else {
      bmSetEdit(a.date, a.pid, a.lid, v);
    }
  }
}

function bmDoUndo() {
  if (bmUndoStack.length === 0) return;
  const entry = bmUndoStack.pop();
  bmApplyHistoryActions(entry.actions, true);
  bmRedoStack.push(entry);
  if (bmRedoStack.length > BM_HISTORY_MAX) bmRedoStack.shift();
  bmRenderMatrix();
  bmRenderCalcInfo();
  bmUpdateUndoBtns();
  wpToast('元に戻しました（' + entry.actions.length + '件）', 'info');
}

function bmDoRedo() {
  if (bmRedoStack.length === 0) return;
  const entry = bmRedoStack.pop();
  bmApplyHistoryActions(entry.actions, false);
  bmUndoStack.push(entry);
  if (bmUndoStack.length > BM_HISTORY_MAX) bmUndoStack.shift();
  bmRenderMatrix();
  bmRenderCalcInfo();
  bmUpdateUndoBtns();
  wpToast('やり直しました（' + entry.actions.length + '件）', 'info');
}

function bmUpdateUndoBtns() {
  const ub = document.getElementById('bm-undo-btn');
  const rb = document.getElementById('bm-redo-btn');
  if (ub) ub.disabled = (bmUndoStack.length === 0);
  if (rb) rb.disabled = (bmRedoStack.length === 0);
}

// 編集を1件単位で履歴に積む（既存 bmSetEdit のラッパ）
function bmSetEditWithHistory(date, pid, lid, newVal) {
  const oldVal = bmGetEdit(date, pid, lid);
  if (oldVal === newVal) return;
  bmSetEdit(date, pid, lid, newVal);
  bmPushHistory([{ date, pid, lid, oldVal, newVal }]);
}

// 複数編集をまとめて履歴に積む
function bmSetEditsBulk(changes) {
  // changes: [{date, pid, lid, newVal}]
  const actions = [];
  for (const c of changes) {
    const oldVal = bmGetEdit(c.date, c.pid, c.lid);
    if (oldVal === c.newVal) continue;
    bmSetEdit(c.date, c.pid, c.lid, c.newVal);
    actions.push({ date: c.date, pid: c.pid, lid: c.lid, oldVal: oldVal, newVal: c.newVal });
  }
  if (actions.length > 0) {
    bmPushHistory(actions);
  }
  return actions.length;
}

// ============================================================
// F3 範囲選択
// ============================================================
function bmCellKey(pid, lid) { return pid + '_' + lid; }
function bmIsSelected(pid, lid) { return bmSelectedCells.has(bmCellKey(pid, lid)); }

function bmClearSelection() {
  bmSelectedCells.clear();
  bmUpdateSelectionUI();
  bmUpdateActionBar();
}

function bmAddToSelection(pid, lid) {
  bmSelectedCells.add(bmCellKey(pid, lid));
}

function bmUpdateSelectionUI() {
  // DOM上の選択状態を反映
  const cells = document.querySelectorAll('#tab-master .bm-cell-sales[data-pid]');
  cells.forEach(el => {
    const k = bmCellKey(el.dataset.pid, el.dataset.lid);
    if (bmSelectedCells.has(k)) el.classList.add('bm-selected');
    else el.classList.remove('bm-selected');
  });
}

function bmSelectRange(startPid, startLid, endPid, endLid) {
  if (!bmServerData) return;
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const pids = products.map(p => p.id);
  const lids = bmServerData.locations.map(l => l.id);
  const pi1 = pids.indexOf(startPid), pi2 = pids.indexOf(endPid);
  const li1 = lids.indexOf(startLid), li2 = lids.indexOf(endLid);
  if (pi1 < 0 || pi2 < 0 || li1 < 0 || li2 < 0) return;
  const pMin = Math.min(pi1, pi2), pMax = Math.max(pi1, pi2);
  const lMin = Math.min(li1, li2), lMax = Math.max(li1, li2);
  bmSelectedCells.clear();
  for (let i = pMin; i <= pMax; i++) {
    for (let j = lMin; j <= lMax; j++) {
      bmAddToSelection(pids[i], lids[j]);
    }
  }
  bmUpdateSelectionUI();
  bmUpdateActionBar();
}

function bmOnCellMouseDown(e, pid, lid) {
  if (e.button !== 0) return; // 左クリックのみ
  // contenteditable のクリック編集を邪魔しないように、Shift/Ctrl 押下時のみ範囲動作
  if (!e.shiftKey && !e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  if (e.shiftKey && bmRangeStart) {
    // 範囲指定
    bmSelectRange(bmRangeStart.pid, bmRangeStart.lid, pid, lid);
  } else {
    // 単一選択開始
    bmRangeStart = { pid, lid };
    bmSelectedCells.clear();
    bmAddToSelection(pid, lid);
    bmUpdateSelectionUI();
    bmUpdateActionBar();
    bmRangeDragging = true;
  }
}

function bmOnCellMouseEnter(e, pid, lid) {
  if (!bmRangeDragging || !bmRangeStart) return;
  bmSelectRange(bmRangeStart.pid, bmRangeStart.lid, pid, lid);
}

function bmOnGlobalMouseUp() {
  bmRangeDragging = false;
}

// ============================================================
// F4 一括クリア用アクションバー
// ============================================================
function bmUpdateActionBar() {
  let bar = document.getElementById('bm-action-bar');
  if (!bar) return;
  if (bmSelectedCells.size === 0) {
    bar.classList.remove('bm-visible');
  } else {
    bar.classList.add('bm-visible');
    const cnt = document.getElementById('bm-action-count');
    if (cnt) cnt.textContent = bmSelectedCells.size;
  }
}

function bmActionClearZero() {
  if (bmSelectedCells.size === 0) return;
  const changes = [];
  for (const k of bmSelectedCells) {
    const [pid, lid] = k.split('_');
    changes.push({ date: bmCurrentDate, pid, lid, newVal: 0 });
  }
  const n = bmSetEditsBulk(changes);
  bmRenderMatrix();
  bmRenderCalcInfo();
  wpToast(n + '件を0にしました', 'success');
  bmClearSelection();
}

function bmActionDeselect() {
  bmClearSelection();
}

function bmActionCopy() {
  if (bmSelectedCells.size === 0) return;
  const cells = [];
  for (const k of bmSelectedCells) {
    const [pid, lid] = k.split('_');
    const v = bmGetDisplaySales(pid, lid);
    cells.push({ pid, lid, val: v });
  }
  bmCopyBuffer = { type: 'range', cells: cells };
  wpToast('コピーしました（' + cells.length + 'セル）', 'info');
}

function bmActionPaste() {
  if (!bmCopyBuffer || bmCopyBuffer.type !== 'range' || bmSelectedCells.size === 0) {
    wpToast('貼り付け先を選択してください', 'error');
    return;
  }
  // 単純実装：選択範囲の左上に貼り付け（オフセット計算）
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const pids = products.map(p => p.id);
  const lids = bmServerData.locations.map(l => l.id);

  // コピー元の左上を求める
  const srcPids = [...new Set(bmCopyBuffer.cells.map(c => c.pid))];
  const srcLids = [...new Set(bmCopyBuffer.cells.map(c => c.lid))];
  const srcPiMin = Math.min(...srcPids.map(p => pids.indexOf(p)));
  const srcLiMin = Math.min(...srcLids.map(l => lids.indexOf(l)));

  // 貼り付け先の左上を求める
  const dstPids = [...new Set([...bmSelectedCells].map(k => k.split('_')[0]))];
  const dstLids = [...new Set([...bmSelectedCells].map(k => k.split('_')[1]))];
  const dstPiMin = Math.min(...dstPids.map(p => pids.indexOf(p)));
  const dstLiMin = Math.min(...dstLids.map(l => lids.indexOf(l)));

  const dPi = dstPiMin - srcPiMin;
  const dLi = dstLiMin - srcLiMin;

  // F8 カテゴリ違い警告
  const srcCats = new Set();
  const dstCats = new Set();
  for (const c of bmCopyBuffer.cells) {
    const p = products.find(x => x.id === c.pid);
    if (p) srcCats.add(p.group || p.category || '');
  }
  for (const cell of bmCopyBuffer.cells) {
    const srcPi = pids.indexOf(cell.pid);
    const newPi = srcPi + dPi;
    if (newPi < 0 || newPi >= pids.length) continue;
    const p = products.find(x => x.id === pids[newPi]);
    if (p) dstCats.add(p.group || p.category || '');
  }
  const srcCatArr = [...srcCats];
  const dstCatArr = [...dstCats];
  if (srcCatArr.length > 0 && dstCatArr.length > 0 &&
      !srcCatArr.every(c => dstCatArr.includes(c))) {
    if (!confirm('コピー元と貼り付け先のカテゴリが違います。\n続行しますか？')) return;
  }

  const changes = [];
  for (const cell of bmCopyBuffer.cells) {
    const srcPi = pids.indexOf(cell.pid);
    const srcLi = lids.indexOf(cell.lid);
    const newPi = srcPi + dPi;
    const newLi = srcLi + dLi;
    if (newPi < 0 || newPi >= pids.length) continue;
    if (newLi < 0 || newLi >= lids.length) continue;
    changes.push({
      date: bmCurrentDate,
      pid: pids[newPi],
      lid: lids[newLi],
      newVal: cell.val
    });
  }
  const n = bmSetEditsBulk(changes);
  bmRenderMatrix();
  bmRenderCalcInfo();
  wpToast(n + 'セルに貼り付けました', 'success');
  bmClearSelection();
}

function bmClearProductRow(pid) {
  if (!bmServerData) return;

    const warn = (cat !== srcCat) ? ' <span style="color:#c62828;font-size:8.5pt;">⚠️ カテゴリ違い</span>' : '';
    const showName = (p.displayName && p.displayName.length > 0) ? p.displayName : p.name;
    html += '<label style="display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid #eee;border-radius:3px;cursor:pointer;">'
      + '<input type="checkbox" class="wp-paste-target" data-pid="' + wpEsc(p.id) + '" data-cat="' + wpEsc(cat) + '">'
      + '<span>' + wpEsc(showName) + '</span>'
      + warn
      + '</label>';
  }
  html += '</div>';
  wpOpenModal('行コピー：貼付先選択', html, [
    { label: 'キャンセル', onclick: 'wpCloseModal()' },
    { label: '貼り付け', primary: true, onclick: 'bmExecRowPaste(\'' + srcPid + '\')' }
  ]);

function bmExecRowPaste(srcPid) {
  if (!bmCopyBuffer || bmCopyBuffer.type !== 'row') { wpCloseModal(); return; }
  const targets = document.querySelectorAll('.wp-paste-target:checked');
  if (targets.length === 0) { wpToast('貼付先を選んでください', 'error'); return; }
  // カテゴリチェック
  const products = [].concat(bmServerData.products.rice, bmServerData.products.brown);
  const srcP = products.find(x => x.id === srcPid);
  const srcCat = srcP ? (srcP.group || srcP.category || '') : '';
  let hasCatMismatch = false;
  for (const t of targets) {
    if (t.dataset.cat !== srcCat) { hasCatMismatch = true; break; }
  }
  if (hasCatMismatch) {
    if (!confirm('カテゴリ違いの貼付先があります。続行しますか？')) return;
  }
  const changes = [];
  for (const t of targets) {
    const dstPid = t.dataset.pid;
    for (const lid of Object.keys(bmCopyBuffer.values)) {
      changes.push({
        date: bmCurrentDate,
        pid: dstPid,
        lid: lid,
        newVal: bmCopyBuffer.values[lid]
      });
    }
  }
  const n = bmSetEditsBulk(changes);
  bmRenderMatrix();
  bmRenderCalcInfo();
  wpCloseModal();
  wpToast(targets.length + '商品 × ' + Object.keys(bmCopyBuffer.values).length + '拠点 = ' + n + '件を貼り付けました', 'success');
}

// ============================================================
// 汎用モーダル
// ============================================================
function wpOpenModal(title, bodyHtml, buttons) {
  let overlay = document.getElementById('wp-modal-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'wp-modal-overlay';
    overlay.className = 'wp-modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) wpCloseModal(); };
    document.body.appendChild(overlay);
  }
  const btnsHtml = (buttons || []).map(b => {
    const cls = b.primary ? 'wp-primary' : (b.danger ? 'wp-danger' : '');
    return '<button class="' + cls + '" onclick="' + b.onclick + '">' + wpEsc(b.label) + '</button>';
  }).join('');
  overlay.innerHTML =
    '<div class="wp-modal" onclick="event.stopPropagation()">' +
      '<div class="wp-modal-head">' +
        '<div class="wp-modal-title">' + wpEsc(title) + '</div>' +
        '<button class="wp-modal-close" onclick="wpCloseModal()">✕</button>' +
      '</div>' +
      '<div class="wp-modal-body">' + bodyHtml + '</div>' +
      (btnsHtml ? '<div class="wp-modal-foot">' + btnsHtml + '</div>' : '') +
    '</div>';
  overlay.classList.add('wp-show');
}

function wpCloseModal() {
  const overlay = document.getElementById('wp-modal-overlay');
  if (overlay) overlay.classList.remove('wp-show');
}

// ============================================================
// F5 プリセット適用
// ============================================================
async function wpLoadPresets() {
  const r = await wpFetch('getWeatherPresets');
  if (!r.ok) {
    wpToast('プリセット取得失敗: ' + (r.error || '不明'), 'error');
    return false;
  }
  // ゴミデータ「プリセット名」を除外
  wpPresets = (r.presets || []).filter(p => p.name && p.name !== 'プリセット名' && p.rows && p.rows.length > 1);
  wpLocations = r.locations || [];
  return true;
}

async function wpOpenPresetSelector() {
  wpToast('プリセット読み込み中...', 'info');
  const ok = await wpLoadPresets();
  if (!ok) return;
  if (wpPresets.length === 0) {
    wpOpenModal('プリセット選択', '<div style="padding:20px;text-align:center;color:#888;">プリセットが登録されていません。<br>設定タブで作成してください。</div>',
      [{ label: '閉じる', onclick: 'wpCloseModal()' }]);
    return;
  }
  let html = '<div class="wp-preview-info">対象日：<b>' + wpEsc(bmCurrentDate) + '</b> に適用します（G列を上書き）</div>';
  html += '<div class="wp-preset-list">';
  for (const p of wpPresets) {
    const valid = p.rows.filter(r => r.locId);
    const off = valid.filter(r => r.ratio === 0).length;
    const reduce = valid.filter(r => r.ratio > 0 && r.ratio < 100).length;
    const keep = valid.filter(r => r.ratio === 100).length;
    const inc = valid.filter(r => r.ratio > 100).length;
    html += '<div class="wp-preset-row" onclick="wpPreviewPreset(\'' + wpEsc(p.name).replace(/'/g, "\\'") + '\')">';
    html += '<div><div class="wp-preset-row-name">' + wpEsc(p.name) + '</div>';
    html += '<div class="wp-preset-row-detail">' + valid.length + '拠点設定 / 0%:' + off + ' / 80%帯:' + reduce + ' / 100%:' + keep + ' / 増量:' + inc + '</div></div>';
    html += '<div class="wp-preset-row-actions"><button class="wp-primary" style="padding:4px 12px;">適用 →</button></div>';
    html += '</div>';
  }
  html += '</div>';
  wpOpenModal('📋 プリセット選択', html, [
    { label: '閉じる', onclick: 'wpCloseModal()' }
  ]);
}

function wpPreviewPreset(presetName) {
  const preset = wpPresets.find(p => p.name === presetName);
  if (!preset) return;
  // 影響を受ける拠点数を計算
  let html = '<div class="wp-preview-info">';
  html += '<b>' + wpEsc(presetName) + '</b> を <b>' + wpEsc(bmCurrentDate) + '</b> に適用します。<br>';
  html += '基本数 × 係数(%) を <b>切上げ</b>で計算し、G列（現在値）に上書きします。<br>';
  html += 'H列（翌週提案値）は変更されません。';
  html += '</div>';
  html += '<table style="width:100%;font-size:9.5pt;border-collapse:collapse;">';
  html += '<thead><tr><th style="text-align:left;padding:4px 8px;background:#fafafa;">拠点</th><th style="padding:4px 8px;background:#fafafa;">係数</th><th style="padding:4px 8px;background:#fafafa;">区分</th></tr></thead>';
  html += '<tbody>';
  for (const r of preset.rows) {
    if (!r.locId) continue;
    const loc = wpLocations.find(l => l.id === r.locId);
    const flagCls = loc && loc.outdoor === '屋外' ? 'wp-outdoor' : 'wp-indoor';
    const flag = loc ? loc.outdoor : '?';
    const ratioBg = r.ratio === 0 ? '#ffcdd2' : (r.ratio < 100 ? '#fff9c4' : (r.ratio > 100 ? '#c8e6c9' : '#f5f5f5'));
    html += '<tr style="border-bottom:1px solid #eee;">';
    html += '<td style="padding:4px 8px;">' + wpEsc((loc && loc.displayName && loc.displayName.length > 0) ? loc.displayName : (r.locName || r.locId)) + '</td>';
    html += '<td style="padding:4px 8px;text-align:center;background:' + ratioBg + ';font-weight:bold;">' + r.ratio + '%</td>';
    html += '<td style="padding:4px 8px;text-align:center;"><span class="wp-loc-flag ' + flagCls + '">' + wpEsc(flag) + '</span></td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  wpOpenModal('プレビュー：' + presetName, html, [
    { label: '← 戻る', onclick: 'wpOpenPresetSelector()' },
    { label: '✓ ' + presetName + ' を適用', primary: true, onclick: 'wpApplyPreset(\'' + presetName.replace(/'/g, "\\'") + '\')' }
  ]);
}

async function wpApplyPreset(presetName) {
  if (!confirm(presetName + ' を ' + bmCurrentDate + ' に適用しますか？')) return;
  wpToast('適用中...', 'info');
  const r = await wpFetch('applyWeatherPreset', { presetName: presetName, date: bmCurrentDate });
  if (!r.ok) {
    wpToast('適用失敗: ' + (r.error || '不明'), 'error');
    return;
  }
  wpToast(r.message || '適用完了', 'success');
  wpCloseModal();
  // 編集キャッシュをクリア（サーバー側のG列が変わるため）
  if (bmEditsCache[bmCurrentDate]) {
    delete bmEditsCache[bmCurrentDate];
    bmSaveEdits();
  }
  // Undo履歴クリア（サーバ側変更のため）
  bmUndoStack = [];
  bmRedoStack = [];
  bmUpdateUndoBtns();
  await bmReload();
}
