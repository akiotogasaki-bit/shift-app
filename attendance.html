<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>出退勤 | お江戸弁当</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --navy:#1A3C5E;
    --navy-d:#142F4A;
    --accent:#C8A45C;
    --accent-d:#B08E45;
    --bg:#F5F6F8;
    --text:#23303C;
    --muted:#7A8794;
    --line:#E4E7EB;
    --green:#2F8F5B;
    --red:#C0504D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    padding:20px;
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%;max-width:440px;background:#fff;border-radius:18px;
    box-shadow:0 10px 30px rgba(26,60,94,0.12);overflow:hidden;
  }
  .head{background:var(--navy);color:#fff;padding:20px;text-align:center;}
  .brand{font-size:12px;letter-spacing:.18em;opacity:.85;}
  .title{font-size:21px;font-weight:700;margin-top:5px;}
  .body{padding:24px 22px 22px;}

  .who{font-size:15px;color:var(--muted);text-align:center;}
  .who b{color:var(--text);font-size:19px;}
  .date{margin-top:4px;text-align:center;font-size:14px;color:var(--muted);}
  .clock{
    margin-top:10px;text-align:center;font-size:40px;font-weight:700;
    color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }

  .status{
    margin:16px 0 4px;padding:12px;border-radius:12px;text-align:center;
    font-size:15px;font-weight:700;background:#EEF2F6;color:var(--navy);
  }
  .status.working{background:#EAF5EF;color:var(--green);}
  .status.done{background:#FBF4E6;color:var(--accent-d);}
  .status.err{background:#FBEAEA;color:var(--red);}

  .btns{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
  .btn{
    border:none;border-radius:14px;padding:18px;font-size:19px;font-weight:700;
    color:#fff;cursor:pointer;transition:transform .05s,opacity .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.98);}
  .btn-in{background:var(--navy);}
  .btn-out{background:var(--accent);}
  .btn:disabled{background:#CDD3DA;color:#8A93A0;cursor:default;}
  .btn .ic{font-size:20px;}

  .times{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:none;}
  .times.show{display:block;}
  .trow{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;font-size:15px;}
  .trow .lbl{color:var(--muted);}
  .trow .val{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;}
  .trow.work .val{color:var(--accent-d);}

  /* 修正・申請への導線（サブボタン） */
  .btn-sub{
    margin-top:14px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);
    border-radius:12px;padding:13px;font-size:15px;font-weight:700;width:100%;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .05s;
  }
  .btn-sub:active{transform:scale(.99);}

  .foot{padding:13px 20px 18px;text-align:center;font-size:11px;color:var(--muted);}
  .tag{
    display:inline-block;margin-left:6px;font-size:10px;color:#fff;
    background:var(--accent);padding:2px 8px;border-radius:10px;letter-spacing:.05em;
  }

  .overlay{
    position:fixed;inset:0;background:rgba(245,246,248,.78);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .spin{
    width:42px;height:42px;border:4px solid #D9DEE4;border-top-color:var(--navy);
    border-radius:50%;animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ── 時刻ピッカー（ボトムシート＋ホイール）── */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;z-index:60;}
  .sheet-bg.show{display:block;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:#fff;border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
    transform:translateY(110%);transition:transform .25s ease;
    padding:0 18px max(18px,env(safe-area-inset-bottom));
    max-width:440px;margin:0 auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 2px 4px;font-size:17px;font-weight:700;color:var(--navy);
  }
  .sheet-x{
    border:none;background:#EEF2F6;color:var(--muted);
    width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .picker{
    position:relative;display:flex;align-items:center;justify-content:center;
    gap:4px;height:220px;margin:6px 0 4px;
  }
  .pick-band{
    position:absolute;left:50%;transform:translateX(-50%);
    width:210px;top:88px;height:44px;
    background:rgba(26,60,94,.07);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:8px;pointer-events:none;
  }
  .pick-col{
    height:220px;width:88px;overflow-y:scroll;
    scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;text-align:center;padding:88px 0;
  }
  .pick-col::-webkit-scrollbar{display:none;}
  .pick-item{
    height:44px;line-height:44px;scroll-snap-align:center;
    font-size:27px;font-weight:700;color:#B9C1CB;font-variant-numeric:tabular-nums;
    transition:color .12s,transform .12s;
  }
  .pick-item.on{color:var(--navy);transform:scale(1.06);}
  .pick-sep{font-size:27px;font-weight:700;color:var(--navy);padding-bottom:2px;}
  .pick-preview{
    text-align:center;font-size:14px;color:var(--muted);margin:2px 0 12px;
  }
  .pick-preview b{font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;margin-left:6px;}
  .sheet-confirm{margin-bottom:6px;}

  /* ── 修正・申請パネル ── */
  .req-ov{
    position:fixed;inset:0;background:rgba(20,30,40,.5);display:none;z-index:55;
    align-items:flex-end;justify-content:center;
  }
  .req-ov.show{display:flex;}
  .req-card{
    width:100%;max-width:440px;background:#fff;border-radius:18px 18px 0 0;
    max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 20px max(20px,env(safe-area-inset-bottom));
    animation:reqUp .25s ease;
  }
  @keyframes reqUp{from{transform:translateY(40px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .req-head{
    position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:18px 0 12px;border-bottom:1px solid var(--line);z-index:1;
  }
  .req-head .t{font-size:17px;font-weight:700;color:var(--navy);}
  .req-x{
    border:none;background:#EEF2F6;color:var(--muted);width:32px;height:32px;border-radius:50%;
    font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .req-sec{margin-top:16px;}
  .req-sec>.lab{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px;}
  .req-date{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;
    font-size:16px;color:var(--text);font-family:inherit;background:#fff;
  }
  .seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .seg.c3{grid-template-columns:repeat(3,1fr);}
  .seg-item{
    border:1.5px solid var(--line);background:#fff;color:var(--text);
    border-radius:11px;padding:12px 6px;font-size:14px;font-weight:700;text-align:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:all .12s;
  }
  .seg-item:active{transform:scale(.98);}
  .seg-item.on{border-color:var(--navy);background:var(--navy);color:#fff;}
  .tfield{
    display:flex;align-items:center;justify-content:space-between;
    border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;background:#fff;
    -webkit-tap-highlight-color:transparent;
  }
  .tfield:active{transform:scale(.99);}
  .tfield .tl{font-size:14px;color:var(--muted);}
  .tfield .tv{font-size:21px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
  .req-reason{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;
    font-size:15px;font-family:inherit;color:var(--text);resize:vertical;min-height:64px;
  }
  .req-submit{
    margin-top:18px;width:100%;border:none;border-radius:14px;padding:17px;
    font-size:18px;font-weight:700;color:#fff;background:var(--navy);cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .05s;
  }
  .req-submit:active{transform:scale(.99);}
  .req-submit:disabled{background:#CDD3DA;color:#8A93A0;}
  .req-result{
    margin-top:14px;padding:13px;border-radius:12px;font-size:14px;font-weight:700;
    display:none;line-height:1.5;word-break:break-word;
  }
  .req-result.ok{background:#EAF5EF;color:var(--green);}
  .req-result.err{background:#FBEAEA;color:var(--red);}
  .req-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="brand">お江戸弁当</div>
      <div class="title">出退勤</div>
    </div>
    <div class="body">
      <div class="who"><b id="who">—</b> さん</div>
      <div class="date" id="date">—</div>
      <div class="clock" id="clock">--:--:--</div>

      <div class="status" id="status">読み込み中…</div>

      <div class="btns">
        <button class="btn btn-in" id="btnIn" disabled><span class="ic">🟢</span><span id="btnInLabel">出勤</span></button>
        <button class="btn btn-out" id="btnOut" disabled><span class="ic">🔴</span><span id="btnOutLabel">退勤</span></button>
      </div>

      <div class="times" id="times">
        <div class="trow"><span class="lbl">出勤</span><span class="val" id="tIn">—</span></div>
        <div class="trow"><span class="lbl">退勤</span><span class="val" id="tOut">—</span></div>
        <div class="trow work"><span class="lbl">勤務時間</span><span class="val" id="tWork">—</span></div>
      </div>

      <button class="btn-sub" id="btnReq">打刻の修正・申請</button>
    </div>
    <div class="foot">© お江戸弁当 / T&amp;A BROTHERS　<span id="ver">v1.3</span><span class="tag" id="testTag" style="display:none;">TEST</span></div>
  </main>

  <div class="overlay" id="overlay"><div class="spin"></div></div>

  <!-- 時刻ピッカー -->
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <span id="sheetTitle">出勤 打刻</span>
      <button class="sheet-x" id="sheetCancel" aria-label="閉じる">✕</button>
    </div>
    <div class="picker">
      <div class="pick-band"></div>
      <div class="pick-col" id="colH"></div>
      <div class="pick-sep">:</div>
      <div class="pick-col" id="colM"></div>
    </div>
    <div class="pick-preview">選択中<b id="pickPrev">--:--</b></div>
    <button class="btn btn-in sheet-confirm" id="sheetConfirm">打刻する</button>
  </div>

  <!-- 修正・申請パネル -->
  <div class="req-ov" id="reqPanel">
    <div class="req-card">
      <div class="req-head">
        <span class="t">打刻の修正・申請</span>
        <button class="req-x" id="reqClose" aria-label="閉じる">✕</button>
      </div>

      <div class="req-sec">
        <div class="lab">対象日</div>
        <input type="date" class="req-date" id="reqDate">
        <div class="req-hint">本日から7日前まで（本日を含む）選べます。承認されると勤怠記録に反映されます。</div>
      </div>

      <div class="req-sec">
        <div class="lab">種別</div>
        <div class="seg" id="kindSeg">
          <div class="seg-item" data-kind="出勤修正">出勤を修正</div>
          <div class="seg-item" data-kind="退勤修正">退勤を修正</div>
          <div class="seg-item" data-kind="後日入力">後日入力（両方）</div>
          <div class="seg-item" data-kind="取消">打刻を取消</div>
        </div>
      </div>

      <div class="req-sec" id="fIn" style="display:none;">
        <div class="lab">新しい出勤時刻</div>
        <div class="tfield" id="reqInField"><span class="tl">タップして選択</span><span class="tv" id="reqInVal">--:--</span></div>
      </div>

      <div class="req-sec" id="fOut" style="display:none;">
        <div class="lab">新しい退勤時刻</div>
        <div class="tfield" id="reqOutField"><span class="tl">タップして選択</span><span class="tv" id="reqOutVal">--:--</span></div>
      </div>

      <div class="req-sec" id="fCancel" style="display:none;">
        <div class="lab">取消する対象</div>
        <div class="seg c3" id="cancelSeg">
          <div class="seg-item" data-cancel="in">出勤のみ</div>
          <div class="seg-item" data-cancel="out">退勤のみ</div>
          <div class="seg-item" data-cancel="all">全日</div>
        </div>
      </div>

      <div class="req-sec">
        <div class="lab">理由（任意）</div>
        <textarea class="req-reason" id="reqReason" placeholder="例：打刻を押し忘れた／時間を間違えた など"></textarea>
      </div>

      <button class="req-submit" id="reqSubmit">申請する</button>
      <div class="req-result" id="reqResult"></div>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════════════════
// 出退勤アプリ attendance.html v1.3
//   ・打刻＝記録のみ（出勤/退勤の2種・通知なし）※v1.2から継続
//   ・【新】打刻の修正・申請（出勤修正/退勤修正/後日入力/取消）
//       対象日=本日〜7日前／種別で入力欄切替／時刻はホイール流用
//       送信→GAS submitAttendanceRequest（社長・井上へ通知・承認制）
//   ・ボタン→時刻ホイール（時24h／分5分刻み・既定=現在時刻を丸め）
//   ・既定値の丸め: 出勤=切り上げ／退勤=切り下げ（5分単位）
//   ・テスト: ?test=1 でLIFF/GASをバイパス（申請は送信内容を表示）
// ═══════════════════════════════════════════════════════════
var LIFF_ID = '2009637457-PgLXUEdN';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxkcAI-Nkl3aoUZKgluss5AawPDc7aluPokONkYz6f2ikwl0S487JvhKdKh6QSp1xhEhA/exec';

var USER_ID = '';
var IS_TEST = false;
var CUR  = { clockIn:'', clockOut:'' };
var mock = { name:'テスト調理', date:'', clockIn:'', clockOut:'' };

function $(id){ return document.getElementById(id); }
function pad2(n){ return ('0'+n).slice(-2); }
function showOverlay(b){ $('overlay').classList.toggle('show', !!b); }

// ---- API（既存アプリと同方式：POSTはContent-Type非指定でCORSプリフライト回避）----
async function apiGet(params){
  var qs = new URLSearchParams(params||{}).toString();
  var url = qs ? GAS_URL+'?'+qs : GAS_URL;
  var res = await fetch(url, { method:'GET', redirect:'follow' });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}
async function apiPost(payload){
  var res = await fetch(GAS_URL, { method:'POST', redirect:'follow', body:JSON.stringify(payload) });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}

// ---- 日付整形 yyyy-MM-dd → 2026年6月18日（水）----
var WD = ['日','月','火','水','木','金','土'];
function fmtDate(ymd){
  if(!ymd) return '—';
  var p = String(ymd).split('-');
  if(p.length!==3) return ymd;
  var y=+p[0], m=+p[1], d=+p[2];
  var w = new Date(y, m-1, d).getDay();
  return y+'年'+m+'月'+d+'日（'+WD[w]+'）';
}

// ---- 勤務時間 'H:MM'（サーバ値が無い場合のフォールバック）----
function calcWork(a,b){
  if(!a||!b) return '';
  var ap=String(a).split(':'), bp=String(b).split(':');
  var diff = (+bp[0]*60 + +bp[1]) - (+ap[0]*60 + +ap[1]);
  if(diff<0) diff+=1440;
  return Math.floor(diff/60)+':'+pad2(diff%60);
}

// ---- ライブ時計（表示専用）----
function tickClock(){
  var n = new Date();
  $('clock').textContent = pad2(n.getHours())+':'+pad2(n.getMinutes())+':'+pad2(n.getSeconds());
}

// ---- 画面描画 ----
function render(d){
  CUR.clockIn  = d.clockIn  || '';
  CUR.clockOut = d.clockOut || '';

  $('who').textContent  = d.name || '—';
  $('date').textContent = fmtDate(d.date);

  var st = $('status');
  var bIn = $('btnIn'), bOut = $('btnOut');
  var inLabel = $('btnInLabel'), outLabel = $('btnOutLabel');
  var times = $('times');

  st.className = 'status';
  inLabel.textContent = '出勤';
  outLabel.textContent = '退勤';

  var status = d.status || (d.clockOut ? 'done' : (d.clockIn ? 'working' : 'before'));

  if(status === 'before'){
    st.textContent = 'おはようございます。出勤を押してください';
    bIn.disabled = false;
    bOut.disabled = true;
    times.classList.remove('show');
  } else if(status === 'working'){
    st.classList.add('working');
    st.textContent = '勤務中です';
    inLabel.textContent = '出勤済 '+d.clockIn;
    bIn.disabled = true;
    bOut.disabled = false;
    times.classList.remove('show');
  } else {
    st.classList.add('done');
    st.textContent = '本日の勤務、お疲れさまでした';
    inLabel.textContent  = '出勤済 '+d.clockIn;
    outLabel.textContent = '退勤済 '+d.clockOut;
    bIn.disabled = true;
    bOut.disabled = true;
    $('tIn').textContent   = d.clockIn || '—';
    $('tOut').textContent  = d.clockOut || '—';
    $('tWork').textContent = d.worked || calcWork(d.clockIn, d.clockOut) || '—';
    times.classList.add('show');
  }
}

function showErr(msg){
  var st = $('status');
  st.className = 'status err';
  st.textContent = msg;
  $('btnIn').disabled = true;
  $('btnOut').disabled = true;
}

// ═══════════════════════════════════════════════════════════
// 時刻ピッカー（ホイール）※打刻・申請で共用
// ═══════════════════════════════════════════════════════════
var ITEM_H = 44;
var pickType = 'in';     // 打刻モード時の対象（in/out）
var pickMode = 'punch';  // 'punch' | 'request'
var pickReturn = null;   // requestモードの確定コールバック
var rafPending = false;

function buildWheel(col, count, fmt){
  var html = '';
  for(var i=0;i<count;i++){ html += '<div class="pick-item">'+fmt(i)+'</div>'; }
  col.innerHTML = html;
}
function selIndex(col, count){
  var idx = Math.round(col.scrollTop / ITEM_H);
  if(idx < 0) idx = 0;
  if(idx > count-1) idx = count-1;
  return idx;
}
function markCenter(col, count){
  var idx = selIndex(col, count);
  var items = col.children;
  for(var i=0;i<items.length;i++){ items[i].classList.toggle('on', i===idx); }
}
function updatePreview(){
  var h = selIndex($('colH'),24);
  var m = selIndex($('colM'),12)*5;
  $('pickPrev').textContent = pad2(h)+':'+pad2(m);
}
function onWheelScroll(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){
    markCenter($('colH'),24);
    markCenter($('colM'),12);
    updatePreview();
    rafPending = false;
  });
}
function scrollWheelTo(H, M){
  $('sheetBg').classList.add('show');
  $('sheet').classList.add('show');
  requestAnimationFrame(function(){
    $('colH').scrollTop = H * ITEM_H;
    $('colM').scrollTop = (M/5) * ITEM_H;
    requestAnimationFrame(function(){
      markCenter($('colH'),24);
      markCenter($('colM'),12);
      updatePreview();
    });
  });
}
function openPicker(type){
  pickMode = 'punch';
  pickType = type;
  $('sheetTitle').textContent = (type==='in' ? '出勤' : '退勤') + ' 打刻';
  var cf = $('sheetConfirm');
  cf.classList.toggle('btn-in',  type==='in');
  cf.classList.toggle('btn-out', type==='out');
  cf.textContent = '打刻する';

  // 既定＝現在時刻を5分単位で丸め（出勤=切り上げ／退勤=切り下げ）
  var now = new Date();
  var H = now.getHours();
  var M;
  if(type === 'in'){
    M = Math.ceil(now.getMinutes()/5)*5;   // 出勤: 切り上げ
    if(M === 60){ M = 0; H = (H+1)%24; }
  } else {
    M = Math.floor(now.getMinutes()/5)*5;  // 退勤: 切り下げ
  }
  scrollWheelTo(H, M);
}
// 申請フォーム用：時刻ホイールを開き、確定値をコールバックで返す
function openReqPicker(which){
  pickMode = 'request';
  pickReturn = function(hhmm){
    if(which==='in'){ REQ.newIn = hhmm; $('reqInVal').textContent = hhmm; }
    else { REQ.newOut = hhmm; $('reqOutVal').textContent = hhmm; }
  };
  $('sheetTitle').textContent = (which==='in' ? '新しい出勤時刻' : '新しい退勤時刻');
  var cf = $('sheetConfirm');
  cf.classList.remove('btn-out'); cf.classList.add('btn-in');
  cf.textContent = '決定';

  var cur = (which==='in' ? REQ.newIn : REQ.newOut);
  var H, M;
  if(cur && /^\d{2}:\d{2}$/.test(cur)){
    H = +cur.split(':')[0]; M = +cur.split(':')[1];
  } else {
    var now = new Date();
    H = now.getHours();
    M = Math.round(now.getMinutes()/5)*5;
    if(M === 60){ M = 0; H = (H+1)%24; }
  }
  M = Math.round(M/5)*5; if(M > 55) M = 55;
  scrollWheelTo(H, M);
}
function closePicker(){
  $('sheetBg').classList.remove('show');
  $('sheet').classList.remove('show');
}
async function confirmPicker(){
  var h = selIndex($('colH'),24);
  var m = selIndex($('colM'),12)*5;
  var hhmm = pad2(h)+':'+pad2(m);

  // 申請モード：値を返して終了（打刻はしない）
  if(pickMode === 'request'){
    closePicker();
    if(typeof pickReturn === 'function') pickReturn(hhmm);
    return;
  }

  // 打刻モード（既存）
  if(pickType==='out' && CUR.clockIn && hhmm < CUR.clockIn){
    if(!confirm('退勤('+hhmm+')が出勤('+CUR.clockIn+')より前です。\nこのまま打刻しますか？')) return;
  }
  closePicker();
  if(IS_TEST){ punchMock(pickType, hhmm); return; }
  await punch(pickType, hhmm);
}

// ---- 打刻送信 ----
async function punch(type, time){
  try{
    showOverlay(true);
    var res = await apiPost({ action:'punchAttendance', userId:USER_ID, type:type, time:time });
    showOverlay(false);
    if(!res || !res.success){
      alert((res && res.message) || '打刻に失敗しました');
      await load();
      return;
    }
    render({ name:res.name, date:res.date, clockIn:res.clockIn, clockOut:res.clockOut, worked:res.worked });
  }catch(e){
    showOverlay(false);
    alert('通信エラー：'+e.message);
  }
}

// ---- 起動時ロード ----
async function load(){
  try{
    showOverlay(true);
    var d = await apiGet({ action:'getAttendanceToday', userId:USER_ID });
    showOverlay(false);
    if(!d || !d.ok || !d.found){
      showErr((d && d.message) || 'スタッフ登録が見つかりません');
      return;
    }
    render(d);
  }catch(e){
    showOverlay(false);
    showErr('通信エラー：'+e.message);
  }
}

// ---- テストモック（?test=1）----
function punchMock(type, hhmm){
  if(type==='in'){
    if(mock.clockIn){ alert('既に出勤打刻済み（'+mock.clockIn+'）'); return; }
    mock.clockIn = hhmm;
  } else {
    if(!mock.clockIn){ alert('先に出勤打刻が必要です'); return; }
    if(mock.clockOut){ alert('既に退勤打刻済み（'+mock.clockOut+'）'); return; }
    mock.clockOut = hhmm;
  }
  render({ name:mock.name, date:mock.date, clockIn:mock.clockIn, clockOut:mock.clockOut });
}

// ═══════════════════════════════════════════════════════════
// 修正・申請フォーム
// ═══════════════════════════════════════════════════════════
var REQ = { date:'', kind:'', newIn:'', newOut:'', cancelTarget:'', reason:'' };
var REQ_TODAY = '', REQ_MIN = '';

function ymdLocal(dt){
  return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
}
function setupReqDates(){
  var n = new Date();
  REQ_TODAY = ymdLocal(n);
  REQ_MIN   = ymdLocal(new Date(n.getTime() - 7*24*3600*1000));
  var di = $('reqDate');
  di.min = REQ_MIN; di.max = REQ_TODAY; di.value = REQ_TODAY;
  REQ.date = REQ_TODAY;
}
function reqMsg(text, isErr){
  var el = $('reqResult');
  if(!text){ el.style.display='none'; el.textContent=''; el.className='req-result'; return; }
  el.style.display='block';
  el.className = 'req-result ' + (isErr ? 'err' : 'ok');
  el.textContent = text;
}
function showReqFields(kind){
  $('fIn').style.display     = (kind==='出勤修正' || kind==='後日入力') ? 'block' : 'none';
  $('fOut').style.display    = (kind==='退勤修正' || kind==='後日入力') ? 'block' : 'none';
  $('fCancel').style.display = (kind==='取消') ? 'block' : 'none';
}
function selectKind(kind){
  REQ.kind = kind; REQ.newIn = ''; REQ.newOut = ''; REQ.cancelTarget = '';
  $('reqInVal').textContent = '--:--';
  $('reqOutVal').textContent = '--:--';
  var kels = document.querySelectorAll('[data-kind]');
  for(var i=0;i<kels.length;i++){ kels[i].classList.toggle('on', kels[i].getAttribute('data-kind')===kind); }
  var cels = document.querySelectorAll('[data-cancel]');
  for(var j=0;j<cels.length;j++){ cels[j].classList.remove('on'); }
  showReqFields(kind);
  reqMsg('', false);
}
function selectCancelTarget(t){
  REQ.cancelTarget = t;
  var cels = document.querySelectorAll('[data-cancel]');
  for(var i=0;i<cels.length;i++){ cels[i].classList.toggle('on', cels[i].getAttribute('data-cancel')===t); }
}
function resetReqForm(){
  REQ.kind=''; REQ.newIn=''; REQ.newOut=''; REQ.cancelTarget='';
  $('reqInVal').textContent='--:--';
  $('reqOutVal').textContent='--:--';
  $('reqReason').value='';
  var kels = document.querySelectorAll('[data-kind]');
  for(var i=0;i<kels.length;i++){ kels[i].classList.remove('on'); }
  var cels = document.querySelectorAll('[data-cancel]');
  for(var j=0;j<cels.length;j++){ cels[j].classList.remove('on'); }
  showReqFields('');
}
function openReqPanel(){
  setupReqDates();
  resetReqForm();
  reqMsg('', false);
  $('reqPanel').classList.add('show');
}
function closeReqPanel(){
  $('reqPanel').classList.remove('show');
}
async function submitRequest(){
  if(!REQ.date){ reqMsg('対象日を選んでください', true); return; }
  if(REQ.date < REQ_MIN || REQ.date > REQ_TODAY){ reqMsg('対象日は本日から7日前まで（本日含む）で選んでください', true); return; }
  if(!REQ.kind){ reqMsg('種別を選んでください', true); return; }
  if(REQ.kind==='出勤修正' && !REQ.newIn){ reqMsg('新しい出勤時刻を選んでください', true); return; }
  if(REQ.kind==='退勤修正' && !REQ.newOut){ reqMsg('新しい退勤時刻を選んでください', true); return; }
  if(REQ.kind==='後日入力' && (!REQ.newIn || !REQ.newOut)){ reqMsg('出勤・退勤の両方の時刻を選んでください', true); return; }
  if(REQ.kind==='取消' && !REQ.cancelTarget){ reqMsg('取消する対象を選んでください', true); return; }

  REQ.reason = $('reqReason').value.trim();

  var payload = {
    action:'submitAttendanceRequest', userId:USER_ID,
    targetDate:REQ.date, kind:REQ.kind,
    newIn:REQ.newIn, newOut:REQ.newOut,
    cancelTarget:REQ.cancelTarget, reason:REQ.reason
  };

  var btn = $('reqSubmit');
  var orig = btn.textContent;
  btn.disabled = true; btn.textContent = '送信中…';

  if(IS_TEST){
    setTimeout(function(){
      btn.disabled=false; btn.textContent=orig;
      reqMsg('【テスト】送信内容: 対象日='+REQ.date+' / 種別='+REQ.kind+' / 出勤='+(REQ.newIn||'-')+' / 退勤='+(REQ.newOut||'-')+' / 取消='+(REQ.cancelTarget||'-')+' / 理由='+(REQ.reason||'(なし)'), false);
    }, 400);
    return;
  }

  try{
    var res = await apiPost(payload);
    btn.disabled=false; btn.textContent=orig;
    if(!res || !res.success){ reqMsg((res && res.message) || '申請に失敗しました', true); return; }
    resetReqForm();
    reqMsg('申請しました（申請ID: '+res.reqId+'）。社長・井上の承認をお待ちください。', false);
  }catch(e){
    btn.disabled=false; btn.textContent=orig;
    reqMsg('通信エラー：'+e.message, true);
  }
}

// ---- INIT ----
async function init(){
  buildWheel($('colH'), 24, function(i){ return pad2(i); });
  buildWheel($('colM'), 12, function(i){ return pad2(i*5); });

  tickClock();
  setInterval(tickClock, 1000);

  // 打刻
  $('btnIn').addEventListener('click', function(){ if(!$('btnIn').disabled) openPicker('in'); });
  $('btnOut').addEventListener('click', function(){ if(!$('btnOut').disabled) openPicker('out'); });
  $('sheetConfirm').addEventListener('click', confirmPicker);
  $('sheetCancel').addEventListener('click', closePicker);
  $('sheetBg').addEventListener('click', closePicker);
  $('colH').addEventListener('scroll', onWheelScroll, { passive:true });
  $('colM').addEventListener('scroll', onWheelScroll, { passive:true });

  // 修正・申請
  $('btnReq').addEventListener('click', openReqPanel);
  $('reqClose').addEventListener('click', closeReqPanel);
  $('reqPanel').addEventListener('click', function(e){ if(e.target === $('reqPanel')) closeReqPanel(); });
  $('reqDate').addEventListener('change', function(){ REQ.date = $('reqDate').value; });
  $('kindSeg').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-kind]') : null;
    if(b) selectKind(b.getAttribute('data-kind'));
  });
  $('cancelSeg').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-cancel]') : null;
    if(b) selectCancelTarget(b.getAttribute('data-cancel'));
  });
  $('reqInField').addEventListener('click', function(){ openReqPicker('in'); });
  $('reqOutField').addEventListener('click', function(){ openReqPicker('out'); });
  $('reqSubmit').addEventListener('click', submitRequest);

  var params = new URLSearchParams(location.search);
  IS_TEST = params.get('test') === '1';

  if(IS_TEST){
    $('testTag').style.display = 'inline-block';
    var n = new Date();
    mock.date = ymdLocal(n);
    render({ name:mock.name, date:mock.date, clockIn:mock.clockIn, clockOut:mock.clockOut });
    return;
  }

  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login(); return; }
    var profile = await liff.getProfile();
    USER_ID = profile.userId;
    await load();
  }catch(e){
    showErr('LIFF初期化エラー：'+e.message);
  }
}

init();
</script>
