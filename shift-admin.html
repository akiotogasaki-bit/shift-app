<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>お江戸弁当 シフト管理</title>
<style>
:root {
  --navy: #1A3C5E;
  --blue: #2471A3;
  --orange: #E67E22;
  --orange-light: #FAD7A0;
  --green: #27AE60;
  --red: #C0392B;
  --pink-bg: #FDECEA;
  --warn-bg: #FFF4E6;
  --ink: #1C1C1C;
  --ink-soft: #4A4A4A;
  --ink-mute: #9A9A9A;
  --cream: #F4F6F9;
  --white: #FFFFFF;
  --border: #D5D8DC;
  --border-light: #ECEEF1;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
body {
  font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

/* ═══ パスワード画面 ═══ */
#scr-pw {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--navy);
  padding: 32px 24px;
  flex-direction: column;
  text-align: center;
}
#scr-pw h1 { font-size: 22px; font-weight: 700; color: #FFF; margin-bottom: 6px; }
#scr-pw .sub { font-size: 13px; color: rgba(255,255,255,.6); margin-bottom: 32px; }
.pw-input {
  width: 100%; max-width: 280px;
  padding: 14px 16px;
  font-size: 18px;
  text-align: center;
  letter-spacing: .2em;
  border: 2px solid rgba(255,255,255,.3);
  border-radius: 12px;
  background: rgba(255,255,255,.1);
  color: #FFF;
  margin-bottom: 12px;
}
.pw-input:focus { outline: none; border-color: rgba(255,255,255,.7); }
.pw-input::placeholder { color: rgba(255,255,255,.3); letter-spacing: .05em; }
.pw-btn {
  width: 100%; max-width: 280px;
  padding: 14px;
  background: #FFF;
  color: var(--navy);
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
}
.pw-btn:active { opacity: .85; }
.pw-err { color: #EF9A9A; font-size: 13px; margin-top: 10px; min-height: 20px; }

/* ═══ メイン画面 ═══ */
#scr-main { display: none; padding-bottom: calc(40px + var(--safe-bottom)); }

.header {
  background: var(--navy);
  color: #FFF;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 { font-size: 16px; font-weight: 700; }
.header .week { font-size: 11px; opacity: .8; margin-top: 2px; }
.logout {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.3);
  color: #FFF;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 12px 16px 8px;
}
.actions-2nd {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 16px 8px;
}
.act-btn {
  position: relative;
  padding: 12px 4px;
  border-radius: 10px;
  color: #FFF;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: opacity .15s, transform .1s;
}
.act-btn:active { opacity: .8; transform: scale(.96); }
.act-btn .ico { font-size: 20px; }
.act-btn.assign { background: var(--navy); }
.act-btn.diff   { background: var(--orange); }
.act-btn.batch  { background: var(--green); }
.act-btn.remind-next { background: #5A6B82; }
.act-btn.remind-this { background: #8B6F47; }
.badge {
  position: absolute;
  top: 4px; right: 4px;
  background: var(--red);
  color: #FFF;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
}
.badge[hidden] { display: none; }

.status {
  margin: 0 16px 8px;
  padding: 8px 12px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status::before {
  content: '';
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ink-mute);
  flex-shrink: 0;
}
.status.ok::before    { background: var(--green); }
.status.err::before   { background: var(--red); }
.status.busy::before  { background: var(--blue); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.sec-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-mute);
  letter-spacing: .1em;
  margin: 16px 16px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-title::after { content:''; flex:1; height:1px; background:var(--border); }

.matrix-wrap {
  margin: 0 16px 8px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: auto;
  max-height: 60vh;
  -webkit-overflow-scrolling: touch;
}
.matrix {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 11px;
}
.matrix th, .matrix td {
  padding: 8px 4px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-right: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
}
.matrix thead th {
  background: var(--navy);
  color: #FFF;
  font-weight: 700;
  position: sticky;
  top: 0;
  z-index: 2;
  min-width: 70px;
  height: 36px;
}
.matrix thead th.corner {
  left: 0;
  z-index: 4;
  min-width: 88px;
  width: 88px;
}
.matrix tbody th {
  background: var(--cream);
  color: var(--ink);
  font-weight: 600;
  position: sticky;
  left: 0;
  z-index: 1;
  text-align: left;
  padding-left: 8px;
  min-width: 88px;
  width: 88px;
  font-size: 11px;
}
.matrix td {
  background: var(--white);
  cursor: pointer;
  min-width: 70px;
  height: 38px;
  font-weight: 500;
  user-select: none;
}
.matrix td:active { background: #E8F1F8; }
.matrix td.unassigned {
  background: var(--pink-bg);
  color: var(--red);
  font-weight: 700;
}
.matrix td.unassigned:active { background: #FAD3CE; }
.matrix td.spot {
  background: var(--warn-bg);
  color: var(--orange);
  font-weight: 700;
}

.matrix-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--ink-mute);
  font-size: 13px;
}
.matrix-empty .em-ico { font-size: 32px; margin-bottom: 8px; }

.legend {
  margin: 0 16px 8px;
  padding: 8px 12px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 10px;
  color: var(--ink-soft);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot {
  width: 12px; height: 12px;
  border-radius: 3px;
  border: 1px solid var(--border);
}
.legend-dot.assigned { background: var(--white); }
.legend-dot.unassigned { background: var(--pink-bg); border-color: var(--red); }
.legend-dot.spot { background: var(--warn-bg); border-color: var(--orange); }

.pool-wrap {
  margin: 0 16px 16px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.pool-empty {
  padding: 20px 16px;
  text-align: center;
  color: var(--ink-mute);
  font-size: 12px;
}
.date-group { border-bottom: 1px solid var(--border-light); }
.date-group:last-child { border-bottom: none; }
.date-head {
  padding: 8px 12px 6px;
  background: var(--cream);
  font-size: 11px;
  font-weight: 700;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 6px;
}
.date-head .count {
  background: var(--white);
  color: var(--ink-soft);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.chip-row {
  padding: 8px 12px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 6px 10px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  user-select: none;
  transition: all .1s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.chip:active { transform: scale(.95); background: var(--cream); }
.chip.normal { background: #EBF3FA; border-color: #C7DCE9; color: var(--navy); }
.chip.normal:active { background: #D7E6F0; }
.chip.spot {
  background: var(--orange);
  border-color: var(--orange);
  color: #FFF;
}
.chip.spot:active { background: #D35400; }
.chip .ico { font-size: 11px; }

.reload-wrap { padding: 8px 16px 16px; text-align: center; }
.reload-btn {
  padding: 10px 20px;
  border: 1px solid var(--border);
  background: var(--white);
  border-radius: 24px;
  color: var(--ink-soft);
  font-size: 12px;
}

.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.sheet-overlay.show { display: flex; }
.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--white);
  border-radius: 16px 16px 0 0;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  padding-bottom: var(--safe-bottom);
  animation: slideUp .25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 8px auto;
  flex-shrink: 0;
}
.sheet-head {
  padding: 4px 16px 12px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.sheet-title { font-size: 16px; font-weight: 700; color: var(--ink); }
.sheet-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
.sheet-current {
  font-size: 12px;
  color: var(--blue);
  margin-top: 6px;
  padding: 4px 8px;
  background: #EBF3FA;
  border-radius: 4px;
  display: inline-block;
}
.sheet-search-wrap { padding: 10px 16px 4px; flex-shrink: 0; }
.sheet-search {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--cream);
}
.sheet-search:focus { outline: none; border-color: var(--blue); background: var(--white); }
.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  -webkit-overflow-scrolling: touch;
}
.tier-head {
  font-size: 10px;
  color: var(--ink-mute);
  font-weight: 700;
  letter-spacing: .1em;
  padding: 8px 16px 4px;
  background: var(--cream);
  display: flex;
  align-items: center;
  gap: 6px;
}
.tier-head.pool {
  background: var(--warn-bg);
  color: var(--orange);
}
  .tier-head.spot-head {
  background: #FFF4E6;
  color: var(--orange);
}
.seller-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  gap: 8px;
}
.seller-item:active { background: var(--cream); }
.seller-item.current { background: #EBF3FA; }
.seller-item.spot-item { background: #FFFAF0; }
.seller-item.spot-item:active { background: var(--warn-bg); }
.seller-item .name { flex: 1; font-size: 14px; font-weight: 500; }
.seller-item .name.spot { color: var(--orange); font-weight: 700; }
.seller-item .pref-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--orange);
  color: #FFF;
}
.seller-item .pref-tag.t2 { background: #F39C12; }
.seller-item .pref-tag.t3 { background: #BDC3C7; color: var(--ink); }
.seller-item .pool-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--green);
  color: #FFF;
}
.seller-item .check { color: var(--green); font-weight: 700; font-size: 16px; }
.sheet-foot {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}
.sheet-foot .btn {
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
}
.btn-ghost { background: var(--cream); color: var(--ink-soft); border: 1px solid var(--border); }
.btn-warn { background: var(--orange); color: #FFF; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 110;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal {
  width: 100%;
  max-width: 420px;
  background: var(--white);
  border-radius: 16px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-head h2 { font-size: 14px; font-weight: 700; }
.modal-head h2 .staff-name { color: var(--blue); }
.modal-head h2 .staff-name.spot { color: var(--orange); }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--cream);
  font-size: 14px;
  color: var(--ink-soft);
}
.modal-body { padding: 12px 16px; overflow-y: auto; flex: 1; }

.base-tier-head {
  font-size: 10px;
  color: var(--ink-mute);
  font-weight: 700;
  letter-spacing: .1em;
  padding: 8px 0 4px;
}
.base-option {
  padding: 12px;
  margin-bottom: 6px;
  background: var(--cream);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border-light);
}
.base-option:active { background: var(--border-light); }
.base-option.preferred {
  background: #EBF3FA;
  border-color: #C7DCE9;
}
.base-option.preferred:active { background: #D7E6F0; }
.base-option .name { flex: 1; font-size: 14px; font-weight: 600; }
.base-option .pref-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--orange);
  color: #FFF;
}

.diff-empty { text-align: center; padding: 24px 0; color: var(--ink-mute); font-size: 13px; }
.diff-item {
  padding: 10px 12px;
  background: var(--warn-bg);
  border-left: 3px solid var(--orange);
  border-radius: 6px;
  margin-bottom: 8px;
  font-size: 12px;
}
.diff-item .meta { color: var(--ink-mute); margin-bottom: 4px; }
.diff-item .change {
  display: flex; align-items: center; gap: 6px;
  font-weight: 600;
}
.diff-item .from { color: var(--red); text-decoration: line-through; }
.diff-item .arrow { color: var(--ink-mute); }
.diff-item .to { color: var(--green); }

.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(0,0,0,.85);
  color: #FFF;
  padding: 10px 16px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: all .25s;
  max-width: 90%;
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.ok  { background: rgba(39, 174, 96, .95); }
.toast.err { background: rgba(192, 57, 43, .95); }

.loading {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,.7);
  z-index: 150;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}
.loading.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--navy);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

/* ═══ タブバー ═══ */
.tab-bar {
  display: flex;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 52px;
  z-index: 40;
  box-shadow: 0 1px 0 rgba(0,0,0,.04);
}
.tab-btn {
  flex: 1;
  padding: 12px 4px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-mute);
  background: var(--white);
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  position: relative;
}
.tab-btn:active { background: var(--cream); }
.tab-btn.active {
  color: var(--navy);
  border-bottom-color: var(--navy);
}
.tab-btn .badge-tab {
  display: inline-block;
  margin-left: 4px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--orange);
  color: #FFF;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  vertical-align: middle;
}
.tab-btn .badge-tab[hidden] { display: none; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ═══ スタッフ管理タブ ═══ */
.staff-section { margin: 0 16px 12px; }
.staff-section .sec-title { margin-left: 0; margin-right: 0; }

.orphan-card {
  background: var(--warn-bg);
  border: 1px solid var(--orange);
  border-left-width: 4px;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.orphan-card .head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.orphan-card .name { font-weight: 700; color: var(--orange); font-size: 14px; flex: 1; min-width: 0; }
.orphan-card .meta { font-size: 11px; color: var(--ink-soft); }
.orphan-card .actions { display: flex; gap: 6px; }
.orphan-card .actions button {
  flex: 1;
  padding: 8px 6px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
}
.orphan-card .btn-add { background: var(--green); color: #FFF; }
.orphan-card .btn-add:active { background: #1E8449; }
.orphan-card .btn-ignore { background: var(--white); color: var(--ink-soft); border: 1px solid var(--border); }
.orphan-card .btn-ignore:active { background: var(--cream); }

.collapse-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}
.collapse-head:active { background: var(--cream); }
.collapse-head .caret { font-size: 11px; color: var(--ink-mute); transition: transform .2s; }
.collapse.open .collapse-head { border-radius: 8px 8px 0 0; }
.collapse.open .collapse-head .caret { transform: rotate(90deg); }
.collapse-body {
  display: none;
  padding: 4px 12px;
  background: var(--white);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 8px 8px;
}
.collapse.open .collapse-body { display: block; }
.ignored-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
  font-size: 13px;
}
.ignored-item:last-child { border-bottom: none; }
.ignored-item button {
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--blue);
  color: #FFF;
  font-size: 11px;
  font-weight: 700;
}
.ignored-item button:active { background: #1F618D; }

.add-staff-btn {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  background: var(--green);
  color: #FFF;
  font-size: 14px;
  font-weight: 700;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.add-staff-btn:active { background: #1E8449; transform: scale(.98); }

.staff-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  overflow: hidden;
  transition: box-shadow .15s, border-color .15s;
}
.staff-card.expanded { border-color: var(--blue); box-shadow: 0 2px 8px rgba(36,113,163,.12); }
.staff-card.spot { background: var(--warn-bg); border-color: #F5CBA7; }
.staff-card-head {
  display: flex;
  align-items: center;
  padding: 12px;
  cursor: pointer;
  gap: 8px;
  user-select: none;
}
.staff-card-head:active { background: var(--cream); }
.staff-card.spot .staff-card-head:active { background: var(--orange-light); }
.staff-card .name { flex: 1; font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.staff-card.spot .name { color: var(--orange); }
.staff-card .prefs-mini {
  font-size: 10px;
  color: var(--ink-mute);
  max-width: 50%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.staff-card .caret { font-size: 12px; color: var(--ink-mute); transition: transform .2s; flex-shrink: 0; }
.staff-card.expanded .caret { transform: rotate(90deg); }
.staff-card-body {
  display: none;
  padding: 12px;
  border-top: 1px solid var(--border-light);
  background: var(--cream);
}
.staff-card.expanded .staff-card-body { display: block; }

.form-row { margin-bottom: 10px; }
.form-row label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-mute);
  margin-bottom: 4px;
  letter-spacing: .05em;
}
.form-row select,
.form-row input {
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  color: var(--ink);
}
.form-row select:focus,
.form-row input:focus { outline: none; border-color: var(--blue); }

.form-actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 14px;
}
.form-actions button {
  padding: 10px 4px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.btn-save { background: var(--green); color: #FFF; }
.btn-save:active { background: #1E8449; }
.btn-rename { background: var(--blue); color: #FFF; }
.btn-rename:active { background: #1F618D; }
.btn-delete { background: var(--red); color: #FFF; }
.btn-delete:active { background: #922B21; }

.warn-note {
  font-size: 11px;
  color: var(--ink-soft);
  background: var(--warn-bg);
  padding: 10px 12px;
  border-radius: 6px;
  border-left: 3px solid var(--orange);
  line-height: 1.6;
  margin-top: 8px;
}

/* ── 週切替ナビ ── */
.week-nav {
  display: flex;
  gap: 6px;
  margin-top: 5px;
}
.week-nav-btn {
  padding: 3px 11px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  border: 1.5px solid var(--blue);
  background: transparent;
  color: var(--blue);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.week-nav-btn.active {
  background: var(--blue);
  color: #FFF;
}

/* ── シフトサブタブ ── */
.shift-sub-tabs {
  display: flex;
  overflow-x: auto;
  gap: 4px;
  padding: 10px 14px 2px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.shift-sub-tabs::-webkit-scrollbar { display: none; }
.shift-sub-tab {
  flex-shrink: 0;
  padding: 5px 13px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 700;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.shift-sub-tab.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #FFF;
}

/* ── 未割当フィルター ── */
.matrix-filter {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 16px 2px;
  font-size: 12px;
  color: var(--ink-soft);
  cursor: pointer;
}
.matrix-filter input[type=checkbox] {
  width: 15px;
  height: 15px;
  cursor: pointer;
  accent-color: var(--blue);
}

/* ── 日別ビュー ── */
.daily-list { padding: 6px 12px 0; }
.daily-row {
  display: flex;
  align-items: center;
  padding: 11px 12px;
  background: var(--white);
  border: 1px solid var(--border-light);
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  gap: 8px;
}
.daily-row:active { background: var(--cream); }
.daily-row .base-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.daily-row .assigned-name {
  font-size: 13px;
  color: var(--ink);
  flex-shrink: 0;
}
.daily-row .assigned-name.unassigned { color: var(--ink-mute); }
.daily-row .assigned-name.spot { color: var(--orange); }
.daily-caret { font-size: 10px; color: var(--ink-mute); flex-shrink: 0; }

/* ── 直接連絡ボタン ── */
.direct-contact-btn {
  display: block;
  width: calc(100% - 24px);
  margin: 8px 12px 14px;
  padding: 12px;
  background: var(--card);
  border: 1.5px dashed var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--ink-soft);
  text-align: center;
  cursor: pointer;
  font-weight: 600;
}
.direct-contact-btn:active { background: var(--cream); }

/* ── 直接連絡セラー選択オーバーレイ ── */
#dcPickerOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 300;
  align-items: flex-end;
}
#dcPickerOverlay.show { display: flex; }
.dc-picker-sheet {
  background: var(--white);
  border-radius: 18px 18px 0 0;
  width: 100%;
  max-height: 75vh;
  display: flex;
  flex-direction: column;
}
.dc-picker-head {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border-light);
}
.dc-picker-title { font-size: 15px; font-weight: 700; color: var(--ink); }
.dc-picker-sub { font-size: 11px; color: var(--ink-mute); margin-top: 2px; }
.dc-picker-search {
  margin: 8px 12px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  width: calc(100% - 24px);
  box-sizing: border-box;
}
.dc-picker-body { overflow-y: auto; flex: 1; padding: 0 0 8px; }
.dc-picker-foot {
  padding: 10px 12px;
  border-top: 1px solid var(--border-light);
}
.dc-tag {
  font-size: 10px;
  background: #E8F4FD;
  color: #1A5276;
  border-radius: 4px;
  padding: 1px 5px;
  margin-left: 4px;
  font-weight: 700;
}

/* ── 保存ボタン ── */
.act-btn.save {
  background: var(--green);
  position: relative;
}
.save-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--red);
  color: #FFF;
  font-size: 10px;
  font-weight: 700;
  border-radius: 10px;
  padding: 1px 5px;
  min-width: 16px;
  text-align: center;
  display: none;
}

/* ── Pending dot（未保存インジケーター） ── */
.matrix td.pending::after,
.daily-row.pending .daily-caret::before {
  content: '●';
  font-size: 7px;
  color: var(--blue);
  vertical-align: super;
  margin-left: 2px;
}

/* ── 希望者なし（薄い赤）セル ── */
.matrix td.no-pool {
  background: #FFEEEE;
  color: #CC6666;
}

/* ── 未提出セクション（toggle付き） ── */
.tier-head.notsubmit { color: var(--ink-mute); border-color: var(--border-light); }
.seller-item.notsubmit-item {
  opacity: .75;
  justify-content: space-between;
}
.seller-item.notsubmit-item .name { color: var(--ink-mute); }

/* トグルスイッチ */
.toggle-wrap {
  display: flex;
  align-items: center;
  cursor: pointer;
  gap: 6px;
  flex-shrink: 0;
}
.toggle-wrap input { display: none; }
.toggle-knob {
  width: 36px;
  height: 20px;
  background: var(--border);
  border-radius: 10px;
  position: relative;
  transition: background .2s;
}
.toggle-knob::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  background: #FFF;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: left .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.toggle-wrap input:checked + .toggle-knob { background: var(--green); }
.toggle-wrap input:checked + .toggle-knob::after { left: 18px; }

/* ── 一括割り当てボタン（スタッフ管理） ── */
.bulk-assign-btn {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  border: 1.5px solid var(--blue);
  background: transparent;
  color: var(--blue);
  cursor: pointer;
  flex-shrink: 0;
}
.bulk-assign-btn:active { background: var(--blue); color: #FFF; }

/* ── 一括割り当て拠点選択シート ── */
.bulk-base-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
}
.bulk-base-item:active { background: var(--cream); }
</style>
</head>
<body>

<div id="scr-pw">
  <h1>📋 シフト管理</h1>
  <div class="sub">管理者専用ページ</div>
  <input type="password" class="pw-input" id="pwInput" placeholder="パスワード" inputmode="numeric"
    onkeydown="if(event.key==='Enter')login()">
  <button class="pw-btn" onclick="login()">ログイン</button>
  <div class="pw-err" id="pwErr"></div>
</div>

<div id="scr-main">

  <header class="header">
    <div>
      <h1>📋 シフト管理</h1>
      <div class="week" id="weekInfo">読み込み中...</div>
      <div class="week-nav">
        <button class="week-nav-btn" id="btnPrevWeek" onclick="switchWeek('prev')">◀ 前週</button>
        <button class="week-nav-btn active" id="btnThisWeek" onclick="switchWeek('this')">今週</button>
      </div>
    </div>
    <button class="logout" onclick="logout()">ログアウト</button>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-shift" onclick="switchTab('shift')">📋 シフト管理</button>
    <button class="tab-btn" id="tab-staff" onclick="switchTab('staff')">👥 スタッフ管理<span class="badge-tab" id="orphanBadge" hidden>0</span></button>
  </div>

  <div class="tab-panel active" id="panel-shift">

  <!-- シフトサブタブ -->
  <div class="shift-sub-tabs" id="shiftSubTabs">
    <button class="shift-sub-tab active" data-tab="all" onclick="switchShiftSubTab('all')">全体</button>
  </div>

  <div class="actions">
    <button class="act-btn assign" onclick="confirmAssign()">
      <span class="ico">🔄</span>
      <span>自動割振</span>
    </button>
    <button class="act-btn diff" onclick="showDiffs()">
      <span class="ico">🔍</span>
      <span>差分確認</span>
      <span class="badge" id="diffBadge" hidden>0</span>
    </button>
    <button class="act-btn batch" onclick="confirmBatch()">
      <span class="ico">📣</span>
      <span>一括送信</span>
    </button>
    <button class="act-btn save" onclick="batchSave()">
      <span class="ico">💾</span>
      <span>保存</span>
      <span class="save-badge" id="saveBadge">0</span>
    </button>
  </div>

  <div class="actions-2nd">
    <button class="act-btn remind-next" onclick="confirmReminder('next')">
      <span class="ico">📣</span>
      <span>来週リマインド</span>
    </button>
    <button class="act-btn remind-this" onclick="confirmReminder('this')">
      <span class="ico">📣</span>
      <span>今週リマインド</span>
    </button>
  </div>

  <div class="status" id="status">準備中...</div>

  <!-- 全体ビュー（デフォルト） -->
  <div id="allView">
    <label class="matrix-filter">
      <input type="checkbox" id="unassignedFilter" onchange="toggleUnassignedFilter()">
      未割当のみ表示
    </label>
    <div class="sec-title">📊 シフト割当</div>
    <div class="matrix-wrap" id="matrixWrap">
      <div class="matrix-empty">
        <div class="em-ico">📋</div>
        <div>マトリクスを読み込み中...</div>
      </div>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="legend-dot assigned"></span>割当済</span>
      <span class="legend-item"><span class="legend-dot unassigned"></span>希望あり未割当</span>
      <span class="legend-item"><span class="legend-dot" style="background:#D0D0D0"></span>希望者なし</span>
      <span class="legend-item"><span class="legend-dot spot"></span>スポット</span>
    </div>

    <div class="sec-title">⚠️ 未割当スタッフ <span id="poolTotalCount" style="margin-left:auto;font-weight:500;color:var(--ink-mute);font-size:10px;letter-spacing:0;"></span></div>
    <div class="pool-wrap" id="poolWrap">
      <div class="pool-empty">読み込み中...</div>
    </div>
  </div>

  <!-- 日別ビュー（サブタブ選択時） -->
  <div id="dailyView" style="display:none">
    <div id="dailyViewContent" class="daily-list"></div>
    <button class="direct-contact-btn" id="directContactBtn" onclick="addDirectContact()">
      💬 直接連絡を追加
    </button>
  </div>

  <div class="reload-wrap">
    <button class="reload-btn" onclick="loadAll()">🔄 再読み込み</button>
  </div>

  </div><!-- /panel-shift -->

  <div class="tab-panel" id="panel-staff">

    <div class="staff-section" id="orphanSection" style="display:none">
      <div class="sec-title">⚠️ 未登録の名前 <span id="orphanCount" style="margin-left:auto;font-weight:500;color:var(--orange);font-size:11px;letter-spacing:0"></span></div>
      <div id="orphanList"></div>
    </div>

    <div class="staff-section" id="ignoredSection" style="display:none">
      <div class="collapse" id="ignoredCollapse">
        <div class="collapse-head" onclick="toggleCollapse('ignoredCollapse')">
          <span>🚫 無視リスト <span id="ignoredCount" style="color:var(--ink-mute);font-weight:500;margin-left:4px"></span></span>
          <span class="caret">▶</span>
        </div>
        <div class="collapse-body" id="ignoredList"></div>
      </div>
    </div>

    <div class="staff-section">
      <div class="sec-title">📋 販売員一覧 <span id="staffTotalCount" style="margin-left:auto;font-weight:500;color:var(--ink-mute);font-size:11px;letter-spacing:0"></span></div>
      <button class="add-staff-btn" onclick="openAddStaffSheet()">
        <span style="font-size:18px;line-height:1">＋</span> 新規追加
      </button>
      <div id="staffList">
        <div class="pool-empty">読み込み中...</div>
      </div>
    </div>

    <div class="reload-wrap">
      <button class="reload-btn" onclick="loadStaffTab()">🔄 再読み込み</button>
    </div>

  </div><!-- /panel-staff -->

</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">—</div>
      <div class="sheet-sub" id="sheetSub">—</div>
      <div class="sheet-current" id="sheetCurrent" style="display:none">現在: —</div>
    </div>
    <div class="sheet-search-wrap">
      <input type="text" class="sheet-search" id="sheetSearch" placeholder="🔍 名前で絞り込み"
        oninput="renderSellers()">
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" onclick="closeSheet()">閉じる</button>
      <button class="btn btn-warn" onclick="removeCurrent()">未割当に戻す</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="staffModal" onclick="if(event.target===this)closeStaffModal()">
  <div class="modal">
    <div class="modal-head">
      <h2 id="staffModalTitle">割り当て先を選択</h2>
      <button class="modal-close" onclick="closeStaffModal()">✕</button>
    </div>
    <div class="modal-body" id="staffModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="diffModal" onclick="if(event.target===this)closeDiff()">
  <div class="modal">
    <div class="modal-head">
      <h2>🔍 通知後の変更</h2>
      <button class="modal-close" onclick="closeDiff()">✕</button>
    </div>
    <div class="modal-body" id="diffBody"></div>
  </div>
</div>

<!-- 直接連絡：販売員ピッカー -->
<div id="dcPickerOverlay" onclick="if(event.target===this)closeDcPicker()">
  <div class="dc-picker-sheet">
    <div class="dc-picker-head">
      <div class="dc-picker-title">💬 直接連絡：販売員を選択</div>
      <div class="dc-picker-sub" id="dcPickerSub">—</div>
    </div>
    <input type="text" class="dc-picker-search" id="dcPickerSearch"
      placeholder="🔍 名前で絞り込み" oninput="renderDcPicker()">
    <div class="dc-picker-body" id="dcPickerBody"></div>
    <div class="dc-picker-foot">
      <button class="btn btn-ghost" style="width:100%" onclick="closeDcPicker()">閉じる</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="staffEditOverlay" onclick="if(event.target===this)closeStaffEdit()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="staffEditTitle">＋ 新規追加</div>
      <div class="sheet-sub" id="staffEditSub">販売員情報を入力</div>
    </div>
    <div class="sheet-body" style="padding:16px">
      <div class="form-row" id="staffEditNameRow">
        <label>名前 <span style="color:var(--red)">*</span></label>
        <input type="text" id="staffEditName" placeholder="例: 山田太郎">
      </div>
      <div class="form-row">
        <label>第1希望拠点</label>
        <select id="staffEditPref1"></select>
      </div>
      <div class="form-row">
        <label>第2希望拠点</label>
        <select id="staffEditPref2"></select>
      </div>
      <div class="form-row">
        <label>第3希望拠点</label>
        <select id="staffEditPref3"></select>
      </div>
      <div class="form-row">
        <label>特別ギャラ（円）</label>
        <input type="number" id="staffEditSalary" placeholder="0" inputmode="numeric">
      </div>
      <div class="form-row">
        <label>備考</label>
        <input type="text" id="staffEditNote" placeholder="任意">
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" onclick="closeStaffEdit()">キャンセル</button>
      <button class="btn btn-warn" id="staffEditSaveBtn" onclick="submitStaffEdit()">追加</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="renameOverlay" onclick="if(event.target===this)closeRename()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title">✏️ 名前変更</div>
      <div class="sheet-sub" id="renameSub">—</div>
    </div>
    <div class="sheet-body" style="padding:16px">
      <div class="form-row">
        <label>新しい名前 <span style="color:var(--red)">*</span></label>
        <input type="text" id="renameInput" placeholder="新しい名前を入力">
      </div>
      <div class="warn-note">
        ⚠️ 名前を変更すると、シフト表・回答シート・通知履歴の該当データもすべて連動更新されます。
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" onclick="closeRename()">キャンセル</button>
      <button class="btn btn-warn" onclick="submitRename()">変更する</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="bulkAssignOverlay" onclick="if(event.target===this)closeBulkAssign()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="bulkAssignTitle">一括割り当て</div>
      <div class="sheet-sub" id="bulkAssignSub">割り当て先の拠点を選択</div>
    </div>
    <div class="sheet-body" id="bulkAssignBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" onclick="closeBulkAssign()">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">処理中...</div>
</div>

<script>
'use strict';

const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkcAI-Nkl3aoUZKgluss5AawPDc7aluPokONkYz6f2ikwl0S487JvhKdKh6QSp1xhEhA/exec';
const PASSWORD = '1115';

const state = {
  weekTarget: null,
  thisWeekTarget: null,
  viewWeek: 'this',
  bases: [],
  sellers: [],
  dates: [],
  matrix: {},
  unassignedPool: {},
  diffs: [],
  selected: null,
  selectedStaff: null,
  activeTab: 'shift',
  activeShiftSub: 'all',
  showUnassignedOnly: false,
  directContactDate: null,
  pending: {},            // {'date|base': {date,base,name}} 未保存変更
  submittedNames: new Set(), // 今週希望提出済み販売員名
  workHoursMap: {},       // 拠点名 → 勤務時間
  bulkAssignStaff: null,
  salesStaff: [],
  orphans: [],
  ignored: [],
  staffTabLoaded: false,
  editingIndex: -1,
  editMode: null,
};

function login() {
  const v = document.getElementById('pwInput').value;
  if (v === PASSWORD) {
    sessionStorage.setItem('shift_admin_auth', '1');
    showMain();
  } else {
    document.getElementById('pwErr').textContent = 'パスワードが違います';
    document.getElementById('pwInput').value = '';
  }
}
function logout() {
  sessionStorage.removeItem('shift_admin_auth');
  document.getElementById('scr-main').style.display = 'none';
  document.getElementById('scr-pw').style.display = 'flex';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
}
function showMain() {
  document.getElementById('scr-pw').style.display = 'none';
  document.getElementById('scr-main').style.display = 'block';
  loadAll();
}

async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${GAS_URL}?${qs}`, { redirect: 'follow' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}
async function apiPost(action, payload = {}) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify({ action, ...payload }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function loadAll() {
  setStatus('busy', 'マトリクスを読み込み中...');
  // サブタブをリセット
  state.activeShiftSub = 'all';
  try {
    const params = {};
    if (state.viewWeek === 'prev' && state.thisWeekTarget) {
      params.weekTarget = computePrevWeekTarget(state.thisWeekTarget);
    }
    const data = await apiGet('getShiftMatrix', params);
    if (!data.success) throw new Error(data.error || 'API失敗');
    if (state.viewWeek !== 'prev') {
      state.thisWeekTarget = data.weekTarget;
    }
    state.weekTarget = data.weekTarget;
    state.bases = data.bases || [];
    state.sellers = data.sellers || [];
    state.dates = data.dates || [];
    state.matrix = data.matrix || {};
    state.unassignedPool = data.unassignedPool || {};

    // submittedNames: プールにいる人 + 既に割り当て済みの人
    state.submittedNames = new Set();
    Object.values(state.unassignedPool).forEach(pool =>
      pool.forEach(p => state.submittedNames.add(p.name)));
    Object.values(state.matrix).forEach(byBase =>
      Object.values(byBase).forEach(n => {
        if (n && n !== '【未割当】') state.submittedNames.add(n);
      }));

    // workHoursMap: 拠点名→勤務時間
    state.workHoursMap = {};
    (data.bases || []).forEach(b => {
      if (b.workHours) state.workHoursMap[b.name] = b.workHours;
    });

    state.pending = {};
    updateSaveBadge();
    updateWeekInfo();
    renderDayTabs();
    renderMatrix();
    renderPool();
    setStatus('ok', `読込完了：${state.bases.length}拠点 × ${state.dates.length}日`);
    loadDiffs();
  } catch (e) {
    setStatus('err', `エラー: ${e.message}`);
    toast(`読込失敗: ${e.message}`, 'err');
  }
}
async function loadDiffs() {
  if (!state.weekTarget) return;
  try {
    const data = await apiGet('getNotifiedDiff', { weekTarget: state.weekTarget });
    if (!data.success) return;
    state.diffs = data.diffs || [];
    updateDiffBadge();
  } catch (e) {
    console.warn('diff load failed:', e);
  }
}

function updateWeekInfo() {
  const wt = state.weekTarget || '—';
  const dateRange = state.dates.length > 0
    ? `${state.dates[0]} 〜 ${state.dates[state.dates.length - 1]}`
    : '日付データなし';
  document.getElementById('weekInfo').textContent = `${wt} ・ ${dateRange}`;
  document.getElementById('btnPrevWeek').classList.toggle('active', state.viewWeek === 'prev');
  document.getElementById('btnThisWeek').classList.toggle('active', state.viewWeek !== 'prev');
}

function isSpotName(name) {
  return /^スポットバイト/.test(String(name || '').trim());
}

function renderMatrix() {
  const wrap = document.getElementById('matrixWrap');
  if (state.dates.length === 0 || state.bases.length === 0) {
    wrap.innerHTML = `
      <div class="matrix-empty">
        <div class="em-ico">📭</div>
        <div>シフトデータがありません</div>
        <div style="margin-top:8px;font-size:11px">「自動割振」を実行してください</div>
      </div>`;
    return;
  }

  // 未割当フィルター：未割当セルが1つでもある拠点のみ表示
  const basesToShow = state.showUnassignedOnly
    ? state.bases.filter(b => state.dates.some(d => {
        const name = (state.matrix[d] && state.matrix[d][b.name]) || '';
        return !name || name === '【未割当】';
      }))
    : state.bases;

  let html = '<table class="matrix"><thead><tr>';
  html += '<th class="corner">拠点</th>';
  state.dates.forEach(d => { html += `<th>${escapeHtml(d)}</th>`; });
  html += '</tr></thead><tbody>';

  basesToShow.forEach(b => {
    html += `<tr><th>${escapeHtml(b.name)}</th>`;
    state.dates.forEach(d => {
      const key = `${d}|${b.name}`;
      const name = (state.matrix[d] && state.matrix[d][b.name]) || '';
      const isUn = !name || name === '【未割当】';
      const isSpot = !isUn && isSpotName(name);
      const isPending = !!state.pending[key];

      let cls = '';
      let display = '';
      if (isUn) {
        // 希望者あり → orange（未割当）、希望者なし → no-pool（グレー）
        const hasPool = (state.unassignedPool[d] || []).some(p =>
          p.pref1 === b.name || p.pref2 === b.name || p.pref3 === b.name);
        cls = hasPool ? 'unassigned' : 'no-pool';
        display = '未割当';
      } else if (isSpot) {
        cls = 'spot'; display = name;
      } else {
        display = name;
      }
      if (isPending) cls += ' pending';

      html += `<td class="${cls}" data-date="${escapeAttr(d)}" data-base="${escapeAttr(b.name)}"
        onclick="openSheet(this.dataset.date, this.dataset.base)">${escapeHtml(display)}</td>`;
    });
    html += '</tr>';
  });

  if (basesToShow.length === 0) {
    html += `<tr><td colspan="${state.dates.length + 1}" style="text-align:center;padding:20px;color:var(--ink-mute);">
      未割当の拠点はありません ✅</td></tr>`;
  }

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function renderPool() {
  const wrap = document.getElementById('poolWrap');
  const countEl = document.getElementById('poolTotalCount');

  // 未割当数カウント（スポットは未割当概念から除外済 by GAS）
  let normalCount = 0;
  Object.values(state.unassignedPool || {}).forEach(pool => {
    pool.forEach(item => {
      if (item.type !== 'spot') normalCount++;
    });
  });
  countEl.textContent = `未割当 ${normalCount}名`;

  if (state.dates.length === 0) {
    wrap.innerHTML = '<div class="pool-empty">日付データがありません</div>';
    return;
  }

  let html = '';
  state.dates.forEach(date => {
    const pool = (state.unassignedPool[date] || []).filter(p => p.type !== 'spot');
    if (pool.length === 0) return;
    html += `<div class="date-group">`;
    html += `<div class="date-head">
      <span>${escapeHtml(date)}</span>
      <span class="count">${pool.length}名</span>
    </div>`;
    html += `<div class="chip-row">`;
    pool.forEach(item => {
      html += `<div class="chip normal"
        onclick="openStaffModal('${escapeAttr(item.name)}','${item.type}','${escapeAttr(date)}')">
        <span class="ico">👤</span>
        <span>${escapeHtml(item.name)}</span>
      </div>`;
    });
    html += `</div></div>`;
  });

  if (!html) {
    html = '<div class="pool-empty">✅ 未割当スタッフはいません</div>';
  }
  wrap.innerHTML = html;
}

function updateDiffBadge() {
  const badge = document.getElementById('diffBadge');
  const n = state.diffs.length;
  if (n > 0) {
    badge.textContent = n;
    badge.hidden = false;
  } else {
    badge.hidden = true;
  }
}

function openSheet(date, base) {
  const current = (state.matrix[date] && state.matrix[date][base]) || '';
  const isUn = !current || current === '【未割当】';
  state.selected = { date, base, current: isUn ? '' : current };

  document.getElementById('sheetTitle').textContent = base;
  document.getElementById('sheetSub').textContent = date;
  const curEl = document.getElementById('sheetCurrent');
  if (isUn) {
    curEl.style.display = 'none';
  } else {
    curEl.style.display = 'inline-block';
    curEl.textContent = `現在: ${current}`;
  }
  document.getElementById('sheetSearch').value = '';
  renderSellers();
  document.getElementById('sheetOverlay').classList.add('show');
}
function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('show');
  state.selected = null;
}

function renderSellers() {
  if (!state.selected) return;
  const { base, current, date } = state.selected;
  const q = document.getElementById('sheetSearch').value.trim().toLowerCase();

  const pool = state.unassignedPool[date] || [];
  const poolNames = new Set(pool.map(p => p.name));

  const poolNormal = [];
  const allSpots = [];     // ★ スポットは常時全件表示
  const tiers = [[], [], [], []];
  state.sellers.forEach(s => {
    const name = s.name;
    if (q && !name.toLowerCase().includes(q)) return;

    if (s.isSpot) {
      allSpots.push({ ...s });
      return;
    }
    if (poolNames.has(name)) {
      poolNormal.push({ ...s });
      return;
    }
    if (s.pref1 === base) tiers[0].push({ ...s, tier: 1 });
    else if (s.pref2 === base) tiers[1].push({ ...s, tier: 2 });
    else if (s.pref3 === base) tiers[2].push({ ...s, tier: 3 });
    else tiers[3].push({ ...s, tier: 4 });
  });

  let html = '';

  // ⚠️ この日の未割当（通常スタッフのみ）
  if (poolNormal.length > 0) {
    html += `<div class="tier-head pool">⚠️ この日の未割当（${poolNormal.length}名）</div>`;
    poolNormal.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    poolNormal.forEach(s => {
      const isCur = s.name === current;
      const prefTag = s.pref1 === base ? '<span class="pref-tag">1</span>'
                    : s.pref2 === base ? '<span class="pref-tag t2">2</span>'
                    : s.pref3 === base ? '<span class="pref-tag t3">3</span>'
                    : '';
      html += `<div class="seller-item ${isCur ? 'current' : ''}"
        onclick="selectSeller('${escapeAttr(s.name)}')">
        <span class="name">${escapeHtml(s.name)}</span>
        <span class="pool-tag">未割当</span>
        ${prefTag}
        ${isCur ? '<span class="check">✓</span>' : ''}
      </div>`;
    });
  }

  // 第1希望〜その他
  const labels = ['第1希望', '第2希望', '第3希望', 'その他'];
  tiers.forEach((arr, i) => {
    if (arr.length === 0) return;
    html += `<div class="tier-head">${labels[i]}（${arr.length}名）</div>`;
    arr.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    arr.forEach(s => {
      const isCur = s.name === current;
      const tag = s.tier === 1 ? '<span class="pref-tag">1</span>'
                : s.tier === 2 ? '<span class="pref-tag t2">2</span>'
                : s.tier === 3 ? '<span class="pref-tag t3">3</span>'
                : '';
      html += `<div class="seller-item ${isCur ? 'current' : ''}"
        onclick="selectSeller('${escapeAttr(s.name)}')">
        <span class="name">${escapeHtml(s.name)}</span>
        ${tag}
        ${isCur ? '<span class="check">✓</span>' : ''}
      </div>`;
    });
  });

  // ⭐ スポット枠（常時利用可・全件表示）
  if (allSpots.length > 0) {
    html += `<div class="tier-head spot-head">⭐ スポット枠（常時利用可・${allSpots.length}名）</div>`;
    allSpots.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    allSpots.forEach(s => {
      const isCur = s.name === current;
      html += `<div class="seller-item spot-item ${isCur ? 'current' : ''}"
        onclick="selectSeller('${escapeAttr(s.name)}')">
        <span class="name spot">${escapeHtml(s.name)}</span>
        ${isCur ? '<span class="check">✓</span>' : ''}
      </div>`;
    });
  }

  if (!html) html = '<div class="diff-empty">該当する販売員がいません</div>';
  document.getElementById('sheetBody').innerHTML = html;
}

function selectSeller(name) {
  if (!state.selected) return;
  const { date, base } = state.selected;
  savePendingLocal(date, base, name);
  closeSheet();
  toast(`${base} → ${name}（未保存）`, 'ok');
}

function removeCurrent() {
  if (!state.selected) return;
  const { date, base } = state.selected;
  savePendingLocal(date, base, '');
  closeSheet();
  toast(`${base} を未割当に戻しました（未保存）`, 'ok');
}

function openStaffModal(name, type, date) {
  state.selectedStaff = { name, type, date };
  const isSpot = type === 'spot';
  document.getElementById('staffModalTitle').innerHTML =
    `<span class="staff-name ${isSpot ? 'spot' : ''}">${escapeHtml(name)}</span> を ${escapeHtml(date)} のどこに？`;
  renderBaseOptions();
  document.getElementById('staffModal').classList.add('show');
}
function closeStaffModal() {
  document.getElementById('staffModal').classList.remove('show');
  state.selectedStaff = null;
}

function renderBaseOptions() {
  if (!state.selectedStaff) return;
  const { name, date, type } = state.selectedStaff;

  const unassignedBases = state.bases.filter(b => {
    const cur = (state.matrix[date] && state.matrix[date][b.name]) || '';
    return !cur || cur === '【未割当】';
  });

  let prefs = [];
  if (type !== 'spot') {
    const seller = state.sellers.find(s => s.name === name);
    if (seller) {
      prefs = [seller.pref1, seller.pref2, seller.pref3].filter(p => p);
    }
  }

  const preferred = [];
  const others = [];
  unassignedBases.forEach(b => {
    const prefIdx = prefs.indexOf(b.name);
    if (prefIdx >= 0) preferred.push({ ...b, prefRank: prefIdx + 1 });
    else others.push(b);
  });
  preferred.sort((a, b) => a.prefRank - b.prefRank);

  let html = '';
  if (unassignedBases.length === 0) {
    html = '<div class="diff-empty">未割当の拠点がありません</div>';
  } else {
    if (preferred.length > 0) {
      html += '<div class="base-tier-head">⭐ 希望拠点</div>';
      preferred.forEach(b => {
        html += `<div class="base-option preferred"
          onclick="assignStaffToBase('${escapeAttr(b.name)}')">
          <span class="name">${escapeHtml(b.name)}</span>
          <span class="pref-tag">第${b.prefRank}希望</span>
        </div>`;
      });
    }
    if (others.length > 0) {
      html += `<div class="base-tier-head">未割当の拠点（${others.length}件）</div>`;
      others.forEach(b => {
        html += `<div class="base-option"
          onclick="assignStaffToBase('${escapeAttr(b.name)}')">
          <span class="name">${escapeHtml(b.name)}</span>
        </div>`;
      });
    }
  }
  document.getElementById('staffModalBody').innerHTML = html;
}

async function assignStaffToBase(baseName) {
  if (!state.selectedStaff) return;
  const { name, date } = state.selectedStaff;
  showLoading('割当を更新中...');
  try {
    const data = await apiPost('setAssignment', { date, base: baseName, name });
    if (!data.success) throw new Error(data.error || '更新失敗');
    closeStaffModal();
    toast(`${baseName} → ${name}`, 'ok');
    await loadAll();
  } catch (e) {
    toast(`更新失敗: ${e.message}`, 'err');
  } finally {
    hideLoading();
  }
}

async function confirmAssign() {
  const ok = confirm('自動割振を実行します。\n\n現在のシフト表は上書きされます。\nよろしいですか？');
  if (!ok) return;
  showLoading('自動割振中（10〜30秒）...');
  setStatus('busy', '自動割振中...');
  try {
    const data = await apiGet('admin', { task: 'assign' });
    if (data.status !== 'ok') throw new Error(data.message || '失敗');
    toast('自動割振完了', 'ok');
    setStatus('ok', '自動割振完了');
    await loadAll();
  } catch (e) {
    toast(`失敗: ${e.message}`, 'err');
    setStatus('err', `自動割振失敗: ${e.message}`);
  } finally {
    hideLoading();
  }
}

async function confirmBatch() {
  const recipients = new Set();
  Object.values(state.matrix).forEach(row => {
    Object.values(row).forEach(name => {
      if (!name || name === '【未割当】') return;
      if (isSpotName(name)) return;
      recipients.add(name);
    });
  });

  let normalUnassigned = 0;
  Object.values(state.unassignedPool || {}).forEach(pool => {
    pool.forEach(item => {
      if (item.type === 'normal') normalUnassigned++;
    });
  });

  let msg = `${recipients.size}名の販売員にLINE通知を送信します。\n`;
  msg += `対象週: ${state.weekTarget || '—'}\n`;
  msg += `（スポットバイトには通知しません）\n\n`;
  if (normalUnassigned > 0) {
    msg += `⚠ 希望提出済みで未割当の方が ${normalUnassigned} 名います。\nこのまま送信してよろしいですか？`;
  } else {
    msg += `送信してよろしいですか？`;
  }

  const ok = confirm(msg);
  if (!ok) return;

  showLoading('LINE通知を送信中...');
  setStatus('busy', 'LINE通知送信中...');
  try {
    const data = await apiPost('sendShiftBatch', {
      weekTarget: state.weekTarget,
      source: 'manual'
    });
    if (!data.success) throw new Error(data.error || '送信失敗');
    const txt = `送信: ${data.sent}名 / スキップ: ${data.skipped}名`;
    toast(txt, 'ok');
    setStatus('ok', `一括送信完了（${txt}）`);
    loadDiffs();
  } catch (e) {
    toast(`送信失敗: ${e.message}`, 'err');
    setStatus('err', `一括送信失敗: ${e.message}`);
  } finally {
    hideLoading();
  }
}

// ─────────────────────────────────────────
// STEP 3-A：シフト未提出者へのLINEリマインダー（v2026-05-11）
//   - weekType: 'this' | 'next'
//   - 事前APIコールなし。confirm時は「未提出者」とだけ表示
//   - GAS側で対象抽出（属性=販売員 かつ userIdあり かつ 未提出）
// ─────────────────────────────────────────
async function confirmReminder(weekType) {
  const label = weekType === 'this' ? '今週' : '来週';
  const ok = confirm(
    `${label}分のシフト未提出者にLINEリマインダーを送信します。\n\n` +
    `（販売員のうち、まだ希望を提出していない人だけが対象です）\n\n` +
    `送信してよろしいですか？`
  );
  if (!ok) return;

  showLoading(`${label}リマインダー送信中...`);
  setStatus('busy', `${label}リマインダー送信中...`);
  try {
    const data = await apiPost('sendReminder', { weekTarget: weekType });
    if (!data.success) throw new Error(data.error || '送信失敗');
    if (data.total === 0) {
      toast(`${label}：未提出者なし（送信対象0名）`, 'ok');
      setStatus('ok', `${label}リマインド：未提出者なし`);
      return;
    }
    const txt = `送信: ${data.sent}名 / スキップ: ${data.skipped}名`;
    toast(`${label}リマインド完了（${txt}）`, 'ok');
    setStatus('ok', `${label}リマインド完了（${txt}）`);
  } catch (e) {
    toast(`リマインド送信失敗: ${e.message}`, 'err');
    setStatus('err', `リマインド送信失敗: ${e.message}`);
  } finally {
    hideLoading();
  }
}

function showDiffs() {
  const body = document.getElementById('diffBody');
  if (state.diffs.length === 0) {
    body.innerHTML = `
      <div class="diff-empty">
        <div style="font-size:32px;margin-bottom:8px">✅</div>
        <div>通知後の変更はありません</div>
      </div>`;
  } else {
    let html = `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px">
      ${state.diffs.length}件の変更を検出</div>`;
    state.diffs.forEach(d => {
      html += `<div class="diff-item">
        <div class="meta">${escapeHtml(d.date)} / ${escapeHtml(d.base)}</div>
        <div class="change">
          <span class="from">${escapeHtml(d.notifiedName)}</span>
          <span class="arrow">→</span>
          <span class="to">${escapeHtml(d.currentName)}</span>
        </div>
      </div>`;
    });
    body.innerHTML = html;
  }
  document.getElementById('diffModal').classList.add('show');
}
function closeDiff() {
  document.getElementById('diffModal').classList.remove('show');
}

function setStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = `status ${type}`;
  el.textContent = msg;
}
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.className = `toast ${type} show`;
  el.textContent = msg;
  setTimeout(() => el.classList.remove('show'), 2400);
}
function showLoading(msg = '処理中...') {
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('loading').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(s) {
  return String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function savePendingLocal(date, base, name) {
  const key = `${date}|${base}`;
  state.pending[key] = { date, base, name };
  if (!state.matrix[date]) state.matrix[date] = {};
  state.matrix[date][base] = name || '【未割当】';
  updateSaveBadge();
  // 現在表示中のビューを再描画
  if (state.activeShiftSub === 'all') renderMatrix();
  else renderDailyView(state.activeShiftSub);
}

function updateSaveBadge() {
  const count = Object.keys(state.pending).length;
  const badge = document.getElementById('saveBadge');
  if (!badge) return;
  badge.textContent = count;
  badge.style.display = count > 0 ? 'block' : 'none';
}

async function batchSave() {
  const entries = Object.values(state.pending);
  if (entries.length === 0) {
    toast('保存する変更がありません', 'ok');
    return;
  }
  showLoading(`${entries.length}件を保存中...`);
  try {
    const data = await apiPost('setAssignmentBatch', { assignments: entries });
    if (!data.success) throw new Error(data.error || '保存失敗');
    state.pending = {};
    updateSaveBadge();
    toast(`${data.saved}件保存しました`, 'ok');
    if (data.errors > 0) toast(`${data.errors}件でエラーが発生しました`, 'err');
    await loadAll();
  } catch (e) {
    toast(`保存失敗: ${e.message}`, 'err');
  } finally {
    hideLoading();
  }
}

function computePrevWeekTarget(wt) {
  const m = String(wt || '').match(/^(\d{4})-W(\d{1,2})$/);
  if (!m) return wt;
  let year = parseInt(m[1]);
  let week = parseInt(m[2]) - 1;
  if (week < 1) {
    year -= 1;
    // 前年の最終ISO週を計算
    const dec28 = new Date(year, 11, 28);
    const d = new Date(Date.UTC(dec28.getFullYear(), dec28.getMonth(), dec28.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }
  return `${year}-W${String(week).padStart(2, '0')}`;
}

function renderDailyView(date) {
  const wrap = document.getElementById('dailyViewContent');
  if (state.bases.length === 0) {
    wrap.innerHTML = '<div class="pool-empty">データがありません</div>';
    return;
  }
  let html = '';
  state.bases.forEach(b => {
    const key = `${date}|${b.name}`;
    const name = (state.matrix[date] && state.matrix[date][b.name]) || '';
    const isUn = !name || name === '【未割当】';
    const isSpot = !isUn && isSpotName(name);
    const isPending = !!state.pending[key];
    const hours = state.workHoursMap[b.name] ? `<span style="font-size:11px;color:var(--ink-mute);margin-left:4px">${escapeHtml(state.workHoursMap[b.name])}</span>` : '';

    let nameClass = '';
    let displayName = '';
    if (isUn) {
      const hasPool = (state.unassignedPool[date] || []).some(p =>
        p.pref1 === b.name || p.pref2 === b.name || p.pref3 === b.name);
      nameClass = hasPool ? 'unassigned' : 'unassigned';
      displayName = hasPool ? '未割当' : '未割当（希望者なし）';
    } else if (isSpot) {
      nameClass = 'spot'; displayName = name;
    } else {
      displayName = name;
    }

    html += `<div class="daily-row${isPending ? ' pending' : ''}"
      onclick="openSheet('${escapeAttr(date)}','${escapeAttr(b.name)}')">
      <span class="base-name">${escapeHtml(b.name)}${hours}</span>
      <span class="assigned-name ${nameClass}">${escapeHtml(displayName)}</span>
      <span class="daily-caret">▶</span>
    </div>`;
  });
  wrap.innerHTML = html;
}

function renderDcPicker() {
  const q = document.getElementById('dcPickerSearch').value.trim().toLowerCase();
  const date = state.directContactDate;
  const assignedNames = new Set();
  if (date) {
    Object.values(state.matrix[date] || {}).forEach(n => {
      if (n && n !== '【未割当】') assignedNames.add(n);
    });
  }
  const poolNames = new Set((state.unassignedPool[date] || []).map(p => p.name));

  const available = state.sellers.filter(s => {
    if (s.isSpot) return false;
    if (assignedNames.has(s.name)) return false;
    if (q && !s.name.toLowerCase().includes(q)) return false;
    return true;
  });
  available.sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  let html = '';
  if (available.length === 0) {
    html = '<div class="diff-empty" style="padding:20px;text-align:center">該当する販売員がいません</div>';
  } else {
    available.forEach(s => {
      const inPool = poolNames.has(s.name);
      const tag = inPool
        ? '<span class="pool-tag">未割当</span>'
        : '<span class="dc-tag">直接連絡</span>';
      html += `<div class="seller-item"
        onclick="selectDcStaff('${escapeAttr(s.name)}')">
        <span class="name">${escapeHtml(s.name)}</span>
        ${tag}
      </div>`;
    });
  }
  document.getElementById('dcPickerBody').innerHTML = html;
}

function toggleStaffCard(idx) {
  const card = document.getElementById(`staffCard_${idx}`);

  document.querySelectorAll('.staff-card.expanded').forEach(c => c.classList.remove('expanded'));

  if (!wasExpanded) {
    card.classList.add('expanded');
    const seller = state.salesStaff[idx];
    if (seller && !seller.isSpot) {
      ['pref1', 'pref2', 'pref3'].forEach(p => {
        const sel = document.getElementById(`${p}_${idx}`);
        if (sel) populateBaseSelect(sel, seller[p]);
      });
    }
  }
}

function populateBaseSelect(selectEl, currentValue) {
  let opts = '<option value="">— 選択なし —</option>';
  state.bases.forEach(b => {
    const selected = b.name === currentValue ? 'selected' : '';
    opts += `<option value="${escapeHtml(b.name)}" ${selected}>${escapeHtml(b.name)}</option>`;
  });
  selectEl.innerHTML = opts;
}

  const note = document.getElementById(`note_${idx}`).value;

  showLoading(`${seller.name} を保存中...`);

    const data = await apiPost('updateSalesStaff', {
      originalName: seller.name,
      pref1, pref2, pref3,
      specialSalary: Number(salary) || 0,
      note,

      ...seller, pref1, pref2, pref3,

    toast(`保存失敗: ${e.message}`, 'err');

  showLoading('名前を変更中...');

    if (state.activeTab === 'shift') {

    toast(`失敗: ${e.message}`, 'err');

    hideLoading();

}

    });
    if (!data.success) throw new Error(data.error || '失敗');
    toast(`${o.name} を販売員一覧に追加`, 'ok');
    await loadStaffTab();
  } catch (e) {
    toast(`失敗: ${e.message}`, 'err');
  } finally {
    hideLoading();
  }
}

async function ignoreOrphanAction(i) {
  const o = state.orphans[i];
  if (!o) return;
  showLoading('無視リストに追加中...');
  try {
    const data = await apiPost('ignoreOrphan', { name: o.name });
    if (!data.success) throw new Error(data.error || '失敗');
    toast(`${o.name} を無視リストへ`, 'ok');
    await loadStaffTab();
  } catch (e) {
    toast(`失敗: ${e.message}`, 'err');
  } finally {
    hideLoading();
  }
}

async function unignoreOrphanAction(i) {
  const name = state.ignored[i];
  if (!name) return;
  showLoading('無視リストから削除中...');
  try {
    const data = await apiPost('unignoreOrphan', { name });
    if (!data.success) throw new Error(data.error || '失敗');
    toast(`${name} を無視リストから削除`, 'ok');
    await loadStaffTab();
  } catch (e) {
    toast(`失敗: ${e.message}`, 'err');
  } finally {
    hideLoading();
  }
}

if (sessionStorage.getItem('shift_admin_auth') === '1') {
  showMain();
}
</script>
</body>
